<style>

/* ============ RESET & BASE ============ */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; overflow-x: hidden; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  transition: background .35s ease, color .35s ease;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font-family: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
::selection { background: var(--accent); color: var(--surface); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}

/* ============ THEME TOKENS ============ */
/* 1. Papierblock — warm notebook, typewriter */
.theme-papier {
  --bg: #EAE2CE; --surface: #FBF7EC; --surface2: #F1E9D6;
  --text: #2B2621; --text-muted: #6B6153;
  --accent: #5F7038; --accent2: #2F4858;
  --border: #C9BC9C; --shadow: 0 2px 10px rgba(43,38,33,.12);
  --font-display: 'Special Elite', cursive; --font-body: 'Courier Prime', monospace;
  --radius: 2px; --pattern: none;
}
/* 2. Mitternacht — deep navy, gold */
.theme-mitternacht {
  --bg: #10142A; --surface: #1A2043; --surface2: #212A54;
  --text: #EDEBFA; --text-muted: #9FA3C7;
  --accent: #C9A24B; --accent2: #3F9C99;
  --border: #313A66; --shadow: 0 8px 24px rgba(0,0,0,.4);
  --font-display: 'Fraunces', serif; --font-body: 'Inter', sans-serif;
  --radius: 10px; --pattern: none;
}
/* 3. Skizzenblock — graph paper */
.theme-skizze {
  --bg: #E7ECF2; --surface: #FFFFFF; --surface2: #DCE4EE;
  --text: #29344A; --text-muted: #6C7793;
  --accent: #3A5A9B; --accent2: #C0453B;
  --border: #B9C6DB; --shadow: 0 2px 8px rgba(41,52,74,.1);
  --font-display: 'Kalam', cursive; --font-body: 'Inter', sans-serif;
  --radius: 4px;
  --pattern: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
}
/* 4. Bauhaus — primary geometry */
/* 4. Tagebuch — zartes Rosé, Handschrift, Papierstruktur und goldene Akzente */
.theme-bauhaus {
  --bg: #FBF1F0; --surface: #FFFAF9; --surface2: #F6E4E2;
  --text: #3E2A2E; --text-muted: #94737A;
  --accent: #D98A9E; --accent2: #C9A24B;
  --border: #EBD2D2; --shadow: 0 6px 20px rgba(190, 130, 145, .16), 0 1px 3px rgba(190, 130, 145, .12);
  --font-display: 'Kalam', cursive; --font-body: 'Lora', serif;
  --radius: 14px; --pattern: none;
}
/* Feines Papier: warme Faserstruktur plus zarte Linien wie in einem Notizbuch */
body.theme-bauhaus {
  background-color: var(--bg);
  background-image:
    repeating-linear-gradient(180deg, transparent 0 31px, rgba(217, 138, 158, .13) 31px 32px),
    radial-gradient(circle at 18% 12%, rgba(217, 138, 158, .10), transparent 42%),
    radial-gradient(circle at 84% 78%, rgba(201, 162, 75, .09), transparent 46%);
}
/* Roter Rand wie beim Schulheft, dazu ein Hauch Buchrücken-Schatten */
.theme-bauhaus .sidebar {
  background: linear-gradient(180deg, var(--surface), color-mix(in srgb, var(--surface2) 55%, var(--surface)));
  border-right: 2px solid var(--border);
  box-shadow: inset -8px 0 18px -14px rgba(190, 130, 145, .55);
}
.theme-bauhaus .sidebar::after {
  content: ""; position: absolute; top: 0; bottom: 0; right: 14px; width: 1.5px;
  background: rgba(217, 138, 158, .38); pointer-events: none;
}
.theme-bauhaus .topbar {
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1.5px solid var(--border);
}
.theme-bauhaus .brand-text, .theme-bauhaus .view-title {
  font-family: 'Kalam', cursive; letter-spacing: .01em;
  color: #6E4A55;
  text-shadow: 0 1px 0 rgba(255,255,255,.9);
}
.theme-bauhaus .view-title { position: relative; display: inline-block; }
/* Handgezogener Unterstrich, wie mit einem Fineliner nachgezogen */
.theme-bauhaus .view-title::after {
  content: ""; position: absolute; left: 0; right: -6px; bottom: -6px; height: 6px;
  background: radial-gradient(ellipse 60% 100% at 50% 0%, rgba(217, 138, 158, .55), transparent 70%);
  border-radius: 50%;
}
.theme-bauhaus .btn { border-radius: 999px; border-color: var(--border); }
.theme-bauhaus .btn-accent {
  background: linear-gradient(135deg, #E2A0B1, #D07E95);
  color: #fff; border: none;
  box-shadow: 0 4px 14px rgba(208, 126, 149, .38);
}
.theme-bauhaus .btn-accent:hover { transform: translateY(-1px); box-shadow: 0 7px 20px rgba(208, 126, 149, .5); }
/* Karten wie eingeklebte Zettel — leicht schief, mit Washi-Tape oben */
.theme-bauhaus .card, .theme-bauhaus .widget-card, .theme-bauhaus .calendar-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: var(--shadow);
  position: relative;
}
.theme-bauhaus .widget-card::before {
  content: ""; position: absolute; top: -7px; left: 50%; transform: translateX(-50%) rotate(-1.6deg);
  width: 76px; height: 17px; border-radius: 2px; z-index: 2;
  background: repeating-linear-gradient(-45deg, rgba(217, 138, 158, .55) 0 6px, rgba(240, 205, 212, .55) 6px 12px);
  box-shadow: 0 1px 3px rgba(160, 110, 125, .28);
}
.theme-bauhaus .card:hover, .theme-bauhaus .widget-card:hover {
  transform: translateY(-3px) rotate(-.35deg);
  box-shadow: 0 14px 30px rgba(190, 130, 145, .24);
}
.theme-bauhaus .card-title { font-family: 'Kalam', cursive; font-size: 17px; }
.theme-bauhaus .nav-item.active {
  background: linear-gradient(135deg, #E7AEBC, #D98A9E);
  color: #fff; border-radius: 999px;
  box-shadow: 0 3px 10px rgba(208, 126, 149, .35);
}
.theme-bauhaus .nav-item:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); border-radius: 999px; }
.theme-bauhaus .avatar, .theme-bauhaus .mini-avatar {
  border-radius: 50%;
  box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px rgba(217, 138, 158, .55);
}
.theme-bauhaus .avatar.active { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent2), 0 4px 12px rgba(201, 162, 75, .35); }
.theme-bauhaus .mm-node { border-radius: 14px; border-color: var(--border); background: var(--surface); box-shadow: var(--shadow); }
.theme-bauhaus .mm-node.root {
  background: linear-gradient(135deg, #E7AEBC, #D07E95); color: #fff; border: none;
  border-radius: 50%; box-shadow: 0 6px 22px rgba(208, 126, 149, .45);
}
.theme-bauhaus .tag-chip { border-radius: 999px; background: color-mix(in srgb, var(--accent) 14%, var(--surface)); border-color: transparent; }
.theme-bauhaus ::selection { background: rgba(217, 138, 158, .35); color: var(--text); }
.theme-bauhaus input, .theme-bauhaus select, .theme-bauhaus textarea {
  border-radius: 12px !important; border-color: var(--border) !important; background: var(--surface) !important;
}
.theme-bauhaus input:focus, .theme-bauhaus select:focus, .theme-bauhaus textarea:focus {
  outline: none; border-color: var(--accent) !important; box-shadow: 0 0 0 3px rgba(217, 138, 158, .18);
}
.theme-bauhaus .global-ticker {
  background: color-mix(in srgb, var(--surface2) 62%, var(--surface));
  border-bottom: 1.5px solid var(--border);
}
.theme-bauhaus .global-ticker-dot { background: var(--accent); box-shadow: 0 0 8px rgba(217, 138, 158, .6); }
.theme-bauhaus .widget-head h3 { font-family: 'Kalam', cursive; font-size: 16px; color: #6E4A55; }
.theme-bauhaus .cal-day-cell { border-radius: 12px; }
.theme-bauhaus .cal-day-cell.is-today {
  background: color-mix(in srgb, var(--accent) 15%, var(--surface));
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(217, 138, 158, .18);
}
.theme-bauhaus .card-progress-bar { background: linear-gradient(90deg, #E7AEBC, #C9A24B); }
.theme-bauhaus .nav-item.active { color: #fff; }
/* 5. Wald — deep forest */
.theme-wald {
  --bg: #172A20; --surface: #203627; --surface2: #294432;
  --text: #EDE7D3; --text-muted: #A9B7A4;
  --accent: #86B35A; --accent2: #D9A441;
  --border: #35503E; --shadow: 0 6px 20px rgba(0,0,0,.35);
  --font-display: 'Fraunces', serif; --font-body: 'Source Sans 3', sans-serif;
  --radius: 8px; --pattern: none;
}
/* 6. Ozean — teal calm */
.theme-ozean {
  --bg: #0E3B43; --surface: #124A54; --surface2: #165B67;
  --text: #E7F5F3; --text-muted: #A9CFCB;
  --accent: #FF9270; --accent2: #F2D6A2;
  --border: #1E6773; --shadow: 0 8px 22px rgba(0,0,0,.3);
  --font-display: 'Poppins', sans-serif; --font-body: 'Nunito Sans', sans-serif;
  --radius: 14px; --pattern: none;
}
/* 8. Rosé — soft editorial */
.theme-rose {
  --bg: #F6E9EE; --surface: #FFF8FA; --surface2: #F0DCE3;
  --text: #4A2338; --text-muted: #8A5E71;
  --accent: #C6577B; --accent2: #B8925A;
  --border: #E3C3CF; --shadow: 0 4px 16px rgba(74,35,56,.12);
  --font-display: 'Playfair Display', serif; --font-body: 'Lora', serif;
  --radius: 6px; --pattern: none;
}
/* 9. Industrial — concrete & safety orange */
.theme-industrial {
  --bg: #DEDBD2; --surface: #F1EFE8; --surface2: #D2CEC2;
  --text: #232323; --text-muted: #5B5850;
  --accent: #E8590C; --accent2: #4A6572;
  --border: #232323; --shadow: none;
  --font-display: 'Oswald', sans-serif; --font-body: 'IBM Plex Sans', sans-serif;
  --radius: 0px; --pattern: none;
}
/* 10. Aurora — gradient dream */
.theme-aurora {
  --bg: #150B26; --surface: #1F1338; --surface2: #291A47;
  --text: #F1EBFF; --text-muted: #B4A4D9;
  --accent: #B15CDE; --accent2: #35D0BA;
  --border: #3A2A5C; --shadow: 0 10px 30px rgba(177,92,222,.25);
  --font-display: 'Space Grotesk', sans-serif; --font-body: 'Manrope', sans-serif;
  --radius: 14px; --pattern: none;
}
/* 11. Neon — cyberpunk glow */
.theme-neon {
  --bg: #0A0A0A; --surface: #141414; --surface2: #1E1E1E;
  --text: #F5F5F5; --text-muted: #999999;
  --accent: #FF1435; --accent2: #FFFFFF;
  --border: #331014; --shadow: 0 0 24px rgba(255,20,53,.25);
  --font-display: 'Orbitron', sans-serif; --font-body: 'Rajdhani', sans-serif;
  --radius: 10px; --pattern: none;
}
/* 12. Sternenstaub — magical starlight */
.theme-stardust {
  --bg: #04060B; --surface: #0A0E16; --surface2: #121826;
  --text: #EFEDE6; --text-muted: #8C93A3;
  --accent: #D4AF37; --accent2: #C6CDD6;
  --border: #2A3140; --shadow: 0 10px 34px rgba(0,0,0,.7), 0 0 0 1px rgba(212,175,55,.14);
  --font-display: 'Cinzel', serif; --font-body: 'Manrope', sans-serif;
  --radius: 12px; --pattern: none;
}

/* ---- Aurora: drifting glow blobs behind the app ---- */
.theme-aurora #app {
  position: relative; z-index: 0;
}
.theme-aurora #app::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(38vw 38vw at 15% 20%, rgba(177,92,222,.35), transparent 70%),
    radial-gradient(32vw 32vw at 85% 30%, rgba(53,208,186,.28), transparent 70%),
    radial-gradient(40vw 40vw at 50% 90%, rgba(255,157,140,.18), transparent 70%);
  filter: blur(10px);
  animation: auroraDrift 22s ease-in-out infinite alternate;
}
@keyframes auroraDrift {
  0%   { transform: translate(0, 0) scale(1); }
  50%  { transform: translate(2%, -3%) scale(1.06); }
  100% { transform: translate(-2%, 2%) scale(1); }
}

/* ---- Neon: glowing edges on interactive elements ---- */
.theme-neon .brand-mark, .theme-neon .brand-text { text-shadow: 0 0 10px var(--accent), 0 0 22px rgba(255,20,53,.5); }
.theme-neon .btn-accent { box-shadow: 0 0 14px rgba(255,20,53,.55), 0 0 2px rgba(255,20,53,.8); border-color: var(--accent); }
.theme-neon .btn-accent:hover { box-shadow: 0 0 22px rgba(255,20,53,.75), 0 0 4px rgba(255,20,53,.9); }
.theme-neon .nav-item.active { box-shadow: 0 0 16px rgba(255,20,53,.45), inset 0 0 0 1px rgba(255,255,255,.08); }
.theme-neon .avatar.active { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--accent), 0 0 16px rgba(255,20,53,.6); }
.theme-neon .card:hover, .theme-neon .widget-card:hover { box-shadow: 0 0 0 1px var(--accent2), 0 0 24px rgba(255,255,255,.2); }
.theme-neon .mm-node.root { box-shadow: 0 0 28px rgba(255,20,53,.45), 0 4px 10px rgba(0,0,0,.3); }
.theme-neon .view-title { text-shadow: 0 0 18px rgba(255,20,53,.35); }
.theme-neon ::selection { background: var(--accent2); color: #0A0A0A; }

/* ---- Sternenstaub: tiefes Weltall mit Nebeln, Milchstraßenband und Edelmetall-Kanten ---- */
.theme-stardust #app { position: relative; z-index: 0; }
/* Ebene 1: farbige Nebelwolken, die sehr langsam atmen */
.theme-stardust #app::before {
  content: ""; position: fixed; inset: -10%; z-index: -3; pointer-events: none;
  background:
    radial-gradient(46vw 40vw at 18% 22%, rgba(86, 62, 168, .34), transparent 68%),
    radial-gradient(40vw 34vw at 82% 30%, rgba(28, 96, 140, .30), transparent 70%),
    radial-gradient(52vw 42vw at 55% 88%, rgba(150, 70, 120, .22), transparent 72%),
    radial-gradient(30vw 26vw at 92% 78%, rgba(212, 175, 55, .10), transparent 70%);
  filter: blur(24px) saturate(115%);
  animation: galaxyBreathe 40s ease-in-out infinite alternate;
}
@keyframes galaxyBreathe {
  0%   { transform: translate(0, 0) scale(1); opacity: .85; }
  50%  { transform: translate(1.5%, -2%) scale(1.08); opacity: 1; }
  100% { transform: translate(-1.5%, 1.5%) scale(1.03); opacity: .9; }
}
/* Ebene 2: schräges Milchstraßenband mit feinem Staubkorn */
.theme-stardust #app::after {
  content: ""; position: fixed; inset: -25%; z-index: -2; pointer-events: none;
  background:
    linear-gradient(102deg, transparent 40%, rgba(228, 232, 245, .10) 47%, rgba(255,255,255,.16) 50%, rgba(228, 232, 245, .10) 53%, transparent 60%),
    radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,.5), transparent),
    radial-gradient(1px 1px at 70% 65%, rgba(255,255,255,.4), transparent);
  filter: blur(1.5px);
  transform: rotate(-8deg);
  animation: milkyDrift 90s linear infinite;
}
@keyframes milkyDrift {
  from { transform: rotate(-8deg) translateX(-2%); }
  to   { transform: rotate(-8deg) translateX(2%); }
}
/* Ebene 3: Sternenfeld in zwei Tiefen — feine ferne Sterne, hellere nahe Sterne */
.theme-stardust .galaxy-stars {
  position: fixed; inset: 0; z-index: -1; pointer-events: none; display: block;
}
.theme-stardust .galaxy-stars::before,
.theme-stardust .galaxy-stars::after {
  content: ""; position: absolute; inset: 0;
  background-repeat: repeat;
}
.theme-stardust .galaxy-stars::before {
  background-image:
    radial-gradient(1px 1px at 14% 18%, rgba(255,255,255,.85), transparent),
    radial-gradient(1px 1px at 37% 62%, rgba(198, 205, 214, .75), transparent),
    radial-gradient(1px 1px at 58% 27%, rgba(255,255,255,.7), transparent),
    radial-gradient(1px 1px at 76% 71%, rgba(212, 175, 55, .55), transparent),
    radial-gradient(1px 1px at 91% 34%, rgba(255,255,255,.7), transparent),
    radial-gradient(1px 1px at 24% 86%, rgba(198, 205, 214, .6), transparent),
    radial-gradient(1px 1px at 66% 92%, rgba(255,255,255,.55), transparent);
  background-size: 340px 340px;
  opacity: .5;
  animation: starDriftFar 220s linear infinite;
}
.theme-stardust .galaxy-stars::after {
  background-image:
    radial-gradient(1.8px 1.8px at 22% 40%, #fff, transparent),
    radial-gradient(2px 2px at 68% 18%, rgba(255, 246, 214, .95), transparent),
    radial-gradient(1.6px 1.6px at 45% 78%, #fff, transparent),
    radial-gradient(2.2px 2.2px at 86% 58%, rgba(212, 175, 55, .9), transparent);
  background-size: 620px 620px;
  opacity: .75;
  animation: starDriftNear 140s linear infinite, starPulse 6s ease-in-out infinite alternate;
}
@keyframes starDriftFar  { from { background-position: 0 0; }     to { background-position: 340px 170px; } }
@keyframes starDriftNear { from { background-position: 0 0; }     to { background-position: -620px 310px; } }
@keyframes starPulse { from { opacity: .55; } to { opacity: .9; } }
body:not(.theme-stardust) .galaxy-stars { display: none; }
@media (prefers-reduced-motion: reduce) {
  .theme-stardust #app::before, .theme-stardust #app::after,
  .theme-stardust .galaxy-stars::before, .theme-stardust .galaxy-stars::after { animation: none; }
}
/* Edelmetall: Gold-Platin-Titan-Verlauf an Kanten und Schrift */
.theme-stardust .sidebar, .theme-stardust .topbar {
  background: color-mix(in srgb, var(--surface) 72%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-color: transparent;
}
.theme-stardust .sidebar { border-right: 1px solid transparent; border-image: linear-gradient(180deg, rgba(212,175,55,.55), rgba(198,205,214,.35) 45%, rgba(122,132,148,.25)) 1; }
.theme-stardust .topbar { border-bottom: 1px solid transparent; border-image: linear-gradient(90deg, transparent, rgba(212,175,55,.5), rgba(198,205,214,.4), transparent) 1; }
.theme-stardust .brand-text, .theme-stardust .view-title {
  background: linear-gradient(100deg, #EFD98A 0%, #D4AF37 26%, #F5F2E8 48%, #C6CDD6 66%, #9AA3B2 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  letter-spacing: .02em;
}
.theme-stardust .card, .theme-stardust .widget-card, .theme-stardust .calendar-card {
  background: color-mix(in srgb, var(--surface) 76%, transparent);
  border: 1px solid rgba(198, 205, 214, .16);
  box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.06);
  position: relative;
}
/* Feiner Lichtreflex an der Oberkante, wie poliertes Metall */
.theme-stardust .card::after, .theme-stardust .calendar-card::after {
  content: ""; position: absolute; left: 12%; right: 12%; top: 0; height: 1px; pointer-events: none;
  background: linear-gradient(90deg, transparent, rgba(212,175,55,.7), rgba(255,255,255,.75), rgba(198,205,214,.6), transparent);
}
.theme-stardust .card:hover, .theme-stardust .widget-card:hover {
  border-color: rgba(212, 175, 55, .45);
  box-shadow: 0 14px 40px rgba(0,0,0,.75), 0 0 26px rgba(212,175,55,.16), inset 0 1px 0 rgba(255,255,255,.1);
}
.theme-stardust .widget-card::before { background: linear-gradient(180deg, #EFD98A, #D4AF37 40%, #C6CDD6); }
.theme-stardust .btn { border-color: rgba(198,205,214,.22); }
.theme-stardust .btn-accent {

/* ---- Blockwelt: grass-block texture, enchant shimmer, torch-flicker glow, break particles ---- */
body.theme-blockwelt {
  background-color: var(--bg);
  background-image:
    linear-gradient(rgba(0,0,0,.09) 0 50%, transparent 50%),
    linear-gradient(90deg, rgba(0,0,0,.09) 0 50%, transparent 50%),
    linear-gradient(rgba(255,255,255,.06) 0 50%, transparent 50%);
  background-size: 32px 32px, 32px 32px, 64px 64px;
  background-position: 0 0, 0 0, 16px 16px;
  image-rendering: pixelated;
}
.theme-blockwelt .sidebar, .theme-blockwelt .topbar { background-color: var(--surface); background-image: none; }
.theme-blockwelt .brand-text, .theme-blockwelt .brand-mark { color: var(--accent); text-shadow: 0 0 8px rgba(76,175,50,.6), 2px 2px 0 rgba(0,0,0,.15); }
.theme-blockwelt .view-title { color: var(--accent); text-shadow: 0 0 10px rgba(76,175,50,.55), 3px 3px 0 rgba(0,0,0,.25); }
.theme-blockwelt .btn { border-radius: 0; border-width: 2px; text-transform: uppercase; letter-spacing: .02em; font-size: 12px; }
.theme-blockwelt .btn-accent {
  position: relative; overflow: hidden;
  box-shadow: inset 2px 2px 0 rgba(255,255,255,.4), inset -2px -2px 0 rgba(0,0,0,.4), 4px 4px 0 rgba(0,0,0,.4), 0 0 18px rgba(76,175,50,.5);
  animation: blockTorchFlicker 2.6s ease-in-out infinite;
}
.theme-blockwelt .btn-accent::after {
  content: ""; position: absolute; top: 0; left: -60%; width: 40%; height: 100%;
  background: linear-gradient(120deg, transparent, rgba(255,255,255,.75), transparent);
  transform: skewX(-20deg); animation: blockEnchantSweep 2.8s ease-in-out infinite;
}
.theme-blockwelt .btn-accent:hover { transform: translate(1px, 1px); box-shadow: inset 2px 2px 0 rgba(255,255,255,.35), inset -2px -2px 0 rgba(0,0,0,.5), 3px 3px 0 rgba(0,0,0,.4), 0 0 26px rgba(76,175,50,.7); }
@keyframes blockEnchantSweep { 0% { left: -60%; } 55% { left: 130%; } 100% { left: 130%; } }
@keyframes blockTorchFlicker {
  0%, 100% { box-shadow: inset 2px 2px 0 rgba(255,255,255,.4), inset -2px -2px 0 rgba(0,0,0,.4), 4px 4px 0 rgba(0,0,0,.4), 0 0 18px rgba(76,175,50,.5); }
  50% { box-shadow: inset 2px 2px 0 rgba(255,255,255,.4), inset -2px -2px 0 rgba(0,0,0,.4), 4px 4px 0 rgba(0,0,0,.4), 0 0 28px rgba(76,175,50,.75); }
}

}
.theme-blockwelt .card:hover, .theme-blockwelt .widget-card:hover { outline: 3px solid var(--accent); outline-offset: 2px; transform: none; box-shadow: inset 2px 2px 0 rgba(255,255,255,.4), inset -2px -2px 0 rgba(0,0,0,.25), 0 0 20px rgba(76,175,50,.45); }
.theme-blockwelt .mm-node.root { background: linear-gradient(180deg, var(--accent) 0 55%, var(--accent2) 55% 100%); border: 2px solid var(--border); box-shadow: 5px 5px 0 rgba(0,0,0,.4), 0 0 22px rgba(76,175,50,.5); }
.theme-blockwelt .avatar, .theme-blockwelt .mini-avatar { border-radius: 4px; }

.theme-blockwelt #app::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;

/* break-particle burst (spawned by JS on click) */

.theme-vaultterm ::selection { background: var(--accent); color: #060A06; }

/* 19. Vault-Shelter — flaches Schwarz/Gelb-Design im Stil von Aufbau-Sim-Vault-Apps */
.theme-atombunker {
  --bg: #14181B; --surface: #1D2226; --surface2: #272D32;
  --text: #F0EDE4; --text-muted: #9AA1A6;

  --border: #FFC300; --shadow: 0 3px 0 rgba(0,0,0,.5);

  --radius: 6px; --pattern: none;
}
body.theme-atombunker { background-color: var(--bg); }
.theme-atombunker .sidebar, .theme-atombunker .topbar {
  background-color: var(--surface); border-color: var(--border); border-width: 2px;
}
.theme-atombunker .topbar {
  border-image: repeating-linear-gradient(-45deg, var(--accent) 0 10px, #14181B 10px 20px) 1;
  border-bottom-width: 5px; border-bottom-style: solid;
}
.theme-atombunker .brand-text, .theme-atombunker .view-title { text-transform: uppercase; letter-spacing: .03em; color: var(--accent); }
.theme-atombunker .btn { border-radius: 4px; text-transform: uppercase; letter-spacing: .04em; font-weight: 700; border-color: var(--border); border-width: 2px; }
.theme-atombunker .btn-accent { background: var(--accent); color: #14100A; border: 2px solid var(--accent); box-shadow: var(--shadow); }
.theme-atombunker .btn-accent:hover { transform: translateY(-1px); box-shadow: 0 4px 0 rgba(0,0,0,.5); }
.theme-atombunker .card, .theme-atombunker .widget-card {

  position: relative; overflow: hidden;
}
.theme-atombunker .card::before, .theme-atombunker .widget-card::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 6px;
  background: repeating-linear-gradient(-45deg, var(--accent) 0 8px, #14100A 8px 16px);
}
.theme-atombunker .card:hover, .theme-atombunker .widget-card:hover { transform: translateY(-2px); box-shadow: 0 5px 0 rgba(0,0,0,.5); }
.theme-atombunker .widget-head h3 { color: var(--accent2); text-transform: uppercase; letter-spacing: .03em; font-size: 13px; }
.theme-atombunker .nav-item.active { background: var(--accent); color: #14100A; border: 2px solid var(--accent); font-weight: 700; }
.theme-atombunker .avatar {
  border-radius: 50%; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--border);
  background-image: repeating-conic-gradient(rgba(255,195,0,.12) 0deg 15deg, transparent 15deg 30deg);
}
.theme-atombunker .avatar.active { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
.theme-atombunker .mm-node { border-color: var(--border); border-width: 2px; background: var(--surface); border-radius: 6px; }
.theme-atombunker .mm-node.root {
  background: var(--surface2); color: var(--accent); border: 3px solid var(--accent); border-radius: 50%;
  background-image: repeating-conic-gradient(rgba(255,195,0,.1) 0deg 12deg, transparent 12deg 24deg);
}
.theme-atombunker ::selection { background: var(--accent); color: #14100A; }
.theme-atombunker input, .theme-atombunker select, .theme-atombunker textarea { background: var(--surface2) !important; border-color: var(--border) !important; border-width: 2px !important; color: var(--text) !important; border-radius: 6px !important; }
.theme-atombunker input:focus, .theme-atombunker select:focus, .theme-atombunker textarea:focus { outline: none; border-color: var(--accent2) !important; }


/* ============ LAYOUT ============ */
#app { display: flex; min-height: 100vh; }
.theme-skizze body, .theme-skizze #app { background-image: var(--pattern); background-size: 24px 24px; }
.theme-skizze { }
body.theme-skizze { background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px); background-size: 26px 26px; background-color: var(--bg); }

.sidebar {
  width: 232px; flex-shrink: 0; background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; padding: 20px 14px;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  transition: transform .25s ease;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 6px 10px 22px; }

.nav { display: flex; flex-direction: column; gap: 4px; flex: 1; }

.nav-item:hover { background: var(--surface2); color: var(--text); }
.nav-item.active { background: var(--accent); color: var(--surface); border-color: var(--accent); }

.nav-icon { font-size: 16px; width: 18px; text-align: center; }
.nav-divider { height: 1px; background: var(--border); margin: 8px 4px; }

.nav-submenu.open { max-height: 220px; }
.nav-subitem { padding-left: 34px; font-size: 13px; }
.nav-subitem .nav-icon { font-size: 15px; }

/* ============ PROFILE BAR ============ */
.profile-bar { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 6px 16px; }
.avatar {
  width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center;

}

.avatar.active { border-color: var(--text); box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--accent); }

  width: 34px; height: 34px; border-radius: 50%; border: 2px dashed var(--border); background: transparent;

}

.build-tag { font-size: 10.5px; color: var(--text-muted); text-align: center; padding: 10px 6px 2px; opacity: .7; }

/* ============ HOME DASHBOARD ============ */
.global-ticker {
  display: flex; align-items: center; gap: 10px; background: var(--surface2); border-bottom: 1px solid var(--border);
  padding: 7px 26px; font-size: 12.5px; min-height: 34px; box-sizing: border-box; cursor: pointer;
}
.global-ticker-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex-shrink: 0; animation: tickerPulse 1.8s ease-in-out infinite; }
@keyframes tickerPulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
.global-ticker-viewport { flex: 1; min-width: 0; overflow: hidden; }
.global-ticker-text { display: inline-flex; white-space: nowrap; will-change: transform; }

  0% { transform: translateX(0); }
  100% { transform: translateX(var(--tape-distance, -50%)); }
}
.widget-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 18px; margin-bottom: 22px; }
.dashboard-card { grid-column: 1 / -1; }
.dashboard-greeting { margin-bottom: 10px; padding-right: 78px; }

  display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 8px 14px; margin-top: 22px;
}

.widget-card {
  background:
    linear-gradient(150deg, rgba(255,255,255,.10), rgba(255,255,255,.02) 42%, transparent 70%),
    color-mix(in srgb, var(--surface) 62%, transparent);
  backdrop-filter: blur(18px) saturate(125%); -webkit-backdrop-filter: blur(18px) saturate(125%);
  border: 1px solid color-mix(in srgb, var(--border) 70%, transparent); border-radius: 18px;
  padding: 18px 20px;
  box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 10px 30px rgba(0,0,0,.10), inset 0 1px 0 rgba(255,255,255,.14);
  display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden;
}
/* Feiner Lichtsaum an der Oberkante — lässt die Kachel wie geschliffenes Glas wirken */
.widget-card::after {
  content: ""; position: absolute; left: 14%; right: 14%; top: 0; height: 1px; pointer-events: none;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.5), transparent);
}

.widget-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

.widget-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px dashed var(--border); font-size: 13px; }

}

.reward-list { display: flex; flex-direction: column; gap: 6px; }
.reward-row {

}
.reward-title { font-weight: 600; font-size: 13.5px; flex: 1; min-width: 120px; }

.reward-row .card-pin { font-size: 13px; padding: 2px; }
.widget-row:last-child { border-bottom: none; }
.widget-row .wr-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.widget-empty { font-size: 12.5px; color: var(--text-muted); font-style: italic; padding: 4px 0; }

.dash-clickable { cursor: pointer; border-radius: 6px; transition: background .12s ease; margin-left: -6px; margin-right: -6px; padding-left: 6px; padding-right: 6px; }

/* ============ CALENDAR EXTRAS ============ */
.custody-summary-bar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }

}

.custody-summary-chip { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 8px 14px; font-size: 12.5px; }

.child-filter-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.child-filter-chip { display: flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-size: 12px; cursor: pointer; opacity: .45; transition: opacity .15s; }

.week-grid { display: flex; flex-direction: column; gap: 10px; max-height: 70vh; overflow-y: auto; scroll-behavior: smooth; padding-right: 2px; }

.calendar-card {

}
.cal-month-grid { display: grid; gap: 8px; }
.cal-weekday-head {

}
.cal-day-cell {

@keyframes calTodayGlow {

.week-day-cell { min-height: auto; border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; background: var(--bg); cursor: pointer; display: flex; flex-direction: column; gap: 8px; transition: transform .12s ease, border-color .15s ease, box-shadow .15s ease; scroll-margin: 12px; }

.wd-head-row { display: flex; align-items: baseline; gap: 8px; }

.week-day-cell .wd-num { font-family: var(--font-display); font-size: 20px; }

.cal-event {

.meal-day-block { padding: 12px 0; border-bottom: 1px dashed var(--border); }
.meal-day-block:last-child { border-bottom: none; }
.meal-day-head { font-size: 13px; font-weight: 700; color: var(--text); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 10px; }

.personal-quick-links { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
.personal-quick-link {

/* Ferienstimmung: dezent, edel, nicht ablenkend — warmer Lichtschimmer oben,
   goldene Zierlinie unter dem Ticker und langsam treibende Lichtpunkte. */
body.holiday-mood::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 3;
  background:
    radial-gradient(ellipse 140% 60% at 50% -18%, rgba(255, 205, 130, .16), transparent 60%),
    radial-gradient(ellipse 90% 40% at 88% 105%, rgba(120, 200, 220, .10), transparent 62%);
}
body.holiday-mood .app-header-sticky::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -2px; height: 2px; z-index: 7;
  background: linear-gradient(90deg, transparent, rgba(201, 162, 75, .85), rgba(255, 215, 160, .95), rgba(201, 162, 75, .85), transparent);
  background-size: 220% 100%;
  animation: holidayShimmer 7s ease-in-out infinite;
}
@keyframes holidayShimmer {
  0%, 100% { background-position: 0% 50%; opacity: .75; }
  50% { background-position: 100% 50%; opacity: 1; }
}
body.holiday-mood .holiday-sparkles {
  position: fixed; inset: 0; pointer-events: none; z-index: 2; overflow: hidden;
}
body.holiday-mood .holiday-sparkles span {
  position: absolute; bottom: -12px; width: 5px; height: 5px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 228, 175, .95), rgba(255, 205, 130, 0) 70%);
  animation: holidayDrift linear infinite;
}
@keyframes holidayDrift {
  0% { transform: translateY(0) translateX(0) scale(.7); opacity: 0; }
  12% { opacity: .85; }
  85% { opacity: .5; }
  100% { transform: translateY(-102vh) translateX(28px) scale(1.15); opacity: 0; }
}
body:not(.holiday-mood) .holiday-sparkles { display: none; }
@media (prefers-reduced-motion: reduce) {
  body.holiday-mood .holiday-sparkles, body.holiday-mood .app-header-sticky::after { animation: none; }
}

.retro-game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }

}

  min-width: 74px; height: 60px; border-radius: var(--radius); border: 1px solid var(--border);
  background: var(--surface2); color: var(--text); font-size: 20px; cursor: pointer;
  /* Spiel-Steuerung: keine Textauswahl, kein Doppeltipp-Zoom, keine 300ms-Verzögerung */

  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}

.retro-game-wrap, .retro-memory-card, .retro-game-card {

.dash-clock-analog { width: 100%; height: 100%; }

.dash-clock-tick { stroke: var(--text-muted); stroke-width: 2; }
.dash-clock-hand-h { stroke: var(--text); stroke-width: 3.5; stroke-linecap: round; }
.dash-clock-hand-m { stroke: var(--text); stroke-width: 2.5; stroke-linecap: round; }
.dash-clock-hand-s { stroke: var(--accent); stroke-width: 1.2; stroke-linecap: round; }
.dash-clock-pin { fill: var(--accent); }
@media (max-width: 640px) {
  .dash-clock { width: 46px; height: 46px; top: 14px; right: 14px; }
  .dash-clock-digital { font-size: 14px; line-height: 46px; }
}

/* Echo Show 15 / große Ambient-Displays: die ganze App wird als ein Block skaliert und
   zentriert (statt einzelner Elemente — das griff kaum), alle Kacheln außer der ersten
   ausgeblendet, damit Menüleiste, Ticker und Dashboard-Kachel den Bildschirm wirklich
   ausfüllen, mit dezentem Vignetten-Hintergrund für einen edleren Ambient-Look. */
body.echo-show-mode { background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--bg) 92%, var(--accent) 8%), var(--bg) 75%); }
body.echo-show-mode #app {
  width: 71.5vw; height: 71.5vh; min-height: 0; overflow: hidden;
  transform: scale(1.4);
  position: fixed; top: 50%; left: 50%;
  margin: -35.75vh 0 0 -35.75vw;
  box-shadow: 0 40px 100px rgba(0,0,0,.5);
}
body.echo-show-mode .sidebar { height: 100%; width: 320px; }
body.echo-show-mode .nav { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
body.echo-show-mode #toolsToggle, body.echo-show-mode .nav-submenu { grid-column: 1 / -1; }
body.echo-show-mode .nav-submenu.open { display: grid; grid-template-columns: repeat(2, 1fr); max-height: none; }
body.echo-show-mode .nav-item { flex-direction: column; text-align: center; padding: 14px 6px; gap: 6px; }
body.echo-show-mode .nav-label { font-size: 11.5px; line-height: 1.15; }
body.echo-show-mode .nav-icon { font-size: 22px; }
body.echo-show-mode .grid > .widget-card:not(.dashboard-card) { display: none; }
body.echo-show-mode .dashboard-card {
  padding: 30px; min-height: 56vh;
  display: flex; flex-wrap: wrap; align-items: center; align-content: center; gap: 18px;
}
body.echo-show-mode .dashboard-greeting { flex: 1 1 200px; padding-right: 0; order: 1; }
body.echo-show-mode .dashboard-greeting h1 { font-size: 38px; }
body.echo-show-mode .dashboard-card .home-date { font-size: 16px; }
body.echo-show-mode .dashboard-card .today-sub-stat { font-size: 18px; padding-top: 10px; margin-top: 10px; }
body.echo-show-mode .dashboard-card .widget-empty { font-size: 17px; }
body.echo-show-mode .dash-clock {
  position: static; width: 44%; max-width: 220px; height: auto; aspect-ratio: 1 / 1; flex-shrink: 0; order: 0;
}
body.echo-show-mode .dashboard-card .widget-body { flex-basis: 100%; order: 2; }
body.echo-show-mode .dash-clock-digital { font-size: 15vw; line-height: 1; display: flex; align-items: center; justify-content: center; height: 100%; }
@media (min-width: 700px) { body.echo-show-mode .dash-clock-digital { font-size: 3.2vw; } }
.clock-side-toggle { display: none; }
body.echo-show-mode .clock-side-toggle {
  display: block; position: absolute; top: 14px; right: 16px; z-index: 2;
  font-size: 11px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--surface2); color: var(--text-muted); cursor: pointer;
}
body.echo-show-mode .dashboard-card.clock-right .dash-clock { order: 2; }
body.echo-show-mode .dashboard-card.clock-right .dashboard-greeting { order: 1; }
body.echo-show-mode .dashboard-card.clock-right .widget-body { order: 3; }
.meal-add-row input { flex: 1; padding: 6px 9px; font-size: 12.5px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); color: var(--text); }

/* Papa-Bereich (admin) */
.admin-gate { max-width: 380px; margin: 40px auto; text-align: center; }
.admin-gate .admin-icon { font-size: 40px; display: block; margin-bottom: 14px; }
.admin-gate input[type=password] { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); font-size: 15px; text-align: center; letter-spacing: .1em; margin-bottom: 12px; }
.admin-gate .admin-error { color: #C0453B; font-size: 12.5px; margin-bottom: 10px; min-height: 16px; }
.build-info-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 22px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
.build-info-card .build-num { font-family: var(--font-display); font-size: 20px; }
.hub-back-link { display: block; background: none; border: none; color: var(--text-muted); font-size: 12px; padding: 0; margin-bottom: 6px; cursor: pointer; }
.hub-back-link:hover { color: var(--accent); }
.hub-profile-row { display: flex; flex-wrap: wrap; gap: 14px; }
.hub-profile-card {
  display: flex; flex-direction: column; align-items: center; gap: 6px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px; min-width: 110px;
  box-shadow: var(--shadow); transition: transform .15s ease;
}
.hub-profile-card:hover { transform: translateY(-3px); border-color: var(--accent); }
.hub-profile-name { font-size: 13px; font-weight: 600; }
.hub-profile-status { font-size: 10.5px; color: var(--text-muted); }

/* custody / Betreuung indicator on calendar days */
.cal-custody-row { position: absolute; left: 6px; right: 6px; bottom: 6px; display: flex; gap: 3px; flex-wrap: wrap; }
.custody-dot { width: 16px; height: 16px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 9px; color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,.3); flex-shrink: 0; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.custody-dot.custody-switch { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--text); }
.custody-dot-empty { width: 16px; height: 16px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; color: var(--text-muted); background: var(--surface2); border: 1px dashed var(--border); }
.custody-block-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 6px; background: var(--bg); flex-wrap: wrap; }
.custody-block-row input[type=number] { width: 64px; padding: 6px 8px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.app-header-sticky { position: sticky; top: 0; z-index: 6; }
.topbar {
  display: flex; align-items: center; gap: 14px; padding: 16px 26px;
  border-bottom: 1px solid var(--border); background: var(--bg);
}
.hamburger { display: none; background: none; border: none; font-size: 20px; color: var(--text); }
.search-wrap { flex: 1; max-width: 480px; }
#searchInput {
  width: 100%; padding: 10px 14px; border-radius: var(--radius); border: 1px solid var(--border);
  background: var(--surface); font-size: 14px;
}
.btn {
  padding: 10px 16px; border-radius: var(--radius); border: 1px solid var(--border);
  background: var(--surface); font-size: 14px; font-weight: 600; white-space: nowrap;
  transition: transform .12s ease, background .15s ease;
}
.btn:hover { transform: translateY(-1px); }
.btn-accent { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.theme-bauhaus .btn-accent { color: #fff; box-shadow: var(--shadow); }
.btn-ghost { background: transparent; }
.btn-sm { padding: 6px 10px; font-size: 12.5px; }
.btn-danger { color: #C0453B; border-color: #C0453B; background: transparent; }

.view-container { flex: 1; padding: 26px; max-width: 1100px; width: 100%; margin: 0 auto; overflow-x: hidden; }
.view-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; gap: 10px;}
.view-title { font-family: var(--font-display); font-size: 28px; margin: 0; }
.view-sub { color: var(--text-muted); font-size: 13.5px; margin: 4px 0 0; }

.empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.empty-state .empty-icon { font-size: 34px; display: block; margin-bottom: 10px; }

.toast {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  padding: 10px 18px; border-radius: var(--radius); box-shadow: var(--shadow);
  font-size: 13.5px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
  z-index: 50;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 860px) {
  .sidebar { position: fixed; z-index: 40; left: 0; top: 0; transform: translateX(-100%); box-shadow: 0 0 30px rgba(0,0,0,.3); height: 100dvh; }
  .sidebar.open { transform: translateX(0); }
  .hamburger { display: block; }
  .view-container { padding: 16px; }
  .topbar { padding: 12px 16px; }
  .global-ticker { padding: 6px 16px; font-size: 11.5px; }
  .sidebar-backdrop.show { display: block; }
}
.sidebar-backdrop {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 39;
}
body.menu-open { overflow: hidden; }

/* ============ GRID / CARDS ============ */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.card {
  background:
    linear-gradient(150deg, rgba(255,255,255,.09), rgba(255,255,255,.02) 45%, transparent 72%),
    color-mix(in srgb, var(--surface) 62%, transparent);
  backdrop-filter: blur(18px) saturate(125%); -webkit-backdrop-filter: blur(18px) saturate(125%);
  border: 1px solid color-mix(in srgb, var(--border) 70%, transparent); border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.12);
  display: flex; flex-direction: column; gap: 8px;
  cursor: pointer; transition: transform .12s ease, border-color .15s, box-shadow .2s ease;
}
.card:hover { box-shadow: var(--shadow), 0 14px 34px rgba(0,0,0,.16), inset 0 1px 0 rgba(255,255,255,.18); }
.card:hover { transform: translateY(-2px); border-color: var(--accent); }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.card-title { font-family: var(--font-display); font-size: 17px; margin: 0; word-break: break-word; }
.card-pin { background: none; border: none; font-size: 15px; color: var(--text-muted); }
.card-pin.pinned { color: var(--accent); }
.card-body { color: var(--text-muted); font-size: 13.5px; line-height: 1.5; max-height: 4.5em; overflow: hidden; }
.card-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.tag-chip {
  font-size: 11px; padding: 3px 9px; border-radius: 999px; background: var(--surface2);
  color: var(--text-muted); border: 1px solid var(--border);
}
.tag-chip.clickable:hover { border-color: var(--accent); color: var(--accent); cursor: pointer; }
.card-meta { font-size: 11px; color: var(--text-muted); margin-top: auto; padding-top: 6px; }
.card-progress { height: 5px; background: var(--surface2); border-radius: 999px; overflow: hidden; margin-top: 4px;}
.checklist-expand-toggle { font-size: 11px; padding: 2px 8px; flex-shrink: 0; }
.inline-checklist { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); display: flex; flex-direction: column; gap: 5px; cursor: default; }
.inline-checklist-row { display: flex; align-items: flex-start; gap: 8px; font-size: 12.5px; cursor: pointer; }
.inline-checklist-row input[type=checkbox] { width: 16px; height: 16px; flex-shrink: 0; margin-top: 1px; accent-color: var(--accent); cursor: pointer; }

.tb-ring-wrap { position: relative; width: 220px; height: 220px; margin: 0 auto 22px; }
.tb-ring-svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.tb-ring-bg { fill: none; stroke: var(--surface2); stroke-width: 14; }
.tb-ring-fg { fill: none; stroke: var(--accent); stroke-width: 14; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
.tb-ring-fg.tb-ring-done { stroke: #86B35A; }
.tb-ring-center {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
}
.tb-time { font-family: var(--font-display); font-size: 44px; }
.tb-quadrant { font-size: 14px; color: var(--text-muted); max-width: 160px; }
.tb-buttons { display: flex; gap: 10px; justify-content: center; margin-bottom: 26px; }
.tb-quadrant-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; max-width: 420px; margin: 0 auto; }
.tb-quadrant-chip {
  border: 1.5px solid var(--border); border-radius: var(--radius); padding: 10px; font-size: 12.5px;
  display: flex; flex-direction: column; gap: 2px; transition: background .2s ease, border-color .2s ease;
}
.tb-quadrant-chip.active { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.tb-quadrant-chip.done { opacity: .55; }
.tb-quadrant-chip span { color: var(--text-muted); font-size: 11px; }
.card-progress-bar { height: 100%; background: var(--accent); }
.card-thumb { width: 100%; height: 130px; object-fit: cover; border-radius: var(--radius); border: 1px solid var(--border); }

/* ============ MODAL / EDITOR ============ */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex;
  align-items: center; justify-content: center; z-index: 60; padding: 20px;
}
.modal {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  width: 100%; max-width: 640px; max-height: 88vh; overflow-y: auto; padding: 24px;
  box-shadow: var(--shadow);
}
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.modal-header h2 { font-family: var(--font-display); margin: 0; font-size: 22px; }
.close-btn { background: none; border: none; font-size: 20px; color: var(--text-muted); }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 6px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; }
.field input[type=text], .field textarea, .field select {
  width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg); color: var(--text); font-size: 14px;
}
.field textarea { min-height: 130px; resize: vertical; line-height: 1.5; }
.modal-footer { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; }
.modal-footer-right { display: flex; gap: 8px; }

/* checklist items in editor */
.checklist-items { display: flex; flex-direction: column; gap: 6px; }
.checklist-row { display: flex; align-items: center; gap: 8px; }
.checklist-row-hw { flex-wrap: wrap; background: var(--surface2); padding: 8px; border-radius: var(--radius); }
.checklist-row-hw input[type=text], .checklist-row-hw input[type=date] { padding: 7px 9px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); }
.md-toolbar { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
.md-btn {
  padding: 5px 9px; font-size: 12px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--surface2); color: var(--text); cursor: pointer;
}
.md-btn:hover { border-color: var(--accent); }
.md-preview p { margin: 0 0 4px; }
.md-preview h4 { margin: 4px 0; font-family: var(--font-display); font-size: 14px; }
.md-preview ul, .md-preview ol { margin: 2px 0 4px 18px; padding: 0; }
.md-preview code { background: var(--surface2); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
.md-preview mark, .mm-text mark { background: color-mix(in srgb, var(--accent) 45%, transparent); color: inherit; padding: 0 2px; border-radius: 2px; }
.md-preview del, .mm-text del { opacity: .65; }
.mm-text p { margin: 0; display: inline; }
.mm-text h4 { margin: 0; font-size: inherit; font-family: inherit; display: inline; }
.mm-text ul, .mm-text ol { margin: 2px 0 0 16px; padding: 0; text-align: left; }
.mm-text code { background: rgba(0,0,0,.08); padding: 0 4px; border-radius: 3px; }
.checklist-row input[type=text] { flex: 1; padding: 8px 10px; }
.checklist-row .del { background: none; border: none; color: var(--text-muted); font-size: 16px; }
.checklist-view-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--border); }
.checklist-view-row:last-child { border-bottom: none; }
.checklist-view-row input { width: 17px; height: 17px; accent-color: var(--accent); }
.checklist-view-row.done label { text-decoration: line-through; color: var(--text-muted); }
.shopping-row {
  display: grid; grid-template-columns: 22px 2fr 1fr 1fr 1fr 26px 26px 24px; gap: 8px; align-items: center;
  padding: 5px 0; border-bottom: 1px dashed var(--border);
}
.shopping-row:last-child { border-bottom: none; }
.shopping-row-head { font-size: 10.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
.shopping-row input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); }
.shopping-row .s-text { font-size: 13px; }
.shopping-row.done .s-text { text-decoration: line-through; color: var(--text-muted); }
.shopping-row select, .shopping-row input[type=text] {
  padding: 4px 7px; font-size: 12.5px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg);
  font-size: 12.5px; width: 100%;
}
.s-size-hint {
  display: inline-block; margin-left: 6px; font-size: 12px; padding: 2px 9px; border-radius: 999px;
  background: color-mix(in srgb, var(--accent) 16%, var(--surface2)); color: var(--accent); font-weight: 600;
}
.s-person-chip {
  display: inline-flex; align-items: center; gap: 5px; margin-left: 6px; font-size: 12px; font-weight: 600;
  padding: 2px 9px 2px 3px; border-radius: 999px; border: 1.5px solid var(--border); vertical-align: middle;
}
.s-person-chip .mini-avatar { width: 18px; height: 18px; font-size: 11px; }
@media (max-width: 640px) {
  .shopping-row {
    grid-template-columns: 20px 1fr 26px 26px 24px; grid-template-areas: "cb text photo move del" "sel cat loc loc loc"; row-gap: 4px; padding: 6px 0;
  }
  .shopping-row-head { display: none; }
  .shopping-row .s-done { grid-area: cb; }
  .shopping-row .s-text { grid-area: text; }
  .shopping-row .s-photo { grid-area: photo; }
  .shopping-row .s-move { grid-area: move; }
  .shopping-row .s-del { grid-area: del; }
  .shopping-row .s-forwhom { grid-area: sel; width: auto; max-width: 88px; padding: 3px 4px; font-size: 11px; }
  .shopping-row .s-category { grid-area: cat; width: auto; max-width: 88px; padding: 3px 4px; font-size: 11px; }
  .shopping-row .s-where { grid-area: loc; width: auto; padding: 3px 6px; font-size: 11px; }
}
.add-row-btn { align-self: flex-start; margin-top: 4px; }

.shopping-list-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.shopping-list-tab {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface);
  color: var(--text); font-size: 13px; cursor: pointer;
}
.shopping-list-tab .mini-avatar { width: 17px; height: 17px; font-size: 10px; }
.shopping-list-tab.active { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.theme-bauhaus .shopping-list-tab.active { color: #fff; }
.shopping-list-add { border-style: dashed; color: var(--text-muted); }

/* image dropzone */
.dropzone {
  border: 2px dashed var(--border); border-radius: var(--radius); padding: 26px; text-align: center;
  color: var(--text-muted); font-size: 13.5px; cursor: pointer; transition: border-color .15s;
}
.dropzone:hover, .dropzone.drag { border-color: var(--accent); color: var(--accent); }
.dropzone input { display: none; }
.image-preview { width: 100%; max-height: 220px; object-fit: contain; border-radius: var(--radius); margin-top: 10px; border: 1px solid var(--border); }

/* image tabs + drawing pad */
.img-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
.img-tab { padding: 7px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-size: 12.5px; }
.img-tab.active { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.theme-bauhaus .img-tab.active { color: #fff; }
.draw-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.draw-colors { display: flex; gap: 5px; }
.draw-swatch { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--border); padding: 0; }
.draw-swatch.active { border-color: var(--text); box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--accent); }
#drawEraser.active-tool { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.draw-canvas { width: 100%; max-width: 100%; height: auto; aspect-ratio: 600 / 380; border: 1px solid var(--border); border-radius: var(--radius); background: #fff; touch-action: none; cursor: crosshair; }
.draw-layer-stack { position: relative; width: 100%; aspect-ratio: 600 / 380; }
.draw-layer-stack .draw-layer { position: absolute; inset: 0; height: 100%; background: transparent; }
.draw-layer-stack .draw-layer:first-child { background: #fff; }
.draw-layer-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 8px 0; font-size: 12.5px; }

  function escapeHtml(str) {
    return String(str || "").replace(/[&<>"']/g, (c) => ({

    }[c]));
  }

  function mdToHtml(text) {
    // Leichtgewichtige, sichere Markdown-Formatierung: erst escapen, dann Muster ersetzen.
    const lines = escapeHtml(text || "").split("\n");
    let html = ""; let inUl = false; let inOl = false;
    function closeLists() {
      if (inUl) { html += "</ul>"; inUl = false; }
      if (inOl) { html += "</ol>"; inOl = false; }
    }
    lines.forEach((line) => {
      const heading = line.match(/^##\s+(.*)/);
      const bullet = line.match(/^[-*]\s+(.*)/);
      const numbered = line.match(/^\d+\.\s+(.*)/);
      let inline = (s) => s
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/==(.+?)==/g, "<mark>$1</mark>")
        .replace(/~~(.+?)~~/g, "<del>$1</del>")
        .replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, "<em>$1</em>")
        .replace(/`(.+?)`/g, "<code>$1</code>");
      if (heading) { closeLists(); html += `<h4>${inline(heading[1])}</h4>`; }
      else if (bullet) { if (!inUl) { closeLists(); html += "<ul>"; inUl = true; } html += `<li>${inline(bullet[1])}</li>`; }
      else if (numbered) { if (!inOl) { closeLists(); html += "<ol>"; inOl = true; } html += `<li>${inline(numbered[1])}</li>`; }
      else if (line.trim() === "") { closeLists(); html += "<br>"; }
      else { closeLists(); html += `<p>${inline(line)}</p>`; }
    });
    closeLists();
    return html;
  }

  function wrapSelection(textarea, before, after) {
    const s = textarea.selectionStart, e = textarea.selectionEnd;
    const val = textarea.value;
    const selected = val.slice(s, e) || "Text";
    textarea.value = val.slice(0, s) + before + selected + (after || before) + val.slice(e);
    textarea.focus();
    textarea.selectionStart = s + before.length;
    textarea.selectionEnd = s + before.length + selected.length;
  }

  function prefixLines(textarea, prefix) {
    const s = textarea.selectionStart, e = textarea.selectionEnd;
    const val = textarea.value;
    const lineStart = val.lastIndexOf("\n", s - 1) + 1;
    let lineEnd = val.indexOf("\n", e);
    if (lineEnd === -1) lineEnd = val.length;
    const block = val.slice(lineStart, lineEnd);
    const prefixed = block.split("\n").map(l => l.startsWith(prefix) ? l : prefix + l).join("\n");
    textarea.value = val.slice(0, lineStart) + prefixed + val.slice(lineEnd);
    textarea.focus();
  }

    try { localStorage.setItem(LAST_VIEW_KEY, view); } catch (e) { /* Speicher evtl. voll — kein Problem, dann startet die App eben auf Home */ }
    document.querySelectorAll(".nav-item[data-view]").forEach(b => {
      b.classList.toggle("active", b.dataset.view === view);
    });
    const toolsSubmenuEl = document.getElementById("toolsSubmenu");
    if (toolsSubmenuEl && ["toothbrush", "notes", "images", "retrogames"].includes(view)) {
      toolsSubmenuEl.classList.add("open");

      if (arrowEl) arrowEl.textContent = "▾";

    const orgaSubmenuEl = document.getElementById("orgaSubmenu");

      orgaSubmenuEl.classList.add("open");

      if (sArrow) sArrow.textContent = "▾";
    }
    setSidebarOpen(false);
    render();
    // Nach jedem Menüwechsel oben starten. Der Browser stellt die alte Position teils
    // erst nach dem Zeichnen wieder her — deshalb mehrfach zurücksetzen.
    scrollViewToTop();
  }

  function scrollViewToTop() {

      if (vc) vc.scrollTop = 0;
      const main = document.querySelector(".main");
      if (main) main.scrollTop = 0;
    };
    reset();
    requestAnimationFrame(reset);
    setTimeout(reset, 60);
  }

  /* ============ HOME (DASHBOARD) ============ */
  const WMO_WEATHER = {

    45: { icon: "🌫️", label: "Nebel" }, 48: { icon: "🌫️", label: "Reifnebel" },

    61: { icon: "🌧️", label: "Regen" }, 63: { icon: "🌧️", label: "Regen" }, 65: { icon: "🌧️", label: "Starkregen" },
    71: { icon: "🌨️", label: "Schnee" }, 73: { icon: "🌨️", label: "Schnee" }, 75: { icon: "❄️", label: "Starker Schnee" },
    80: { icon: "🌦️", label: "Schauer" }, 81: { icon: "🌧️", label: "Schauer" }, 82: { icon: "⛈️", label: "Heftige Schauer" },
    95: { icon: "⛈️", label: "Gewitter" }, 96: { icon: "⛈️", label: "Gewitter mit Hagel" }, 99: { icon: "⛈️", label: "Gewitter mit Hagel" }
  };
  function weatherInfo(code) { return WMO_WEATHER[code] || { icon: "🌡️", label: "" }; }

  let warnCache = { data: null, fetchedAt: 0, error: "" };
  const DWD_WARN_LEVELS = { 1: "Wetterinfo", 2: "Wetterwarnung", 3: "Markante Wetterwarnung", 4: "Unwetterwarnung" };

  // Bundesland-Code -> DWD-Pollen-region_id
  const POLLEN_REGION_BY_STATE = {
    SH: 10, HH: 10, MV: 20, NI: 30, HB: 30, NW: 40, BB: 50, BE: 50,
    ST: 60, TH: 70, SN: 80, HE: 90, RP: 100, SL: 100, BW: 110, BY: 120
  };
  const POLLEN_LABELS = { "0": "keine", "0-1": "keine–gering", "1": "gering", "1-2": "gering–mittel", "2": "mittel", "2-3": "mittel–hoch", "3": "hoch" };
  const POLLEN_NAMES = { Ambrosia: "Ambrosia", Esche: "Esche", Hasel: "Hasel", Graeser: "Gräser", Beifuss: "Beifuß", Roggen: "Roggen", Erle: "Erle", Birke: "Birke" };
  function pollenScore(v) {
    if (!v || v === "-1") return -1;
    const parts = v.split("-").map(Number);
    return parts.reduce((a, b) => a + b, 0) / parts.length;
  }
  let pollenCache = { data: null, fetchedAt: 0 };
  async function updatePollenWidget() {
    const el = document.getElementById("pollenWidgetBody");
    if (!el) return;
    const fresh = Date.now() - pollenCache.fetchedAt < 6 * 60 * 60 * 1000;
    if (!fresh) {
      const directUrl = "https://opendata.dwd.de/climate_environment/health/alerts/s31fg.json";
      const proxyUrl = "https://corsproxy.io/?url=" + encodeURIComponent(directUrl);
      try {
        let res;
        try {
          res = await fetch(directUrl);
          if (!res.ok) throw new Error("HTTP " + res.status);
        } catch (directErr) {
          // Direkter Zugriff von DWD Opendata blockiert typischerweise CORS aus dem Browser —
          // über einen CORS-Proxy umleiten, der die Anfrage im Namen der App weiterreicht.
          res = await fetch(proxyUrl);
          if (!res.ok) throw new Error("HTTP " + res.status);
        }
        const data = await res.json();
        pollenCache = { data: data.content || [], fetchedAt: Date.now() };
      } catch (err) {
        pollenCache = { data: null, fetchedAt: Date.now() };
        console.warn("Pollenflug-Abruf fehlgeschlagen:", err);
      }
    }
    const regionId = POLLEN_REGION_BY_STATE[state.federalState];
    if (!regionId) { el.innerHTML = `⚪ Bundesland in den Einstellungen wählen für Pollenflug`; return; }
    if (!pollenCache.data) { el.innerHTML = `⚪ Pollenflug konnte nicht geladen werden.`; return; }
    const entries = pollenCache.data.filter(r => r.region_id === regionId);
    if (!entries.length) { el.innerHTML = `⚪ Keine Pollendaten für diese Region.`; return; }
    let best = null;
    let bestTomorrow = null;
    entries.forEach(r => {
      Object.entries(r.Pollen || {}).forEach(([type, vals]) => {
        const score = pollenScore(vals.today);
        if (score > (best ? best.score : -1)) best = { type, score, raw: vals.today };
        const scoreTomorrow = pollenScore(vals.tomorrow);
        if (scoreTomorrow > (bestTomorrow ? bestTomorrow.score : -1)) bestTomorrow = { type, score: scoreTomorrow, raw: vals.tomorrow };
      });
    });
    if (!best || best.score < 1) {
      el.innerHTML = `🌿 Kaum Pollenbelastung heute`;
      return;
    }
    const light = best.score >= 2.5 ? "🔴" : best.score >= 1.5 ? "🟡" : "🟢";
    const tomorrowHtml = (bestTomorrow && bestTomorrow.score >= 1)
      ? `<span class="pollen-tomorrow">${bestTomorrow.score >= 2.5 ? "🔴" : bestTomorrow.score >= 1.5 ? "🟡" : "🟢"} Morgen: ${POLLEN_NAMES[bestTomorrow.type] || bestTomorrow.type} (${POLLEN_LABELS[bestTomorrow.raw] || bestTomorrow.raw})</span>`
      : "";
    el.innerHTML = `<span>${light} Pollen heute: ${POLLEN_NAMES[best.type] || best.type} (${POLLEN_LABELS[best.raw] || best.raw})</span>${tomorrowHtml}`;
  }

  function warningMatchesRegion(w, stateName) {
    if (w.state !== stateName) return false;
    const filter = (state.warnRegionFilter || "").trim().toLowerCase();
    if (!filter) return true;
    return (w.regionName || "").toLowerCase().includes(filter);
  }
  async function updateWarnWidget() {
    const el = document.getElementById("warnBadgeBody");
    if (!el) return;
    const fresh = Date.now() - warnCache.fetchedAt < 15 * 60 * 1000;
    if (!fresh) {
      try {
        const res = await fetch("https://www.dwd.de/DWD/warnungen/warnapp/json/warnings.json");
        const raw = await res.text();
        const jsonText = raw.replace(/^\s*warnWetter\.loadWarnings\(/, "").replace(/\);\s*$/, "");
        const parsed = JSON.parse(jsonText);
        const all = Object.values(parsed.warnings || {}).flat();
        warnCache = { data: all, fetchedAt: Date.now(), error: "" };
      } catch (err) {
        warnCache = { data: null, fetchedAt: Date.now(), error: "Warnungen konnten nicht geladen werden (evtl. CORS/Netzwerk)." };
        console.warn("DWD-Warnungen-Abruf fehlgeschlagen:", err);
      }
    }
    const stateName = (GERMAN_STATES.find(s => s.code === state.federalState) || {}).name;
    if (!stateName) {
      el.innerHTML = `⚪ Bundesland in den Einstellungen wählen für Wetterwarnungen`;
      return;
    }
    if (warnCache.error) {
      el.innerHTML = `⚪ ${escapeHtml(warnCache.error)}`;
      return;
    }
    const relevant = (warnCache.data || []).filter(w => warningMatchesRegion(w, stateName));
    if (!relevant.length) {
      el.innerHTML = `🟢 Keine aktuellen Wetterwarnungen für ${escapeHtml(state.warnRegionFilter ? state.warnRegionFilter : stateName)}`;
      return;
    }
    relevant.sort((a, b) => b.level - a.level);
    const top = relevant[0];
    const light = top.level >= 3 ? "🔴" : "🟡";
    el.innerHTML = `${light} ${relevant.length > 1 ? relevant.length + " Warnungen — " : ""}${escapeHtml((top.headline || "Warnung").replace(/^Amtliche /, ""))} (${escapeHtml(top.regionName || "")})`;
  }

  // Grobe Faustformel: ab welchem Kp-Wert Polarlicht bei einem bestimmten Breitengrad
  // grundsätzlich sichtbar werden kann (je weiter südlich, desto höherer Kp nötig).
  function kpNeededForLatitude(lat) {
    const absLat = Math.abs(lat);
    return Math.max(1, Math.min(9, Math.round((65 - absLat) / 3)));
  }

  let kpForecastCache = { data: null, fetchedAt: 0 };
  async function updateKpWidget() {
    const el = document.getElementById("auroraWidgetBody");
    if (!el) return;
    const fresh = Date.now() - kpCache.fetchedAt < 30 * 60 * 1000;
    if (!fresh) {
      try {
        const [curRes, fcRes] = await Promise.all([
          fetch("https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json"),
          fetch("https://services.swpc.noaa.gov/products/noaa-planetary-k-index-forecast.json")
        ]);
        const curRows = await curRes.json();
        const fcRows = await fcRes.json();
        kpCache = { data: curRows[curRows.length - 1], fetchedAt: Date.now() };
        kpForecastCache = { data: fcRows, fetchedAt: Date.now() };
      } catch (err) { console.warn("Kp-Index-Abruf fehlgeschlagen:", err); }
    }
    if (kpCache.data) {
      const kp = Math.round(kpCache.data.Kp);
      const loc = state.weatherLocation;
      const needed = loc && loc.lat ? kpNeededForLatitude(loc.lat) : null;
      let chance = "";
      if (needed !== null) {
        if (kp >= needed + 2) chance = "🟢 Gute Chance gerade jetzt!";
        else if (kp >= needed) chance = "🟡 Möglich, wenn's dunkel & klar ist";
        else if (kp >= needed - 2) chance = "🟠 Eher unwahrscheinlich";
        else chance = "⚪ Aktuell sehr unwahrscheinlich";
      }
      // Vorschau für die kommende Nacht (nächste ca. 15h ab jetzt), damit man's nicht vergisst
      let nightHtml = "";
      if (kpForecastCache.data) {
        const now = Date.now();
        const windowEnd = now + 15 * 60 * 60 * 1000;
        const upcoming = kpForecastCache.data.filter(r => {
          const t = new Date(r.time_tag + "Z").getTime();
          return t >= now - 60 * 60 * 1000 && t <= windowEnd;
        });
        if (upcoming.length) {
          const maxKp = Math.round(Math.max(...upcoming.map(r => r.kp)));
          let nightChance = "";
          if (needed !== null) {
            nightChance = maxKp >= needed ? " — 🟢 gute Chance heute Nacht!" : maxKp >= needed - 2 ? " — 🟡 leichte Chance" : "";
          }
          nightHtml = `<div class="today-sub-stat">🌙 Vorschau heute Nacht: bis zu Kp ${maxKp}${nightChance}</div>`;
        }
      }
      el.innerHTML = `
        <div style="display:flex;align-items:center;gap:12px;">
          <span style="font-size:28px;">🌌</span>
          <div><div class="widget-big-stat" style="font-size:20px;">Kp ${kp}</div><div style="font-size:12px;color:var(--text-muted);">${loc && loc.name ? "für " + escapeHtml(loc.name) : "Planetarer Index"}${chance ? " · " + chance : ""}</div></div>
        </div>
        ${nightHtml}
      `;
    }
  }

  async function updateWeatherWidget() {
    const loc = state.weatherLocation;
    const el = document.getElementById("weatherWidgetBody");
    if (!loc || !loc.lat) return;
    const fresh = Date.now() - weatherCache.fetchedAt < 30 * 60 * 1000;
    if (!fresh) {
      try {
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&current_weather=true&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=auto`);
        const data = await res.json();
        weatherCache = { data, fetchedAt: Date.now() };
      } catch (err) { console.warn("Wetter-Abruf fehlgeschlagen:", err); }
    }
    if (el && weatherCache.data) {
      const cw = weatherCache.data.current_weather;
      const info = weatherInfo(cw.weathercode);
      const tMax = Math.round(weatherCache.data.daily.temperature_2m_max[0]);
      const tMin = Math.round(weatherCache.data.daily.temperature_2m_min[0]);
      // Drei-Tage-Vorschau: heute überspringen, die nächsten drei Tage zeigen
      const daily = weatherCache.data.daily;
      let forecastHtml = "";
      if (daily && daily.time && daily.time.length > 1) {
        const days = [];
        for (let i = 1; i <= 3 && i < daily.time.length; i++) {
          const dInfo = weatherInfo(daily.weathercode[i]);
          const [y, mo, dd] = daily.time[i].split("-").map(Number);
          const wd = new Date(Date.UTC(y, mo - 1, dd)).toLocaleDateString("de-DE", { weekday: "short", timeZone: "UTC" });
          days.push(`<div class="weather-fc-day" title="${dInfo.label}">
            <span class="weather-fc-wd">${wd}</span>
            <span class="weather-fc-icon">${dInfo.icon}</span>
            <span class="weather-fc-temp">${Math.round(daily.temperature_2m_max[i])}° <span>${Math.round(daily.temperature_2m_min[i])}°</span></span>
          </div>`);
        }
        if (days.length) forecastHtml = `<div class="weather-forecast">${days.join("")}</div>`;
      }
      el.innerHTML = `
        <div style="display:flex;align-items:center;gap:12px;">
          <span style="font-size:34px;">${info.icon}</span>
          <div><div class="widget-big-stat">${Math.round(cw.temperature)}°</div><div style="font-size:12px;color:var(--text-muted);">${info.label} · ${loc.name}</div></div>
        </div>
        <div style="font-size:12px;color:var(--text-muted);margin-top:4px;">Heute: ${tMin}° / ${tMax}°</div>
        ${forecastHtml}`;
    }
  }

  function renderHomeView(container) {
    const todayStr = new Date().toISOString().slice(0, 10);
    const activeProfile = getActiveProfile();

    const grid = document.createElement("div");
    grid.className = "widget-grid";
    container.appendChild(grid);

    let hiddenWidgets = [];
    try { hiddenWidgets = JSON.parse(localStorage.getItem("dapp_hidden_widgets") || "[]"); } catch (e) {}
    function widget(icon, title, accentVar, bodyHtml, linkView, linkLabel) {
      // Ausgeblendete Kacheln gar nicht erst bauen — aber ein Dummy zurückgeben,
      // damit aufrufender Code weiterhin .querySelector() nutzen kann.
      if (hiddenWidgets.includes(title)) return document.createElement("div");
      const card = document.createElement("div");
      card.className = "widget-card";
      card.dataset.sortId = title; // Titel dient als stabiler Schlüssel für die eigene Reihenfolge

      card.innerHTML = `
        <div class="widget-head"><h3>${icon} ${title}</h3>${linkView ? `<span class="widget-link" data-goto="${linkView}" style="cursor:pointer;">${linkLabel || "Öffnen ›"}</span>` : ""}</div>

      const link = card.querySelector("[data-goto]");
      if (link) link.onclick = () => setView(link.dataset.goto);
      grid.appendChild(card);
      return card;
    }

    // --- Dashboard-Kachel: Begrüßung + Name + Datum, zusammen mit Wetter, Ferien & Betreuung ---
    const hour = new Date().getHours();
    const salutation = hour < 11 ? "Guten Morgen" : hour < 18 ? "Hallo" : "Guten Abend";
    const ferienStatus = getFerienStatus();
    const hasWeather = !!state.weatherLocation.lat;
    const hasFerien = !!state.federalState;
    const hasCustody = state.custodySchedules.length > 0;
    {
      const weatherPart = hasWeather
        ? `<div id="weatherWidgetBody" class="dash-clickable" data-goto="calendar">${weatherCache.data ? "" : `<div class="widget-empty">Lade Wetter …</div>`}</div>`

                : (() => {
                    const sd = countSchoolDays(todayStr, ferienStatus.lastSchoolDay);
