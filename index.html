                    return `🏖️ Noch ${sd} Schultag${sd === 1 ? "" : "e"} bis ${escapeHtml(ferienStatus.name)}. Letzter Schultag ${formatDateWithWeekday(ferienStatus.lastSchoolDay)}`;
                  })()}</div>`
            : `<div class="today-sub-stat widget-empty" style="padding:0;">Noch keine Ferientermine geladen.</div>`)
        : "";
      const vacStatus = getVacationStatus();
      const vacationPart = vacStatus
        ? `<div class="today-sub-stat dash-clickable" data-goto="calendar">${vacStatus.type === "current"
            ? `${vacStatus.emoji} Urlaub: ${escapeHtml(vacStatus.name)} — ${countdownText(vacStatus.days, { zero: "heute letzter Tag", one: "noch 1 Tag" })}`
            : `${vacStatus.emoji} ${countdownText(vacStatus.days, { zero: "Heute geht es los", one: "Morgen geht es los" })}${vacStatus.days > 1 ? " bis" : " —"} ${escapeHtml(vacStatus.name)}`}</div>`
        : "";
      let custodyPart = "";
      if (hasCustody) {
        const rows = state.custodySchedules.map(s => {
          const res = custodyResultForDate(s, todayStr);
          if (!res) return "";
          const parents = (res.block.profileIds || []).map(id => getProfile(id)).filter(Boolean);
          const kids = s.childIds.map(id => getProfile(id)).filter(Boolean);
          return `<div class="custody-today-row">
            <span style="font-size:12.5px;">${kids.map(k => k.emoji || k.name.charAt(0)).join(" ")} ${escapeHtml(kids.map(k => k.name).join(", "))}</span>
            <span class="arrow">→</span>
            ${parents.map(p => `<span class="mini-avatar" style="background:${p.color};width:22px;height:22px;font-size:12px;">${p.emoji || p.name.charAt(0)}</span>`).join("")}
            <span style="font-size:12px;color:var(--text-muted);">${escapeHtml(parents.map(p => p.name).join(" & "))}</span>
            ${res.isSwitchDay ? `<span class="tag-chip" style="margin-left:auto;">⇄ Wechseltag</span>` : ""}
          </div>`;
        }).join("");
        custodyPart = `<div class="today-sub-stat dash-clickable" data-goto="calendar">${rows || `<div class="widget-empty" style="padding:0;">Nichts hinterlegt.</div>`}</div>`;
      }
      const mealToday = getMealForDate(todayStr);
      const mealPart = `<div class="today-sub-stat" style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
        <span>🍽️ ${mealToday ? escapeHtml(mealToday) : "Essensplan: noch nichts geplant."}</span>
        <span class="widget-link" data-goto="mealplan" style="cursor:pointer;white-space:nowrap;">Planen ›</span>
      </div>`;
      const openTasksCount = state.tasks.filter(t => !t.done && t.category !== "homework" && t.approved !== false).length;
      const pointsPills = state.profiles.filter(p => p.role === "child").map(p =>
        `<span class="points-pill"><span class="mini-avatar" style="background:${p.color};">${p.emoji || p.name.charAt(0)}</span>${escapeHtml(p.name)} · ${pointsBalance(p.id)}⭐</span>`
      ).join("");
      const tasksPart = `<div class="today-sub-stat" style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;">
        <span style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">⭐ ${openTasksCount ? `${openTasksCount} offene Aufgabe${openTasksCount === 1 ? "" : "n"}` : "Keine offenen Aufgaben 🎉"}${pointsPills ? `<span class="points-pill-row">${pointsPills}</span>` : ""}</span>
        <span class="widget-link" data-goto="tasks" style="cursor:pointer;white-space:nowrap;">Aufgaben ›</span>
      </div>`;
      const auroraPart = `<div class="today-sub-stat dash-clickable" data-goto="settings" id="auroraWidgetBody">Lade Nordlicht-Vorschau …</div>`;
      const warnPart = state.federalState
        ? `<div class="today-sub-stat dash-clickable" data-goto="settings" id="warnBadgeBody">Lade Wetterwarnungen …</div>`
        : "";
      const pollenPart = state.federalState
        ? `<div class="today-sub-stat dash-clickable" data-goto="settings" id="pollenWidgetBody">Lade Pollenflug …</div>`
        : "";
      const dashCard = document.createElement("div");
      let clockSide = "left";
      try { clockSide = localStorage.getItem("dapp_clock_side") || "left"; } catch (e) {}
      dashCard.className = "widget-card dashboard-card" + (clockSide === "right" ? " clock-right" : "");
      dashCard.style.setProperty("--widget-accent", "#0057A6");
      const dashBody = weatherPart + ferienPart + vacationPart + custodyPart + mealPart + tasksPart + auroraPart + warnPart + pollenPart;
      dashCard.innerHTML = `
        <button type="button" class="clock-side-toggle" id="clockSideToggle" title="Uhr links/rechts">⇄ Uhr ${clockSide === "left" ? "rechts" : "links"}</button>
        <div class="dash-clock" id="dashClock"></div>
        <div class="dashboard-greeting">
          <h1>${salutation}${activeProfile ? ", " + escapeHtml(activeProfile.name) : ""}!</h1>
          <div class="home-date">${new Date().toLocaleDateString("de-DE", { weekday: "long", day: "2-digit", month: "long", year: "numeric" })}</div>
        </div>
        ${dashBody ? `<div class="widget-body">${dashBody}</div>` : ""}
      `;
      grid.appendChild(dashCard);
      dashCard.querySelector("#clockSideToggle").onclick = () => {
        const next = clockSide === "left" ? "right" : "left";
        try { localStorage.setItem("dapp_clock_side", next); } catch (e) {}
        render();
      };
      dashCard.querySelectorAll("[data-goto]").forEach(el => {
        el.onclick = () => setView(el.dataset.goto);
      });
      if (hasWeather) updateWeatherWidget();
      updateKpWidget();
      if (state.federalState) { updateWarnWidget(); updatePollenWidget(); }
      setupDashboardClock();
    }

    // --- Familien-News ---
    const recentNews = state.newsPosts.slice().sort((a, b) => b.createdAt - a.createdAt).slice(0, 3);
    widget("📰", "Familien-News", "#B15CDE",
      recentNews.length ? recentNews.map(post => {
        const author = post.createdBy ? getProfile(post.createdBy) : null;
        const preview = post.text ? escapeHtml(post.text).slice(0, 60) : (post.photo ? "📷 Foto" : post.audio ? "🎤 Sprachnachricht" : "");
        return `<div class="widget-row">${author ? `<span class="mini-avatar" style="background:${author.color};">${author.emoji || author.name.charAt(0)}</span>` : ""}<span class="wr-title">${preview}</span></div>`;
      }).join("") : `<div class="widget-empty">Noch keine News geteilt.</div>`,
      "news", "Alle News ›");

    // --- Nächste Termine ---
    const upcoming = state.events.filter(ev => ev.date >= todayStr).sort((a, b) => (a.date + (a.time || "")).localeCompare(b.date + (b.time || ""))).slice(0, 5);
    widget("📅", "Nächste Termine", "#3A5A9B",
      upcoming.length ? upcoming.map(ev => {
        const visible = canSeeEventDetails(ev);
        const ps = visible ? (ev.profileIds || []).map(id => getProfile(id)).filter(Boolean) : [];
        return `<div class="widget-row">
          <span class="wr-title" style="${visible ? "" : "font-style:italic;color:var(--text-muted);"}">${visible ? escapeHtml(ev.title) : "🔒 Privat"}</span>
          ${ps.map(p => `<span class="mini-avatar" style="background:${p.color};">${p.emoji || p.name.charAt(0)}</span>`).join("")}
          <span class="wr-meta">${ev.date === todayStr ? "Heute" : formatDateStrShort(ev.date)}${visible && ev.time ? " · " + ev.time : ""}</span>
        </div>`;
      }).join("") : `<div class="widget-empty">Keine anstehenden Termine.</div>`,
      "calendar", "Kalender ›");

    // --- Für dich markiert ---
    if (activeProfile) {
      const forYouItems = state.items.filter(it => (it.taggedProfileIds || []).includes(activeProfile.id) && canSeeItemDetails(it));
      const forYouTasks = state.tasks.filter(t => t.assignedTo === activeProfile.id && !t.done && t.approved !== false);
      const forYouCount = forYouItems.length + forYouTasks.length;
      if (forYouCount) {
        const rows = [
          ...forYouItems.slice(0, 4).map(it => {
            const icon = { note: "📝", checklist: "☑️", image: "🖼️" }[it.type] || "•";
            return `<div class="widget-row" data-foryou-item="${it.id}" data-foryou-type="${it.type}" style="cursor:pointer;"><span class="wr-title">${icon} ${escapeHtml(it.title || "Ohne Titel")}</span></div>`;
          }),
          ...forYouTasks.slice(0, 4).map(t => `<div class="widget-row" data-foryou-view="tasks" style="cursor:pointer;"><span class="wr-title">⭐ ${escapeHtml(t.title)}</span><span class="wr-meta">${t.points} Pkt.</span></div>`)
        ].join("");
        const card = widget("📌", "Für dich markiert", "#B15CDE", rows, null);
        card.querySelectorAll("[data-foryou-item]").forEach(row => {
          row.onclick = () => openEditor(row.dataset.foryouType, row.dataset.foryouItem);
        });
        card.querySelectorAll("[data-foryou-view]").forEach(row => {
          row.onclick = () => setView(row.dataset.foryouView);
        });
      }
    }

    // --- Offene Abstimmungen ---
    const activeIdForVotes = state.activeProfileId;
    const pendingVotes = [];
    Array.from({ length: 14 }, (_, i) => addDays(todayStr, i)).forEach(d => {
      const entry = getMealEntry(d);
      if (entry.confirmed) return;
      entry.options.forEach(o => {
        if (!activeIdForVotes || !(o.votes || []).includes(activeIdForVotes)) {
          pendingVotes.push({ kind: "meal", date: d, label: `🍽️ ${o.text}`, sub: formatDateStrShort(d) });
        }
      });
    });
    (state.vacations || []).filter(v => v.votable && v.end >= todayStr).forEach(v => {
      if (!activeIdForVotes || !(v.votes || []).includes(activeIdForVotes)) {
        pendingVotes.push({ kind: "vacation", label: `${v.emoji || "🏝️"} ${v.name}`, sub: `${formatDateStrShort(v.start)}–${formatDateStrShort(v.end)}` });
      }
    });
    // Eltern sehen hier zusätzlich, was noch auf ihre Freigabe wartet
    const meForVotes = getActiveProfile();
    if (!meForVotes || meForVotes.role === "parent") {
      state.tasks.filter(t => t.approved === false).forEach(t =>
        pendingVotes.push({ kind: "approve-task", label: `✅ Aufgabe: ${t.title}`, sub: "Freigabe nötig" }));
      state.rewards.filter(r => r.approved === false).forEach(r =>
        pendingVotes.push({ kind: "approve-task", label: `✅ Belohnung: ${r.title}`, sub: "Freigabe nötig" }));
      (state.allowanceRequests || []).filter(r => r.status === "pending").forEach(r => {
        const p = getProfile(r.profileId);
        const what = r.type === "payout" ? `Auszahlung ${fmtEuro(r.amount)}` : `${r.amount} Punkte umwandeln`;
        pendingVotes.push({ kind: "approve-allowance", label: `💰 ${p ? p.name : "?"}: ${what}`, sub: "Anfrage offen" });
      });
    }
    if (pendingVotes.length) {
      const voteCard = widget("🗳️", "Offen &amp; abzustimmen", "#B15CDE",
        pendingVotes.slice(0, 6).map((v, i) =>
          `<div class="widget-row vote-row" data-vote-idx="${i}" style="cursor:pointer;">
            <span class="wr-title">${escapeHtml(v.label)}</span><span class="wr-meta">${escapeHtml(v.sub)}</span>
          </div>`).join("") +
        (pendingVotes.length > 6 ? `<div class="widget-empty">+${pendingVotes.length - 6} weitere</div>` : ""),
        null);
      voteCard.querySelectorAll("[data-vote-idx]").forEach(row => {
        row.onclick = () => {
          const v = pendingVotes[Number(row.dataset.voteIdx)];
          if (!v) return;
          if (v.kind === "meal") { mealPlanWeekCursor = startOfWeek(v.date); setView("mealplan"); }
          else if (v.kind === "approve-task") { setView("tasks"); }
          else if (v.kind === "approve-allowance") { setView("admin"); }
          else { setView("calendar"); setTimeout(() => openVacationManager(), 140); }
        };
      });
    }

    // --- Hausaufgaben ---
    const openHomework = state.tasks.filter(t => t.category === "homework" && !t.done && t.approved !== false)
      .sort((a, b) => (a.dueDate || "").localeCompare(b.dueDate || ""));
    widget("📚", "Hausi", "#3A5A9B",
      openHomework.length ? openHomework.slice(0, 5).map(t => {
        const owner = getProfile(t.assignedTo);
        const overdue = t.dueDate && t.dueDate < todayStr;
        return `<div class="widget-row">
          ${owner ? `<span class="mini-avatar" style="background:${owner.color};">${owner.emoji || owner.name.charAt(0)}</span>` : ""}
          <span class="wr-title">${escapeHtml(t.title)}</span>
          <span class="wr-meta" style="${overdue ? "color:#C0453B;" : ""}">${t.dueDate ? (overdue ? "⚠️ " : "") + formatDateStrShort(t.dueDate) : ""}</span>
        </div>`;
      }).join("") : `<div class="widget-empty">Keine offenen Hausaufgaben 🎉</div>`,
      "tasks", "Aufgaben ›");

    // --- Einkaufsliste ---
    const openShopping = state.shoppingList.filter(i => !i.done);
    const multiList = (state.shoppingLists || []).length > 1;
    widget("🛒", "Einkaufsliste", "#86B35A",
      openShopping.length ? openShopping.slice(0, 5).map(i => `<div class="widget-row"><span class="wr-title">${escapeHtml(i.text)}</span>${multiList ? `<span class="wr-meta">${escapeHtml(i.list || state.shoppingLists[0])}</span>` : ""}</div>`).join("") +
        (openShopping.length > 5 ? `<div class="widget-empty">+${openShopping.length - 5} weitere</div>` : "")
        : `<div class="widget-empty">Liste ist leer.</div>`,
      "shopping", "Liste ›");

    // --- Philips Hue Lampen ---
    const myLights = (state.hue.lights || []).filter(l => l.assignedTo === state.activeProfileId);
    if (state.hue.bridgeUrl && myLights.length) {
      const hueCard = widget("💡", "Meine Lampen", "#E8A33D",
        myLights.map(l => `
          <div class="hue-light-row" data-light="${l.id}">
            <div class="hue-light-top">
              <span class="wr-title">${escapeHtml(l.name)}</span>
              <label class="hue-toggle"><input type="checkbox" class="hue-on"><span></span></label>
            </div>
            <input type="range" class="hue-bri" min="1" max="254" value="200">
            <input type="color" class="hue-color" value="#ffcc66">
          </div>
        `).join(""), null, null);
      myLights.forEach(l => {
        const row = hueCard.querySelector(`.hue-light-row[data-light="${l.id}"]`);
        row.querySelector(".hue-on").onchange = (e) => setHueLightState(l.id, { on: e.target.checked });
        row.querySelector(".hue-bri").addEventListener("change", (e) => setHueLightState(l.id, { on: true, bri: Number(e.target.value) }));
        row.querySelector(".hue-color").addEventListener("change", (e) => setHueLightState(l.id, { on: true, ...hexToHueSat(e.target.value) }));
      });
    }

    // "Zuletzt bearbeitet" liegt jetzt im gemeinsamen Elternbereich statt auf dem Homescreen.
    if (false) {
    const recent = state.items.filter(canSeeItemDetails).sort((a, b) => b.updatedAt - a.updatedAt).slice(0, 4);
    widget("🕘", "Zuletzt bearbeitet", "#4A6572",
      recent.length ? recent.map(it => {
        const icon = { note: "📝", checklist: "☑️", image: "🖼️" }[it.type] || "•";
        return `<div class="widget-row" data-item="${it.id}" data-type="${it.type}" style="cursor:pointer;"><span class="wr-title">${icon} ${escapeHtml(it.title || "Ohne Titel")}</span><span class="wr-meta">${fmtDate(it.updatedAt).split(" ")[0]}</span></div>`;
      }).join("") : `<div class="widget-empty">Noch nichts angelegt.</div>`,
      null);
    }

    grid.querySelectorAll("[data-item]").forEach(row => {
      row.onclick = () => openEditor(row.dataset.type, row.dataset.item);
    });

    // Eigene Kachel-Reihenfolge anwenden — die Dashboard-Kachel bleibt immer oben.
    let savedOrder = [];
    try { savedOrder = JSON.parse(localStorage.getItem("dapp_widget_order") || "[]"); } catch (e) {}
    if (savedOrder.length) {
      savedOrder.forEach(key => {
        const el = grid.querySelector(`.widget-card[data-sort-id="${CSS.escape(key)}"]`);
        if (el) grid.appendChild(el);
      });
      // Kacheln ohne gespeicherte Position hängen sich hinten an, bleiben aber erhalten.
      Array.from(grid.querySelectorAll(".widget-card[data-sort-id]"))
        .filter(el => !savedOrder.includes(el.dataset.sortId))
        .forEach(el => grid.appendChild(el));
    }
    makeListSortable(grid, ".widget-card[data-sort-id]", (order) => {
      try { localStorage.setItem("dapp_widget_order", JSON.stringify(order)); } catch (e) {}
      showToast("Reihenfolge gespeichert.");
    });
  }

  function renderListView(container, type, title, subtitle, icon) {
    const items = state.items
      .filter(it => it.type === type && itemMatchesSearch(it) && canSeeItemDetails(it))
      .sort((a, b) => (b.pinned - a.pinned) || (b.updatedAt - a.updatedAt));

    const header = document.createElement("div");
    header.className = "view-header";
    header.innerHTML = `
      <div><h1 class="view-title">${title}</h1><p class="view-sub">${subtitle}</p></div>
      <button class="btn btn-accent" id="addBtn">+ Neu</button>
    `;
    container.appendChild(header);

    if (activeTagFilter) {
      const bar = document.createElement("div");
      bar.style.marginBottom = "14px";
      bar.innerHTML = `<span class="tag-chip clickable" id="clearTagFilter">Filter: #${escapeHtml(activeTagFilter)} ✕</span>`;
      container.appendChild(bar);
      bar.querySelector("#clearTagFilter").onclick = () => { activeTagFilter = null; render(); };
    }

    if (!items.length) {
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.innerHTML = `<span class="empty-icon">${icon}</span>${
        searchQuery || activeTagFilter ? "Keine Treffer." : "Noch nichts hier — leg direkt los."
      }`;
      container.appendChild(empty);
    } else {
      const grid = document.createElement("div");
      grid.className = "grid";
      items.forEach(it => grid.appendChild(renderCard(it)));
      container.appendChild(grid);
    }

    document.getElementById("addBtn").onclick = () => openEditor(type);
  }

  function renderCard(it) {
    const card = document.createElement("div");
    card.className = "card";
    card.onclick = (e) => { if (!e.target.closest(".card-pin")) openEditor(it.type, it.id); };

    let bodyHtml = "";
    if (it.type === "note") {
      bodyHtml = `<div class="card-body md-preview">${mdToHtml((it.body || "").slice(0, 260))}</div>`;
    } else if (it.type === "checklist") {
      const total = (it.items || []).length;
      const done = (it.items || []).filter(c => c.done).length;
      const pct = total ? Math.round((done / total) * 100) : 0;
      const todayStrCard = new Date().toISOString().slice(0, 10);
      const overdueCount = it.hwMode ? (it.items || []).filter(c => !c.done && c.dueDate && c.dueDate < todayStrCard).length : 0;
      const isExpanded = expandedChecklists.has(it.id);
      bodyHtml = `
        <div class="card-body" style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
          <span>${it.hwMode ? "📚 " : ""}${done}/${total} erledigt${overdueCount ? ` · <span style="color:#C0453B;">${overdueCount} überfällig</span>` : ""}</span>
          ${total ? `<button class="card-pin checklist-expand-toggle" title="${isExpanded ? "Einklappen" : "Zum Abhaken aufklappen"}">${isExpanded ? "▾" : "▸"}</button>` : ""}
        </div>
        <div class="card-progress"><div class="card-progress-bar" style="width:${pct}%"></div></div>
        ${isExpanded ? `<div class="inline-checklist card-pin">${(it.items || []).map(c => `
          <label class="inline-checklist-row" data-sort-id="${c.id}"${c.level ? ` style="margin-left:${Math.min(3, c.level) * 18}px;"` : ""}>
            <input type="checkbox" data-item-id="${c.id}" ${c.done ? "checked" : ""}>
            <span${c.done ? ' style="text-decoration:line-through;color:var(--text-muted);"' : ""}>${escapeHtml(c.text || "")}${it.hwMode && c.subject ? ` <span class="tag-chip" style="font-size:10px;">${escapeHtml(c.subject)}</span>` : ""}</span>
          </label>`).join("")}</div>` : ""}
      `;
    } else if (it.type === "image") {
      bodyHtml = `${it.dataUrl ? `<img class="card-thumb" src="${it.dataUrl}" alt="">` : ""}
        <div class="card-body">${escapeHtml(it.caption || "")}</div>`;
    }

    const creator = it.createdBy ? getProfile(it.createdBy) : null;
    card.innerHTML = `
      <div class="card-top">
        <h3 class="card-title">${it.private ? "🔒 " : ""}${escapeHtml(it.title || "Ohne Titel")}</h3>
        <button class="card-pin ${it.pinned ? "pinned" : ""}" title="Anheften">${it.pinned ? "★" : "☆"}</button>
      </div>
      ${bodyHtml}
      <div class="card-tags">${(it.tags || []).map(t => `<span class="tag-chip clickable" data-tag="${escapeHtml(t)}">#${escapeHtml(t)}</span>`).join("")}</div>
      <div class="card-meta" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
        ${creator ? `<span class="mini-avatar" style="background:${creator.color};" title="Erstellt von ${escapeHtml(creator.name)}">${creator.emoji || creator.name.charAt(0)}</span>` : ""}
        Aktualisiert ${fmtDate(it.updatedAt)}
        ${(it.taggedProfileIds || []).length ? `<span style="margin-left:auto;display:flex;gap:3px;">${(it.taggedProfileIds || []).map(pid => { const p = getProfile(pid); return p ? `<span class="mini-avatar" style="background:${p.color};" title="Für ${escapeHtml(p.name)}">${p.emoji || p.name.charAt(0)}</span>` : ""; }).join("")}</span>` : ""}
      </div>
    `;
    card.querySelector(".card-pin").onclick = () => { it.pinned = !it.pinned; saveState(); render(); };
    card.querySelectorAll(".tag-chip[data-tag]").forEach(chip => {
      chip.onclick = (e) => { e.stopPropagation(); activeTagFilter = chip.dataset.tag; render(); };
    });
    const expandToggle = card.querySelector(".checklist-expand-toggle");
    if (expandToggle) {
      expandToggle.onclick = (e) => {
        e.stopPropagation();
        if (expandedChecklists.has(it.id)) expandedChecklists.delete(it.id);
        else expandedChecklists.add(it.id);
        render();
      };
    }
    card.querySelectorAll(".inline-checklist input[type=checkbox]").forEach(cb => {
      cb.onclick = (e) => e.stopPropagation();
      cb.onchange = (e) => {
        const row = it.items.find(r => r.id === cb.dataset.itemId);
        if (row) {
          row.done = cb.checked;
          // Unterpunkte mitziehen, danach Oberpunkte nachführen
          const idx = it.items.indexOf(row);
          const lvl = row.level || 0;
          for (let j = idx + 1; j < it.items.length; j++) {
            if ((it.items[j].level || 0) <= lvl) break;
            it.items[j].done = cb.checked;
          }
          syncChecklistParents(it.items);
          it.updatedAt = Date.now();
          saveState();
        }
        render();
      };
    });
    const inlineList = card.querySelector(".inline-checklist");
    if (inlineList) {
      makeListSortable(inlineList, ".inline-checklist-row", (order) => {
        const reordered = order.map(id => it.items.find(r => r.id === id)).filter(Boolean);
        const rest = it.items.filter(r => !order.includes(r.id));
        it.items = [...reordered, ...rest];
        it.updatedAt = Date.now();
        saveState();
      });
    }
    return card;
  }

  function renderTagsView(container) {
    const header = document.createElement("div");
    header.className = "view-header";
    header.innerHTML = `<div><h1 class="view-title">Tags</h1><p class="view-sub">Alle Themen auf einen Blick — klicke, um zu filtern.</p></div>`;
    container.appendChild(header);

    const tags = allTags();
    if (!tags.size) {
      container.innerHTML += `<div class="empty-state"><span class="empty-icon">🏷️</span>Noch keine Tags vergeben.</div>`;
      return;
    }
    const cloud = document.createElement("div");
    cloud.className = "tag-cloud";
    [...tags.entries()].sort((a, b) => b[1] - a[1]).forEach(([tag, count]) => {
      const pill = document.createElement("button");
      pill.className = "tag-pill" + (activeTagFilter === tag ? " active" : "");
      pill.innerHTML = `#${escapeHtml(tag)} <span class="count">${count}</span>`;
      pill.onclick = () => { activeTagFilter = activeTagFilter === tag ? null : tag; setView("notes"); };
      cloud.appendChild(pill);
    });
    container.appendChild(cloud);
  }

  /* ============ EDITOR MODAL ============ */
  function drawColoringTemplate(ctx, id) {
    ctx.save();
    ctx.strokeStyle = "#2B2621";
    ctx.fillStyle = "#2B2621";
    ctx.lineWidth = 5;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    if (id === "auto") {
      ctx.beginPath(); ctx.roundRect(120, 190, 320, 90, 20); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(170, 190); ctx.lineTo(210, 130); ctx.lineTo(370, 130); ctx.lineTo(410, 190); ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.arc(200, 285, 35, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(370, 285, 35, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.rect(240, 150, 60, 40); ctx.stroke();
    } else if (id === "haus") {
      ctx.beginPath(); ctx.rect(160, 180, 280, 160); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(140, 180); ctx.lineTo(300, 70); ctx.lineTo(460, 180); ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.rect(270, 260, 60, 80); ctx.stroke();
      ctx.beginPath(); ctx.rect(190, 210, 50, 50); ctx.stroke();
      ctx.beginPath(); ctx.rect(360, 210, 50, 50); ctx.stroke();
    } else if (id === "katze") {
      ctx.beginPath(); ctx.arc(300, 230, 90, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(230, 170); ctx.lineTo(210, 100); ctx.lineTo(270, 150); ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(370, 170); ctx.lineTo(390, 100); ctx.lineTo(330, 150); ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.arc(265, 220, 8, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(335, 220, 8, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(300, 235); ctx.lineTo(300, 250); ctx.lineTo(285, 260); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(380, 260); ctx.quadraticCurveTo(440, 220, 420, 160); ctx.stroke();
    } else if (id === "rakete") {
      ctx.beginPath(); ctx.moveTo(300, 60); ctx.quadraticCurveTo(360, 130, 350, 260); ctx.lineTo(250, 260); ctx.quadraticCurveTo(240, 130, 300, 60); ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.arc(300, 150, 22, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(250, 230); ctx.lineTo(200, 290); ctx.lineTo(250, 270); ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(350, 230); ctx.lineTo(400, 290); ctx.lineTo(350, 270); ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(275, 260); ctx.lineTo(265, 310); ctx.lineTo(285, 310); ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(325, 260); ctx.lineTo(315, 310); ctx.lineTo(335, 310); ctx.closePath(); ctx.stroke();
    } else if (id === "blume") {

  function openEditor(type, id) {

    overlay.innerHTML = `
      <div class="modal">
        <div class="modal-header">
          <h2>${existing ? "Bearbeiten" : "Neu"}: ${typeLabel}</h2>
          <button class="close-btn" id="closeModal">✕</button>

        <div class="field"><label>Titel</label>

        ${bodyFieldHtml}
        <div class="field"><label>Tags (mit Komma trennen)</label>
          <input type="text" id="f-tags" value="${escapeHtml((draft.tags || []).join(", "))}" placeholder="z. B. produkt, ux, sprint3">

        ${state.profiles.length ? `
