<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DApp V1</title>
<meta name="description" content="DApp — die Familien-App: Notizen, Mind-Maps, Checklisten, Aufgaben, Kalender und mehr an einem Ort.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5F7038">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DApp">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=Kalam:wght@400;700&family=Archivo+Black&family=Work+Sans:wght@400;500;700&family=Source+Sans+3:wght@400;600;700&family=Poppins:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&family=VT323&family=IBM+Plex+Mono:wght@400;500;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Lora:wght@400;600&family=Oswald:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@400;500;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>

/* ============ RESET & BASE ============ */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  transition: background .35s ease, color .35s ease;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font-family: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
::selection { background: var(--accent); color: var(--surface); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}

/* ============ THEME TOKENS ============ */
/* 1. Papierblock — warm notebook, typewriter */
.theme-papier {
  --bg: #EAE2CE; --surface: #FBF7EC; --surface2: #F1E9D6;
  --text: #2B2621; --text-muted: #6B6153;
  --accent: #5F7038; --accent2: #2F4858;
  --border: #C9BC9C; --shadow: 0 2px 10px rgba(43,38,33,.12);
  --font-display: 'Special Elite', cursive; --font-body: 'Courier Prime', monospace;
  --radius: 2px; --pattern: none;
}
/* 2. Mitternacht — deep navy, gold */
.theme-mitternacht {
  --bg: #10142A; --surface: #1A2043; --surface2: #212A54;
  --text: #EDEBFA; --text-muted: #9FA3C7;
  --accent: #C9A24B; --accent2: #3F9C99;
  --border: #313A66; --shadow: 0 8px 24px rgba(0,0,0,.4);
  --font-display: 'Fraunces', serif; --font-body: 'Inter', sans-serif;
  --radius: 10px; --pattern: none;
}
/* 3. Skizzenblock — graph paper */
.theme-skizze {
  --bg: #E7ECF2; --surface: #FFFFFF; --surface2: #DCE4EE;
  --text: #29344A; --text-muted: #6C7793;
  --accent: #3A5A9B; --accent2: #C0453B;
  --border: #B9C6DB; --shadow: 0 2px 8px rgba(41,52,74,.1);
  --font-display: 'Kalam', cursive; --font-body: 'Inter', sans-serif;
  --radius: 4px;
  --pattern: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
}
/* 4. Bauhaus — primary geometry */
.theme-bauhaus {
  --bg: #F2EFE6; --surface: #FFFFFF; --surface2: #EAE5D6;
  --text: #1A1A1A; --text-muted: #555049;
  --accent: #D0263B; --accent2: #1D4E9B;
  --border: #1A1A1A; --shadow: 4px 4px 0 #1A1A1A;
  --font-display: 'Archivo Black', sans-serif; --font-body: 'Work Sans', sans-serif;
  --radius: 0px; --pattern: none;
}
/* 5. Wald — deep forest */
.theme-wald {
  --bg: #172A20; --surface: #203627; --surface2: #294432;
  --text: #EDE7D3; --text-muted: #A9B7A4;
  --accent: #86B35A; --accent2: #D9A441;
  --border: #35503E; --shadow: 0 6px 20px rgba(0,0,0,.35);
  --font-display: 'Fraunces', serif; --font-body: 'Source Sans 3', sans-serif;
  --radius: 8px; --pattern: none;
}
/* 6. Ozean — teal calm */
.theme-ozean {
  --bg: #0E3B43; --surface: #124A54; --surface2: #165B67;
  --text: #E7F5F3; --text-muted: #A9CFCB;
  --accent: #FF9270; --accent2: #F2D6A2;
  --border: #1E6773; --shadow: 0 8px 22px rgba(0,0,0,.3);
  --font-display: 'Poppins', sans-serif; --font-body: 'Nunito Sans', sans-serif;
  --radius: 14px; --pattern: none;
}
/* 7. Terminal — retro phosphor */
.theme-terminal {
  --bg: #0B0F0C; --surface: #101610; --surface2: #161D16;
  --text: #4CFF6B; --text-muted: #3A9950;
  --accent: #FFB000; --accent2: #4CFF6B;
  --border: #234027; --shadow: 0 0 0 1px #234027;
  --font-display: 'VT323', monospace; --font-body: 'IBM Plex Mono', monospace;
  --radius: 0px; --pattern: none;
}
/* 8. Rosé — soft editorial */
.theme-rose {
  --bg: #F6E9EE; --surface: #FFF8FA; --surface2: #F0DCE3;
  --text: #4A2338; --text-muted: #8A5E71;
  --accent: #C6577B; --accent2: #B8925A;
  --border: #E3C3CF; --shadow: 0 4px 16px rgba(74,35,56,.12);
  --font-display: 'Playfair Display', serif; --font-body: 'Lora', serif;
  --radius: 6px; --pattern: none;
}
/* 9. Industrial — concrete & safety orange */
.theme-industrial {
  --bg: #DEDBD2; --surface: #F1EFE8; --surface2: #D2CEC2;
  --text: #232323; --text-muted: #5B5850;
  --accent: #E8590C; --accent2: #4A6572;
  --border: #232323; --shadow: none;
  --font-display: 'Oswald', sans-serif; --font-body: 'IBM Plex Sans', sans-serif;
  --radius: 0px; --pattern: none;
}
/* 10. Aurora — gradient dream */
.theme-aurora {
  --bg: #150B26; --surface: #1F1338; --surface2: #291A47;
  --text: #F1EBFF; --text-muted: #B4A4D9;
  --accent: #B15CDE; --accent2: #35D0BA;
  --border: #3A2A5C; --shadow: 0 10px 30px rgba(177,92,222,.25);
  --font-display: 'Space Grotesk', sans-serif; --font-body: 'Manrope', sans-serif;
  --radius: 14px; --pattern: none;
}

/* ============ LAYOUT ============ */
#app { display: flex; min-height: 100vh; }
.theme-skizze body, .theme-skizze #app { background-image: var(--pattern); background-size: 24px 24px; }
.theme-skizze { }
body.theme-skizze { background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px); background-size: 26px 26px; background-color: var(--bg); }

.sidebar {
  width: 232px; flex-shrink: 0; background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; padding: 20px 14px;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  transition: transform .25s ease;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 6px 10px 22px; }
.brand-mark { font-size: 22px; color: var(--accent); }
.brand-text { font-family: var(--font-display); font-size: 21px; letter-spacing: .3px; }
.brand-version { font-size: 10px; color: var(--text-muted); background: var(--surface2); border: 1px solid var(--border); border-radius: 999px; padding: 2px 7px; margin-left: 2px; font-weight: 600; }
.nav { display: flex; flex-direction: column; gap: 4px; flex: 1; }
.sidebar-bottom { display: flex; flex-direction: column; gap: 4px; border-top: 1px solid var(--border); padding-top: 12px; margin-top: 12px; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  background: transparent; border: 1px solid transparent; border-radius: var(--radius);
  padding: 10px 12px; font-size: 14.5px; font-weight: 500; text-align: left;
  color: var(--text-muted); transition: background .15s, color .15s, border-color .15s;
}
.nav-item:hover { background: var(--surface2); color: var(--text); }
.nav-item.active { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.theme-bauhaus .nav-item.active { color: #fff; }
.nav-icon { font-size: 16px; width: 18px; text-align: center; }
.nav-divider { height: 1px; background: var(--border); margin: 8px 4px; }

/* ============ PROFILE BAR ============ */
.profile-bar { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 6px 16px; }
.avatar {
  width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 16px; border: 2px solid transparent; cursor: pointer; flex-shrink: 0; position: relative;
  transition: transform .12s ease, border-color .15s; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.35);
}
.avatar:hover { transform: translateY(-1px); }
.avatar.active { border-color: var(--text); box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--accent); }
.avatar-add {
  width: 34px; height: 34px; border-radius: 50%; border: 2px dashed var(--border); background: transparent;
  color: var(--text-muted); font-size: 16px; display: flex; align-items: center; justify-content: center;
}
.avatar-add:hover { border-color: var(--accent); color: var(--accent); }
.profile-empty-hint { font-size: 12px; color: var(--text-muted); padding: 0 6px 14px; line-height: 1.5; }
.profile-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 3px 10px 3px 3px; border-radius: 999px; background: var(--surface2); border: 1px solid var(--border); }
.mini-avatar { width: 18px; height: 18px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,.3); flex-shrink: 0; }
.build-tag { font-size: 10.5px; color: var(--text-muted); text-align: center; padding: 10px 6px 2px; opacity: .7; }

/* Papa-Bereich (admin) */
.admin-gate { max-width: 380px; margin: 40px auto; text-align: center; }
.admin-gate .admin-icon { font-size: 40px; display: block; margin-bottom: 14px; }
.admin-gate input[type=password] { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); font-size: 15px; text-align: center; letter-spacing: .1em; margin-bottom: 12px; }
.admin-gate .admin-error { color: #C0453B; font-size: 12.5px; margin-bottom: 10px; min-height: 16px; }
.build-info-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 22px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
.build-info-card .build-num { font-family: var(--font-display); font-size: 20px; }

/* custody / Wechselmodell indicator on calendar days */
.cal-custody-row { position: absolute; left: 6px; right: 6px; bottom: 6px; display: flex; gap: 3px; flex-wrap: wrap; }
.custody-dot { width: 16px; height: 16px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 9px; color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,.3); flex-shrink: 0; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.custody-dot.custody-switch { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--text); }
.custody-dot-empty { width: 16px; height: 16px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; color: var(--text-muted); background: var(--surface2); border: 1px dashed var(--border); }
.custody-block-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 6px; background: var(--bg); flex-wrap: wrap; }
.custody-block-row input[type=number] { width: 64px; padding: 6px 8px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  display: flex; align-items: center; gap: 14px; padding: 16px 26px;
  border-bottom: 1px solid var(--border); background: var(--bg);
  position: sticky; top: 0; z-index: 5;
}
.hamburger { display: none; background: none; border: none; font-size: 20px; color: var(--text); }
.search-wrap { flex: 1; max-width: 480px; }
#searchInput {
  width: 100%; padding: 10px 14px; border-radius: var(--radius); border: 1px solid var(--border);
  background: var(--surface); font-size: 14px;
}
.btn {
  padding: 10px 16px; border-radius: var(--radius); border: 1px solid var(--border);
  background: var(--surface); font-size: 14px; font-weight: 600; white-space: nowrap;
  transition: transform .12s ease, background .15s ease;
}
.btn:hover { transform: translateY(-1px); }
.btn-accent { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.theme-bauhaus .btn-accent { color: #fff; box-shadow: var(--shadow); }
.btn-ghost { background: transparent; }
.btn-sm { padding: 6px 10px; font-size: 12.5px; }
.btn-danger { color: #C0453B; border-color: #C0453B; background: transparent; }

.view-container { flex: 1; padding: 26px; max-width: 1100px; width: 100%; margin: 0 auto; }
.view-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; gap: 10px;}
.view-title { font-family: var(--font-display); font-size: 28px; margin: 0; }
.view-sub { color: var(--text-muted); font-size: 13.5px; margin: 4px 0 0; }

.empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.empty-state .empty-icon { font-size: 34px; display: block; margin-bottom: 10px; }

.toast {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  padding: 10px 18px; border-radius: var(--radius); box-shadow: var(--shadow);
  font-size: 13.5px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
  z-index: 50;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 860px) {
  .sidebar { position: fixed; z-index: 40; left: 0; top: 0; transform: translateX(-100%); box-shadow: 0 0 30px rgba(0,0,0,.3);}
  .sidebar.open { transform: translateX(0); }
  .hamburger { display: block; }
  .view-container { padding: 16px; }
  .topbar { padding: 12px 16px; }
}

/* ============ GRID / CARDS ============ */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px;
  cursor: pointer; transition: transform .12s ease, border-color .15s;
}
.card:hover { transform: translateY(-2px); border-color: var(--accent); }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.card-title { font-family: var(--font-display); font-size: 17px; margin: 0; word-break: break-word; }
.card-pin { background: none; border: none; font-size: 15px; color: var(--text-muted); }
.card-pin.pinned { color: var(--accent); }
.card-body { color: var(--text-muted); font-size: 13.5px; line-height: 1.5; max-height: 4.5em; overflow: hidden; }
.card-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.tag-chip {
  font-size: 11px; padding: 3px 9px; border-radius: 999px; background: var(--surface2);
  color: var(--text-muted); border: 1px solid var(--border);
}
.tag-chip.clickable:hover { border-color: var(--accent); color: var(--accent); cursor: pointer; }
.card-meta { font-size: 11px; color: var(--text-muted); margin-top: auto; padding-top: 6px; }
.card-progress { height: 5px; background: var(--surface2); border-radius: 999px; overflow: hidden; margin-top: 4px;}
.card-progress-bar { height: 100%; background: var(--accent); }
.card-thumb { width: 100%; height: 130px; object-fit: cover; border-radius: var(--radius); border: 1px solid var(--border); }

/* ============ MODAL / EDITOR ============ */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex;
  align-items: center; justify-content: center; z-index: 60; padding: 20px;
}
.modal {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  width: 100%; max-width: 640px; max-height: 88vh; overflow-y: auto; padding: 24px;
  box-shadow: var(--shadow);
}
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.modal-header h2 { font-family: var(--font-display); margin: 0; font-size: 22px; }
.close-btn { background: none; border: none; font-size: 20px; color: var(--text-muted); }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 6px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; }
.field input[type=text], .field textarea, .field select {
  width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg); color: var(--text); font-size: 14px;
}
.field textarea { min-height: 130px; resize: vertical; line-height: 1.5; }
.modal-footer { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; }
.modal-footer-right { display: flex; gap: 8px; }

/* checklist items in editor */
.checklist-items { display: flex; flex-direction: column; gap: 6px; }
.checklist-row { display: flex; align-items: center; gap: 8px; }
.checklist-row input[type=text] { flex: 1; padding: 8px 10px; }
.checklist-row .del { background: none; border: none; color: var(--text-muted); font-size: 16px; }
.checklist-view-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--border); }
.checklist-view-row:last-child { border-bottom: none; }
.checklist-view-row input { width: 17px; height: 17px; accent-color: var(--accent); }
.checklist-view-row.done label { text-decoration: line-through; color: var(--text-muted); }
.add-row-btn { align-self: flex-start; margin-top: 4px; }

/* image dropzone */
.dropzone {
  border: 2px dashed var(--border); border-radius: var(--radius); padding: 26px; text-align: center;
  color: var(--text-muted); font-size: 13.5px; cursor: pointer; transition: border-color .15s;
}
.dropzone:hover, .dropzone.drag { border-color: var(--accent); color: var(--accent); }
.dropzone input { display: none; }
.image-preview { width: 100%; max-height: 220px; object-fit: contain; border-radius: var(--radius); margin-top: 10px; border: 1px solid var(--border); }

/* image tabs + drawing pad */
.img-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
.img-tab { padding: 7px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-size: 12.5px; }
.img-tab.active { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.theme-bauhaus .img-tab.active { color: #fff; }
.draw-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.draw-colors { display: flex; gap: 5px; }
.draw-swatch { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--border); padding: 0; }
.draw-swatch.active { border-color: var(--text); box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--accent); }
#drawEraser.active-tool { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.draw-canvas { width: 100%; max-width: 100%; height: auto; aspect-ratio: 600 / 380; border: 1px solid var(--border); border-radius: var(--radius); background: #fff; touch-action: none; cursor: crosshair; }

/* tags view */
.tag-cloud { display: flex; flex-wrap: wrap; gap: 10px; }
.tag-pill {
  padding: 8px 16px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border);
  font-size: 13.5px; display: flex; align-items: center; gap: 8px;
}
.tag-pill .count { background: var(--surface2); border-radius: 999px; padding: 1px 8px; font-size: 11px; color: var(--text-muted); }
.tag-pill.active { border-color: var(--accent); color: var(--accent); }

/* ============ MIND-MAP ============ */
.mindmap-toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
.mindmap-hint { font-size: 12px; color: var(--text-muted); margin-left: auto; }
.mindmap-wrap {
  position: relative; width: 100%; height: 70vh; min-height: 460px; overflow: hidden;
  border: 1px solid var(--border); border-radius: calc(var(--radius) + 6px); background: var(--surface);
  background-image: radial-gradient(var(--border) 1.1px, transparent 1.1px);
  background-size: 26px 26px; cursor: grab; touch-action: none;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.02);
}
.mindmap-wrap.panning { cursor: grabbing; }
.mindmap-world { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }
.mindmap-svg { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; }
.mindmap-svg path.mm-edge { fill: none; opacity: .85; stroke-linecap: round; filter: drop-shadow(0 1px 1px rgba(0,0,0,.08)); }

.mm-node {
  position: absolute; min-width: 130px; max-width: 240px; padding: 11px 16px;
  background: var(--surface); border: 2px solid var(--accent); border-radius: 14px;
  font-size: 13.5px; line-height: 1.35; cursor: grab;
  box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 6px 16px rgba(0,0,0,.08);
  transition: box-shadow .15s ease, border-color .15s ease, transform .12s ease;
  animation: mmPop .22s cubic-bezier(.34,1.56,.64,1);
}
@keyframes mmPop { from { transform: scale(.75); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.mm-node:hover { box-shadow: 0 2px 4px rgba(0,0,0,.08), 0 10px 22px rgba(0,0,0,.12); }
.mm-node.selected { border-width: 2px; box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent2) 30%, transparent), 0 8px 20px rgba(0,0,0,.12); }
.mm-node.root {
  background: linear-gradient(155deg, var(--accent), color-mix(in srgb, var(--accent) 78%, #000 10%));
  color: var(--surface); font-family: var(--font-display); font-size: 17px; font-weight: 600;
  padding: 16px 22px; border: none; box-shadow: 0 4px 10px rgba(0,0,0,.14), 0 14px 30px rgba(0,0,0,.16);
  min-width: 160px;
}
.theme-bauhaus .mm-node.root { color: #fff; }
.mm-node .mm-text { display: block; outline: none; cursor: text; user-select: text; }
.mm-node .mm-text:focus { cursor: text; }
.mm-node .mm-del { position: absolute; top: -9px; right: -9px; background: var(--bg); border: 1px solid var(--border); border-radius: 50%; width: 22px; height: 22px; font-size: 11px; line-height: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0; transition: opacity .15s; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
.mm-node .mm-add-child { position: absolute; bottom: -9px; right: -9px; background: var(--accent); color: var(--surface); border: 1px solid var(--accent); border-radius: 50%; width: 22px; height: 22px; font-size: 13px; line-height: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0; transition: opacity .15s; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
.mm-node:hover .mm-del, .mm-node:hover .mm-add-child, .mm-node.selected .mm-del, .mm-node.selected .mm-add-child { opacity: 1; }
.theme-bauhaus .mm-node .mm-add-child { color: #fff; }

.mm-controls {
  position: absolute; right: 14px; bottom: 14px; z-index: 3; display: flex; flex-direction: column;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden;
}
.mm-controls button {
  width: 36px; height: 36px; border: none; background: transparent; color: var(--text); font-size: 16px;
  border-bottom: 1px solid var(--border); cursor: pointer;
}
.mm-controls button:last-child { border-bottom: none; }
.mm-controls button:hover { background: var(--surface2); }
.mm-zoom-label { font-size: 10px; text-align: center; color: var(--text-muted); padding: 3px 0; border-bottom: 1px solid var(--border); user-select: none; }

/* ============ EXPORT PANEL ============ */
.export-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap: 14px; margin-bottom: 22px; }
.export-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
.export-card h3 { margin: 0 0 6px; font-family: var(--font-display); font-size: 18px; }
.export-card p { font-size: 13px; color: var(--text-muted); margin: 0 0 12px; }
.scope-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.scope-chip { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-size: 12.5px; }
.scope-chip.active { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.theme-bauhaus .scope-chip.active { color:#fff; }

/* ============ SETTINGS / THEME PICKER ============ */
.settings-section { margin-bottom: 32px; }
.settings-section h3 { font-family: var(--font-display); font-size: 19px; margin-bottom: 4px; }
.settings-section .hint { color: var(--text-muted); font-size: 13px; margin-bottom: 14px; }

.theme-shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 14px; }
.theme-cover {
  border-radius: 6px 6px 3px 3px; border: 1px solid rgba(0,0,0,.15); cursor: pointer;
  padding: 14px 12px; height: 108px; display: flex; flex-direction: column; justify-content: space-between;
  position: relative; transition: transform .15s ease; box-shadow: 2px 3px 8px rgba(0,0,0,.18);
}
.theme-cover:hover { transform: translateY(-4px) rotate(-.5deg); }
.theme-cover.active::after {
  content: "✓"; position: absolute; top: 8px; right: 10px; font-size: 13px;
  background: rgba(255,255,255,.85); color: #222; border-radius: 50%; width: 20px; height: 20px;
  display: flex; align-items: center; justify-content: center;
}
.theme-cover .spine { position: absolute; left: 0; top: 0; bottom: 0; width: 8px; background: rgba(0,0,0,.18); border-radius: 6px 0 0 3px; }
.theme-cover .t-name { font-size: 13.5px; font-weight: 700; padding-left: 6px; }
.theme-cover .t-sub { font-size: 10.5px; opacity: .75; padding-left: 6px; }
.theme-cover .t-dots { display: flex; gap: 5px; padding-left: 6px; }
.theme-cover .t-dots span { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

.connector-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 14px; }
.connector-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.connector-head h4 { margin: 0; font-size: 15.5px; }
.badge-soon { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; background: var(--surface2); color: var(--text-muted); padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); }
.connector-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap: 10px; margin-bottom: 10px; }
.connector-fields input, .connector-fields select { padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); font-size: 13px; }
.connector-fields input:disabled { opacity: .55; cursor: not-allowed; }

.backup-row { display: flex; gap: 10px; flex-wrap: wrap; }

/* ============ PRINT (used for PDF-safe layouts) ============ */
@media print {
  .sidebar, .topbar, .modal-overlay, .toast { display: none !important; }
  .view-container { max-width: 100%; }
}

</style>
</head>
<body class="theme-papier">

<div id="app">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-mark">✎</span>
      <span class="brand-text">DApp</span>
      <span class="brand-version">V1</span>
    </div>

    <div class="profile-bar" id="profileBar"></div>

    <nav class="nav">
      <button class="nav-item active" data-view="notes">
        <span class="nav-icon">📝</span><span class="nav-label">Notizen</span>
      </button>
      <button class="nav-item" data-view="mindmap">
        <span class="nav-icon">🕸️</span><span class="nav-label">Mind-Map</span>
      </button>
      <button class="nav-item" data-view="checklists">
        <span class="nav-icon">☑️</span><span class="nav-label">Checklisten</span>
      </button>
      <button class="nav-item" data-view="images">
        <span class="nav-icon">🖼️</span><span class="nav-label">Bilder &amp; Malen</span>
      </button>
      <button class="nav-item" data-view="tags">
        <span class="nav-icon">🏷️</span><span class="nav-label">Tags</span>
      </button>
      <div class="nav-divider"></div>
      <button class="nav-item" data-view="tasks">
        <span class="nav-icon">⭐</span><span class="nav-label">Aufgaben &amp; Belohnungen</span>
      </button>
      <button class="nav-item" data-view="calendar">
        <span class="nav-icon">📅</span><span class="nav-label">Familienkalender</span>
      </button>
      <button class="nav-item" data-view="shopping">
        <span class="nav-icon">🛒</span><span class="nav-label">Einkaufsliste</span>
      </button>
    </nav>

    <div class="sidebar-bottom">
      <button class="nav-item" id="installBtn" style="display:none;">
        <span class="nav-icon">⬇️</span><span class="nav-label">App installieren</span>
      </button>
      <button class="nav-item" data-view="export">
        <span class="nav-icon">⇩</span><span class="nav-label">Export</span>
      </button>
      <button class="nav-item" data-view="settings">
        <span class="nav-icon">⚙️</span><span class="nav-label">Einstellungen</span>
      </button>
      <button class="nav-item" data-view="admin">
        <span class="nav-icon">🔐</span><span class="nav-label">Papa-Bereich</span>
      </button>
      <div class="build-tag" id="buildTag"></div>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <header class="topbar">
      <button class="hamburger" id="hamburger" aria-label="Menü">☰</button>
      <div class="search-wrap">
        <input type="text" id="searchInput" placeholder="Ideen, Tags oder Inhalte durchsuchen…" autocomplete="off">
      </div>
      <button class="btn btn-accent" id="newItemBtn">+ Neue Idee</button>
    </header>

    <main class="view-container" id="viewContainer">
      <!-- Views are rendered here by JS -->
    </main>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   IDEENBUCH — App-Logik (vanilla JS, keine Frameworks)
   ============================================================ */
(function () {
  "use strict";

  const STORAGE_KEY = "ideabook_state_v1";
  const APP_BUILD_NUMBER = 9;
  const APP_BUILD_DATE = "2026-07-24";

  const THEMES = [
    { id: "papier",     name: "Papierblock",     sub: "Warmes Notizbuch",  dots: ["#5F7038", "#2F4858", "#EAE2CE"] },
    { id: "mitternacht",name: "Mitternacht",     sub: "Tief & golden",     dots: ["#C9A24B", "#3F9C99", "#10142A"] },
    { id: "skizze",     name: "Skizzenblock",    sub: "Karopapier",        dots: ["#3A5A9B", "#C0453B", "#E7ECF2"] },
    { id: "bauhaus",    name: "Bauhaus",         sub: "Geometrisch",       dots: ["#D0263B", "#1D4E9B", "#F2EFE6"] },
    { id: "wald",       name: "Wald",            sub: "Tiefgrün & Moos",   dots: ["#86B35A", "#D9A441", "#172A20"] },
    { id: "ozean",      name: "Ozean",           sub: "Ruhig & weit",      dots: ["#FF9270", "#F2D6A2", "#0E3B43"] },
    { id: "terminal",   name: "Terminal",        sub: "Retro-Phosphor",    dots: ["#4CFF6B", "#FFB000", "#0B0F0C"] },
    { id: "rose",       name: "Rosé",            sub: "Sanft & editorial", dots: ["#C6577B", "#B8925A", "#F6E9EE"] },
    { id: "industrial", name: "Industrial",      sub: "Beton & Signalorange", dots: ["#E8590C", "#4A6572", "#DEDBD2"] },
    { id: "aurora",     name: "Aurora",          sub: "Verträumtes Farbspiel", dots: ["#B15CDE", "#35D0BA", "#150B26"] },
  ];

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  function defaultState() {
    return {
      theme: "papier",
      items: [],
      mindmap: { nodes: [], edges: [] },
      meta: { lastModified: Date.now() },
      profiles: [],
      activeProfileId: null,
      tasks: [],
      rewards: [],
      pointsLedger: [],
      events: [],
      shoppingList: [],
      custodySchedules: [],
      adminPasswordHash: "",
      connectors: {
        sharepoint: { siteUrl: "", library: "" },
        ftp: { host: "", port: "", user: "", path: "" },
        network: { url: "", authHeader: "", method: "PUT", autoSync: false, intervalMinutes: 5, lastSyncAt: 0 }
      }
    };
  }

  const PROFILE_COLORS = ["#5F7038", "#C9A24B", "#3A5A9B", "#C0453B", "#86B35A", "#FF9270", "#C6577B", "#4A6572", "#B15CDE", "#35D0BA"];
  const PROFILE_EMOJI = ["🦊", "🐨", "🐸", "🐝", "🦉", "🐙", "🦄", "🐳", "🐧", "🦁", "🐼", "🐬"];

  function loadState() {
    const base = defaultState();
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        return {
          ...base, ...parsed,
          mindmap: { ...base.mindmap, ...(parsed.mindmap || {}) },
          meta: { ...base.meta, ...(parsed.meta || {}) },
          connectors: {
            sharepoint: { ...base.connectors.sharepoint, ...((parsed.connectors || {}).sharepoint || {}) },
            ftp: { ...base.connectors.ftp, ...((parsed.connectors || {}).ftp || {}) },
            network: { ...base.connectors.network, ...((parsed.connectors || {}).network || {}) }
          }
        };
      }
    } catch (e) { console.warn("Konnte gespeicherten Zustand nicht laden:", e); }
    return base;
  }

  function saveState(opts) {
    if (!opts || !opts.skipTouch) {
      state.meta = state.meta || {};
      state.meta.lastModified = Date.now();
    }
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      showToast("Speichern fehlgeschlagen — evtl. ist der Speicher voll (große Bilder?)");
    }
  }

  let state = loadState();
  let currentView = "notes";
  let searchQuery = "";
  let adminUnlocked = false;
  let activeTagFilter = null;
  let mmSelectedNode = null;
  let exportScope = "all";

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(() => t.classList.remove("show"), 2600);
  }

  function escapeHtml(str) {
    return String(str || "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function fmtDate(ts) {
    if (!ts) return "";
    const d = new Date(ts);
    return d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" }) +
           " " + d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  }

  function allTags() {
    const map = new Map();
    state.items.forEach(it => (it.tags || []).forEach(t => map.set(t, (map.get(t) || 0) + 1)));
    return map;
  }

  function itemMatchesSearch(it) {
    if (activeTagFilter && !(it.tags || []).includes(activeTagFilter)) return false;
    if (!searchQuery) return true;
    const q = searchQuery.toLowerCase();
    const hay = [it.title, it.body, it.caption, ...(it.tags || []),
      ...((it.items || []).map(c => c.text))].filter(Boolean).join(" ").toLowerCase();
    return hay.includes(q);
  }

  /* ============ PROFILE (FAMILIE) ============ */
  function getProfile(id) { return state.profiles.find(p => p.id === id) || null; }
  function getActiveProfile() { return getProfile(state.activeProfileId); }

  function pointsBalance(profileId) {
    return state.pointsLedger.filter(l => l.profileId === profileId).reduce((sum, l) => sum + l.delta, 0);
  }

  function renderProfileBar() {
    const bar = document.getElementById("profileBar");
    bar.innerHTML = "";
    state.profiles.forEach(p => {
      const av = document.createElement("div");
      av.className = "avatar" + (state.activeProfileId === p.id ? " active" : "");
      av.style.background = p.color;
      av.textContent = p.emoji || p.name.charAt(0).toUpperCase();
      av.title = p.name + (p.role === "child" ? ` — ${pointsBalance(p.id)} Punkte` : "");
      av.onclick = () => { state.activeProfileId = p.id; saveState(); renderProfileBar(); render(); };
      av.ondblclick = () => openProfileEditor(p.id);
      bar.appendChild(av);
    });
    const addBtn = document.createElement("button");
    addBtn.className = "avatar-add";
    addBtn.title = "Profil hinzufügen";
    addBtn.textContent = "+";
    addBtn.onclick = () => openProfileEditor();
    bar.appendChild(addBtn);

    let hint = document.getElementById("profileBarHint");
    if (!hint) {
      hint = document.createElement("div");
      hint.id = "profileBarHint";
      hint.className = "profile-empty-hint";
      bar.parentElement.insertBefore(hint, bar.nextSibling);
    }
    hint.textContent = state.profiles.length
      ? "Klicken zum Wechseln, doppelklicken zum Bearbeiten."
      : "Noch keine Profile — legt eins für jedes Familienmitglied an.";
  }

  function openProfileEditor(id) {
    const existing = id ? getProfile(id) : null;
    const draft = existing ? { ...existing } : {
      id: uid(), name: "", color: PROFILE_COLORS[state.profiles.length % PROFILE_COLORS.length],
      emoji: PROFILE_EMOJI[state.profiles.length % PROFILE_EMOJI.length], role: "child"
    };
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML = `
      <div class="modal" style="max-width:420px;">
        <div class="modal-header"><h2>${existing ? "Profil bearbeiten" : "Neues Profil"}</h2><button class="close-btn" id="closeModal">✕</button></div>
        <div class="field"><label>Name</label><input type="text" id="p-name" value="${escapeHtml(draft.name)}" placeholder="z. B. Mia"></div>
        <div class="field"><label>Rolle</label>
          <select id="p-role">
            <option value="child" ${draft.role === "child" ? "selected" : ""}>Kind</option>
            <option value="parent" ${draft.role === "parent" ? "selected" : ""}>Elternteil</option>
          </select>
        </div>
        <div class="field"><label>Symbol</label>
          <div id="p-emoji-picker" style="display:flex;flex-wrap:wrap;gap:6px;">
            ${PROFILE_EMOJI.map(e => `<button type="button" class="btn btn-sm emoji-opt" data-emoji="${e}" style="${e === draft.emoji ? "outline:2px solid var(--accent);" : ""}">${e}</button>`).join("")}
          </div>
        </div>
        <div class="field"><label>Farbe</label>
          <div id="p-color-picker" style="display:flex;flex-wrap:wrap;gap:8px;">
            ${PROFILE_COLORS.map(c => `<button type="button" class="color-opt" data-color="${c}" style="width:28px;height:28px;border-radius:50%;background:${c};border:2px solid ${c === draft.color ? "var(--text)" : "transparent"};"></button>`).join("")}
          </div>
        </div>
        <div class="modal-footer">
          <div>${existing ? `<button class="btn btn-danger" id="deleteProfileBtn">Profil löschen</button>` : ""}</div>
          <div class="modal-footer-right">
            <button class="btn btn-ghost" id="cancelBtn">Abbrechen</button>
            <button class="btn btn-accent" id="saveProfileBtn">Speichern</button>
          </div>
        </div>
      </div>`;
    document.body.appendChild(overlay);

    overlay.querySelectorAll(".emoji-opt").forEach(b => b.onclick = () => {
      draft.emoji = b.dataset.emoji;
      overlay.querySelectorAll(".emoji-opt").forEach(x => x.style.outline = "");
      b.style.outline = "2px solid var(--accent)";
    });
    overlay.querySelectorAll(".color-opt").forEach(b => b.onclick = () => {
      draft.color = b.dataset.color;
      overlay.querySelectorAll(".color-opt").forEach(x => x.style.borderColor = "transparent");
      b.style.borderColor = "var(--text)";
    });

    function close() { overlay.remove(); }
    overlay.querySelector("#closeModal").onclick = close;
    overlay.querySelector("#cancelBtn").onclick = close;
    overlay.onclick = (e) => { if (e.target === overlay) close(); };

    if (existing) {
      overlay.querySelector("#deleteProfileBtn").onclick = () => {
        if (confirm(`Profil „${existing.name}" wirklich löschen? Zugewiesene Aufgaben/Termine bleiben erhalten, aber ohne Zuordnung.`)) {
          state.profiles = state.profiles.filter(p => p.id !== existing.id);
          if (state.activeProfileId === existing.id) state.activeProfileId = (state.profiles[0] || {}).id || null;
          saveState(); close(); renderProfileBar(); render();
        }
      };
    }
    overlay.querySelector("#saveProfileBtn").onclick = () => {
      draft.name = overlay.querySelector("#p-name").value.trim() || "Familie";
      draft.role = overlay.querySelector("#p-role").value;
      const idx = state.profiles.findIndex(p => p.id === draft.id);
      if (idx >= 0) state.profiles[idx] = draft; else state.profiles.push(draft);
      if (!state.activeProfileId) state.activeProfileId = draft.id;
      saveState(); close(); renderProfileBar(); render();
      showToast(existing ? "Profil aktualisiert." : `Willkommen, ${draft.name}!`);
    };
    setTimeout(() => overlay.querySelector("#p-name").focus(), 30);
  }

  /* ============ VIEW ROUTING ============ */
  function setView(view) {
    currentView = view;
    document.querySelectorAll(".nav-item[data-view]").forEach(b => {
      b.classList.toggle("active", b.dataset.view === view);
    });
    document.getElementById("sidebar").classList.remove("open");
    render();
  }

  function render() {
    const c = document.getElementById("viewContainer");
    c.innerHTML = "";
    if (currentView === "notes") return renderListView(c, "note", "Notizen", "Fang eine Idee ein, bevor sie verfliegt.", "📝");
    if (currentView === "checklists") return renderListView(c, "checklist", "Checklisten", "Schritte, Aufgaben, To-dos für deine Ideen.", "☑️");
    if (currentView === "images") return renderListView(c, "image", "Bilder", "Skizzen, Referenzen, Screenshots.", "🖼️");
    if (currentView === "tags") return renderTagsView(c);
    if (currentView === "mindmap") return renderMindmapView(c);
    if (currentView === "tasks") return renderTasksView(c);
    if (currentView === "calendar") return renderCalendarView(c);
    if (currentView === "shopping") return renderShoppingView(c);
    if (currentView === "export") return renderExportView(c);
    if (currentView === "settings") return renderSettingsView(c);
    if (currentView === "admin") return renderAdminView(c);
  }

  function renderListView(container, type, title, subtitle, icon) {
    const items = state.items
      .filter(it => it.type === type && itemMatchesSearch(it))
      .sort((a, b) => (b.pinned - a.pinned) || (b.updatedAt - a.updatedAt));

    const header = document.createElement("div");
    header.className = "view-header";
    header.innerHTML = `
      <div><h1 class="view-title">${title}</h1><p class="view-sub">${subtitle}</p></div>
      <button class="btn btn-accent" id="addBtn">+ Neu</button>
    `;
    container.appendChild(header);

    if (activeTagFilter) {
      const bar = document.createElement("div");
      bar.style.marginBottom = "14px";
      bar.innerHTML = `<span class="tag-chip clickable" id="clearTagFilter">Filter: #${escapeHtml(activeTagFilter)} ✕</span>`;
      container.appendChild(bar);
      bar.querySelector("#clearTagFilter").onclick = () => { activeTagFilter = null; render(); };
    }

    if (!items.length) {
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.innerHTML = `<span class="empty-icon">${icon}</span>${
        searchQuery || activeTagFilter ? "Keine Treffer." : "Noch nichts hier — leg direkt los."
      }`;
      container.appendChild(empty);
    } else {
      const grid = document.createElement("div");
      grid.className = "grid";
      items.forEach(it => grid.appendChild(renderCard(it)));
      container.appendChild(grid);
    }

    document.getElementById("addBtn").onclick = () => openEditor(type);
  }

  function renderCard(it) {
    const card = document.createElement("div");
    card.className = "card";
    card.onclick = (e) => { if (!e.target.closest(".card-pin")) openEditor(it.type, it.id); };

    let bodyHtml = "";
    if (it.type === "note") {
      bodyHtml = `<div class="card-body">${escapeHtml(it.body || "").slice(0, 220)}</div>`;
    } else if (it.type === "checklist") {
      const total = (it.items || []).length;
      const done = (it.items || []).filter(c => c.done).length;
      const pct = total ? Math.round((done / total) * 100) : 0;
      bodyHtml = `
        <div class="card-body">${done}/${total} erledigt</div>
        <div class="card-progress"><div class="card-progress-bar" style="width:${pct}%"></div></div>`;
    } else if (it.type === "image") {
      bodyHtml = `${it.dataUrl ? `<img class="card-thumb" src="${it.dataUrl}" alt="">` : ""}
        <div class="card-body">${escapeHtml(it.caption || "")}</div>`;
    }

    const creator = it.createdBy ? getProfile(it.createdBy) : null;
    card.innerHTML = `
      <div class="card-top">
        <h3 class="card-title">${escapeHtml(it.title || "Ohne Titel")}</h3>
        <button class="card-pin ${it.pinned ? "pinned" : ""}" title="Anheften">${it.pinned ? "★" : "☆"}</button>
      </div>
      ${bodyHtml}
      <div class="card-tags">${(it.tags || []).map(t => `<span class="tag-chip clickable" data-tag="${escapeHtml(t)}">#${escapeHtml(t)}</span>`).join("")}</div>
      <div class="card-meta" style="display:flex;align-items:center;gap:6px;">
        ${creator ? `<span class="mini-avatar" style="background:${creator.color};">${creator.emoji || creator.name.charAt(0)}</span>` : ""}
        Aktualisiert ${fmtDate(it.updatedAt)}
      </div>
    `;
    card.querySelector(".card-pin").onclick = () => { it.pinned = !it.pinned; saveState(); render(); };
    card.querySelectorAll(".tag-chip[data-tag]").forEach(chip => {
      chip.onclick = (e) => { e.stopPropagation(); activeTagFilter = chip.dataset.tag; render(); };
    });
    return card;
  }

  function renderTagsView(container) {
    const header = document.createElement("div");
    header.className = "view-header";
    header.innerHTML = `<div><h1 class="view-title">Tags</h1><p class="view-sub">Alle Themen auf einen Blick — klicke, um zu filtern.</p></div>`;
    container.appendChild(header);

    const tags = allTags();
    if (!tags.size) {
      container.innerHTML += `<div class="empty-state"><span class="empty-icon">🏷️</span>Noch keine Tags vergeben.</div>`;
      return;
    }
    const cloud = document.createElement("div");
    cloud.className = "tag-cloud";
    [...tags.entries()].sort((a, b) => b[1] - a[1]).forEach(([tag, count]) => {
      const pill = document.createElement("button");
      pill.className = "tag-pill" + (activeTagFilter === tag ? " active" : "");
      pill.innerHTML = `#${escapeHtml(tag)} <span class="count">${count}</span>`;
      pill.onclick = () => { activeTagFilter = activeTagFilter === tag ? null : tag; setView("notes"); };
      cloud.appendChild(pill);
    });
    container.appendChild(cloud);
  }

  /* ============ EDITOR MODAL ============ */
  function openEditor(type, id) {
    const existing = id ? state.items.find(i => i.id === id) : null;
    const draft = existing ? JSON.parse(JSON.stringify(existing)) : {
      id: uid(), type, title: "", tags: [], pinned: false,
      createdAt: Date.now(), updatedAt: Date.now(),
      body: "", items: [], dataUrl: "", caption: ""
    };

    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    const typeLabel = { note: "Notiz", checklist: "Checkliste", image: "Bild" }[type];

    let bodyFieldHtml = "";
    if (type === "note") {
      bodyFieldHtml = `
        <div class="field"><label>Inhalt</label>
          <textarea id="f-body" placeholder="Worum geht's bei der Idee?">${escapeHtml(draft.body)}</textarea>
        </div>`;

      bodyFieldHtml = `
        <div class="field"><label>Punkte</label>

        <div class="field"><label>Bild</label>
          <div class="img-tabs">
            <button type="button" class="img-tab active" data-tab="upload">📎 Hochladen</button>
            <button type="button" class="img-tab" data-tab="draw">🖌️ Malen</button>
          </div>
          <div id="uploadPane">
            <div class="dropzone" id="dropzone">

            </div>
          </div>
          <div id="drawPane" style="display:none;">
            <div class="draw-toolbar">
              <div class="draw-colors" id="drawColors"></div>
              <input type="color" id="drawCustomColor" value="#2B2621" title="Eigene Farbe">
              <select id="drawSize">
                <option value="3">Dünn</option>
                <option value="7" selected>Mittel</option>
                <option value="16">Dick</option>
              </select>
              <button type="button" class="btn btn-sm" id="drawEraser">🧹 Radierer</button>
              <button type="button" class="btn btn-sm" id="drawUndo">↩︎ Rückgängig</button>
              <button type="button" class="btn btn-sm" id="drawClear">Leeren</button>
            </div>
            <canvas id="drawCanvas" class="draw-canvas" width="600" height="380"></canvas>
            <button type="button" class="btn btn-accent btn-sm" id="drawUse" style="margin-top:10px;">In Bild übernehmen</button>
          </div>
          ${draft.dataUrl ? `<img class="image-preview" id="imgPreview" src="${draft.dataUrl}">` : `<img class="image-preview" id="imgPreview" style="display:none">`}
        </div>
        <div class="field"><label>Bildunterschrift</label>
          <input type="text" id="f-caption" value="${escapeHtml(draft.caption)}" placeholder="Kurze Beschreibung">
        </div>`;
    }

    overlay.innerHTML = `
      <div class="modal">
        <div class="modal-header">
          <h2>${existing ? "Bearbeiten" : "Neu"}: ${typeLabel}</h2>
          <button class="close-btn" id="closeModal">✕</button>
        </div>
        <div class="field"><label>Titel</label>
          <input type="text" id="f-title" value="${escapeHtml(draft.title)}" placeholder="Titel der Idee">
        </div>
        ${bodyFieldHtml}
        <div class="field"><label>Tags (mit Komma trennen)</label>
          <input type="text" id="f-tags" value="${escapeHtml((draft.tags || []).join(", "))}" placeholder="z. B. produkt, ux, sprint3">
        </div>
        <div class="modal-footer">
          <div>${existing ? `<button class="btn btn-danger" id="deleteBtn">Löschen</button>` : ""}</div>
          <div class="modal-footer-right">
            <button class="btn btn-ghost" id="cancelBtn">Abbrechen</button>
            <button class="btn btn-accent" id="saveBtn">Speichern</button>
          </div>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    // checklist rows
    function renderChecklistRows() {
      const wrap = overlay.querySelector("#checklistItems");
      if (!wrap) return;
      wrap.innerHTML = "";
      (draft.items || []).forEach((row) => {
        const r = document.createElement("div");
        r.className = "checklist-row";
        r.innerHTML = `
          <input type="checkbox" ${row.done ? "checked" : ""}>
          <input type="text" value="${escapeHtml(row.text)}" placeholder="Aufgabe...">
          <button type="button" class="del" title="Entfernen">✕</button>`;
        const [cb, txt, del] = r.children;
        cb.onchange = () => { row.done = cb.checked; };
        txt.oninput = () => { row.text = txt.value; };
        del.onclick = () => { draft.items = draft.items.filter(x => x !== row); renderChecklistRows(); };
        wrap.appendChild(r);
      });
    }
    if (type === "checklist") {
      renderChecklistRows();
      overlay.querySelector("#addChecklistRow").onclick = () => {
        draft.items.push({ id: uid(), text: "", done: false });
        renderChecklistRows();
        const rows = overlay.querySelectorAll(".checklist-row input[type=text]");
        if (rows.length) rows[rows.length - 1].focus();
      };
    }

    // image upload
    if (type === "image") {
      const dz = overlay.querySelector("#dropzone");
      const fileInput = overlay.querySelector("#fileInput");
      const preview = overlay.querySelector("#imgPreview");
      const handleFile = (file) => {
        if (!file || !file.type.startsWith("image/")) return;
        if (file.size > 4 * 1024 * 1024) { showToast("Bild ist größer als 4 MB — bitte kleineres Bild wählen."); return; }
        const reader = new FileReader();
        reader.onload = (e) => { draft.dataUrl = e.target.result; preview.src = draft.dataUrl; preview.style.display = "block"; };
        reader.readAsDataURL(file);
      };
      dz.onclick = () => fileInput.click();
      fileInput.onchange = () => handleFile(fileInput.files[0]);
      dz.ondragover = (e) => { e.preventDefault(); dz.classList.add("drag"); };
      dz.ondragleave = () => dz.classList.remove("drag");
      dz.ondrop = (e) => { e.preventDefault(); dz.classList.remove("drag"); handleFile(e.dataTransfer.files[0]); };

      // tabs
      const uploadPane = overlay.querySelector("#uploadPane");
      const drawPane = overlay.querySelector("#drawPane");
      overlay.querySelectorAll(".img-tab").forEach(tab => {
        tab.onclick = () => {
          overlay.querySelectorAll(".img-tab").forEach(t => t.classList.remove("active"));
          tab.classList.add("active");
          const isDraw = tab.dataset.tab === "draw";
          uploadPane.style.display = isDraw ? "none" : "block";
          drawPane.style.display = isDraw ? "block" : "none";
        };
      });

      // drawing pad
      const canvas = overlay.querySelector("#drawCanvas");
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#FFFFFF";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      const DRAW_COLORS = ["#2B2621", "#C0453B", "#3A5A9B", "#86B35A", "#C9A24B", "#B15CDE", "#FF9270", "#FFFFFF"];
      const colorsWrap = overlay.querySelector("#drawColors");
      let currentColor = DRAW_COLORS[0];
      let erasing = false;
      DRAW_COLORS.forEach((c, i) => {
        const sw = document.createElement("button");
        sw.type = "button";
        sw.className = "draw-swatch" + (i === 0 ? " active" : "");
        sw.style.background = c;
        sw.onclick = () => {
          currentColor = c; erasing = false;
          colorsWrap.querySelectorAll(".draw-swatch").forEach(s => s.classList.remove("active"));
          sw.classList.add("active");
          overlay.querySelector("#drawEraser").classList.remove("active-tool");
        };
        colorsWrap.appendChild(sw);
      });
      overlay.querySelector("#drawCustomColor").addEventListener("input", (e) => {
        currentColor = e.target.value; erasing = false;
        colorsWrap.querySelectorAll(".draw-swatch").forEach(s => s.classList.remove("active"));
        overlay.querySelector("#drawEraser").classList.remove("active-tool");
      });
      overlay.querySelector("#drawEraser").onclick = (e) => {
        erasing = !erasing;
        e.currentTarget.classList.toggle("active-tool", erasing);
      };

      let undoStack = [];
      function pushUndo() {
        undoStack.push(canvas.toDataURL());
        if (undoStack.length > 20) undoStack.shift();
      }
      overlay.querySelector("#drawUndo").onclick = () => {
        if (!undoStack.length) return;
        const imgData = undoStack.pop();
        const img = new Image();
        img.onload = () => { ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.drawImage(img, 0, 0); };
        img.src = imgData;
      };
      overlay.querySelector("#drawClear").onclick = () => {
        pushUndo();
        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      };

      let drawing = false;
      function pos(e) {
        const rect = canvas.getBoundingClientRect();
        return { x: (e.clientX - rect.left) * (canvas.width / rect.width), y: (e.clientY - rect.top) * (canvas.height / rect.height) };
      }
      canvas.addEventListener("pointerdown", (e) => {
        pushUndo();
        drawing = true;
        canvas.setPointerCapture(e.pointerId);
        const p = pos(e);
        ctx.beginPath(); ctx.moveTo(p.x, p.y);
        ctx.lineWidth = parseInt(overlay.querySelector("#drawSize").value, 10);
        ctx.strokeStyle = erasing ? "#FFFFFF" : currentColor;
        ctx.lineTo(p.x + 0.1, p.y + 0.1); ctx.stroke();
      });
      canvas.addEventListener("pointermove", (e) => {
        if (!drawing) return;
        const p = pos(e);
        ctx.lineTo(p.x, p.y); ctx.stroke();
      });
      canvas.addEventListener("pointerup", () => { drawing = false; });
      canvas.addEventListener("pointerleave", () => { drawing = false; });

      overlay.querySelector("#drawUse").onclick = () => {
        draft.dataUrl = canvas.toDataURL("image/png");
        preview.src = draft.dataUrl; preview.style.display = "block";
        overlay.querySelectorAll(".img-tab").forEach(t => t.classList.remove("active"));
        overlay.querySelector('.img-tab[data-tab="upload"]').classList.add("active");
        uploadPane.style.display = "block"; drawPane.style.display = "none";
        showToast("Zeichnung übernommen.");
      };
    }

    function close() { overlay.remove(); }
    overlay.querySelector("#closeModal").onclick = close;
    overlay.querySelector("#cancelBtn").onclick = close;
    overlay.onclick = (e) => { if (e.target === overlay) close(); };

    if (existing) {
      overlay.querySelector("#deleteBtn").onclick = () => {
        if (confirm("Diesen Eintrag wirklich löschen?")) {
          state.items = state.items.filter(i => i.id !== draft.id);
          saveState(); close(); render();
          showToast("Eintrag gelöscht.");
        }
      };
    }

    overlay.querySelector("#saveBtn").onclick = () => {
      draft.title = overlay.querySelector("#f-title").value.trim() || "Ohne Titel";
      draft.tags = overlay.querySelector("#f-tags").value.split(",").map(t => t.trim()).filter(Boolean);
      if (type === "note") draft.body = overlay.querySelector("#f-body").value;
      if (type === "image") draft.caption = overlay.querySelector("#f-caption").value;
      draft.updatedAt = Date.now();
      if (!existing) draft.createdBy = state.activeProfileId || null;

      const idx = state.items.findIndex(i => i.id === draft.id);
      if (idx >= 0) state.items[idx] = draft; else state.items.push(draft);
      saveState(); close(); render();
      showToast(existing ? "Änderungen gespeichert." : "Idee gespeichert.");
    };

    setTimeout(() => overlay.querySelector("#f-title").focus(), 30);
  }

  /* ============ MIND-MAP ============ */
  const MM_BRANCH_COLORS = ["#C0453B", "#3A5A9B", "#86B35A", "#C9A24B", "#B15CDE", "#FF9270", "#4A6572", "#35D0BA", "#E8590C", "#5F7038"];

  function mmRoot() { return state.mindmap.nodes.find(n => n.root) || state.mindmap.nodes[0]; }
  function mmChildren(id) { return state.mindmap.nodes.filter(n => n.parentId === id); }
  function mmBranchColorFor(node) {
    // walk up to the top-level branch (direct child of root) to pick a stable color
    const root = mmRoot();
    if (!root || node.id === root.id) return null;
    let cur = node;
    const guard = new Set();
    while (cur.parentId && cur.parentId !== root.id && !guard.has(cur.id)) {
      guard.add(cur.id);
      const parent = state.mindmap.nodes.find(n => n.id === cur.parentId);
      if (!parent) break;
      cur = parent;
    }
    const topLevelSiblings = mmChildren(root.id);
    const idx = topLevelSiblings.findIndex(n => n.id === cur.id);
    return MM_BRANCH_COLORS[idx >= 0 ? idx % MM_BRANCH_COLORS.length : 0];
  }

  function migrateMindmapIfNeeded() {
    const mm = state.mindmap;
    if (!mm.nodes.length) {
      mm.nodes.push({ id: uid(), parentId: null, root: true, x: 1040, y: 680, text: "Zentrale Idee" });
      return;
    }
    const needsMigration = mm.nodes.some(n => n.parentId === undefined);
    if (!needsMigration) return;
    let root = mm.nodes.find(n => n.root);
    if (!root) { root = mm.nodes[0]; root.root = true; }
    root.parentId = null;
    const edges = mm.edges || [];
    const visited = new Set([root.id]);
    const queue = [root.id];
    while (queue.length) {
      const cur = queue.shift();
      edges.forEach(e => {
        let otherId = null;
        if (e.from === cur && !visited.has(e.to)) otherId = e.to;
        else if (e.to === cur && !visited.has(e.from)) otherId = e.from;
        if (otherId) {
          const n = mm.nodes.find(x => x.id === otherId);
          if (n) { n.parentId = cur; visited.add(otherId); queue.push(otherId); }
        }
      });
    }
    mm.nodes.forEach(n => { if (n.parentId === undefined) { n.parentId = n.id === root.id ? null : root.id; visited.add(n.id); } });
  }

  function computeChildPosition(parent) {
    const root = mmRoot();
    const siblings = mmChildren(parent.id);
    const idx = siblings.length;
    if (parent.id === root.id) {
      const totalGuess = Math.max(idx + 1, 6);
      const angle = (idx / totalGuess) * Math.PI * 2 - Math.PI / 2;
      return { x: root.x + Math.cos(angle) * 260, y: root.y + Math.sin(angle) * 200 };
    }
    const dx = parent.x - root.x, dy = parent.y - root.y;
    const baseAngle = Math.atan2(dy, dx) || 0;
    const spread = 0.36;
    const angle = baseAngle + (idx - (idx % 2 === 0 ? idx / 2 : (idx - 1) / 2)) * spread * (idx % 2 === 0 ? 1 : -1);
    const dist = Math.hypot(dx, dy) || 160;
    return { x: parent.x + Math.cos(angle) * (dist * 0 + 190), y: parent.y + Math.sin(angle) * (dist * 0 + 190) };
  }

  function renderMindmapView(container) {
    migrateMindmapIfNeeded();
    const root = mmRoot();
    const header = document.createElement("div");
    header.className = "view-header";
    header.innerHTML = `<div><h1 class="view-title">Mind-Map</h1><p class="view-sub">Klicken &amp; direkt tippen · <b>Enter</b> = neuer Punkt daneben · <b>Tab</b> = neuer Unterpunkt · Fläche ziehen = verschieben · Scrollrad/Pinch = zoomen</p></div>`;
    container.appendChild(header);

    const toolbar = document.createElement("div");
    toolbar.className = "mindmap-toolbar";
    toolbar.innerHTML = `
      <button class="btn btn-sm btn-accent" id="mmAddBranch">+ Hauptast</button>
      <button class="btn btn-sm" id="mmAddChild">+ Unterpunkt</button>
      <button class="btn btn-sm btn-danger" id="mmDeleteNode">Löschen</button>
      <span class="mindmap-hint">Knoten anklicken = auswählen &amp; sofort tippen.</span>
    `;
    container.appendChild(toolbar);

    const wrap = document.createElement("div");
    wrap.className = "mindmap-wrap";
    wrap.innerHTML = `
      <div class="mindmap-world" id="mmWorld">
        <svg class="mindmap-svg" id="mmSvg"></svg>
      </div>
      <div class="mm-controls">
        <div class="mm-zoom-label" id="mmZoomLabel">100%</div>
        <button type="button" id="mmZoomIn" title="Vergrößern">+</button>
        <button type="button" id="mmZoomOut" title="Verkleinern">−</button>
        <button type="button" id="mmZoomFit" title="Einpassen">⛶</button>
      </div>
    `;
    container.appendChild(wrap);

    let selectedId = root ? root.id : null;
    const mmView = { tx: 0, ty: 0, scale: 1 };

    function applyTransform(animate) {
      const world = document.getElementById("mmWorld");
      if (!world) return;
      world.style.transition = animate ? "transform .3s cubic-bezier(.2,.7,.3,1)" : "none";
      world.style.transform = `translate(${mmView.tx}px, ${mmView.ty}px) scale(${mmView.scale})`;
      const label = document.getElementById("mmZoomLabel");
      if (label) label.textContent = Math.round(mmView.scale * 100) + "%";
    }

    function fitToContent(animate) {
      const nodeEls = wrap.querySelectorAll(".mm-node");
      if (!nodeEls.length) return;
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      state.mindmap.nodes.forEach(n => {
        const el = wrap.querySelector(`.mm-node[data-id="${n.id}"]`);
        const w = el ? el.offsetWidth : 160, h = el ? el.offsetHeight : 50;
        minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
        maxX = Math.max(maxX, n.x + w); maxY = Math.max(maxY, n.y + h);
      });
      const padding = 70;
      const bboxW = Math.max(1, maxX - minX), bboxH = Math.max(1, maxY - minY);
      const wrapRect = wrap.getBoundingClientRect();
      const scale = Math.min(
        (wrapRect.width - padding * 2) / bboxW,
        (wrapRect.height - padding * 2) / bboxH,
        1.15
      );
      mmView.scale = Math.max(0.15, scale);
      mmView.tx = (wrapRect.width - bboxW * mmView.scale) / 2 - minX * mmView.scale;
      mmView.ty = (wrapRect.height - bboxH * mmView.scale) / 2 - minY * mmView.scale;
      applyTransform(animate);
    }

    function zoomBy(factor, screenX, screenY) {
      const wrapRect = wrap.getBoundingClientRect();
      const cx = screenX !== undefined ? screenX : wrapRect.width / 2;
      const cy = screenY !== undefined ? screenY : wrapRect.height / 2;
      const worldX = (cx - mmView.tx) / mmView.scale;
      const worldY = (cy - mmView.ty) / mmView.scale;
      mmView.scale = Math.min(2.5, Math.max(0.15, mmView.scale * factor));
      mmView.tx = cx - worldX * mmView.scale;
      mmView.ty = cy - worldY * mmView.scale;
      applyTransform(false);
    }

    function ensureVisible(node) {
      const wrapRect = wrap.getBoundingClientRect();
      const margin = 40;
      const screenX = mmView.tx + node.x * mmView.scale;
      const screenY = mmView.ty + node.y * mmView.scale;
      const w = 180 * mmView.scale, h = 56 * mmView.scale;
      let dx = 0, dy = 0;
      if (screenX < margin) dx = margin - screenX;
      else if (screenX + w > wrapRect.width - margin) dx = (wrapRect.width - margin) - (screenX + w);
      if (screenY < margin) dy = margin - screenY;
      else if (screenY + h > wrapRect.height - margin) dy = (wrapRect.height - margin) - (screenY + h);
      if (dx || dy) { mmView.tx += dx; mmView.ty += dy; applyTransform(true); }
    }

    function selectAllText(el) {
      const range = document.createRange();
      range.selectNodeContents(el);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }

    function focusNode(id, selectAll) {
      selectedId = id;
      renderNodes();
      drawEdges();
      const node = state.mindmap.nodes.find(n => n.id === id);
      if (node) ensureVisible(node);
      const el = document.querySelector(`.mm-node[data-id="${id}"] .mm-text`);
      if (el) {
        el.focus();
        if (selectAll) selectAllText(el);
      }
    }

    function addChildTo(parentId) {
      const parent = state.mindmap.nodes.find(n => n.id === parentId);
      if (!parent) return;
      const pos = computeChildPosition(parent);
      const node = { id: uid(), parentId: parent.id, x: pos.x, y: pos.y, text: "Neuer Punkt" };
      state.mindmap.nodes.push(node);
      saveState();
      focusNode(node.id, true);
    }

    function addSiblingTo(nodeId) {
      const node = state.mindmap.nodes.find(n => n.id === nodeId);
      if (!node || !node.parentId) { addChildTo(mmRoot().id); return; }
      addChildTo(node.parentId);
    }

    function deleteSubtree(id) {
      const rootNode = mmRoot();
      if (id === rootNode.id) { showToast("Die Zentrale Idee kann nicht gelöscht werden."); return; }
      const toDelete = new Set([id]);
      let changed = true;
      while (changed) {
        changed = false;
        state.mindmap.nodes.forEach(n => {
          if (n.parentId && toDelete.has(n.parentId) && !toDelete.has(n.id)) { toDelete.add(n.id); changed = true; }
        });
      }
      state.mindmap.nodes = state.mindmap.nodes.filter(n => !toDelete.has(n.id));
      selectedId = rootNode.id;
      saveState(); renderNodes(); drawEdges();
    }

    function drawEdges() {
      const svg = document.getElementById("mmSvg");
      if (!svg) return;
      svg.innerHTML = "";
      state.mindmap.nodes.forEach(node => {
        if (!node.parentId) return;
        const a = state.mindmap.nodes.find(n => n.id === node.parentId);
        if (!a) return;
        const aEl = wrap.querySelector(`.mm-node[data-id="${a.id}"]`);
        const bEl = wrap.querySelector(`.mm-node[data-id="${node.id}"]`);
        const aw = aEl ? aEl.offsetWidth : 160, ah = aEl ? aEl.offsetHeight : 46;
        const bw = bEl ? bEl.offsetWidth : 160, bh = bEl ? bEl.offsetHeight : 46;
        const ax = a.x + aw / 2, ay = a.y + ah / 2, bx = node.x + bw / 2, by = node.y + bh / 2;
        const mx = (ax + bx) / 2;
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("class", "mm-edge");
        path.setAttribute("d", `M ${ax} ${ay} C ${mx} ${ay}, ${mx} ${by}, ${bx} ${by}`);
        const color = mmBranchColorFor(node) || "var(--accent2)";
        path.setAttribute("stroke", color);
        path.setAttribute("stroke-width", node.parentId === mmRoot().id ? "3.5" : "2.25");
        svg.appendChild(path);
      });
    }

    function renderNodes() {
      const world = document.getElementById("mmWorld");
      world.querySelectorAll(".mm-node").forEach(n => n.remove());
      state.mindmap.nodes.forEach(node => {
        const el = document.createElement("div");
        const branchColor = mmBranchColorFor(node);
        el.className = "mm-node" + (node.root ? " root" : "") + (selectedId === node.id ? " selected" : "");
        el.style.left = node.x + "px";
        el.style.top = node.y + "px";
        if (branchColor && !node.root) el.style.borderColor = branchColor;
        el.dataset.id = node.id;

        const textEl = document.createElement("span");
        textEl.className = "mm-text";
        textEl.contentEditable = "true";
        textEl.spellcheck = false;
        textEl.textContent = node.text;

        const delBtn = document.createElement("button");
        delBtn.className = "mm-del";
        delBtn.title = "Ast löschen";
        delBtn.textContent = "✕";
        delBtn.style.display = node.root ? "none" : "";

        const addChildBtn = document.createElement("button");
        addChildBtn.className = "mm-add-child";
        addChildBtn.title = "Unterpunkt hinzufügen";
        addChildBtn.textContent = "+";

        el.appendChild(textEl);
        el.appendChild(delBtn);
        el.appendChild(addChildBtn);

        delBtn.onclick = (e) => { e.stopPropagation(); deleteSubtree(node.id); };
        addChildBtn.onclick = (e) => { e.stopPropagation(); addChildTo(node.id); };

        el.addEventListener("click", (e) => {
          if (e.target === delBtn || e.target === addChildBtn) return;
          if (selectedId !== node.id) { selectedId = node.id; renderNodes(); }
          if (e.target !== textEl) { textEl.focus(); selectAllText(textEl); }
        });

        textEl.addEventListener("blur", () => {
          node.text = textEl.textContent.trim() || "Ohne Titel";
          saveState();
        });
        textEl.addEventListener("keydown", (e) => {
          if (e.key === "Enter") { e.preventDefault(); node.text = textEl.textContent.trim() || "Ohne Titel"; saveState(); addSiblingTo(node.id); }
          else if (e.key === "Tab") { e.preventDefault(); node.text = textEl.textContent.trim() || "Ohne Titel"; saveState(); addChildTo(node.id); }
          else if (e.key === "Escape") { e.preventDefault(); textEl.blur(); }
        });
        textEl.addEventListener("pointerdown", (e) => e.stopPropagation());

        // dragging (from anywhere on the node except the editable text / buttons)
        let dragging = false, moved = false, sx = 0, sy = 0, ox = 0, oy = 0;
        el.addEventListener("pointerdown", (e) => {
          if (e.target === delBtn || e.target === textEl || e.target === addChildBtn) return;
          e.stopPropagation();
          dragging = true; moved = false; sx = e.clientX; sy = e.clientY; ox = node.x; oy = node.y;
          el.setPointerCapture(e.pointerId);
          el.style.cursor = "grabbing";
        });
        el.addEventListener("pointermove", (e) => {
          if (!dragging) return;
          e.stopPropagation();
          if (Math.abs(e.clientX - sx) > 3 || Math.abs(e.clientY - sy) > 3) moved = true;
          node.x = ox + (e.clientX - sx) / mmView.scale;
          node.y = oy + (e.clientY - sy) / mmView.scale;
          el.style.left = node.x + "px"; el.style.top = node.y + "px";
          drawEdges();
        });
        el.addEventListener("pointerup", (e) => {
          if (dragging) { e.stopPropagation(); dragging = false; el.style.cursor = "grab"; if (moved) saveState(); }
        });

        world.appendChild(el);
      });
    }

    // Pan (drag empty canvas) + wheel zoom + pinch zoom
    let panning = false, panSX = 0, panSY = 0, panOX = 0, panOY = 0;
    const activePointers = new Map();
    let pinchStartDist = 0, pinchStartScale = 1, pinchAnchorX = 0, pinchAnchorY = 0;

    wrap.addEventListener("pointerdown", (e) => {
      if (e.target.closest(".mm-node") || e.target.closest(".mm-controls")) return;
      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (activePointers.size === 1) {
        panning = true; panSX = e.clientX; panSY = e.clientY; panOX = mmView.tx; panOY = mmView.ty;
        wrap.classList.add("panning");
        wrap.setPointerCapture(e.pointerId);
      } else if (activePointers.size === 2) {
        panning = false;
        const pts = [...activePointers.values()];
        const rect = wrap.getBoundingClientRect();
        pinchStartDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1;
        pinchStartScale = mmView.scale;
        const midX = (pts[0].x + pts[1].x) / 2 - rect.left, midY = (pts[0].y + pts[1].y) / 2 - rect.top;
        pinchAnchorX = (midX - mmView.tx) / mmView.scale;
        pinchAnchorY = (midY - mmView.ty) / mmView.scale;
      }
    });
    wrap.addEventListener("pointermove", (e) => {
      if (!activePointers.has(e.pointerId)) return;
      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (activePointers.size === 2) {
        const pts = [...activePointers.values()];
        const rect = wrap.getBoundingClientRect();
        const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1;
        const midX = (pts[0].x + pts[1].x) / 2 - rect.left, midY = (pts[0].y + pts[1].y) / 2 - rect.top;
        mmView.scale = Math.min(2.5, Math.max(0.15, pinchStartScale * (dist / pinchStartDist)));
        mmView.tx = midX - pinchAnchorX * mmView.scale;
        mmView.ty = midY - pinchAnchorY * mmView.scale;
        applyTransform(false);
      } else if (panning) {
        mmView.tx = panOX + (e.clientX - panSX);
        mmView.ty = panOY + (e.clientY - panSY);
        applyTransform(false);
      }
    });
    function endPan(e) {
      activePointers.delete(e.pointerId);
      if (activePointers.size < 2) pinchStartDist = 0;
      if (activePointers.size === 0) { panning = false; wrap.classList.remove("panning"); }
    }
    wrap.addEventListener("pointerup", endPan);
    wrap.addEventListener("pointercancel", endPan);
    wrap.addEventListener("pointerleave", (e) => { if (activePointers.size <= 1) endPan(e); });

    wrap.addEventListener("wheel", (e) => {
      e.preventDefault();
      const rect = wrap.getBoundingClientRect();
      if (e.ctrlKey || e.metaKey) {
        const factor = e.deltaY < 0 ? 1.08 : 0.93;
        zoomBy(factor, e.clientX - rect.left, e.clientY - rect.top);
      } else {
        mmView.tx -= e.deltaX;
        mmView.ty -= e.deltaY;
        applyTransform(false);
      }
    }, { passive: false });

    wrap.addEventListener("dblclick", (e) => {
      if (e.target.closest(".mm-node") || e.target.closest(".mm-controls")) return;
      addChildTo(selectedId || root.id);
    });

    document.getElementById("mmZoomIn").onclick = () => zoomBy(1.2);
    document.getElementById("mmZoomOut").onclick = () => zoomBy(0.8);
    document.getElementById("mmZoomFit").onclick = () => fitToContent(true);

    let resizeTimer;
    const onResize = () => {
      if (!document.body.contains(wrap)) { window.removeEventListener("resize", onResize); return; }
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => fitToContent(false), 150);
    };
    window.addEventListener("resize", onResize);

    toolbar.querySelector("#mmAddBranch").onclick = () => addChildTo(root.id);
    toolbar.querySelector("#mmAddChild").onclick = () => addChildTo(selectedId || root.id);
    toolbar.querySelector("#mmDeleteNode").onclick = () => {
      if (!selectedId) { showToast("Kein Knoten ausgewählt."); return; }
      deleteSubtree(selectedId);
    };

    renderNodes();
    drawEdges();
    fitToContent(false);
  }

  /* ============ FAMILIENKALENDER ============ */
  let calendarCursor = new Date();

  function dateStrToDayNumber(dateStr) {
    const [y, m, d] = dateStr.split("-").map(Number);
    return Math.floor(Date.UTC(y, (m || 1) - 1, d || 1) / 86400000);
  }

  function custodyResultForDate(schedule, dateStr) {
    if (!schedule.blocks || !schedule.blocks.length || !schedule.startDate) return null;
    const totalCycle = schedule.blocks.reduce((s, b) => s + (b.days || 0), 0);
    if (totalCycle <= 0) return null;
    const startDay = dateStrToDayNumber(schedule.startDate);
    const dateDay = dateStrToDayNumber(dateStr);
    const offset = (((dateDay - startDay) % totalCycle) + totalCycle) % totalCycle;
    let acc = 0;
    for (let i = 0; i < schedule.blocks.length; i++) {
      const b = schedule.blocks[i];
      if (offset < acc + (b.days || 0)) return { block: b, isSwitchDay: offset === acc, blockIndex: i };
      acc += b.days || 0;
    }
    return null;
  }

  function custodyAssignmentsForDate(dateStr) {
    return state.custodySchedules
      .map(s => ({ schedule: s, result: custodyResultForDate(s, dateStr) }))
      .filter(x => x.result);
  }
