  function easterSunday(year) {
    // Gauss'sche Osterformel
    const a = year % 19, b = Math.floor(year / 100), c = year % 100;
    const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
    const g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
    const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
    const m = Math.floor((a + 11 * h + 22 * l) / 451);
    const month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
    return new Date(Date.UTC(year, month - 1, day));
  }

  function germanHolidaysForYear(year) {
    const easter = easterSunday(year);
    const off = (days) => { const d = new Date(easter); d.setUTCDate(d.getUTCDate() + days); return d.toISOString().slice(0, 10); };
    const y = (m, d) => `${year}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    return {
      [y(1, 1)]: "Neujahr",
      [off(-2)]: "Karfreitag",
      [off(1)]: "Ostermontag",
      [y(5, 1)]: "Tag der Arbeit",
      [off(39)]: "Christi Himmelfahrt",
      [off(50)]: "Pfingstmontag",
      [y(10, 3)]: "Tag der Deutschen Einheit",
      [y(12, 25)]: "1. Weihnachtsfeiertag",
      [y(12, 26)]: "2. Weihnachtsfeiertag"
    };
  }

  let holidayCache = {};
  function getHolidayName(dateStr) {
    const year = parseInt(dateStr.slice(0, 4), 10);
    if (!holidayCache[year]) holidayCache[year] = germanHolidaysForYear(year);
    return holidayCache[year][dateStr] || null;
  }

  function getSchoolHolidayName(dateStr) {
    const list = state.schoolHolidays[state.federalState];
    if (!list) return null;
    const hit = list.find(f => dateStr >= f.start && dateStr <= f.end);
    return hit ? hit.name : null;
  }

  function isWeekendStr(dateStr) {
    const [y, m, d] = dateStr.split("-").map(Number);
    const day = new Date(Date.UTC(y, m - 1, d)).getUTCDay();
    return day === 0 || day === 6; // Sonntag oder Samstag
  }
  function lastWorkdayBefore(dateStr) {
    let d = addDays(dateStr, -1);
    while (isWeekendStr(d)) d = addDays(d, -1);
    return d;
  }
  function firstWorkdayOnOrAfter(dateStr) {
    let d = dateStr;
    while (isWeekendStr(d)) d = addDays(d, 1);
    return d;
  }
  // Fällt zwischen letztem Schultag und Ferienbeginn ein Wochenende, gehört es
  // gefühlt schon zu den Ferien — die App behandelt es deshalb auch so.
  function isEffectiveHoliday(dateStr) {
    if (getSchoolHolidayName(dateStr)) return true;
    if (!isWeekendStr(dateStr)) return false;
    const list = state.schoolHolidays[state.federalState];
    if (!list || !list.length) return false;
    // Nächster Werktag: liegt der bereits in den Ferien, zählt das Wochenende mit.
    let d = dateStr;
    for (let i = 0; i < 4; i++) {
      d = addDays(d, 1);
      if (!isWeekendStr(d)) return !!getSchoolHolidayName(d);
    }
    return false;
  }

  function getVacationForDate(dateStr) {
    return (state.vacations || []).find(v => dateStr >= v.start && dateStr <= v.end) || null;
  }
  function getVacationStatus() {
    const today = new Date().toISOString().slice(0, 10);
    const current = getVacationForDate(today);
    if (current) {
      return { type: "current", name: current.name, emoji: current.emoji || "🏝️", days: dateStrToDayNumber(current.end) - dateStrToDayNumber(today) + 1 };
    }
    const upcoming = (state.vacations || []).filter(v => v.start > today).sort((a, b) => a.start.localeCompare(b.start))[0];
    if (upcoming) {
      return { type: "next", name: upcoming.name, emoji: upcoming.emoji || "🏝️", days: dateStrToDayNumber(upcoming.start) - dateStrToDayNumber(today), start: upcoming.start };
    }
    return null;
  }

  function getFerienStatus() {
    const list = state.schoolHolidays[state.federalState];
    if (!list || !list.length) return null;
    const today = new Date().toISOString().slice(0, 10);
    const sorted = list.slice().sort((a, b) => a.start.localeCompare(b.start));
    const current = sorted.find(f => f.start <= today && today >= f.start && today <= f.end);
    if (current) {
      // Schule beginnt am nächsten Werktag nach dem letzten Ferientag — fällt der direkt
      // folgende Tag aufs Wochenende, zählt trotzdem erst der nächste Montag (o. Ä.).
      const schoolStart = firstWorkdayOnOrAfter(addDays(current.end, 1));
      const daysUntilSchoolStart = dateStrToDayNumber(schoolStart) - dateStrToDayNumber(today);
      return { type: "current", name: current.name, days: daysUntilSchoolStart, schoolStart };
    }
    const next = sorted.find(f => f.start > today);
    if (next) return {
      type: "next", name: next.name, days: dateStrToDayNumber(next.start) - dateStrToDayNumber(today),
      // Letzter Schultag ist der letzte Werktag vor Ferienbeginn (Zeugnistag), nicht einfach "ein Tag davor".
      lastSchoolDay: lastWorkdayBefore(next.start)
    };
    return null;
  }

  let lastFerienError = "";
  async function fetchSchoolHolidays(stateCode) {
    const FERIEN_LABELS = { winterferien: "Winterferien", osterferien: "Osterferien", pfingstferien: "Pfingstferien", sommerferien: "Sommerferien", herbstferien: "Herbstferien", weihnachtsferien: "Weihnachtsferien", fruehjahrsferien: "Frühjahrsferien" };
    const thisYear = new Date().getFullYear();
    const years = [thisYear - 1, thisYear, thisYear + 1, thisYear + 2];
    lastFerienError = "";
    let anyHttpError = "";
    try {
      const results = await Promise.all(years.map(async (year) => {
        try {
          const res = await fetch(`https://schulferien-api.de/api/v1/${year}/${stateCode}`);
          if (!res.ok) { anyHttpError = "HTTP " + res.status; return []; }
          const json = await res.json();
          if (Array.isArray(json)) return json;
          if (json && Array.isArray(json.data)) return json.data;
          if (json && Array.isArray(json.holidays)) return json.holidays;
          return [];
        } catch (err) { anyHttpError = err.message || "Netzwerkfehler (evtl. CORS)"; return []; }
      }));
      const flat = results.flat().filter(f => f && f.start && f.end);
      if (!flat.length) { lastFerienError = anyHttpError || "Keine Daten erhalten"; throw new Error(lastFerienError); }
      state.schoolHolidays[stateCode] = flat.map(f => ({
        start: f.start.slice(0, 10), end: f.end.slice(0, 10), name: FERIEN_LABELS[f.name] || f.name
      }));
      saveState({ skipTouch: true });
      return true;
    } catch (err) {
      lastFerienError = lastFerienError || err.message || "Unbekannter Fehler";
      console.warn("Schulferien-Abruf fehlgeschlagen:", err);
      return false;
    }
  }

  function dateStrToDayNumber(dateStr) {
    const [y, m, d] = dateStr.split("-").map(Number);
    return Math.floor(Date.UTC(y, (m || 1) - 1, d || 1) / 86400000);
  }

  function custodyResultForDate(schedule, dateStr) {
    if (!schedule.blocks || !schedule.blocks.length || !schedule.startDate) return null;
    const totalCycle = schedule.blocks.reduce((s, b) => s + (b.days || 0), 0);
    if (totalCycle <= 0) return null;
    const startDay = dateStrToDayNumber(schedule.startDate);
    const dateDay = dateStrToDayNumber(dateStr);
    const offset = (((dateDay - startDay) % totalCycle) + totalCycle) % totalCycle;
    let acc = 0;
    for (let i = 0; i < schedule.blocks.length; i++) {
      const b = schedule.blocks[i];
      if (offset < acc + (b.days || 0)) return { block: b, isSwitchDay: offset === acc, blockIndex: i };
      acc += b.days || 0;
    }
    return null;
  }

  function custodyAssignmentsForDate(dateStr) {
    return state.custodySchedules
      .map(s => ({ schedule: s, result: custodyResultForDate(s, dateStr) }))
      .filter(x => x.result);
  }

  function parseMealCsv(text) {
    const lines = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n").filter(l => l.trim() !== "");
    if (!lines.length) return [];
    const delimiter = (lines[0].match(/;/g) || []).length >= (lines[0].match(/,/g) || []).length ? ";" : ",";
    function parseLine(line) {
      const cells = []; let cur = ""; let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (inQuotes) {
          if (ch === '"' && line[i + 1] === '"') { cur += '"'; i++; }
          else if (ch === '"') { inQuotes = false; }
          else cur += ch;
        } else {
          if (ch === '"') inQuotes = true;
          else if (ch === delimiter) { cells.push(cur); cur = ""; }
          else cur += ch;
        }
      }
      cells.push(cur);
      return cells.map(c => c.trim());
    }
    function normalizeDate(raw) {
      raw = (raw || "").trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) return raw;
      const de = raw.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
      if (de) return `${de[3]}-${de[2].padStart(2, "0")}-${de[1].padStart(2, "0")}`;
      return null;
    }
    let rows = lines.map(parseLine);
    const firstDate = normalizeDate(rows[0][0]);
    if (!firstDate) rows = rows.slice(1); // Kopfzeile überspringen, falls die erste Zelle kein Datum ist
    return rows.map(cells => ({ date: normalizeDate(cells[0]), text: cells[1] || "" })).filter(r => r.date && r.text);
  }

  function mergeMealPlans(remote, local) {
    remote = remote || {}; local = local || {};
    const result = {};
    const allDates = new Set([...Object.keys(remote), ...Object.keys(local)]);
    allDates.forEach(dateStr => {
      const r = remote[dateStr], l = local[dateStr];
      if (!r) { result[dateStr] = l; return; }
      if (!l) { result[dateStr] = r; return; }
      // Beide Seiten haben etwas für diesen Tag — Vorschläge und Stimmen zusammenführen statt eine Seite zu verwerfen.
      if (typeof r === "string" || typeof l === "string") {
        // Legacy-Format (einfacher Text) auf einer Seite — lokaler Wert hat Vorrang, sonst Server-Wert
        result[dateStr] = (typeof l === "string" && l) ? l : r;
        return;
      }
      const options = unionById(l.options || [], r.options || []).map(opt => {
        const lo = (l.options || []).find(o => o.id === opt.id);
        const ro = (r.options || []).find(o => o.id === opt.id);
        if (lo && ro) return {
          ...opt,
          votes: [...new Set([...(lo.votes || []), ...(ro.votes || [])])],
          ratings: { ...(ro.ratings || {}), ...(lo.ratings || {}) }
        };
        return opt;
      });
      result[dateStr] = { options, confirmed: l.confirmed || r.confirmed || null };
    });
    return result;
  }

  function getMealEntry(dateStr) {
    const raw = state.mealPlan[dateStr];
    if (!raw) return { options: [], confirmed: null };
    if (typeof raw === "string") return { options: [], confirmed: raw };
    return { options: raw.options || [], confirmed: raw.confirmed || null };
  }
  function optionForWhomIds(o) {
    if (Array.isArray(o.forWhomIds)) return o.forWhomIds;
    return o.forWhom ? [o.forWhom] : [];
  }
  function getMealForDate(dateStr, profileId) {
    profileId = profileId === undefined ? state.activeProfileId : profileId;
    const entry = getMealEntry(dateStr);
    // Persönliche, bestätigte Variante hat Vorrang vor der allgemeinen
    const personalConfirmed = entry.options.find(o => optionForWhomIds(o).includes(profileId) && entry.confirmed === o.id);
    if (personalConfirmed) return personalConfirmed.text;
    if (entry.confirmed) {
      const opt = entry.options.find(o => o.id === entry.confirmed);
      if (opt) return opt.text;
      return entry.confirmed;
    }
    const personalOptions = entry.options.filter(o => optionForWhomIds(o).includes(profileId));
    if (personalOptions.length) {
      return personalOptions.slice().sort((a, b) => (b.votes || []).length - (a.votes || []).length)[0].text;
    }
    const generalOptions = entry.options.filter(o => !optionForWhomIds(o).length);
    if (generalOptions.length) {
      return generalOptions.slice().sort((a, b) => (b.votes || []).length - (a.votes || []).length)[0].text;
    }
    return "";
  }
  function setMealForDate(dateStr, text) {
    if (text && text.trim()) state.mealPlan[dateStr] = { options: [], confirmed: text.trim() };
    else delete state.mealPlan[dateStr];
    saveState();
  }
  function addMealOption(dateStr, text, forWhomIds, kinship) {
    if (!text || !text.trim()) return;
    const entry = getMealEntry(dateStr);
    entry.options.push({ id: uid(), text: text.trim(), createdBy: state.activeProfileId || null, votes: [], forWhomIds: forWhomIds || [], ratings: {}, kinship: !!kinship, updatedAt: Date.now() });
    state.mealPlan[dateStr] = entry;
    saveState();
    if (kinship) pushKinshipData(true);
  }
  function toggleMealVote(dateStr, optionId, profileId) {
    const entry = getMealEntry(dateStr);
    entry.options.forEach(o => { o.votes = (o.votes || []).filter(v => v !== profileId); });
    const opt = entry.options.find(o => o.id === optionId);
    if (opt && !opt.votes.includes(profileId)) opt.votes.push(profileId);
    state.mealPlan[dateStr] = entry;
    saveState();
  }
  function rateMealOption(dateStr, optionId, profileId, score) {
    const entry = getMealEntry(dateStr);
    const opt = entry.options.find(o => o.id === optionId);
    if (!opt) return;
    opt.ratings = opt.ratings || {};
    if (opt.ratings[profileId] === score) delete opt.ratings[profileId]; // nochmal draufklicken = Bewertung zurücknehmen
    else opt.ratings[profileId] = score;
    state.mealPlan[dateStr] = entry;
    saveState();
  }
  function mealAverageRating(opt) {
    const vals = Object.values(opt.ratings || {});
    if (!vals.length) return null;
    return vals.reduce((a, b) => a + b, 0) / vals.length;
  }
  function confirmMealOption(dateStr, optionId) {
    const entry = getMealEntry(dateStr);
    entry.confirmed = entry.confirmed === optionId ? null : optionId;
    state.mealPlan[dateStr] = entry;
    saveState();
  }
  function removeMealOption(dateStr, optionId) {
    const entry = getMealEntry(dateStr);
    entry.options = entry.options.filter(o => o.id !== optionId);
    if (entry.confirmed === optionId) entry.confirmed = null;
    state.mealPlan[dateStr] = entry;
    saveState();
  }
  function isoDate(d) { return d.toISOString().slice(0, 10); }
  function formatDateStrShort(dateStr) {
    const [y, m, d] = dateStr.split("-");
    return `${d}.${m}.`;
  }
  // Countdown-Text ohne "0 Tage": bei 0 bzw. 1 verständliche Worte statt nackter Zahl.
  function countdownText(days, opts) {
    const o = opts || {};
    if (days <= 0) return o.zero || "heute";
    if (days === 1) return o.one || "noch 1 Tag";
    return `noch ${days} Tage`;
  }

  function formatDateWithWeekday(dateStr) {
    const [y, m, d] = dateStr.split("-").map(Number);
    let wd = new Date(Date.UTC(y, m - 1, d)).toLocaleDateString("de-DE", { weekday: "short", timeZone: "UTC" });
    if (!wd.endsWith(".")) wd += ".";
    return `${wd} ${String(d).padStart(2, "0")}.${String(m).padStart(2, "0")}.`;
  }
  function countSchoolDays(fromStr, toStr) {
    // Zählt Werktage (Mo–Fr) zwischen heute (exklusiv) und dem letzten Schultag (inklusiv).
    let count = 0;
    let d = addDays(fromStr, 1);
    while (d <= toStr) {
      if (!isWeekendStr(d)) count++;
      d = addDays(d, 1);
    }
    return count;
  }
  function addDays(dateStr, n) {
    const [y, m, d] = dateStr.split("-").map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d));
    dt.setUTCDate(dt.getUTCDate() + n);
    return dt.toISOString().slice(0, 10);
  }
  function resetRecurringTasksIfNeeded() {
    const todayStr = new Date().toISOString().slice(0, 10);
    let changed = false;
    state.tasks.forEach(t => {
      if (!t.recurring || !t.done) return;
      const completedStr = t.updatedAt ? new Date(t.updatedAt).toISOString().slice(0, 10) : null;
      if (!completedStr) return;
      const shouldReset = t.recurring === "daily"
        ? completedStr < todayStr
        : startOfWeek(completedStr) < startOfWeek(todayStr);
      if (shouldReset) {
        // Bereits verdiente Punkte bleiben im Verlauf erhalten — nur der "erledigt"-Status
        // für den neuen Tag/die neue Woche wird zurückgesetzt.
        t.done = false;
        t.lastEntryId = null;
        t.updatedAt = Date.now();
        changed = true;
      }
    });
    if (changed) saveState();
  }

  function startOfWeek(dateStr) {
    const [y, m, d] = dateStr.split("-").map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d));
    const offset = (dt.getUTCDay() + 6) % 7; // Monday-first
    dt.setUTCDate(dt.getUTCDate() - offset);
    return dt.toISOString().slice(0, 10);
  }

  function nextSwitchDate(schedule, fromDateStr) {
    for (let i = 1; i <= 60; i++) {
      const d = addDays(fromDateStr, i);
      const res = custodyResultForDate(schedule, d);
      if (res && res.isSwitchDay) return d;
    }
    return null;
  }

  function canSeeEventDetails(ev) {
    if (!ev.private) return true;
    const activeId = state.activeProfileId;
    if (!activeId) return false;
    if (ev.createdBy === activeId) return true;
    return (ev.profileIds || []).includes(activeId);
  }

  function canSeeItemDetails(it) {
    if (!it.private) return true;
    const activeId = state.activeProfileId;
    if (!activeId) return false;
    if (!it.createdBy) return true; // ältere Einträge ohne Zuordnung bleiben sichtbar
    return it.createdBy === activeId;
  }

  function buildDayCellInner(dateStr, day, maxEvents, showHeader) {
    const dayEvents = state.events.filter(ev => ev.date === dateStr);
    const dayHomework = state.tasks.filter(t => t.category === "homework" && t.dueDate === dateStr && !t.done && t.approved !== false);
    const activeFilter = calendarChildFilterIds;
    const custody = custodyAssignmentsForDate(dateStr).filter(({ schedule }) =>
      !activeFilter || schedule.childIds.some(id => activeFilter.has(id))
    );
    const meal = getMealForDate(dateStr);
    const holiday = getHolidayName(dateStr);
    const ferien = getSchoolHolidayName(dateStr);
    const dayNumHtml = holiday ? `<span style="color:#C0453B;font-weight:700;font-family:var(--font-display);" title="${escapeHtml(holiday)}">${day} 🎉</span>` : `<span style="font-family:var(--font-display);font-weight:600;">${day}</span>`;
    const custodyDotsHtml = custody.map(({ schedule, result }) => {
      const parents = (result.block.profileIds || []).map(pid => getProfile(pid)).filter(Boolean);
      const label = (parents.map(p => p.name).join(" & ") || "frei") + (result.isSwitchDay ? " · Wechseltag" : "");
      const title = `${escapeHtml(schedule.name)}: ${escapeHtml(label)}`;
      if (!parents.length) return `<span class="custody-dot custody-dot-empty" title="${title}">–</span>`;
      return parents.map(p => `<span class="custody-dot${result.isSwitchDay ? " custody-switch" : ""}" style="background:${p.color};" title="${title}">${result.isSwitchDay ? "⇄" : (p.emoji || p.name.charAt(0))}</span>`).join("");
    }).join("");
    const headerHtml = showHeader ? `<div style="font-size:12px;color:var(--text-muted);margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;gap:4px;">
        ${dayNumHtml}<span style="display:flex;align-items:center;gap:3px;">${meal ? `<span title="${escapeHtml(meal)}" style="font-size:12px;">🍽️</span>` : ""}${custodyDotsHtml}</span>
      </div>` : (meal ? `<div class="week-meal-tag" title="${escapeHtml(meal)}">🍽️ ${escapeHtml(meal)}</div>` : "");
    const bridging = !ferien && isEffectiveHoliday(dateStr);
    const ferienHtml = ferien
      ? `<div class="week-meal-tag" style="background:#F2D6A2;color:#6B4A22;" title="${escapeHtml(ferien)}">🏖️ ${escapeHtml(ferien)}</div>`
      : (bridging ? `<div class="week-meal-tag" style="background:#F7E6C6;color:#6B4A22;" title="Wochenende vor den Ferien">🏖️ Ferienwochenende</div>` : "");
    const vacation = getVacationForDate(dateStr);
    const vacationHtml = vacation ? `<div class="week-meal-tag vacation-tag" title="${escapeHtml(vacation.name)}">${vacation.emoji || "🏝️"} ${escapeHtml(vacation.name)}</div>` : "";
    const eventChips = dayEvents.slice(0, maxEvents).map(ev => {
      const visible = canSeeEventDetails(ev);
      const p = getProfile((ev.profileIds || [])[0]);
      const color = visible ? (p ? p.color : "var(--accent)") : "var(--text-muted)";
      const label = visible ? escapeHtml(ev.title) : "🔒 Privat";
      return `<div class="cal-event" data-id="${ev.id}" style="border-left-color:${color};${visible ? "" : "font-style:italic;opacity:.8;"}">${label}</div>`;
    }).join("");
    const homeworkChips = dayHomework.slice(0, maxEvents).map(t => {
      const owner = getProfile(t.assignedTo);
      return `<div class="cal-event cal-homework-chip" data-task-id="${t.id}" style="border-left-color:#3A5A9B;">📚 ${escapeHtml(t.title)}${owner ? " · " + escapeHtml(owner.name) : ""}</div>`;
    }).join("");
    const kinshipEvents = (kinshipCache.events || []).filter(ev => ev.date === dateStr);
    const kinshipChips = kinshipEvents.map(ev =>
      `<div class="cal-event" style="border-left-color:#B15CDE;font-style:italic;">👨‍👩‍👧‍👦 ${escapeHtml(ev.title)} <span style="opacity:.7;">· ${escapeHtml(ev.familyLabel || "")}</span></div>`
    ).join("");
    return `${headerHtml}
      <div style="display:flex;flex-direction:column;gap:2px;">
        ${eventChips}${homeworkChips}${kinshipChips}
        ${dayEvents.length > maxEvents ? `<div style="font-size:10px;color:var(--text-muted);">+${dayEvents.length - maxEvents} mehr</div>` : ""}
      </div>
      ${ferienHtml}${vacationHtml}
      ${(!showHeader && custody.length) ? `<div class="cal-custody-row" style="position:static;margin-top:6px;">${custodyDotsHtml}</div>` : ""}`;
  }

  // Waagerechtes Wischen zum Blättern (Touch) — senkrechtes Scrollen bleibt unberührt.
  function makeSwipeable(el, onSwipeLeft, onSwipeRight) {
    let startX = 0, startY = 0, tracking = false;
    el.addEventListener("touchstart", (e) => {
      if (e.touches.length !== 1) { tracking = false; return; }
      startX = e.touches[0].clientX; startY = e.touches[0].clientY; tracking = true;
    }, { passive: true });
    el.addEventListener("touchend", (e) => {
      if (!tracking) return;
      tracking = false;
      const t = e.changedTouches[0];
      const dx = t.clientX - startX, dy = t.clientY - startY;
      // Nur auslösen, wenn deutlich waagerecht gewischt wurde.
      if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.6) return;
      if (dx < 0) onSwipeLeft(); else onSwipeRight();
    }, { passive: true });
  }

  function wireDayCell(cell, dateStr) {
    cell.onclick = (e) => {
      const hwChip = e.target.closest(".cal-homework-chip");
      if (hwChip) { setView("tasks"); return; }
      const evChip = e.target.closest(".cal-event");
      if (evChip) {
        const ev = state.events.find(x => x.id === evChip.dataset.id);
        if (ev && !canSeeEventDetails(ev)) { showToast("🔒 Dieser Termin ist privat."); return; }
        openEventEditor(ev);
        return;
      }
      openDayOverview(dateStr);
    };
  }

  // Tagesübersicht statt sofort einen neuen Termin anzulegen — zeigt alles,
  // was an dem Tag ansteht, und lässt jeden Eintrag direkt bearbeiten.
  function openDayOverview(dateStr) {
    const dayEvents = state.events.filter(ev => ev.date === dateStr)
      .sort((a, b) => (a.time || "").localeCompare(b.time || ""));
    const dayHomework = state.tasks.filter(t => t.category === "homework" && !t.done && t.dueDate === dateStr && t.approved !== false);
    const meal = getMealForDate(dateStr);
    const ferien = getSchoolHolidayName(dateStr);
    const holiday = getHolidayName(dateStr);
    const vacation = getVacationForDate(dateStr);
    const custody = custodyAssignmentsForDate(dateStr);

    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    const [y, m, d] = dateStr.split("-").map(Number);
    const weekdayLong = new Date(Date.UTC(y, m - 1, d)).toLocaleDateString("de-DE", { weekday: "long", timeZone: "UTC" });
    overlay.innerHTML = `<div class="modal" style="max-width:460px;">
      <div class="modal-header">
        <h2>${weekdayLong}, ${String(d).padStart(2, "0")}.${String(m).padStart(2, "0")}.${y}</h2>
        <button class="close-btn" id="closeModal">✕</button>
      </div>
      <div class="day-overview-body">
        ${holiday ? `<div class="today-sub-stat">🎌 Feiertag: ${escapeHtml(holiday)}</div>` : ""}
        ${ferien ? `<div class="today-sub-stat">🏖️ Ferien: ${escapeHtml(ferien)}</div>` : ""}
        ${vacation ? `<div class="today-sub-stat">${vacation.emoji || "🏝️"} Urlaub: ${escapeHtml(vacation.name)}</div>` : ""}
        ${custody.length ? custody.map(({ schedule, result }) => {
          const parents = (result.block.profileIds || []).map(pid => getProfile(pid)).filter(Boolean);
          const kids = schedule.childIds.map(id => getProfile(id)).filter(Boolean);
          return `<div class="today-sub-stat">🔁 ${escapeHtml(kids.map(k => k.name).join(", "))} bei ${escapeHtml(parents.map(p => p.name).join(" & ") || "—")}${result.isSwitchDay ? " · Wechseltag" : ""}</div>`;
        }).join("") : ""}
        ${meal ? `<div class="today-sub-stat">🍽️ ${escapeHtml(meal)}</div>` : ""}
        <h3 class="day-overview-heading">Termine</h3>
        ${dayEvents.length ? dayEvents.map(ev => {
          const visible = canSeeEventDetails(ev);
          const people = (ev.profileIds || []).map(id => getProfile(id)).filter(Boolean);
          return `<div class="widget-row day-overview-event" data-event-id="${ev.id}" style="cursor:${visible ? "pointer" : "default"};">
            <span class="wr-title">${visible ? `${ev.time ? `<strong>${escapeHtml(ev.time)}</strong> · ` : ""}${escapeHtml(ev.title)}` : "🔒 Privat"}</span>
            <span class="meal-voters">${people.map(p => `<span class="mini-avatar" style="background:${p.color};" title="${escapeHtml(p.name)}">${p.emoji || p.name.charAt(0)}</span>`).join("")}</span>
          </div>`;
        }).join("") : `<div class="widget-empty">Keine Termine an diesem Tag.</div>`}
        ${dayHomework.length ? `<h3 class="day-overview-heading">Hausaufgaben</h3>` + dayHomework.map(t => {
          const owner = getProfile(t.assignedTo);
          return `<div class="widget-row"><span class="wr-title">📚 ${escapeHtml(t.title)}${owner ? ` · ${escapeHtml(owner.name)}` : ""}</span></div>`;
        }).join("") : ""}
      </div>
      <div class="modal-footer">
        <div></div>
        <div class="modal-footer-right">
          <button class="btn btn-ghost" id="dayCloseBtn">Schließen</button>
          <button class="btn btn-accent" id="dayNewEventBtn">+ Neuer Termin</button>
        </div>
      </div>
    </div>`;
    document.body.appendChild(overlay);
    function close() { overlay.remove(); }
    overlay.querySelector("#closeModal").onclick = close;
    overlay.querySelector("#dayCloseBtn").onclick = close;
    overlay.onclick = (e) => { if (e.target === overlay) close(); };
    overlay.querySelector("#dayNewEventBtn").onclick = () => { close(); openEventEditor(null, dateStr); };
    overlay.querySelectorAll("[data-event-id]").forEach(row => {
      row.onclick = () => {
        const ev = state.events.find(x => x.id === row.dataset.eventId);
        if (!ev) return;
        if (!canSeeEventDetails(ev)) { showToast("🔒 Dieser Termin ist privat."); return; }
        close();
        openEventEditor(ev);
      };
    });
  }

  let ferienAutoFetchTried = false;
  function renderCalendarView(container) {
    const allCustodyChildIds = [...new Set(state.custodySchedules.flatMap(s => s.childIds))];
    if (calendarChildFilterIds === null) calendarChildFilterIds = new Set(allCustodyChildIds);

    if (state.federalState && !ferienAutoFetchTried &&
        (!state.schoolHolidays[state.federalState] || !state.schoolHolidays[state.federalState].length)) {
      ferienAutoFetchTried = true;
      fetchSchoolHolidays(state.federalState).then(ok => {
        if (ok) render();
        else showToast(`Schulferien-Abruf fehlgeschlagen: ${lastFerienError || "unbekannter Fehler"}`);
      });
    }

    const header = document.createElement("div");
    header.className = "view-header";
    header.innerHTML = `<div><h1 class="view-title">Familienkalender</h1><p class="view-sub">Termine für die ganze Familie${state.custodySchedules.length ? " · farbiger Punkt = Betreuung, ⇄ = Wechseltag" : ""} · 🎉 = Feiertag${state.federalState ? ", 🏖️ = Schulferien" : ""}.</p></div>`;
    container.appendChild(header);

    const ferienCount = state.federalState ? (state.schoolHolidays[state.federalState] || []).length : 0;
    if (!state.federalState) {
      const hint = document.createElement("div");
      hint.className = "ferien-status-banner";
      hint.innerHTML = `🏖️ Noch kein Bundesland für Schulferien eingestellt. <button class="btn btn-sm" id="ferienGoSettings">Jetzt einstellen</button>`;
      container.appendChild(hint);
      hint.querySelector("#ferienGoSettings").onclick = () => setView("settings");
    } else if (!ferienCount) {
      const warn = document.createElement("div");
      warn.className = "ferien-status-banner ferien-status-warn";
      warn.innerHTML = `⚠️ Schulferien für ${escapeHtml((GERMAN_STATES.find(s => s.code === state.federalState) || {}).name || state.federalState)} sind (noch) nicht geladen${lastFerienError ? " — " + escapeHtml(lastFerienError) : ""}. <button class="btn btn-sm" id="ferienRetryBtn">↻ Erneut versuchen</button>`;
      container.appendChild(warn);
      warn.querySelector("#ferienRetryBtn").onclick = async () => {
        warn.querySelector("#ferienRetryBtn").textContent = "Lädt …";
        const ok = await fetchSchoolHolidays(state.federalState);
        showToast(ok ? "Schulferien geladen." : `Fehlgeschlagen: ${lastFerienError || "unbekannter Fehler"}`);
        render();
      };
    }

    // --- "Wer ist heute da" Übersicht ---
    if (state.custodySchedules.length) {
      const todayStr0 = new Date().toISOString().slice(0, 10);
      const bar = document.createElement("div");
      bar.className = "custody-summary-bar";
      bar.innerHTML = state.custodySchedules.map(s => {
        const res = custodyResultForDate(s, todayStr0);
        if (!res) return "";
        const parents = (res.block.profileIds || []).map(id => getProfile(id)).filter(Boolean);
        const kids = s.childIds.map(id => getProfile(id)).filter(Boolean);
        const nextSwitch = nextSwitchDate(s, todayStr0);
        return `<div class="custody-summary-chip">
          <span>${kids.map(k => k.emoji || k.name.charAt(0)).join(" ")} ${escapeHtml(kids.map(k => k.name).join(", "))}</span>
          <span class="arrow">→</span>
          ${parents.map(p => `<span class="mini-avatar" style="background:${p.color};">${p.emoji || p.name.charAt(0)}</span>`).join("")}
          <span>${escapeHtml(parents.map(p => p.name).join(" & ") || "—")}</span>
          ${nextSwitch ? `<span style="color:var(--text-muted);">· Wechsel ${formatDateStrShort(nextSwitch)}</span>` : ""}
        </div>`;
      }).join("");
      container.appendChild(bar);
    }

    // --- Kind-Filter ---
    if (allCustodyChildIds.length > 1) {
      const filterRow = document.createElement("div");
      filterRow.className = "child-filter-row";
      allCustodyChildIds.forEach(cid => {
        const c = getProfile(cid);
        if (!c) return;
        const chip = document.createElement("button");
        chip.className = "child-filter-chip" + (calendarChildFilterIds.has(cid) ? " active" : "");
        chip.innerHTML = `<span class="mini-avatar" style="background:${c.color};">${c.emoji || c.name.charAt(0)}</span>${escapeHtml(c.name)}`;
        chip.onclick = () => {
          if (calendarChildFilterIds.has(cid)) calendarChildFilterIds.delete(cid); else calendarChildFilterIds.add(cid);
          render();
        };
        filterRow.appendChild(chip);
      });
      container.appendChild(filterRow);
    }

    const toolbar = document.createElement("div");
    toolbar.className = "mindmap-toolbar";
    const [curY, curM] = calendarCursorStr.split("-").map(Number);
    const label = calendarViewMode === "month"
      ? new Date(curY, curM - 1, 1).toLocaleDateString("de-DE", { month: "long", year: "numeric" })
      : (() => {
          const wStart = startOfWeek(calendarCursorStr);
          const wEnd = addDays(wStart, 6);
          return `${formatDateStrShort(wStart)} – ${formatDateStrShort(wEnd)} ${wEnd.slice(0, 4)}`;
        })();
    toolbar.innerHTML = `
      <button class="btn btn-sm" id="calPrev">‹</button>
      <span style="font-family:var(--font-display);font-size:16px;min-width:190px;text-align:center;">${label}</span>
      <button class="btn btn-sm" id="calNext">›</button>
      <button class="btn btn-sm" id="calToday">Heute</button>
      <div class="view-toggle">
        <button id="calModeMonth" class="${calendarViewMode === "month" ? "active" : ""}">Monat</button>
        <button id="calModeWeek" class="${calendarViewMode === "week" ? "active" : ""}">Woche</button>
      </div>
      <button class="btn btn-sm" id="calMeal">🍽️ Essensplan</button>
      ${(!getActiveProfile() || getActiveProfile().role === "parent") ? `<button class="btn btn-sm" id="calCustody">🔁 Betreuung</button>` : ""}
      <button class="btn btn-sm" id="calVacation">🏝️ Urlaub</button>
      <button class="btn btn-sm" id="calImport" title="Termine aus anderer Quelle hinzufügen (JSON oder ICS)">⊕ Termine importieren</button>
      <input type="file" id="calImportFile" accept=".json,.ics" style="display:none">
      <button class="btn btn-sm btn-accent" id="calAdd" style="margin-left:auto;">+ Termin</button>
    `;
    container.appendChild(toolbar);

    const calImportFile = toolbar.querySelector("#calImportFile");
    let calImportForProfileId = "";
    toolbar.querySelector("#calImport").onclick = () => {
      const overlay = document.createElement("div");
      overlay.className = "modal-overlay";
      overlay.innerHTML = `
        <div class="modal" style="max-width:380px;">
          <div class="modal-header"><h2>Termine importieren</h2><button class="close-btn" id="closeImportModal">✕</button></div>
          <div class="field"><label>Für wen sind diese Termine?</label>
            <select id="importForProfile">
              <option value="">Für alle (kein bestimmtes Profil)</option>
              ${state.profiles.map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join("")}
            </select>
          </div>
          <p class="hint">Praktisch z. B. beim Import eines Arbeits- oder Schulkalenders, damit die Termine gleich richtig zugeordnet sind.</p>
          <div class="modal-footer"><div></div><div class="modal-footer-right">
            <button class="btn btn-ghost" id="cancelImportModal">Abbrechen</button>
            <button class="btn btn-accent" id="continueImportBtn">Datei auswählen</button>
          </div></div>
        </div>`;
      document.body.appendChild(overlay);
      const close = () => overlay.remove();
      overlay.querySelector("#closeImportModal").onclick = close;
      overlay.querySelector("#cancelImportModal").onclick = close;
      overlay.onclick = (e) => { if (e.target === overlay) close(); };
      overlay.querySelector("#continueImportBtn").onclick = () => {
        calImportForProfileId = overlay.querySelector("#importForProfile").value;
        close();
        calImportFile.click();
      };
    };
    calImportFile.onchange = () => {
      const file = calImportFile.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          let incoming = [];
          if (file.name.toLowerCase().endsWith(".ics")) {
            incoming = parseICS(e.target.result).map(ev => ({
              id: "ics-" + (ev.uid || (ev.title + ev.date)).replace(/[^a-z0-9]/gi, "").slice(0, 60),
              title: ev.title, date: ev.date, time: ev.time || "",
              profileIds: calImportForProfileId ? [calImportForProfileId] : [], private: false,
              createdBy: calImportForProfileId || state.activeProfileId || null
            }));
          } else {
            const data = JSON.parse(e.target.result);
            incoming = (data.events || (Array.isArray(data) ? data : [])).map(ev => ({
              ...ev,
              profileIds: calImportForProfileId ? [calImportForProfileId] : (ev.profileIds || [])
            }));
          }
          const before = state.events.length;
          state.events = unionById(state.events, incoming);
          const added = state.events.length - before;
          saveState(); render();
          showToast(added > 0 ? `${added} Termin(e) hinzugefügt.` : "Keine neuen Termine (schon vorhanden).");
        } catch (err) { showToast("Import fehlgeschlagen — Datei prüfen."); }
      };
      reader.readAsText(file);
      calImportFile.value = "";
    };

    const todayStr = new Date().toISOString().slice(0, 10);

    if (calendarViewMode === "month") {
      const calCard = document.createElement("div");
      calCard.className = "calendar-card";
      const grid = document.createElement("div");
      grid.className = "cal-month-grid";
      grid.style.gridTemplateColumns = "repeat(7, 1fr)";
      ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"].forEach(d => {
        const h = document.createElement("div");
        h.className = "cal-weekday-head";
        h.textContent = d;
        grid.appendChild(h);
      });
      const year = curY, month = curM - 1; // month: 0-based, local-only usage below
      const startOffset = (new Date(year, month, 1).getDay() + 6) % 7;
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      for (let i = 0; i < startOffset; i++) grid.appendChild(document.createElement("div"));
      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
        const cell = document.createElement("div");
        const isHoliday = !!getHolidayName(dateStr);
        const isFerien = !!getSchoolHolidayName(dateStr);
        const isToday = dateStr === todayStr;
        cell.className = "cal-day-cell" + (isToday ? " is-today" : "");
        const bg = isHoliday ? "color-mix(in srgb, #C0453B 22%, var(--surface))" : isFerien ? "color-mix(in srgb, #D9A441 32%, var(--surface))" : "";
        if (bg) cell.style.background = bg;
        cell.innerHTML = buildDayCellInner(dateStr, day, 3, true);
        wireDayCell(cell, dateStr);
        grid.appendChild(cell);
      }
      calCard.appendChild(grid);
      container.appendChild(calCard);
      toolbar.querySelector("#calPrev").onclick = () => { calendarCursorStr = addMonths(calendarCursorStr, -1); render(); };
      toolbar.querySelector("#calNext").onclick = () => { calendarCursorStr = addMonths(calendarCursorStr, 1); render(); };
      makeSwipeable(calCard,
        () => { calendarCursorStr = addMonths(calendarCursorStr, 1); render(); },
        () => { calendarCursorStr = addMonths(calendarCursorStr, -1); render(); });
    } else {
      const weekCard = document.createElement("div");
      weekCard.className = "calendar-card week-card-vertical";
      const weekGrid = document.createElement("div");
      weekGrid.className = "week-grid";
      const wStart = startOfWeek(calendarCursorStr);
      const labels = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"];
      let todayCellEl = null;
      for (let i = 0; i < 7; i++) {
        const dateStr = addDays(wStart, i);
        const [, , dNum] = dateStr.split("-");
        const cell = document.createElement("div");
        cell.className = "week-day-cell";
        const isHoliday = !!getHolidayName(dateStr);
        const isFerien = !!getSchoolHolidayName(dateStr);
        if (isHoliday) cell.style.background = "color-mix(in srgb, #C0453B 22%, var(--surface))";
        else if (isFerien) cell.style.background = "color-mix(in srgb, #D9A441 32%, var(--surface))";
        if (dateStr === todayStr) { cell.classList.add("is-today"); todayCellEl = cell; }
        cell.innerHTML = `<div class="wd-head-row"><span class="wd-label">${labels[i]}</span><span class="wd-num">${parseInt(dNum, 10)}</span></div>` +
          buildDayCellInner(dateStr, "", 8, false);
        wireDayCell(cell, dateStr);
        weekGrid.appendChild(cell);
      }
      weekCard.appendChild(weekGrid);
      container.appendChild(weekCard);
      if (todayCellEl) {
        setTimeout(() => todayCellEl.scrollIntoView({ block: "center", behavior: "smooth" }), 50);
      }
      toolbar.querySelector("#calPrev").onclick = () => { calendarCursorStr = addDays(calendarCursorStr, -7); render(); };
      toolbar.querySelector("#calNext").onclick = () => { calendarCursorStr = addDays(calendarCursorStr, 7); render(); };
      makeSwipeable(weekCard,
        () => { calendarCursorStr = addDays(calendarCursorStr, 7); render(); },
        () => { calendarCursorStr = addDays(calendarCursorStr, -7); render(); });
    }

    toolbar.querySelector("#calToday").onclick = () => { calendarCursorStr = new Date().toISOString().slice(0, 10); render(); };
    toolbar.querySelector("#calAdd").onclick = () => openEventEditor(null, todayStr);
    const custodyBtn = toolbar.querySelector("#calCustody");
    if (custodyBtn) custodyBtn.onclick = () => openCustodyManager();
    toolbar.querySelector("#calVacation").onclick = () => openVacationManager();
    toolbar.querySelector("#calMeal").onclick = () => setView("mealplan");
    toolbar.querySelector("#calModeMonth").onclick = () => { calendarViewMode = "month"; render(); };
    toolbar.querySelector("#calModeWeek").onclick = () => { calendarViewMode = "week"; render(); };
  }

  let mealPlanWeekCursor = null;
  function renderMealPlanView(container) {
    if (!mealPlanWeekCursor) mealPlanWeekCursor = new Date().toISOString().slice(0, 10);
    const wStart = startOfWeek(mealPlanWeekCursor);
    const wEnd = addDays(wStart, 6);
    const days = Array.from({ length: 7 }, (_, i) => addDays(wStart, i));
    const dayNames = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"];

    const activeProfileForMeal = getActiveProfile();

    header.className = "view-header";

    container.appendChild(header);
    container.appendChild(csvHint);

    toolbar.className = "mindmap-toolbar";

      <button class="btn btn-sm" id="mealPrev">‹</button>
      <span style="font-family:var(--font-display);font-size:15px;min-width:170px;text-align:center;">${formatDateStrShort(wStart)} – ${formatDateStrShort(wEnd)}</span>
      <button class="btn btn-sm" id="mealNext">›</button>
      <button class="btn btn-sm" id="mealToday">Diese Woche</button>
      <button class="btn btn-sm" id="mealExportBtn" style="margin-left:auto;">⇩ Vorschläge exportieren</button>
      <button class="btn btn-sm" id="mealImportBtn">⊕ Vorschläge importieren</button>
      <input type="file" id="mealImportFile" accept=".json,.csv" style="display:none">
    `;
    container.appendChild(toolbar);
    toolbar.querySelector("#mealExportBtn").onclick = () => {
      const rows = [["Datum", "Vorschlag", "Stimmen", "Freigegeben"]];
      Object.keys(state.mealPlan).sort().forEach(dateStr => {
        const entry = getMealEntry(dateStr);
        entry.options.forEach(o => {
          const text = (o.text || "").replace(/"/g, '""');
          const votes = (o.votes || []).length;
          const confirmed = entry.confirmed === o.id ? "ja" : "";
          rows.push([dateStr, `"${text}"`, votes, confirmed]);
        });
      });
      if (rows.length === 1) { showToast("Noch keine Vorschläge zum Exportieren vorhanden."); return; }
      const csv = rows.map(r => r.join(",")).join("\n");
      downloadBlob(csv, `dapp-essensplan-vorschlaege-${Date.now()}.csv`, "text/csv");
    };
    toolbar.querySelector("#mealPrev").onclick = () => { mealPlanWeekCursor = addDays(wStart, -7); render(); };
    toolbar.querySelector("#mealNext").onclick = () => { mealPlanWeekCursor = addDays(wStart, 7); render(); };
    toolbar.querySelector("#mealToday").onclick = () => { mealPlanWeekCursor = new Date().toISOString().slice(0, 10); render(); };

    const mealImportFile = toolbar.querySelector("#mealImportFile");
    toolbar.querySelector("#mealImportBtn").onclick = () => mealImportFile.click();
    mealImportFile.onchange = () => {
      const file = mealImportFile.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          let list = [];
          if (file.name.toLowerCase().endsWith(".csv")) {
            list = parseMealCsv(e.target.result);
          } else {
            const data = JSON.parse(e.target.result);
            list = Array.isArray(data) ? data : (data.suggestions || data.options || []);
          }
          let added = 0;
          list.forEach(entry => {
            const date = entry.date;
            const text = entry.text || entry.title || entry.meal;
            if (date && text) { addMealOption(date, text); added++; }
          });
          render();
          showToast(added ? `${added} Vorschlag/Vorschläge importiert.` : "Keine passenden Vorschläge in der Datei gefunden.");
        } catch (err) { showToast("Import fehlgeschlagen — erwartet wird CSV (Datum,Vorschlag) oder JSON mit {date, text}."); }
      };
      reader.readAsText(file);
      mealImportFile.value = "";
    };

    const card = document.createElement("div");
    card.className = "calendar-card";
    container.appendChild(card);

    function renderMealOptionCard(o, entry, dateStr, dayWrap, label) {
      const voters = (o.votes || []).map(pid => getProfile(pid)).filter(Boolean);
      const isConfirmed = entry.confirmed === o.id;
      const iVoted = activeId && (o.votes || []).includes(activeId);
      const avgRating = mealAverageRating(o);
      const myRating = (o.ratings || {})[activeId] || 0;

  let toothbrushTimerHandle = null;
  let toothbrushMuted = false;
  let toothbrushAudioCtx = null;
  function tbBeep(freq, duration, volume) {
    if (toothbrushMuted) return;
    try {
      if (!toothbrushAudioCtx) toothbrushAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const ctx = toothbrushAudioCtx;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(volume || 0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration);
    } catch (e) { /* Web Audio evtl. nicht verfügbar — kein Problem, Timer läuft trotzdem */ }
  }
  function tbVibrate(pattern) {
    if (toothbrushMuted) return;
    if (navigator.vibrate) { try { navigator.vibrate(pattern); } catch (e) { /* nicht unterstützt */ } }
  }
  function renderToothbrushView(container) {
    const TOTAL = 120; // 2 Minuten, wie von Zahnärzten empfohlen
    let remaining = TOTAL;
    let running = false;

    const header = document.createElement("div");
    header.className = "view-header";
    header.innerHTML = `<div><h1 class="view-title">🦷 Zahnputz-Timer</h1><p class="view-sub">2 Minuten, viermal 30 Sekunden — für jede Ecke im Mund gleich lang.</p></div>`;
    container.appendChild(header);

    const card = document.createElement("div");
    card.className = "calendar-card";
    card.style.textAlign = "center";
    card.style.padding = "34px 20px";
    card.innerHTML = `
      <div class="tb-ring-wrap">
        <svg viewBox="0 0 200 200" class="tb-ring-svg">

        </svg>
        <div class="tb-ring-center">
          <div class="tb-time" id="tbTime">2:00</div>
          <div class="tb-quadrant" id="tbQuadrant">Bereit? Los geht's!</div>
        </div>
      </div>
      <div class="tb-buttons">
        <button class="btn btn-accent" id="tbStartBtn">▶ Start</button>
        <button class="btn" id="tbResetBtn">↺ Neu</button>
        <button class="btn" id="tbMuteBtn" title="Ton &amp; Vibration ein/aus">${toothbrushMuted ? "🔇" : "🔊"}</button>
      </div>
      <div class="tb-quadrant-list" id="tbQuadrantList"></div>
    `;
    container.appendChild(card);

    card.querySelector("#tbMuteBtn").onclick = () => {
      toothbrushMuted = !toothbrushMuted;
      card.querySelector("#tbMuteBtn").textContent = toothbrushMuted ? "🔇" : "🔊";
    };

    const timeEl = card.querySelector("#tbTime");
    const quadEl = card.querySelector("#tbQuadrant");
    const ringFg = card.querySelector("#tbRingFg");
    const startBtn = card.querySelector("#tbStartBtn");
    const listEl = card.querySelector("#tbQuadrantList");
    const CIRC = 2 * Math.PI * 88;
    ringFg.style.strokeDasharray = `${CIRC}`;
    let lastQuadIdx = -1;

    listEl.innerHTML = TOOTHBRUSH_QUADRANTS.map((q, i) => `
      <div class="tb-quadrant-chip" id="tbChip${i}"><strong>${q.label}</strong><span>${q.sub}</span></div>
    `).join("");

    function paint() {
      const mins = Math.floor(remaining / 60);
      const secs = remaining % 60;
      timeEl.textContent = `${mins}:${String(secs).padStart(2, "0")}`;
      const elapsed = TOTAL - remaining;
      const progress = elapsed / TOTAL;
      ringFg.style.strokeDashoffset = `${CIRC * (1 - progress)}`;
      const quadIdx = Math.min(3, Math.floor(elapsed / 30));
      if (remaining > 0) {
        quadEl.textContent = TOOTHBRUSH_QUADRANTS[quadIdx].label;
        if (running && quadIdx !== lastQuadIdx && lastQuadIdx !== -1) {
          tbBeep(660, 0.18, 0.15);
          tbVibrate(120);
        }
        lastQuadIdx = quadIdx;
      }
      TOOTHBRUSH_QUADRANTS.forEach((_, i) => {
        const chip = card.querySelector(`#tbChip${i}`);
        chip.classList.toggle("active", running && i === quadIdx && remaining > 0);
        chip.classList.toggle("done", elapsed >= (i + 1) * 30);
      });
      if (remaining <= 0) {
        quadEl.textContent = "🎉 Fertig — super gemacht!";
        ringFg.classList.add("tb-ring-done");
      }
    }
    function tick() {
      if (remaining > 0) { remaining--; paint(); }
      if (remaining <= 0) {
        running = false;
        clearInterval(toothbrushTimerHandle);
        toothbrushTimerHandle = null;
        startBtn.textContent = "▶ Nochmal";
        tbBeep(523, 0.2, 0.18);
        setTimeout(() => tbBeep(659, 0.2, 0.18), 180);
        setTimeout(() => tbBeep(784, 0.35, 0.2), 360);
        tbVibrate([120, 80, 120, 80, 200]);
        showToast("🦷 Fertig geputzt — Superstar! ⭐");
      }
    }
    startBtn.onclick = () => {
      if (remaining <= 0) { remaining = TOTAL; lastQuadIdx = -1; ringFg.classList.remove("tb-ring-done"); paint(); }
      if (running) {
        running = false;
        clearInterval(toothbrushTimerHandle); toothbrushTimerHandle = null;
        startBtn.textContent = "▶ Weiter";
      } else {
        running = true;
        startBtn.textContent = "⏸ Pause";
        if (lastQuadIdx === -1) { tbBeep(660, 0.15, 0.15); tbVibrate(80); lastQuadIdx = 0; }
        toothbrushTimerHandle = setInterval(tick, 1000);
      }
    };
    card.querySelector("#tbResetBtn").onclick = () => {
      running = false;
      if (toothbrushTimerHandle) { clearInterval(toothbrushTimerHandle); toothbrushTimerHandle = null; }
      remaining = TOTAL;
      lastQuadIdx = -1;
      startBtn.textContent = "▶ Start";
      ringFg.classList.remove("tb-ring-done");
      paint();
    };
    paint();
  }

    `;
    container.appendChild(wrap);

    const canvas = wrap.querySelector("#snakeCanvas");
    const ctx = canvas.getContext("2d");
    const cell = 24, cols = Math.floor(canvas.width / cell), rows = Math.floor(canvas.height / cell);
    let speed = 260; // gemütlicher Start für Kinder, wird mit jedem Apfel etwas schneller
    let snake = [{ x: 4, y: 4 }];
    let dir = { x: 1, y: 0 };
    let nextDir = { x: 1, y: 0 };
    let food = { x: 8, y: 4 };
    let score = 0;
    let gameOver = false;

    function placeFood() {
      food = { x: Math.floor(Math.random() * cols), y: Math.floor(Math.random() * rows) };
      if (snake.some(s => s.x === food.x && s.y === food.y)) placeFood();
    }
    function paint() {
      ctx.fillStyle = "#14181B"; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#E8A33D";
      ctx.fillRect(food.x * cell + 2, food.y * cell + 2, cell - 4, cell - 4);
      snake.forEach((s, i) => {
        ctx.fillStyle = i === 0 ? "#3FA796" : "#2E8B84";
        ctx.fillRect(s.x * cell + 1, s.y * cell + 1, cell - 2, cell - 2);
      });
      if (gameOver) {
        ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#fff"; ctx.font = "bold 22px sans-serif"; ctx.textAlign = "center";
        ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2 - 10);
        ctx.font = "14px sans-serif";
        ctx.fillText("Erneut klicken zum Neustart", canvas.width / 2, canvas.height / 2 + 16);
      }
    }
    function tick() {
      if (gameOver) return;
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      // Wände sind durchlässig: man kommt auf der anderen Seite wieder heraus,
      // statt sofort zu verlieren — deutlich freundlicher für jüngere Kinder.
      if (head.x < 0) head.x = cols - 1;
      if (head.y < 0) head.y = rows - 1;
      if (head.x >= cols) head.x = 0;
      if (head.y >= rows) head.y = 0;
      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        gameOver = true; submitScore("snake", score); paint(); render(); return;
      }
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        wrap.querySelector("#snakeScore").textContent = score;
        placeFood();
        // Schrittweise schneller, aber nie hektisch
        if (speed > 120) {
          speed -= 6;
          clearInterval(retroGameHandle);
          retroGameHandle = setInterval(tick, speed);
        }
      } else {
        snake.pop();
      }
      paint();
    }
    function setDir(x, y) { if (dir.x === -x && dir.y === -y) return; nextDir = { x, y }; }
    function keyHandler(e) {
      if (e.key === "ArrowUp") setDir(0, -1);
      else if (e.key === "ArrowDown") setDir(0, 1);
      else if (e.key === "ArrowLeft") setDir(-1, 0);
      else if (e.key === "ArrowRight") setDir(1, 0);
    }
    document.addEventListener("keydown", keyHandler);
    wrap.querySelectorAll("[data-dir]").forEach(btn => {
      // pointerdown statt click: reagiert sofort, ohne die Touch-Verzögerung des Browsers
      btn.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        const d = btn.dataset.dir;
        if (d === "up") setDir(0, -1); else if (d === "down") setDir(0, 1);
        else if (d === "left") setDir(-1, 0); else if (d === "right") setDir(1, 0);
      });
    });
    canvas.onclick = () => {
      if (!gameOver) return;
      snake = [{ x: 4, y: 4 }]; dir = { x: 1, y: 0 }; nextDir = { x: 1, y: 0 };
      score = 0; wrap.querySelector("#snakeScore").textContent = "0";
      gameOver = false; placeFood(); paint();
      speed = 260;
      clearInterval(retroGameHandle);
      retroGameHandle = setInterval(tick, speed);
    };
    const cleanup = () => document.removeEventListener("keydown", keyHandler);
    const observer = new MutationObserver(() => { if (!document.body.contains(canvas)) { cleanup(); observer.disconnect(); } });
    observer.observe(document.getElementById("viewContainer"), { childList: true, subtree: true });

    paint();
    retroGameHandle = setInterval(tick, speed);
    renderHighscoreList(container, "snake", false, "");
  }

  function renderPongGame(container) {
    const wrap = document.createElement("div");
    wrap.className = "calendar-card retro-game-wrap";
    wrap.innerHTML = `
      <div class="retro-game-score">Du: <strong id="pongScoreP">0</strong> · Computer: <strong id="pongScoreC">0</strong></div>
      <canvas id="pongCanvas" width="360" height="300" class="retro-canvas"></canvas>
      <div class="retro-touch-pad"><div class="retro-touch-row"><button data-dir="up">▲ Schläger</button><button data-dir="down">▼ Schläger</button></div></div>
      <p class="hint" style="margin-top:8px;">Pfeiltasten hoch/runter oder die Knöpfe. Erster bis 5 Punkte gewinnt.</p>
    `;
    container.appendChild(wrap);
    const canvas = wrap.querySelector("#pongCanvas");
    const ctx = canvas.getContext("2d");
    const W = canvas.width, H = canvas.height;
    let playerY = H / 2 - 25, compY = H / 2 - 25;
    const paddleH = 50, paddleW = 8;
    let ballX = W / 2, ballY = H / 2, ballVX = 3.2, ballVY = 2.2;
    let scoreP = 0, scoreC = 0;
    let moveUp = false, moveDown = false;
    function keyDown(e) { if (e.key === "ArrowUp") moveUp = true; if (e.key === "ArrowDown") moveDown = true; }
    function keyUp(e) { if (e.key === "ArrowUp") moveUp = false; if (e.key === "ArrowDown") moveDown = false; }
    document.addEventListener("keydown", keyDown);
    document.addEventListener("keyup", keyUp);
    const pongUp = wrap.querySelector('[data-dir="up"]');
    const pongDown = wrap.querySelector('[data-dir="down"]');
    pongUp.addEventListener("pointerdown", (e) => { e.preventDefault(); moveUp = true; });
    pongDown.addEventListener("pointerdown", (e) => { e.preventDefault(); moveDown = true; });
    ["pointerup", "pointercancel", "pointerleave"].forEach(evt => {
      pongUp.addEventListener(evt, () => moveUp = false);
      pongDown.addEventListener(evt, () => moveDown = false);
    });
    function tick() {
      if (moveUp) playerY -= 5; if (moveDown) playerY += 5;
      playerY = Math.max(0, Math.min(H - paddleH, playerY));
      const compCenter = compY + paddleH / 2;
      if (compCenter < ballY - 10) compY += 3.2; else if (compCenter > ballY + 10) compY -= 3.2;
      compY = Math.max(0, Math.min(H - paddleH, compY));
      ballX += ballVX; ballY += ballVY;
      if (ballY <= 0 || ballY >= H) ballVY *= -1;
      if (ballX <= paddleW + 4 && ballY >= playerY && ballY <= playerY + paddleH) ballVX = Math.abs(ballVX);
      if (ballX >= W - paddleW - 4 && ballY >= compY && ballY <= compY + paddleH) ballVX = -Math.abs(ballVX);
      if (ballX < 0) { scoreC++; wrap.querySelector("#pongScoreC").textContent = scoreC; resetBall(); }
      if (ballX > W) { scoreP++; wrap.querySelector("#pongScoreP").textContent = scoreP; resetBall(); }
      paint();
    }
    function resetBall() { ballX = W / 2; ballY = H / 2; ballVX = (Math.random() > 0.5 ? 1 : -1) * 3.2; ballVY = (Math.random() - 0.5) * 4; }
    function paint() {
      ctx.fillStyle = "#14181B"; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#3FA796";
      ctx.fillRect(4, playerY, paddleW, paddleH);
      ctx.fillRect(W - paddleW - 4, compY, paddleW, paddleH);
      ctx.fillStyle = "#E8A33D";
      ctx.beginPath(); ctx.arc(ballX, ballY, 6, 0, Math.PI * 2); ctx.fill();
    }
    const cleanup = () => { document.removeEventListener("keydown", keyDown); document.removeEventListener("keyup", keyUp); };
    const observer = new MutationObserver(() => { if (!document.body.contains(canvas)) { cleanup(); observer.disconnect(); } });
    observer.observe(document.getElementById("viewContainer"), { childList: true, subtree: true });
    paint();
    retroGameHandle = setInterval(tick, 20);
    renderHighscoreList(container, "pong", false, "");
  }

  // Kleines Gesangs-Spielzeug: vier Blobs, die zusammen einen Akkord singen.
  // Höhe = Tonhöhe, Antippen/Ziehen steuert sie. Eigene Umsetzung, kein fremdes Vorbild.
  function renderChoirToy(container) {
    const wrap = document.createElement("div");
    wrap.className = "calendar-card retro-game-wrap";
    wrap.innerHTML = `
      <div class="retro-game-score">Zieh die Blobs hoch und runter — sie singen mit!</div>
      <div class="choir-stage" id="choirStage">
        ${["#E88AA6", "#7EC9E0", "#8FD18A", "#EBC46A"].map((col, i) =>
          `<div class="choir-lane" data-blob="${i}">
             <div class="choir-blob" style="background:${col};">
               <span class="choir-eye"></span><span class="choir-eye right"></span>
               <span class="choir-mouth"></span>
             </div>
           </div>`).join("")}
      </div>
      <div class="choir-controls">
        <button type="button" class="btn btn-sm" id="choirAll">🎶 Alle singen</button>
        <button type="button" class="btn btn-sm" id="choirStop">⏹ Stopp</button>
      </div>
      <p class="hint" style="margin-top:8px;">Halte einen Blob gedrückt und bewege ihn nach oben oder unten. Mehrere gleichzeitig ergeben einen Akkord.</p>`;
    container.appendChild(wrap);

    let audioCtx = null;
    const voices = [null, null, null, null];
    // Pentatonik: klingt in jeder Kombination angenehm, egal was die Kinder treffen
    const scale = [196.00, 220.00, 246.94, 293.66, 329.63, 392.00, 440.00, 493.88, 587.33];
    function ensureCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }
    function startVoice(i, freq) {
      const ctx = ensureCtx();
      stopVoice(i);
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const vibrato = ctx.createOscillator();
      const vibratoGain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      // leichtes Vibrato macht den Ton lebendig statt piepsig
      vibrato.frequency.value = 5.2;
      vibratoGain.gain.value = 3.4;
      vibrato.connect(vibratoGain); vibratoGain.connect(osc.frequency);
      gain.gain.setValueAtTime(0, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.13, ctx.currentTime + 0.08);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); vibrato.start();
      voices[i] = { osc, gain, vibrato };
    }
    function setVoiceFreq(i, freq) {
      if (!voices[i]) return;
      voices[i].osc.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.05);
    }
    function stopVoice(i) {
      const v = voices[i];
      if (!v) return;
      try {
        v.gain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.06);
        v.osc.stop(audioCtx.currentTime + 0.3);
        v.vibrato.stop(audioCtx.currentTime + 0.3);
      } catch (e) { /* Ton lief evtl. schon aus */ }
      voices[i] = null;
    }
    function stopAll() { voices.forEach((_, i) => stopVoice(i)); wrap.querySelectorAll(".choir-blob").forEach(b => b.classList.remove("singing")); }

    wrap.querySelectorAll(".choir-lane").forEach((lane, i) => {
      const blob = lane.querySelector(".choir-blob");
      function updateFromY(clientY) {
        const rect = lane.getBoundingClientRect();
        const rel = Math.max(0, Math.min(1, 1 - (clientY - rect.top) / rect.height));
        const step = Math.round(rel * (scale.length - 1));
        blob.style.bottom = `${8 + rel * (rect.height - 74)}px`;
        return scale[step];
      }
      lane.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        lane.setPointerCapture(e.pointerId);
        startVoice(i, updateFromY(e.clientY));
        blob.classList.add("singing");
      });
      lane.addEventListener("pointermove", (e) => {
        if (!voices[i]) return;
        setVoiceFreq(i, updateFromY(e.clientY));
      });
      ["pointerup", "pointercancel", "pointerleave"].forEach(ev =>
        lane.addEventListener(ev, () => { stopVoice(i); blob.classList.remove("singing"); }));
    });

    // Tonhöhe aus der aktuellen Blob-Position ableiten, statt sie zu überschreiben
    function freqFromBlobPosition(i) {
      const lane = wrap.querySelectorAll(".choir-lane")[i];
      const blob = lane.querySelector(".choir-blob");
      const laneH = lane.getBoundingClientRect().height;
      const bottom = parseFloat(blob.style.bottom || "8");
      const rel = Math.max(0, Math.min(1, (bottom - 8) / Math.max(1, laneH - 74)));
      return scale[Math.round(rel * (scale.length - 1))];
    }
    let allSinging = false;
    const allBtn = wrap.querySelector("#choirAll");
    allBtn.onclick = () => {
      if (allSinging) { stopAll(); allSinging = false; allBtn.textContent = "🎶 Alle singen"; return; }
      ensureCtx();
      voices.forEach((_, i) => {
        startVoice(i, freqFromBlobPosition(i));
        wrap.querySelectorAll(".choir-lane")[i].querySelector(".choir-blob").classList.add("singing");
      });
      allSinging = true;
      allBtn.textContent = "⏸ Pause";
      setupChoirMediaSession();
    };
    // Als Medienwiedergabe anmelden, damit der Ton beim Sperren/Wechseln weiterläuft
    function setupChoirMediaSession() {
      if (!("mediaSession" in navigator)) return;
      try {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: "Singende Blobs", artist: "DApp", album: "Familien-Spielzeug"
        });
        navigator.mediaSession.playbackState = "playing";
        navigator.mediaSession.setActionHandler("pause", () => { stopAll(); allSinging = false; allBtn.textContent = "🎶 Alle singen"; navigator.mediaSession.playbackState = "paused"; });
        navigator.mediaSession.setActionHandler("play", () => allBtn.click());
        navigator.mediaSession.setActionHandler("stop", () => { stopAll(); allSinging = false; allBtn.textContent = "🎶 Alle singen"; });
      } catch (e) { /* nicht überall unterstützt */ }
    }
    wrap.querySelector("#choirStop").onclick = () => {
      stopAll(); allSinging = false; allBtn.textContent = "🎶 Alle singen";
      if ("mediaSession" in navigator) { try { navigator.mediaSession.playbackState = "paused"; } catch (e) {} }
    };

    const observer = new MutationObserver(() => {
      if (!document.body.contains(wrap)) { stopAll(); observer.disconnect(); }
    });
    observer.observe(document.getElementById("viewContainer"), { childList: true, subtree: true });
  }

  function renderBreakoutGame(container) {
    const wrap = document.createElement("div");
    wrap.className = "calendar-card retro-game-wrap";
    wrap.innerHTML = `
      <div class="retro-game-score">Punkte: <strong id="bkScore">0</strong> · Leben: <strong id="bkLives">3</strong></div>
      <canvas id="bkCanvas" width="360" height="420" class="retro-canvas"></canvas>
      <div class="retro-touch-pad"><div class="retro-touch-row"><button data-dir="left">◀</button><button data-dir="right">▶</button></div></div>
      <p class="hint" style="margin-top:8px;">Pfeiltasten oder die Knöpfe. Alle Steine abräumen!</p>`;
    container.appendChild(wrap);
    const canvas = wrap.querySelector("#bkCanvas");
    const ctx = canvas.getContext("2d");
    const W = canvas.width, H = canvas.height;
    const padW = 72, padH = 11;
    let padX = W / 2 - padW / 2, ballX = W / 2, ballY = H - 60, vx = 2.6, vy = -3.4;
    let score = 0, lives = 3, over = false;
    let moveL = false, moveR = false;
    const cols = 7, rows = 5, bw = W / cols, bh = 20;
    const colors = ["#C0453B", "#E08A4A", "#D9A441", "#86B35A", "#3FA796"];
    let bricks = [];
    function resetBricks() {
      bricks = [];
      for (let r = 0; r < rows; r++) for (let col = 0; col < cols; col++) bricks.push({ x: col * bw, y: 40 + r * bh, alive: true, c: colors[r % colors.length] });
    }
    resetBricks();
    function keyDown(e) { if (e.key === "ArrowLeft") moveL = true; if (e.key === "ArrowRight") moveR = true; }
    function keyUp(e) { if (e.key === "ArrowLeft") moveL = false; if (e.key === "ArrowRight") moveR = false; }
    document.addEventListener("keydown", keyDown); document.addEventListener("keyup", keyUp);
    wrap.querySelectorAll("[data-dir]").forEach(btn => {
      btn.addEventListener("pointerdown", (e) => { e.preventDefault(); if (btn.dataset.dir === "left") moveL = true; else moveR = true; });
      ["pointerup", "pointercancel", "pointerleave"].forEach(ev => btn.addEventListener(ev, () => { moveL = false; moveR = false; }));
    });
    canvas.addEventListener("pointermove", (e) => {
      const rect = canvas.getBoundingClientRect();
      padX = Math.max(0, Math.min(W - padW, (e.clientX - rect.left) * (W / rect.width) - padW / 2));
    });
    function paint() {
      ctx.fillStyle = "#14181B"; ctx.fillRect(0, 0, W, H);
      bricks.forEach(b => { if (b.alive) { ctx.fillStyle = b.c; ctx.fillRect(b.x + 1.5, b.y + 1.5, bw - 3, bh - 3); } });
      ctx.fillStyle = "#3FA796"; ctx.fillRect(padX, H - 26, padW, padH);
      ctx.fillStyle = "#E8A33D"; ctx.beginPath(); ctx.arc(ballX, ballY, 6, 0, Math.PI * 2); ctx.fill();
      if (over) {
        ctx.fillStyle = "rgba(0,0,0,.65)"; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = "#fff"; ctx.font = "bold 22px sans-serif"; ctx.textAlign = "center";
        ctx.fillText(bricks.every(b => !b.alive) ? "Geschafft!" : "Game Over", W / 2, H / 2 - 8);
        ctx.font = "14px sans-serif"; ctx.fillText("Tippen für neue Runde", W / 2, H / 2 + 18);
      }
    }
    function tick() {
      if (over) return;
      if (moveL) padX -= 6; if (moveR) padX += 6;
      padX = Math.max(0, Math.min(W - padW, padX));
      ballX += vx; ballY += vy;
      if (ballX < 6 || ballX > W - 6) vx *= -1;
      if (ballY < 6) vy *= -1;
      if (ballY > H - 32 && ballY < H - 20 && ballX > padX && ballX < padX + padW) {
        vy = -Math.abs(vy);
        vx += ((ballX - (padX + padW / 2)) / (padW / 2)) * 1.4;
      }
      bricks.forEach(b => {
        if (!b.alive) return;
        if (ballX > b.x && ballX < b.x + bw && ballY > b.y && ballY < b.y + bh) {
          b.alive = false; vy *= -1; score += 10;
          wrap.querySelector("#bkScore").textContent = score;
        }
      });
      if (bricks.every(b => !b.alive)) { over = true; submitScore("breakout", score); render(); return; }
      if (ballY > H) {
        lives--; wrap.querySelector("#bkLives").textContent = Math.max(0, lives);
        if (lives <= 0) { over = true; submitScore("breakout", score); render(); return; }
        ballX = W / 2; ballY = H - 60; vx = 2.6; vy = -3.4;
      }
      paint();
    }
    canvas.addEventListener("pointerdown", () => {
      if (!over) return;
      score = 0; lives = 3; over = false; resetBricks();
      wrap.querySelector("#bkScore").textContent = "0"; wrap.querySelector("#bkLives").textContent = "3";
      ballX = W / 2; ballY = H - 60; vx = 2.6; vy = -3.4;
    });
    const observer = new MutationObserver(() => {
      if (!document.body.contains(canvas)) {
        document.removeEventListener("keydown", keyDown); document.removeEventListener("keyup", keyUp);
        observer.disconnect();
      }
    });
    observer.observe(document.getElementById("viewContainer"), { childList: true, subtree: true });
    paint();
    retroGameHandle = setInterval(tick, 18);
    renderHighscoreList(container, "breakout", false, "");
  }

    canvas.addEventListener("pointerdown", () => {

    observer.observe(document.getElementById("viewContainer"), { childList: true, subtree: true });

  function render2048Game(container) {
    const wrap = document.createElement("div");
    wrap.className = "calendar-card retro-game-wrap";
    wrap.innerHTML = `
      <div class="retro-game-score">Punkte: <strong id="g2Score">0</strong></div>
      <div id="g2Grid" class="g2-grid"></div>
      <div class="retro-touch-pad">
        <button data-dir="up">▲</button>
        <div class="retro-touch-row"><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div>
      </div>
      <p class="hint" style="margin-top:8px;">Wischen, Pfeiltasten oder Knöpfe — gleiche Zahlen verschmelzen.</p>`;
    container.appendChild(wrap);
    const gridEl = wrap.querySelector("#g2Grid");
    let board = Array.from({ length: 4 }, () => Array(4).fill(0));
    let score = 0, done = false;
    const TILE_COLORS = { 2: "#EDE4D4", 4: "#E8D8B8", 8: "#E8A33D", 16: "#E08A4A", 32: "#D9744A", 64: "#C0453B", 128: "#86B35A", 256: "#3FA796", 512: "#3A5A9B", 1024: "#7E57C2", 2048: "#C9A24B" };
    function addTile() {
      const free = [];
      board.forEach((row, r) => row.forEach((v, col) => { if (!v) free.push([r, col]); }));
      if (!free.length) return;
      const [r, col] = free[Math.floor(Math.random() * free.length)];
      board[r][col] = Math.random() < 0.9 ? 2 : 4;
    }
    function paint() {
      gridEl.innerHTML = board.flat().map(v => `<div class="g2-tile${v ? "" : " empty"}" style="${v ? `background:${TILE_COLORS[v] || "#8B2E28"};color:${v > 4 ? "#fff" : "#3E2A2E"};` : ""}">${v || ""}</div>`).join("");
      wrap.querySelector("#g2Score").textContent = score;
    }
    function slide(row) {
      const vals = row.filter(v => v);
      for (let i = 0; i < vals.length - 1; i++) {
        if (vals[i] === vals[i + 1]) { vals[i] *= 2; score += vals[i]; vals.splice(i + 1, 1); }
      }
      while (vals.length < 4) vals.push(0);
      return vals;
    }
    function move(dir) {
      if (done) return;
      const before = JSON.stringify(board);
      if (dir === "left") board = board.map(r => slide(r));
      else if (dir === "right") board = board.map(r => slide(r.slice().reverse()).reverse());
      else {
        for (let col = 0; col < 4; col++) {
          let column = [board[0][col], board[1][col], board[2][col], board[3][col]];
          if (dir === "down") column.reverse();
          column = slide(column);
          if (dir === "down") column.reverse();
          for (let r = 0; r < 4; r++) board[r][col] = column[r];
        }
      }
      if (JSON.stringify(board) !== before) { addTile(); paint(); }
      const full = board.flat().every(v => v);
      if (full) {
        let canMove = false;
        for (let r = 0; r < 4; r++) for (let col = 0; col < 4; col++) {
          if (col < 3 && board[r][col] === board[r][col + 1]) canMove = true;
          if (r < 3 && board[r][col] === board[r + 1][col]) canMove = true;
        }
        if (!canMove) { done = true; submitScore("2048", score); showToast(`Vorbei — ${score} Punkte!`); render(); }
      }
    }
    function keyHandler(e) {
      const map = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down" };
      if (map[e.key]) { e.preventDefault(); move(map[e.key]); }
    }
    document.addEventListener("keydown", keyHandler);
    wrap.querySelectorAll("[data-dir]").forEach(btn => {
      btn.addEventListener("pointerdown", (e) => { e.preventDefault(); move(btn.dataset.dir); });
    });
    makeSwipeable(gridEl, () => move("left"), () => move("right"));
    let sy = 0;
    gridEl.addEventListener("touchstart", (e) => { sy = e.touches[0].clientY; }, { passive: true });
    gridEl.addEventListener("touchend", (e) => {
      const dy = e.changedTouches[0].clientY - sy;
      if (Math.abs(dy) > 50) move(dy > 0 ? "down" : "up");
    }, { passive: true });
    const observer = new MutationObserver(() => {
      if (!document.body.contains(gridEl)) { document.removeEventListener("keydown", keyHandler); observer.disconnect(); }
    });
    observer.observe(document.getElementById("viewContainer"), { childList: true, subtree: true });
    addTile(); addTile(); paint();
    renderHighscoreList(container, "2048", false, "");
  }

  function renderMemoryGame(container) {
    const wrap = document.createElement("div");
    wrap.className = "calendar-card retro-game-wrap";
    const emojis = ["🍎", "🚀", "⭐", "🎈", "🐶", "🌈", "⚽", "🎵"];
    const cards = [...emojis, ...emojis].sort(() => Math.random() - 0.5);
    let flipped = [];
    let matched = new Set();
    let moves = 0;
    wrap.innerHTML = `<div class="retro-game-score">Züge: <strong id="memMoves">0</strong></div><div class="retro-memory-grid" id="memGrid"></div>`;
    container.appendChild(wrap);
    const grid = wrap.querySelector("#memGrid");
    function paint() {
      grid.innerHTML = cards.map((c, i) => `<button type="button" class="retro-memory-card ${flipped.includes(i) || matched.has(i) ? "flipped" : ""}" data-idx="${i}">${flipped.includes(i) || matched.has(i) ? c : "❓"}</button>`).join("");
      grid.querySelectorAll("[data-idx]").forEach(btn => {
        btn.onclick = () => {
          const i = Number(btn.dataset.idx);
          if (flipped.length >= 2 || flipped.includes(i) || matched.has(i)) return;
          flipped.push(i);
          if (flipped.length === 2) {
            moves++; wrap.querySelector("#memMoves").textContent = moves;
            if (cards[flipped[0]] === cards[flipped[1]]) {
              matched.add(flipped[0]); matched.add(flipped[1]);
              flipped = []; paint();
              if (matched.size === cards.length) { submitScore("memory", moves, true); setTimeout(() => { showToast(`🎉 Geschafft in ${moves} Zügen!`); render(); }, 200); }
            } else {
              paint();
              setTimeout(() => { flipped = []; paint(); }, 700);
            }
          } else { paint(); }
        };
      });
    }
    paint();
    renderHighscoreList(container, "memory", true, " Züge");
  }

  // Zahlungen der Eltern (Taschengeld, Zeugnisgeld) ins Haushaltsbuch übernehmen.
  // Sie landen dort als einmalige Kosten unter "Kinder & Schule".
  function bookToBudget(label, amount, category) {
    if (!amount || amount <= 0) return;
    state.budget = state.budget || { income: [], costs: [], loans: [] };
    state.budget.costs.push({
      id: uid(), name: label, category: category || "👶 Kinder & Schule",
      amount: Math.abs(amount), frequency: "once", updatedAt: Date.now()
    });
    saveState();
  }
  function fmtEuro(n) {
    return n.toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
  }
  function requestAllowanceAction(profileId, type, amount, note) {
    state.allowanceRequests.push({
      id: uid(), profileId, type, amount, note: note || "", status: "pending",
      createdAt: Date.now(), updatedAt: Date.now()
    });
    saveState();
  }
  function resolveAllowanceRequest(reqId, approve) {
    const req = state.allowanceRequests.find(r => r.id === reqId);
    if (!req) return;
    req.status = approve ? "approved" : "denied";
    req.updatedAt = Date.now();
    if (approve) {
      if (req.type === "payout") {
        allowanceAdd(req.profileId, -Math.abs(req.amount), "Auszahlung (angefragt): " + (req.note || ""));
        const kidName = (getProfile(req.profileId) || {}).name || "Kind";
        if (confirm("Auszahlung ins Haushaltsbuch übernehmen?")) {
          bookToBudget(`Taschengeld ${kidName}${req.note ? " – " + req.note : ""}`, Math.abs(req.amount));
        }
      } else if (req.type === "convert") {
        const pts = pointsBalance(req.profileId);
        const usePts = Math.min(pts, req.amount);
        if (usePts > 0) {
          ledgerAdd(req.profileId, -usePts, "In Taschengeld umgewandelt");
          allowanceAdd(req.profileId, +(usePts * state.pointsToMoneyRate).toFixed(2), `${usePts} Punkte umgewandelt (angefragt)`);
        }
      }
    }
    saveState();
  }
  function poolBalance(poolId) {
    return state.poolLedger.filter(l => l.poolId === poolId).reduce((sum, l) => sum + l.amount, 0);
  }
  function poolContributionBy(poolId, profileId) {
    return state.poolLedger.filter(l => l.poolId === poolId && l.profileId === profileId).reduce((sum, l) => sum + l.amount, 0);
  }
