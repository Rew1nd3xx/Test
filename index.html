<script>
/* ============================================================
   IDEENBUCH — App-Logik (vanilla JS, keine Frameworks)
   ============================================================ */
(function () {
  "use strict";

  const STORAGE_KEY = "ideabook_state_v1";
  const APP_BUILD_NUMBER = 53;
  const APP_BUILD_DATE = "2026-07-26";

  const THEMES = [
    { id: "papier",     name: "Papierblock",     sub: "Warmes Notizbuch",  dots: ["#5F7038", "#2F4858", "#EAE2CE"] },
    { id: "mitternacht",name: "Mitternacht",     sub: "Tief & golden",     dots: ["#C9A24B", "#3F9C99", "#10142A"] },
    { id: "skizze",     name: "Skizzenblock",    sub: "Karopapier",        dots: ["#3A5A9B", "#C0453B", "#E7ECF2"] },
    { id: "bauhaus",    name: "Bauhaus",         sub: "Geometrisch",       dots: ["#D0263B", "#1D4E9B", "#F2EFE6"] },
    { id: "wald",       name: "Wald",            sub: "Tiefgrün & Moos",   dots: ["#86B35A", "#D9A441", "#172A20"] },
    { id: "ozean",      name: "Ozean",           sub: "Ruhig & weit",      dots: ["#FF9270", "#F2D6A2", "#0E3B43"] },
    { id: "rose",       name: "Rosé",            sub: "Sanft & editorial", dots: ["#C6577B", "#B8925A", "#F6E9EE"] },
    { id: "industrial", name: "Industrial",      sub: "Beton & Signalorange", dots: ["#E8590C", "#4A6572", "#DEDBD2"] },
    { id: "aurora",     name: "Aurora",          sub: "Verträumtes Farbspiel", dots: ["#B15CDE", "#35D0BA", "#150B26"] },
    { id: "neon",       name: "Neon",            sub: "Cyberpunk-Glow ✨",   dots: ["#FF2E88", "#00E5FF", "#0A0912"] },
    { id: "stardust",   name: "Sternenstaub",    sub: "Magisches Glühen ✨", dots: ["#9C7FFF", "#FFD86B", "#0D0B1F"] },
    { id: "blockwelt",  name: "Blockwelt",       sub: "Pixelig & abenteuerlich ⛏️", dots: ["#4CAF32", "#8B5A2B", "#3E8E2E"] },
    { id: "bausteine",  name: "Bausteine",       sub: "Bunt & verspielt 🧱", dots: ["#D6001C", "#0057A6", "#F5F1E6"] },
    { id: "obsidian",   name: "Obsidian",        sub: "Exklusiv & gedämpft ♟️", dots: ["#C9A24B", "#7A6E5C", "#0B0B0A"] },
    { id: "militaer",   name: "Militär",         sub: "Camouflage & Stencil 🎖️", dots: ["#B8A369", "#A63A2C", "#2B2E1F"] },
    { id: "vaultterm",  name: "Vault-Terminal",  sub: "Retro-Röhrenbildschirm 📻", dots: ["#4CFF4C", "#FFB000", "#060A06"] },
    { id: "atombunker", name: "Atombunker",      sub: "1950er Atomzeitalter ☢️", dots: ["#C4442E", "#2E8B84", "#EFE3C4"] },
  ];

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  function defaultState() {
    return {
      theme: "papier",
      items: [],
      mindmaps: [],
      activeMindmapId: null,
      meta: { lastModified: Date.now() },
      profiles: [],
      activeProfileId: null,
      tasks: [],
      rewards: [],
      pointsLedger: [],
      events: [],
      shoppingList: [],
      custodySchedules: [],
      adminPasswordHash: "",
      mealPlan: {},
      wishlist: [],
      schoolHolidays: {},
      federalState: "",
      weatherLocation: { name: "", lat: null, lon: null },
      sharedAreas: { parent: { pinHash: "" }, child: { pinHash: "" } },
      checklistTemplates: [],
      militaryTemplatesEnabled: false,
      connectors: {
        sharepoint: { siteUrl: "", library: "" },
        ftp: { host: "", port: "", user: "", path: "" },
        network: { url: "", authHeaderName: "Authorization", authHeader: "", method: "PUT", autoSync: false, intervalMinutes: 5, lastSyncAt: 0 }
      }
    };
  }

  const PROFILE_COLORS = ["#5F7038", "#C9A24B", "#3A5A9B", "#C0453B", "#86B35A", "#FF9270", "#C6577B", "#4A6572", "#B15CDE", "#35D0BA"];
  const PROFILE_EMOJI = ["🦊", "🐨", "🐸", "🐝", "🦉", "🐙", "🦄", "🐳", "🐧", "🦁", "🐼", "🐬"];

  function loadState() {
    const base = defaultState();
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        const result = {
          ...base, ...parsed,
          meta: { ...base.meta, ...(parsed.meta || {}) },
          connectors: {
            sharepoint: { ...base.connectors.sharepoint, ...((parsed.connectors || {}).sharepoint || {}) },
            ftp: { ...base.connectors.ftp, ...((parsed.connectors || {}).ftp || {}) },
            network: { ...base.connectors.network, ...((parsed.connectors || {}).network || {}) }
          }
        };
        // Migration: alte Einzel-Mindmap (state.mindmap) → neue Sammlung state.mindmaps
        if (parsed.mindmap && parsed.mindmap.nodes && parsed.mindmap.nodes.length && (!parsed.mindmaps || !parsed.mindmaps.length)) {
          const migrated = {
            id: uid(), name: "Ideen", nodes: parsed.mindmap.nodes, private: !!parsed.mindmap.private,
            createdAt: Date.now(), updatedAt: Date.now()
          };
          result.mindmaps = [migrated];
          result.activeMindmapId = migrated.id;
        }
        if (!result.mindmaps) result.mindmaps = [];
        return result;
      }
    } catch (e) { console.warn("Konnte gespeicherten Zustand nicht laden:", e); }
    return base;
  }

  function saveState(opts) {
    const isRealChange = !opts || !opts.skipTouch;
    if (isRealChange) {
      state.meta = state.meta || {};
      state.meta.lastModified = Date.now();
    }
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      showToast("Speichern fehlgeschlagen — evtl. ist der Speicher voll (große Bilder?)");
    }
    if (isRealChange && state.connectors && state.connectors.network.autoSync && state.connectors.network.url) {
      clearTimeout(autoPushDebounce);
      autoPushDebounce = setTimeout(() => { pushToNetwork(true); }, 4000);
    }
  }

  let state = loadState();
  const LAST_VIEW_KEY = "dapp_last_view_v1";
  const VALID_VIEWS = ["home", "notes", "checklists", "images", "mindmap", "tags", "tasks", "calendar", "shopping", "mealplan", "admin", "settings"];
  let currentView = (() => {
    try {
      const saved = localStorage.getItem(LAST_VIEW_KEY);
      return VALID_VIEWS.includes(saved) ? saved : "home";
    } catch (e) { return "home"; }
  })();
  let searchQuery = "";
  let personalAreaUnlockedFor = null;
  let personalAreaViewingProfileId = null;
  let weatherCache = { data: null, fetchedAt: 0 };
  let kpCache = { data: null, fetchedAt: 0 };
  let tickerInterval = null;
  let autoPushDebounce = null;
  let activeTagFilter = null;
  let mmSelectedNode = null;
  let exportScope = "all";

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(() => t.classList.remove("show"), 2600);
  }

  function escapeHtml(str) {
    return String(str || "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function mdToHtml(text) {
    // Leichtgewichtige, sichere Markdown-Formatierung: erst escapen, dann Muster ersetzen.
    const lines = escapeHtml(text || "").split("\n");
    let html = ""; let inUl = false; let inOl = false;
    function closeLists() {
      if (inUl) { html += "</ul>"; inUl = false; }
      if (inOl) { html += "</ol>"; inOl = false; }
    }
    lines.forEach((line) => {
      const heading = line.match(/^##\s+(.*)/);
      const bullet = line.match(/^[-*]\s+(.*)/);
      const numbered = line.match(/^\d+\.\s+(.*)/);
      let inline = (s) => s
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/==(.+?)==/g, "<mark>$1</mark>")
        .replace(/~~(.+?)~~/g, "<del>$1</del>")
        .replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, "<em>$1</em>")
        .replace(/`(.+?)`/g, "<code>$1</code>");
      if (heading) { closeLists(); html += `<h4>${inline(heading[1])}</h4>`; }
      else if (bullet) { if (!inUl) { closeLists(); html += "<ul>"; inUl = true; } html += `<li>${inline(bullet[1])}</li>`; }
      else if (numbered) { if (!inOl) { closeLists(); html += "<ol>"; inOl = true; } html += `<li>${inline(numbered[1])}</li>`; }
      else if (line.trim() === "") { closeLists(); html += "<br>"; }
      else { closeLists(); html += `<p>${inline(line)}</p>`; }
    });
    closeLists();
    return html;
  }

  function wrapSelection(textarea, before, after) {
    const s = textarea.selectionStart, e = textarea.selectionEnd;
    const val = textarea.value;
    const selected = val.slice(s, e) || "Text";
    textarea.value = val.slice(0, s) + before + selected + (after || before) + val.slice(e);
    textarea.focus();
    textarea.selectionStart = s + before.length;
    textarea.selectionEnd = s + before.length + selected.length;
  }

  function prefixLines(textarea, prefix) {
    const s = textarea.selectionStart, e = textarea.selectionEnd;
    const val = textarea.value;
    const lineStart = val.lastIndexOf("\n", s - 1) + 1;
    let lineEnd = val.indexOf("\n", e);
    if (lineEnd === -1) lineEnd = val.length;
    const block = val.slice(lineStart, lineEnd);
    const prefixed = block.split("\n").map(l => l.startsWith(prefix) ? l : prefix + l).join("\n");
    textarea.value = val.slice(0, lineStart) + prefixed + val.slice(lineEnd);
    textarea.focus();
  }

  function fmtDate(ts) {
    if (!ts) return "";
    const d = new Date(ts);
    return d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" }) +
           " " + d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  }

  function allTags() {
    const map = new Map();
    state.items.filter(canSeeItemDetails).forEach(it => (it.tags || []).forEach(t => map.set(t, (map.get(t) || 0) + 1)));
    return map;
  }

  function itemMatchesSearch(it) {
    if (activeTagFilter && !(it.tags || []).includes(activeTagFilter)) return false;
    if (!searchQuery) return true;
    const q = searchQuery.toLowerCase();
    const hay = [it.title, it.body, it.caption, ...(it.tags || []),
      ...((it.items || []).map(c => c.text))].filter(Boolean).join(" ").toLowerCase();
    return hay.includes(q);
  }

  /* ============ PROFILE (FAMILIE) ============ */
  function getProfile(id) { return state.profiles.find(p => p.id === id) || null; }
  function getActiveProfile() { return getProfile(state.activeProfileId); }

  function pointsBalance(profileId) {
    return state.pointsLedger.filter(l => l.profileId === profileId).reduce((sum, l) => sum + l.delta, 0);
  }

  function renderProfileBar() {
    const bar = document.getElementById("profileBar");
    bar.innerHTML = "";
    state.profiles.forEach(p => {
      const av = document.createElement("div");
      av.className = "avatar" + (state.activeProfileId === p.id ? " active" : "");
      av.style.background = p.color;
      av.textContent = p.emoji || p.name.charAt(0).toUpperCase();
      av.title = p.name + (p.role === "child" ? ` — ${pointsBalance(p.id)} Punkte` : "");
      av.onclick = () => {
        if (state.activeProfileId !== p.id) { personalAreaUnlockedFor = null; personalAreaViewingProfileId = null; }
        state.activeProfileId = p.id; saveState(); renderProfileBar(); render();
      };
      av.ondblclick = () => openProfileEditor(p.id);
      bar.appendChild(av);
    });
    const addBtn = document.createElement("button");
    addBtn.className = "avatar-add";
    addBtn.title = "Profil hinzufügen";
    addBtn.textContent = "+";
    addBtn.onclick = () => openProfileEditor();
    bar.appendChild(addBtn);

    let hint = document.getElementById("profileBarHint");
    if (!hint) {
      hint = document.createElement("div");
      hint.id = "profileBarHint";
      hint.className = "profile-empty-hint";
      bar.parentElement.insertBefore(hint, bar.nextSibling);
    }
    hint.textContent = state.profiles.length
      ? "Klicken zum Wechseln, doppelklicken zum Bearbeiten."
      : "Noch keine Profile — legt eins für jedes Familienmitglied an.";
  }

  function openProfileEditor(id) {
    const existing = id ? getProfile(id) : null;
    const draft = existing ? { ...existing } : {
      id: uid(), name: "", color: PROFILE_COLORS[state.profiles.length % PROFILE_COLORS.length],
      emoji: PROFILE_EMOJI[state.profiles.length % PROFILE_EMOJI.length], role: "child", pinHash: ""
    };
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML = `
      <div class="modal" style="max-width:420px;">
        <div class="modal-header"><h2>${existing ? "Profil bearbeiten" : "Neues Profil"}</h2><button class="close-btn" id="closeModal">✕</button></div>
        <div class="field"><label>Name</label><input type="text" id="p-name" value="${escapeHtml(draft.name)}" placeholder="z. B. Mia"></div>
        <div class="field"><label>Rolle</label>
          <select id="p-role">
            <option value="child" ${draft.role === "child" ? "selected" : ""}>Kind</option>
            <option value="parent" ${draft.role === "parent" ? "selected" : ""}>Elternteil</option>
          </select>
        </div>
        <div class="field"><label>Symbol</label>
          <div id="p-emoji-picker" style="display:flex;flex-wrap:wrap;gap:6px;">
            ${PROFILE_EMOJI.map(e => `<button type="button" class="btn btn-sm emoji-opt" data-emoji="${e}" style="${e === draft.emoji ? "outline:2px solid var(--accent);" : ""}">${e}</button>`).join("")}
          </div>
        </div>
        <div class="field"><label>Farbe</label>
          <div id="p-color-picker" style="display:flex;flex-wrap:wrap;gap:8px;">
            ${PROFILE_COLORS.map(c => `<button type="button" class="color-opt" data-color="${c}" style="width:28px;height:28px;border-radius:50%;background:${c};border:2px solid ${c === draft.color ? "var(--text)" : "transparent"};"></button>`).join("")}
          </div>
        </div>
        <div class="modal-footer">
          <div>${existing ? `<button class="btn btn-danger" id="deleteProfileBtn">Profil löschen</button>` : ""}</div>
          <div class="modal-footer-right">
            <button class="btn btn-ghost" id="cancelBtn">Abbrechen</button>
            <button class="btn btn-accent" id="saveProfileBtn">Speichern</button>
          </div>
        </div>
      </div>`;
    document.body.appendChild(overlay);

    overlay.querySelectorAll(".emoji-opt").forEach(b => b.onclick = () => {
      draft.emoji = b.dataset.emoji;
      overlay.querySelectorAll(".emoji-opt").forEach(x => x.style.outline = "");
      b.style.outline = "2px solid var(--accent)";
    });
    overlay.querySelectorAll(".color-opt").forEach(b => b.onclick = () => {
      draft.color = b.dataset.color;
      overlay.querySelectorAll(".color-opt").forEach(x => x.style.borderColor = "transparent");
      b.style.borderColor = "var(--text)";
    });

    function close() { overlay.remove(); }
    overlay.querySelector("#closeModal").onclick = close;
    overlay.querySelector("#cancelBtn").onclick = close;
    overlay.onclick = (e) => { if (e.target === overlay) close(); };

    if (existing) {
      overlay.querySelector("#deleteProfileBtn").onclick = () => {
        if (confirm(`Profil „${existing.name}" wirklich löschen? Zugewiesene Aufgaben/Termine bleiben erhalten, aber ohne Zuordnung.`)) {
          state.profiles = state.profiles.filter(p => p.id !== existing.id);
          if (state.activeProfileId === existing.id) state.activeProfileId = (state.profiles[0] || {}).id || null;
          saveState(); close(); renderProfileBar(); render();
        }
      };
    }
    overlay.querySelector("#saveProfileBtn").onclick = () => {
      draft.name = overlay.querySelector("#p-name").value.trim() || "Familie";
      draft.role = overlay.querySelector("#p-role").value;
      const idx = state.profiles.findIndex(p => p.id === draft.id);
      if (idx >= 0) state.profiles[idx] = draft; else state.profiles.push(draft);
      if (!state.activeProfileId) state.activeProfileId = draft.id;
      saveState(); close(); renderProfileBar(); render();
      showToast(existing ? "Profil aktualisiert." : `Willkommen, ${draft.name}!`);
    };
    setTimeout(() => overlay.querySelector("#p-name").focus(), 30);
  }

  /* ============ VIEW ROUTING ============ */
  function setView(view) {
    currentView = view;
    try { localStorage.setItem(LAST_VIEW_KEY, view); } catch (e) { /* Speicher evtl. voll — kein Problem, dann startet die App eben auf Home */ }
    document.querySelectorAll(".nav-item[data-view]").forEach(b => {
      b.classList.toggle("active", b.dataset.view === view);
    });
    document.getElementById("sidebar").classList.remove("open");
    render();
  }

  function render() {
    const c = document.getElementById("viewContainer");
    c.innerHTML = "";
    if (currentView === "home") return renderHomeView(c);
    if (currentView === "notes") return renderListView(c, "note", "Notizen", "Fang eine Idee ein, bevor sie verfliegt.", "📝");
    if (currentView === "checklists") return renderListView(c, "checklist", "Checklisten", "Schritte, Aufgaben, To-dos für deine Ideen.", "☑️");
    if (currentView === "images") return renderListView(c, "image", "Bilder", "Skizzen, Referenzen, Screenshots.", "🖼️");
    if (currentView === "tags") return renderTagsView(c);
    if (currentView === "mindmap") return renderMindmapView(c);
    if (currentView === "tasks") return renderTasksView(c);
    if (currentView === "calendar") return renderCalendarView(c);
    if (currentView === "shopping") return renderShoppingView(c);
    if (currentView === "mealplan") return renderMealPlanView(c);
    if (currentView === "settings") return renderSettingsView(c);
    if (currentView === "admin") return renderAdminView(c);
  }

  /* ============ HOME (DASHBOARD) ============ */
  const WMO_WEATHER = {
    0: { icon: "☀️", label: "Klar" }, 1: { icon: "🌤️", label: "Meist klar" }, 2: { icon: "⛅", label: "Wolkig" }, 3: { icon: "☁️", label: "Bedeckt" },
    45: { icon: "🌫️", label: "Nebel" }, 48: { icon: "🌫️", label: "Reifnebel" },
    51: { icon: "🌦️", label: "Nieselregen" }, 53: { icon: "🌦️", label: "Nieselregen" }, 55: { icon: "🌧️", label: "Nieselregen" },
    61: { icon: "🌧️", label: "Regen" }, 63: { icon: "🌧️", label: "Regen" }, 65: { icon: "🌧️", label: "Starkregen" },
    71: { icon: "🌨️", label: "Schnee" }, 73: { icon: "🌨️", label: "Schnee" }, 75: { icon: "❄️", label: "Starker Schnee" },
    80: { icon: "🌦️", label: "Schauer" }, 81: { icon: "🌧️", label: "Schauer" }, 82: { icon: "⛈️", label: "Heftige Schauer" },
    95: { icon: "⛈️", label: "Gewitter" }, 96: { icon: "⛈️", label: "Gewitter mit Hagel" }, 99: { icon: "⛈️", label: "Gewitter mit Hagel" }
  };
  function weatherInfo(code) { return WMO_WEATHER[code] || { icon: "🌡️", label: "" }; }

  let warnCache = { data: null, fetchedAt: 0, error: "" };
  const DWD_WARN_LEVELS = { 1: "Wetterinfo", 2: "Wetterwarnung", 3: "Markante Wetterwarnung", 4: "Unwetterwarnung" };
  async function updateWarnWidget() {
    const el = document.getElementById("warnWidgetBody");
    if (!el) return;
    const fresh = Date.now() - warnCache.fetchedAt < 15 * 60 * 1000;
    if (!fresh) {
      try {
        const res = await fetch("https://www.dwd.de/DWD/warnungen/warnapp/json/warnings.json");
        const raw = await res.text();
        const jsonText = raw.replace(/^\s*warnWetter\.loadWarnings\(/, "").replace(/\);\s*$/, "");
        const parsed = JSON.parse(jsonText);
        const all = Object.values(parsed.warnings || {}).flat();
        warnCache = { data: all, fetchedAt: Date.now(), error: "" };
      } catch (err) {
        warnCache = { data: null, fetchedAt: Date.now(), error: "Warnungen konnten nicht geladen werden (evtl. CORS/Netzwerk)." };
        console.warn("DWD-Warnungen-Abruf fehlgeschlagen:", err);
      }
    }
    const stateName = (GERMAN_STATES.find(s => s.code === state.federalState) || {}).name;
    if (!stateName) {
      el.innerHTML = `<div class="widget-empty">Bundesland in den Einstellungen wählen für Wetterwarnungen.</div>`;
      return;
    }
    if (warnCache.error) {
      el.innerHTML = `<div class="widget-empty">${escapeHtml(warnCache.error)}</div>`;
      return;
    }
    const relevant = (warnCache.data || []).filter(w => w.state === stateName);
    if (!relevant.length) {
      el.innerHTML = `<div class="widget-empty">✅ Keine aktuellen Warnungen für ${escapeHtml(stateName)}.</div>`;
      return;
    }
    relevant.sort((a, b) => b.level - a.level);
    el.innerHTML = relevant.slice(0, 3).map(w => `
      <div class="today-sub-stat" style="border-left:3px solid ${w.level >= 3 ? "#C0453B" : "#D9A441"};padding-left:8px;">
        <strong>${w.level >= 3 ? "🔴" : "🟡"} ${escapeHtml(DWD_WARN_LEVELS[w.level] || "Warnung")}</strong><br>
        <span style="font-size:11.5px;">${escapeHtml(w.regionName || "")}: ${escapeHtml((w.headline || "").replace(/^Amtliche /, ""))}</span>
      </div>
    `).join("");
  }

  // Grobe Faustformel: ab welchem Kp-Wert Polarlicht bei einem bestimmten Breitengrad
  // grundsätzlich sichtbar werden kann (je weiter südlich, desto höherer Kp nötig).
  function kpNeededForLatitude(lat) {
    const absLat = Math.abs(lat);
    return Math.max(1, Math.min(9, Math.round((65 - absLat) / 3)));
  }

  async function updateKpWidget() {
    const el = document.getElementById("kpWidgetBody");
    if (!el) return;
    const fresh = Date.now() - kpCache.fetchedAt < 30 * 60 * 1000;
    if (!fresh) {
      try {
        const res = await fetch("https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json");
        const rows = await res.json();
        kpCache = { data: rows[rows.length - 1], fetchedAt: Date.now() };
      } catch (err) { console.warn("Kp-Index-Abruf fehlgeschlagen:", err); }
    }
    if (kpCache.data) {
      const kp = Math.round(kpCache.data.Kp);
      const loc = state.weatherLocation;
      const needed = loc && loc.lat ? kpNeededForLatitude(loc.lat) : null;
      let chance = "";
      if (needed !== null) {
        if (kp >= needed + 2) chance = "🟢 Gute Chance heute Nacht!";
        else if (kp >= needed) chance = "🟡 Möglich, wenn's dunkel & klar ist";
        else if (kp >= needed - 2) chance = "🟠 Eher unwahrscheinlich";
        else chance = "⚪ Aktuell sehr unwahrscheinlich";
      }
      el.innerHTML = `
        <div style="display:flex;align-items:center;gap:12px;">
          <span style="font-size:34px;">🌌</span>
          <div><div class="widget-big-stat">Kp ${kp}</div><div style="font-size:12px;color:var(--text-muted);">${loc && loc.name ? "für " + escapeHtml(loc.name) : "Planetarer Index"}</div></div>
        </div>
        ${chance ? `<div style="font-size:12px;color:var(--text-muted);margin-top:4px;">${chance}</div>` : `<div style="font-size:11px;color:var(--text-muted);margin-top:4px;">Ort in den Einstellungen hinterlegen für eine Einschätzung.</div>`}
      `;
    }
  }

  async function updateWeatherWidget() {
    const loc = state.weatherLocation;
    const el = document.getElementById("weatherWidgetBody");
    if (!loc || !loc.lat) return;
    const fresh = Date.now() - weatherCache.fetchedAt < 30 * 60 * 1000;
    if (!fresh) {
      try {
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&current_weather=true&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=auto`);
        const data = await res.json();
        weatherCache = { data, fetchedAt: Date.now() };
      } catch (err) { console.warn("Wetter-Abruf fehlgeschlagen:", err); }
    }
    if (el && weatherCache.data) {
      const cw = weatherCache.data.current_weather;
      const info = weatherInfo(cw.weathercode);
      const tMax = Math.round(weatherCache.data.daily.temperature_2m_max[0]);
      const tMin = Math.round(weatherCache.data.daily.temperature_2m_min[0]);
      el.innerHTML = `
        <div style="display:flex;align-items:center;gap:12px;">
          <span style="font-size:34px;">${info.icon}</span>
          <div><div class="widget-big-stat">${Math.round(cw.temperature)}°</div><div style="font-size:12px;color:var(--text-muted);">${info.label} · ${loc.name}</div></div>
        </div>
        <div style="font-size:12px;color:var(--text-muted);margin-top:4px;">Heute: ${tMin}° / ${tMax}°</div>`;
    }
  }

  function renderHomeView(container) {
    const todayStr = new Date().toISOString().slice(0, 10);
    const activeProfile = getActiveProfile();

    const grid = document.createElement("div");
    grid.className = "widget-grid";
    container.appendChild(grid);

    function widget(icon, title, accentVar, bodyHtml, linkView, linkLabel) {
      const card = document.createElement("div");
      card.className = "widget-card";
      card.style.setProperty("--widget-accent", accentVar);
      card.innerHTML = `
        <div class="widget-head"><h3>${icon} ${title}</h3>${linkView ? `<span class="widget-link" data-goto="${linkView}" style="cursor:pointer;">${linkLabel || "Öffnen ›"}</span>` : ""}</div>
        <div class="widget-body">${bodyHtml}</div>
      `;
      const link = card.querySelector("[data-goto]");
      if (link) link.onclick = () => setView(link.dataset.goto);
      grid.appendChild(card);
      return card;
    }

    // --- Dashboard-Kachel: Begrüßung + Name + Datum, zusammen mit Wetter, Ferien & Betreuung ---
    const hour = new Date().getHours();
    const salutation = hour < 11 ? "Guten Morgen" : hour < 18 ? "Hallo" : "Guten Abend";
    const ferienStatus = getFerienStatus();
    const hasWeather = !!state.weatherLocation.lat;
    const hasFerien = !!state.federalState;
    const hasCustody = state.custodySchedules.length > 0;
    {
      const weatherPart = hasWeather
        ? `<div id="weatherWidgetBody">${weatherCache.data ? "" : `<div class="widget-empty">Lade Wetter …</div>`}</div>`
        : "";
      const ferienPart = hasFerien
        ? (ferienStatus
            ? `<div class="today-sub-stat">${ferienStatus.type === "current"
                ? `🎉 Ferien! Noch ${ferienStatus.days} Tag${ferienStatus.days === 1 ? "" : "e"} (${escapeHtml(ferienStatus.name)})`
                : `🏖️ Noch ${ferienStatus.days} Tag${ferienStatus.days === 1 ? "" : "e"} bis ${escapeHtml(ferienStatus.name)}`}</div>`
            : `<div class="today-sub-stat widget-empty" style="padding:0;">Noch keine Ferientermine geladen.</div>`)
        : "";
      let custodyPart = "";
      if (hasCustody) {
        const rows = state.custodySchedules.map(s => {
          const res = custodyResultForDate(s, todayStr);
          if (!res) return "";
          const parents = (res.block.profileIds || []).map(id => getProfile(id)).filter(Boolean);
          const kids = s.childIds.map(id => getProfile(id)).filter(Boolean);
          return `<div class="custody-today-row">
            <span style="font-size:12.5px;">${kids.map(k => k.emoji || k.name.charAt(0)).join(" ")} ${escapeHtml(kids.map(k => k.name).join(", "))}</span>
            <span class="arrow">→</span>
            ${parents.map(p => `<span class="mini-avatar" style="background:${p.color};width:22px;height:22px;font-size:12px;">${p.emoji || p.name.charAt(0)}</span>`).join("")}
            <span style="font-size:12px;color:var(--text-muted);">${escapeHtml(parents.map(p => p.name).join(" & "))}</span>
            ${res.isSwitchDay ? `<span class="tag-chip" style="margin-left:auto;">⇄ Wechseltag</span>` : ""}
          </div>`;
        }).join("");
        custodyPart = `<div class="today-sub-stat">${rows || `<div class="widget-empty" style="padding:0;">Nichts hinterlegt.</div>`}</div>`;
      }
      const mealToday = getMealForDate(todayStr);
      const mealPart = `<div class="today-sub-stat" style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
        <span>🍽️ ${mealToday ? escapeHtml(mealToday) : "Essensplan: noch nichts geplant."}</span>
        <span class="widget-link" data-goto="mealplan" style="cursor:pointer;white-space:nowrap;">Planen ›</span>
      </div>`;
      const dashCard = document.createElement("div");
      dashCard.className = "widget-card dashboard-card";
      dashCard.style.setProperty("--widget-accent", "#0057A6");
      const dashBody = weatherPart + ferienPart + custodyPart + mealPart;
      dashCard.innerHTML = `
        <div class="dashboard-greeting">
          <h1>${salutation}${activeProfile ? ", " + escapeHtml(activeProfile.name) : ""}!</h1>
          <div class="home-date">${new Date().toLocaleDateString("de-DE", { weekday: "long", day: "2-digit", month: "long", year: "numeric" })}</div>
        </div>
        ${dashBody ? `<div class="widget-body">${dashBody}</div>` : ""}
      `;
      grid.appendChild(dashCard);
      const dashLink = dashCard.querySelector("[data-goto]");
      if (dashLink) dashLink.onclick = () => setView(dashLink.dataset.goto);
      if (hasWeather) updateWeatherWidget();
    }

    // --- Wetterwarnung ---
    if (state.federalState) {
      widget("⚠️", "Wetterwarnung", "#C0453B",
        `<div id="warnWidgetBody">${warnCache.data || warnCache.error ? "" : `<div class="widget-empty">Lade Warnungen …</div>`}</div>`,
        "settings", "Einstellungen ›");
      updateWarnWidget();
    }

    // --- Kp-Index / Nordlicht-Chance ---
    widget("🌌", "Nordlicht-Chance", "#3A5A9B",
      `<div id="kpWidgetBody">${kpCache.data ? "" : `<div class="widget-empty">Lade Kp-Index …</div>`}</div>`,
      "settings", "Ort einstellen ›");
    updateKpWidget();

    // --- Nächste Termine ---
    const upcoming = state.events.filter(ev => ev.date >= todayStr).sort((a, b) => (a.date + (a.time || "")).localeCompare(b.date + (b.time || ""))).slice(0, 5);
    widget("📅", "Nächste Termine", "#3A5A9B",
      upcoming.length ? upcoming.map(ev => {
        const visible = canSeeEventDetails(ev);
        const ps = visible ? (ev.profileIds || []).map(id => getProfile(id)).filter(Boolean) : [];
        return `<div class="widget-row">
          <span class="wr-title" style="${visible ? "" : "font-style:italic;color:var(--text-muted);"}">${visible ? escapeHtml(ev.title) : "🔒 Privat"}</span>
          ${ps.map(p => `<span class="mini-avatar" style="background:${p.color};">${p.emoji || p.name.charAt(0)}</span>`).join("")}
          <span class="wr-meta">${ev.date === todayStr ? "Heute" : formatDateStrShort(ev.date)}${visible && ev.time ? " · " + ev.time : ""}</span>
        </div>`;
      }).join("") : `<div class="widget-empty">Keine anstehenden Termine.</div>`,
      "calendar", "Kalender ›");

    // --- Für dich markiert ---
    if (activeProfile) {
      const forYouItems = state.items.filter(it => (it.taggedProfileIds || []).includes(activeProfile.id) && canSeeItemDetails(it));
      const forYouTasks = state.tasks.filter(t => t.assignedTo === activeProfile.id && !t.done && t.approved !== false);
      const forYouCount = forYouItems.length + forYouTasks.length;
      if (forYouCount) {
        const rows = [
          ...forYouItems.slice(0, 4).map(it => {
            const icon = { note: "📝", checklist: "☑️", image: "🖼️" }[it.type] || "•";
            return `<div class="widget-row" data-foryou-item="${it.id}" data-foryou-type="${it.type}" style="cursor:pointer;"><span class="wr-title">${icon} ${escapeHtml(it.title || "Ohne Titel")}</span></div>`;
          }),
          ...forYouTasks.slice(0, 4).map(t => `<div class="widget-row" data-foryou-view="tasks" style="cursor:pointer;"><span class="wr-title">⭐ ${escapeHtml(t.title)}</span><span class="wr-meta">${t.points} Pkt.</span></div>`)
        ].join("");
        const card = widget("📌", "Für dich markiert", "#B15CDE", rows, null);
        card.querySelectorAll("[data-foryou-item]").forEach(row => {
          row.onclick = () => openEditor(row.dataset.foryouType, row.dataset.foryouItem);
        });
        card.querySelectorAll("[data-foryou-view]").forEach(row => {
          row.onclick = () => setView(row.dataset.foryouView);
        });
      }
    }

    // --- Aufgaben & Punktestand ---
    const openTasks = state.tasks.filter(t => !t.done && t.category !== "homework" && t.approved !== false);
    const pointsHtml = `<div class="points-pill-row">${state.profiles.filter(p => p.role === "child").map(p =>
      `<span class="points-pill"><span class="mini-avatar" style="background:${p.color};">${p.emoji || p.name.charAt(0)}</span>${escapeHtml(p.name)} · ${pointsBalance(p.id)}⭐</span>`
    ).join("")}</div>`;
    widget("⭐", "Aufgaben &amp; Punkte", "#C9A24B",
      `${pointsHtml}<div style="margin-top:8px;font-size:12.5px;color:var(--text-muted);">${openTasks.length ? openTasks.length + " offene Aufgabe(n)" : "Keine offenen Aufgaben 🎉"}</div>`,
      "tasks", "Aufgaben ›");

    // --- Hausaufgaben ---
    const openHomework = state.tasks.filter(t => t.category === "homework" && !t.done && t.approved !== false)
      .sort((a, b) => (a.dueDate || "").localeCompare(b.dueDate || ""));
    widget("📚", "Hausaufgaben", "#3A5A9B",
      openHomework.length ? openHomework.slice(0, 5).map(t => {
        const owner = getProfile(t.assignedTo);
        const overdue = t.dueDate && t.dueDate < todayStr;
        return `<div class="widget-row">
          ${owner ? `<span class="mini-avatar" style="background:${owner.color};">${owner.emoji || owner.name.charAt(0)}</span>` : ""}
          <span class="wr-title">${escapeHtml(t.title)}</span>
          <span class="wr-meta" style="${overdue ? "color:#C0453B;" : ""}">${t.dueDate ? (overdue ? "⚠️ " : "") + formatDateStrShort(t.dueDate) : ""}</span>
        </div>`;
      }).join("") : `<div class="widget-empty">Keine offenen Hausaufgaben 🎉</div>`,
      "tasks", "Aufgaben ›");

    // --- Einkaufsliste ---
    const openShopping = state.shoppingList.filter(i => !i.done);
    widget("🛒", "Einkaufsliste", "#86B35A",
      openShopping.length ? openShopping.slice(0, 5).map(i => `<div class="widget-row"><span class="wr-title">${escapeHtml(i.text)}</span></div>`).join("") +
        (openShopping.length > 5 ? `<div class="widget-empty">+${openShopping.length - 5} weitere</div>` : "")
        : `<div class="widget-empty">Liste ist leer.</div>`,
      "shopping", "Liste ›");

    // --- Zuletzt bearbeitet ---
    const recent = state.items.filter(canSeeItemDetails).sort((a, b) => b.updatedAt - a.updatedAt).slice(0, 4);
    widget("🕘", "Zuletzt bearbeitet", "#4A6572",
      recent.length ? recent.map(it => {
        const icon = { note: "📝", checklist: "☑️", image: "🖼️" }[it.type] || "•";
        return `<div class="widget-row" data-item="${it.id}" data-type="${it.type}" style="cursor:pointer;"><span class="wr-title">${icon} ${escapeHtml(it.title || "Ohne Titel")}</span><span class="wr-meta">${fmtDate(it.updatedAt).split(" ")[0]}</span></div>`;
      }).join("") : `<div class="widget-empty">Noch nichts angelegt.</div>`,
      null);
    grid.querySelectorAll("[data-item]").forEach(row => {
      row.onclick = () => openEditor(row.dataset.type, row.dataset.item);
    });

  }

  function renderListView(container, type, title, subtitle, icon) {
    const items = state.items
      .filter(it => it.type === type && itemMatchesSearch(it) && canSeeItemDetails(it))
      .sort((a, b) => (b.pinned - a.pinned) || (b.updatedAt - a.updatedAt));

    const header = document.createElement("div");
    header.className = "view-header";
    header.innerHTML = `
      <div><h1 class="view-title">${title}</h1><p class="view-sub">${subtitle}</p></div>
      <button class="btn btn-accent" id="addBtn">+ Neu</button>
    `;
    container.appendChild(header);

    if (activeTagFilter) {
      const bar = document.createElement("div");
      bar.style.marginBottom = "14px";
      bar.innerHTML = `<span class="tag-chip clickable" id="clearTagFilter">Filter: #${escapeHtml(activeTagFilter)} ✕</span>`;
      container.appendChild(bar);
      bar.querySelector("#clearTagFilter").onclick = () => { activeTagFilter = null; render(); };
    }

    if (!items.length) {
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.innerHTML = `<span class="empty-icon">${icon}</span>${
        searchQuery || activeTagFilter ? "Keine Treffer." : "Noch nichts hier — leg direkt los."
      }`;
      container.appendChild(empty);
    } else {
      const grid = document.createElement("div");
      grid.className = "grid";
      items.forEach(it => grid.appendChild(renderCard(it)));
      container.appendChild(grid);
    }

    document.getElementById("addBtn").onclick = () => openEditor(type);
  }

  function renderCard(it) {
    const card = document.createElement("div");
    card.className = "card";
    card.onclick = (e) => { if (!e.target.closest(".card-pin")) openEditor(it.type, it.id); };

    let bodyHtml = "";
    if (it.type === "note") {
      bodyHtml = `<div class="card-body md-preview">${mdToHtml((it.body || "").slice(0, 260))}</div>`;
    } else if (it.type === "checklist") {
      const total = (it.items || []).length;
      const done = (it.items || []).filter(c => c.done).length;
      const pct = total ? Math.round((done / total) * 100) : 0;
      const todayStrCard = new Date().toISOString().slice(0, 10);
      const overdueCount = it.hwMode ? (it.items || []).filter(c => !c.done && c.dueDate && c.dueDate < todayStrCard).length : 0;
      bodyHtml = `
        <div class="card-body">${it.hwMode ? "📚 " : ""}${done}/${total} erledigt${overdueCount ? ` · <span style="color:#C0453B;">${overdueCount} überfällig</span>` : ""}</div>
        <div class="card-progress"><div class="card-progress-bar" style="width:${pct}%"></div></div>`;
    } else if (it.type === "image") {
      bodyHtml = `${it.dataUrl ? `<img class="card-thumb" src="${it.dataUrl}" alt="">` : ""}
        <div class="card-body">${escapeHtml(it.caption || "")}</div>`;
    }

    const creator = it.createdBy ? getProfile(it.createdBy) : null;
    card.innerHTML = `
      <div class="card-top">
        <h3 class="card-title">${it.private ? "🔒 " : ""}${escapeHtml(it.title || "Ohne Titel")}</h3>
        <button class="card-pin ${it.pinned ? "pinned" : ""}" title="Anheften">${it.pinned ? "★" : "☆"}</button>
      </div>
      ${bodyHtml}
      <div class="card-tags">${(it.tags || []).map(t => `<span class="tag-chip clickable" data-tag="${escapeHtml(t)}">#${escapeHtml(t)}</span>`).join("")}</div>
      <div class="card-meta" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
        ${creator ? `<span class="mini-avatar" style="background:${creator.color};" title="Erstellt von ${escapeHtml(creator.name)}">${creator.emoji || creator.name.charAt(0)}</span>` : ""}
        Aktualisiert ${fmtDate(it.updatedAt)}
        ${(it.taggedProfileIds || []).length ? `<span style="margin-left:auto;display:flex;gap:3px;">${(it.taggedProfileIds || []).map(pid => { const p = getProfile(pid); return p ? `<span class="mini-avatar" style="background:${p.color};" title="Für ${escapeHtml(p.name)}">${p.emoji || p.name.charAt(0)}</span>` : ""; }).join("")}</span>` : ""}
      </div>
    `;
    card.querySelector(".card-pin").onclick = () => { it.pinned = !it.pinned; saveState(); render(); };
    card.querySelectorAll(".tag-chip[data-tag]").forEach(chip => {
      chip.onclick = (e) => { e.stopPropagation(); activeTagFilter = chip.dataset.tag; render(); };
    });
    return card;
  }

  function renderTagsView(container) {
    const header = document.createElement("div");
    header.className = "view-header";
    header.innerHTML = `<div><h1 class="view-title">Tags</h1><p class="view-sub">Alle Themen auf einen Blick — klicke, um zu filtern.</p></div>`;
    container.appendChild(header);

    const tags = allTags();
    if (!tags.size) {
      container.innerHTML += `<div class="empty-state"><span class="empty-icon">🏷️</span>Noch keine Tags vergeben.</div>`;
      return;
    }
    const cloud = document.createElement("div");
    cloud.className = "tag-cloud";
    [...tags.entries()].sort((a, b) => b[1] - a[1]).forEach(([tag, count]) => {
      const pill = document.createElement("button");
      pill.className = "tag-pill" + (activeTagFilter === tag ? " active" : "");
      pill.innerHTML = `#${escapeHtml(tag)} <span class="count">${count}</span>`;
      pill.onclick = () => { activeTagFilter = activeTagFilter === tag ? null : tag; setView("notes"); };
      cloud.appendChild(pill);
    });
    container.appendChild(cloud);
  }

  /* ============ EDITOR MODAL ============ */
  function drawColoringTemplate(ctx, id) {
    ctx.save();
    ctx.strokeStyle = "#2B2621";
    ctx.fillStyle = "#2B2621";
    ctx.lineWidth = 5;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    if (id === "auto") {
      ctx.beginPath(); ctx.roundRect(120, 190, 320, 90, 20); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(170, 190); ctx.lineTo(210, 130); ctx.lineTo(370, 130); ctx.lineTo(410, 190); ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.arc(200, 285, 35, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(370, 285, 35, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.rect(240, 150, 60, 40); ctx.stroke();
    } else if (id === "haus") {
      ctx.beginPath(); ctx.rect(160, 180, 280, 160); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(140, 180); ctx.lineTo(300, 70); ctx.lineTo(460, 180); ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.rect(270, 260, 60, 80); ctx.stroke();
      ctx.beginPath(); ctx.rect(190, 210, 50, 50); ctx.stroke();
      ctx.beginPath(); ctx.rect(360, 210, 50, 50); ctx.stroke();
    } else if (id === "katze") {
      ctx.beginPath(); ctx.arc(300, 230, 90, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(230, 170); ctx.lineTo(210, 100); ctx.lineTo(270, 150); ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(370, 170); ctx.lineTo(390, 100); ctx.lineTo(330, 150); ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.arc(265, 220, 8, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(335, 220, 8, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(300, 235); ctx.lineTo(300, 250); ctx.lineTo(285, 260); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(380, 260); ctx.quadraticCurveTo(440, 220, 420, 160); ctx.stroke();
    } else if (id === "rakete") {
      ctx.beginPath(); ctx.moveTo(300, 60); ctx.quadraticCurveTo(360, 130, 350, 260); ctx.lineTo(250, 260); ctx.quadraticCurveTo(240, 130, 300, 60); ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.arc(300, 150, 22, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(250, 230); ctx.lineTo(200, 290); ctx.lineTo(250, 270); ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(350, 230); ctx.lineTo(400, 290); ctx.lineTo(350, 270); ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(275, 260); ctx.lineTo(265, 310); ctx.lineTo(285, 310); ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(325, 260); ctx.lineTo(315, 310); ctx.lineTo(335, 310); ctx.closePath(); ctx.stroke();
    } else if (id === "blume") {
      ctx.beginPath(); ctx.arc(150, 100, 40, 0, Math.PI * 2); ctx.stroke();
      [0, 1, 2, 3, 4].forEach(i => { const a = (i / 5) * Math.PI * 2; ctx.beginPath(); ctx.ellipse(150 + Math.cos(a) * 45, 100 + Math.sin(a) * 45, 22, 14, a, 0, Math.PI * 2); ctx.stroke(); });
      ctx.beginPath(); ctx.moveTo(150, 140); ctx.lineTo(150, 300); ctx.stroke();
      ctx.beginPath(); ctx.arc(420, 130, 36, 0, Math.PI * 2); ctx.stroke();
      [0, 1, 2, 3, 4].forEach(i => { const a = (i / 5) * Math.PI * 2 + 0.3; ctx.beginPath(); ctx.ellipse(420 + Math.cos(a) * 40, 130 + Math.sin(a) * 40, 20, 12, a, 0, Math.PI * 2); ctx.stroke(); });
      ctx.beginPath(); ctx.moveTo(420, 166); ctx.lineTo(420, 300); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(60, 310); ctx.lineTo(540, 310); ctx.stroke();
    } else if (id === "boot") {
      ctx.beginPath(); ctx.moveTo(150, 260); ctx.lineTo(450, 260); ctx.lineTo(400, 310); ctx.lineTo(200, 310); ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(300, 260); ctx.lineTo(300, 90); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(300, 100); ctx.lineTo(380, 220); ctx.lineTo(300, 220); ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(295, 140); ctx.lineTo(230, 220); ctx.lineTo(295, 220); ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(80, 330); ctx.quadraticCurveTo(150, 310, 220, 330); ctx.quadraticCurveTo(300, 350, 380, 330); ctx.quadraticCurveTo(460, 310, 520, 330); ctx.stroke();
    } else if (id === "dino") {
      ctx.beginPath();
      ctx.moveTo(120, 300); ctx.quadraticCurveTo(110, 220, 170, 200); ctx.quadraticCurveTo(160, 140, 220, 110);
      ctx.quadraticCurveTo(240, 90, 260, 110); ctx.quadraticCurveTo(230, 130, 240, 150);
      ctx.quadraticCurveTo(320, 130, 400, 170); ctx.quadraticCurveTo(460, 190, 470, 230);
      ctx.quadraticCurveTo(440, 220, 420, 240); ctx.quadraticCurveTo(400, 260, 410, 300);
      ctx.lineTo(380, 300); ctx.quadraticCurveTo(370, 270, 350, 260);
      ctx.quadraticCurveTo(280, 280, 220, 270); ctx.quadraticCurveTo(200, 290, 195, 300);
      ctx.lineTo(165, 300); ctx.quadraticCurveTo(160, 270, 170, 250); ctx.quadraticCurveTo(130, 260, 120, 300);
      ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.arc(230, 115, 6, 0, Math.PI * 2); ctx.stroke();
      [0, 1, 2].forEach(i => { ctx.beginPath(); ctx.moveTo(230 + i * 40, 140); ctx.lineTo(240 + i * 40, 115); ctx.stroke(); });
    } else if (id === "roboter") {
      ctx.beginPath(); ctx.roundRect(220, 130, 160, 130, 16); ctx.stroke();
      ctx.beginPath(); ctx.arc(270, 180, 14, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(330, 180, 14, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(265, 225); ctx.lineTo(335, 225); ctx.stroke();
      ctx.beginPath(); ctx.rect(260, 270, 80, 90); ctx.stroke();
      ctx.beginPath(); ctx.rect(150, 280, 40, 60); ctx.stroke();
      ctx.beginPath(); ctx.rect(410, 280, 40, 60); ctx.stroke();
      ctx.beginPath(); ctx.rect(275, 360, 25, 20); ctx.stroke();
      ctx.beginPath(); ctx.rect(320, 360, 25, 20); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(300, 130); ctx.lineTo(300, 100); ctx.stroke();
      ctx.beginPath(); ctx.arc(300, 92, 8, 0, Math.PI * 2); ctx.stroke();
    } else if (id === "panzer") {
      ctx.beginPath(); ctx.roundRect(130, 240, 340, 60, 10); ctx.stroke();
      [0, 1, 2, 3, 4, 5].forEach(i => { ctx.beginPath(); ctx.arc(160 + i * 55, 300, 22, 0, Math.PI * 2); ctx.stroke(); });
      ctx.beginPath(); ctx.roundRect(220, 180, 160, 65, 12); ctx.stroke();
      ctx.beginPath(); ctx.arc(300, 210, 26, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(300, 210); ctx.lineTo(430, 195); ctx.lineWidth = 10; ctx.stroke(); ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(150, 240); ctx.lineTo(150, 320); ctx.moveTo(450, 240); ctx.lineTo(450, 320); ctx.stroke();
    } else if (id === "jet") {
      ctx.beginPath();
      ctx.moveTo(500, 190); ctx.lineTo(360, 175); ctx.lineTo(230, 165); ctx.lineTo(90, 190);
      ctx.lineTo(230, 205); ctx.lineTo(360, 205); ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(300, 165); ctx.lineTo(250, 90); ctx.lineTo(300, 130); ctx.lineTo(330, 90); ctx.lineTo(320, 165); ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(300, 205); ctx.lineTo(250, 290); ctx.lineTo(300, 245); ctx.lineTo(330, 290); ctx.lineTo(320, 205); ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(150, 185); ctx.quadraticCurveTo(140, 165, 165, 168); ctx.quadraticCurveTo(150, 175, 150, 185); ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(230, 183, 20, 9, 0, 0, Math.PI * 2); ctx.stroke();
    } else if (id === "helikopter") {
      ctx.beginPath(); ctx.ellipse(300, 230, 100, 55, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(400, 220); ctx.quadraticCurveTo(480, 210, 500, 195); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(470, 175); ctx.lineTo(500, 215); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(200, 260); ctx.lineTo(150, 300); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(230, 275); ctx.lineTo(120, 285); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(300, 175); ctx.lineTo(300, 150); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(210, 150); ctx.lineTo(390, 150); ctx.stroke();
      ctx.beginPath(); ctx.arc(220, 270, 15, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(280, 285, 15, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
  }

    document.body.appendChild(overlay);

    if (type === "note") {

    // checklist rows
    const todayStrEditor = new Date().toISOString().slice(0, 10);
    function renderChecklistRows() {
      const wrap = overlay.querySelector("#checklistItems");

    // image upload
    if (type === "image") {

      dz.onclick = () => fileInput.click();

      dz.ondragover = (e) => { e.preventDefault(); dz.classList.add("drag"); };

      // tabs
      const uploadPane = overlay.querySelector("#uploadPane");
      const drawPane = overlay.querySelector("#drawPane");
      overlay.querySelectorAll(".img-tab").forEach(tab => {
        tab.onclick = () => {

      // drawing pad
      const canvas = overlay.querySelector("#drawCanvas");
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#FFFFFF";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      const DRAW_COLORS = ["#2B2621", "#C0453B", "#3A5A9B", "#86B35A", "#C9A24B", "#B15CDE", "#FF9270", "#FFFFFF"];
      const colorsWrap = overlay.querySelector("#drawColors");
      let currentColor = DRAW_COLORS[0];
      let erasing = false;
      DRAW_COLORS.forEach((c, i) => {
        const sw = document.createElement("button");
        sw.type = "button";
        sw.className = "draw-swatch" + (i === 0 ? " active" : "");
        sw.style.background = c;
        sw.onclick = () => {
          currentColor = c; erasing = false;
          colorsWrap.querySelectorAll(".draw-swatch").forEach(s => s.classList.remove("active"));
          sw.classList.add("active");
          overlay.querySelector("#drawEraser").classList.remove("active-tool");
        };
        colorsWrap.appendChild(sw);
      });
      overlay.querySelector("#drawCustomColor").addEventListener("input", (e) => {
        currentColor = e.target.value; erasing = false;
        colorsWrap.querySelectorAll(".draw-swatch").forEach(s => s.classList.remove("active"));
        overlay.querySelector("#drawEraser").classList.remove("active-tool");
      });
      overlay.querySelector("#drawEraser").onclick = (e) => {
        erasing = !erasing;
        e.currentTarget.classList.toggle("active-tool", erasing);
      };

      let undoStack = [];
      function pushUndo() {
        undoStack.push(canvas.toDataURL());
        if (undoStack.length > 20) undoStack.shift();
      }
      overlay.querySelector("#drawUndo").onclick = () => {
        if (!undoStack.length) return;
        const imgData = undoStack.pop();
        const img = new Image();
        img.onload = () => { ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.drawImage(img, 0, 0); };
        img.src = imgData;
      };
      overlay.querySelector("#drawClear").onclick = () => {
        pushUndo();
        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      };
      overlay.querySelector("#drawTemplate").addEventListener("change", (e) => {
        const tplId = e.target.value;
        if (!tplId) return;
        pushUndo();
        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        drawColoringTemplate(ctx, tplId);
        e.target.value = "";
      });

      let drawing = false;
      function pos(e) {
        const rect = canvas.getBoundingClientRect();
        return { x: (e.clientX - rect.left) * (canvas.width / rect.width), y: (e.clientY - rect.top) * (canvas.height / rect.height) };
      }
      canvas.addEventListener("pointerdown", (e) => {
        pushUndo();
        drawing = true;
        canvas.setPointerCapture(e.pointerId);
        const p = pos(e);
        ctx.beginPath(); ctx.moveTo(p.x, p.y);
        ctx.lineWidth = parseInt(overlay.querySelector("#drawSize").value, 10);
        ctx.strokeStyle = erasing ? "#FFFFFF" : currentColor;
        ctx.lineTo(p.x + 0.1, p.y + 0.1); ctx.stroke();
      });
      canvas.addEventListener("pointermove", (e) => {
        if (!drawing) return;
        const p = pos(e);
        ctx.lineTo(p.x, p.y); ctx.stroke();
      });
      canvas.addEventListener("pointerup", () => { drawing = false; });
      canvas.addEventListener("pointerleave", () => { drawing = false; });

      overlay.querySelector("#drawUse").onclick = () => {
        draft.dataUrl = canvas.toDataURL("image/png");
        preview.src = draft.dataUrl; preview.style.display = "block";
        overlay.querySelectorAll(".img-tab").forEach(t => t.classList.remove("active"));
        overlay.querySelector('.img-tab[data-tab="upload"]').classList.add("active");

        showToast("Zeichnung übernommen.");

  /* ============ MIND-MAP ============ */
  const MM_BRANCH_COLORS = ["#C0453B", "#3A5A9B", "#86B35A", "#C9A24B", "#B15CDE", "#FF9270", "#4A6572", "#35D0BA", "#E8590C", "#5F7038"];

  function currentMindmap() {
    if (!state.mindmaps.length) {
      state.mindmaps.push({ id: uid(), name: "Ideen", nodes: [], private: false, createdBy: state.activeProfileId || null, createdAt: Date.now(), updatedAt: Date.now() });
      state.activeMindmapId = state.mindmaps[0].id;
    }
    if (!state.activeMindmapId || !state.mindmaps.some(m => m.id === state.activeMindmapId)) {
      state.activeMindmapId = state.mindmaps[0].id;
    }
    return state.mindmaps.find(m => m.id === state.activeMindmapId);
  }

  function canSeeMindmap(m) {
    if (!m.private) return true;
    const activeId = state.activeProfileId;
    if (!activeId) return false;
    if (!m.createdBy) return true;
    return m.createdBy === activeId;
  }

  function mmRoot() { return currentMindmap().nodes.find(n => n.root) || currentMindmap().nodes[0]; }
  function mmChildren(id) { return currentMindmap().nodes.filter(n => n.parentId === id); }
  function mmBranchColorFor(node) {
    // walk up to the top-level branch (direct child of root) to pick a stable color
    const root = mmRoot();
    if (!root || node.id === root.id) return null;
    let cur = node;
    const guard = new Set();
    while (cur.parentId && cur.parentId !== root.id && !guard.has(cur.id)) {
      guard.add(cur.id);
      const parent = currentMindmap().nodes.find(n => n.id === cur.parentId);
      if (!parent) break;
      cur = parent;
    }
    const topLevelSiblings = mmChildren(root.id);
    const idx = topLevelSiblings.findIndex(n => n.id === cur.id);
    return MM_BRANCH_COLORS[idx >= 0 ? idx % MM_BRANCH_COLORS.length : 0];
  }

  function migrateMindmapIfNeeded() {
    const mm = currentMindmap();
    if (!mm.nodes.length) {
      mm.nodes.push({ id: uid(), parentId: null, root: true, x: 1040, y: 680, text: "Zentrale Idee" });
      return;
    }
    const needsMigration = mm.nodes.some(n => n.parentId === undefined);
    if (!needsMigration) return;
    let root = mm.nodes.find(n => n.root);
    if (!root) { root = mm.nodes[0]; root.root = true; }
    root.parentId = null;
    const edges = mm.edges || [];
    const visited = new Set([root.id]);
    const queue = [root.id];
    while (queue.length) {
      const cur = queue.shift();
      edges.forEach(e => {
        let otherId = null;
        if (e.from === cur && !visited.has(e.to)) otherId = e.to;
        else if (e.to === cur && !visited.has(e.from)) otherId = e.from;
        if (otherId) {
          const n = mm.nodes.find(x => x.id === otherId);
          if (n) { n.parentId = cur; visited.add(otherId); queue.push(otherId); }
        }
      });
    }
    mm.nodes.forEach(n => { if (n.parentId === undefined) { n.parentId = n.id === root.id ? null : root.id; visited.add(n.id); } });
  }

  function computeChildPosition(parent) {
    const root = mmRoot();
    const siblings = mmChildren(parent.id);
    const idx = siblings.length;
    if (parent.id === root.id) {
      const totalGuess = Math.max(idx + 1, 6);
      const angle = (idx / totalGuess) * Math.PI * 2 - Math.PI / 2;
      return { x: root.x + Math.cos(angle) * 260, y: root.y + Math.sin(angle) * 200 };
    }
    const dx = parent.x - root.x, dy = parent.y - root.y;
    const baseAngle = Math.atan2(dy, dx) || 0;
    const spread = 0.36;
    const angle = baseAngle + (idx - (idx % 2 === 0 ? idx / 2 : (idx - 1) / 2)) * spread * (idx % 2 === 0 ? 1 : -1);
    const dist = Math.hypot(dx, dy) || 160;
    return { x: parent.x + Math.cos(angle) * (dist * 0 + 190), y: parent.y + Math.sin(angle) * (dist * 0 + 190) };
  }

  function renderMindmapView(container) {
    migrateMindmapIfNeeded();
    const mmList = state.mindmaps;
    const header = document.createElement("div");
    header.className = "view-header";
    header.innerHTML = `<div><h1 class="view-title">Mind-Map</h1><p class="view-sub">Klicken &amp; direkt tippen · <b>Enter</b> = neuer Punkt daneben · <b>Tab</b> = neuer Unterpunkt · <b>Esc</b>, dann <b>Entf</b> = löschen · Knoten auf einen anderen ziehen = neu einordnen · ▾ = ein-/ausklappen</p></div>`;
    container.appendChild(header);

    const switcher = document.createElement("div");
    switcher.className = "mindmap-toolbar";
    switcher.innerHTML = `
      <select id="mmSelect" style="min-width:180px;">
        ${mmList.map(m => `<option value="${m.id}" ${m.id === state.activeMindmapId ? "selected" : ""}>${m.private ? "🔒 " : ""}${escapeHtml(m.name)}</option>`).join("")}
      </select>
      <button class="btn btn-sm btn-accent" id="mmNewBtn">+ Neue Mind-Map</button>
      <button class="btn btn-sm" id="mmRenameBtn">✎ Umbenennen</button>
      <button class="btn btn-sm btn-danger" id="mmDeleteMapBtn">Mind-Map löschen</button>
    `;
    container.appendChild(switcher);
    switcher.querySelector("#mmSelect").addEventListener("change", (e) => {
      state.activeMindmapId = e.target.value;
      saveState({ skipTouch: true }); render();
    });
    switcher.querySelector("#mmNewBtn").onclick = () => {
      const nm = { id: uid(), name: "Neue Mind-Map " + (state.mindmaps.length + 1), nodes: [], private: false, createdBy: state.activeProfileId || null, createdAt: Date.now(), updatedAt: Date.now() };
      state.mindmaps.push(nm);
      state.activeMindmapId = nm.id;
      saveState(); render();
    };
    switcher.querySelector("#mmRenameBtn").onclick = () => {
      const mm = currentMindmap();
      const name = prompt("Name der Mind-Map:", mm.name);
      if (name && name.trim()) { mm.name = name.trim(); saveState(); render(); }
    };
    switcher.querySelector("#mmDeleteMapBtn").onclick = () => {
      if (state.mindmaps.length <= 1) { showToast("Das ist eure einzige Mind-Map — leg zuerst eine neue an, bevor du diese löschst."); return; }
      if (!confirm(`„${currentMindmap().name}" wirklich komplett löschen?`)) return;
      state.mindmaps = state.mindmaps.filter(m => m.id !== state.activeMindmapId);
      state.activeMindmapId = state.mindmaps[0].id;
      saveState(); render();
    };

    const root = mmRoot();
    const toolbar = document.createElement("div");
    toolbar.className = "mindmap-toolbar";
    toolbar.innerHTML = `
      <button class="btn btn-sm btn-accent" id="mmAddBranch">+ Hauptast</button>
      <button class="btn btn-sm" id="mmAddChild">+ Unterpunkt</button>
      <button class="btn btn-sm btn-danger" id="mmDeleteNode">Löschen</button>
      <button class="btn btn-sm" id="mmPrivateToggle">${currentMindmap().private ? "🔒 Privat" : "🔓 Privat machen"}</button>
      <span class="mindmap-hint">Knoten anklicken = auswählen &amp; sofort tippen.</span>
    `;
    container.appendChild(toolbar);
    toolbar.querySelector("#mmPrivateToggle").onclick = () => {
      currentMindmap().private = !currentMindmap().private;
      saveState(); render();
      showToast(currentMindmap().private ? "Mind-Map ist jetzt privat." : "Mind-Map wird wieder mitgeteilt.");
    };

    const wrap = document.createElement("div");
    wrap.className = "mindmap-wrap";
    wrap.innerHTML = `
      <div class="mindmap-world" id="mmWorld">
        <svg class="mindmap-svg" id="mmSvg"></svg>
      </div>
      <div class="mm-controls">
        <div class="mm-zoom-label" id="mmZoomLabel">100%</div>
        <button type="button" id="mmZoomIn" title="Vergrößern">+</button>
        <button type="button" id="mmZoomOut" title="Verkleinern">−</button>
        <button type="button" id="mmZoomFit" title="Einpassen">⛶</button>
      </div>
    `;
    container.appendChild(wrap);

    let selectedId = root ? root.id : null;
    const mmView = { tx: 0, ty: 0, scale: 1 };

    function isDescendantOf(candidateId, ancestorId) {
      let cur = currentMindmap().nodes.find(n => n.id === candidateId);
      const guard = new Set();
      while (cur && cur.parentId && !guard.has(cur.id)) {
        if (cur.parentId === ancestorId) return true;
        guard.add(cur.id);
        cur = currentMindmap().nodes.find(n => n.id === cur.parentId);
      }
      return false;
    }

    function collapsedAncestorIds() {
      return new Set(currentMindmap().nodes.filter(n => n.collapsed).map(n => n.id));
    }
    function visibleNodes() {
      const collapsed = collapsedAncestorIds();
      return currentMindmap().nodes.filter(n => {
        let cur = n;
        const guard = new Set();
        while (cur && cur.parentId && !guard.has(cur.id)) {
          if (collapsed.has(cur.parentId) && cur.parentId !== n.id) return false;
          guard.add(cur.id);
          cur = currentMindmap().nodes.find(x => x.id === cur.parentId);
        }
        return true;
      });
    }

    function applyTransform(animate) {
      const world = document.getElementById("mmWorld");
      if (!world) return;
      world.style.transition = animate ? "transform .3s cubic-bezier(.2,.7,.3,1)" : "none";
      world.style.transform = `translate(${mmView.tx}px, ${mmView.ty}px) scale(${mmView.scale})`;
      const label = document.getElementById("mmZoomLabel");
      if (label) label.textContent = Math.round(mmView.scale * 100) + "%";
    }

    function fitToContent(animate) {
      const visible = visibleNodes();
      if (!visible.length) return;
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      visible.forEach(n => {
        const el = wrap.querySelector(`.mm-node[data-id="${n.id}"]`);
        const w = el ? el.offsetWidth : 160, h = el ? el.offsetHeight : 50;
        minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
        maxX = Math.max(maxX, n.x + w); maxY = Math.max(maxY, n.y + h);
      });
      const padding = 70;
      const bboxW = Math.max(1, maxX - minX), bboxH = Math.max(1, maxY - minY);
      const wrapRect = wrap.getBoundingClientRect();
      const scale = Math.min(
        (wrapRect.width - padding * 2) / bboxW,
        (wrapRect.height - padding * 2) / bboxH,
        1.15
      );
      mmView.scale = Math.max(0.15, scale);
      mmView.tx = (wrapRect.width - bboxW * mmView.scale) / 2 - minX * mmView.scale;
      mmView.ty = (wrapRect.height - bboxH * mmView.scale) / 2 - minY * mmView.scale;
      applyTransform(animate);
    }

    function zoomBy(factor, screenX, screenY) {
      const wrapRect = wrap.getBoundingClientRect();
      const cx = screenX !== undefined ? screenX : wrapRect.width / 2;
      const cy = screenY !== undefined ? screenY : wrapRect.height / 2;
      const worldX = (cx - mmView.tx) / mmView.scale;
      const worldY = (cy - mmView.ty) / mmView.scale;
      mmView.scale = Math.min(2.5, Math.max(0.15, mmView.scale * factor));
      mmView.tx = cx - worldX * mmView.scale;
      mmView.ty = cy - worldY * mmView.scale;
      applyTransform(false);
    }

    function ensureVisible(node) {
      const wrapRect = wrap.getBoundingClientRect();
      const margin = 40;
      const screenX = mmView.tx + node.x * mmView.scale;
      const screenY = mmView.ty + node.y * mmView.scale;
      const w = 180 * mmView.scale, h = 56 * mmView.scale;
      let dx = 0, dy = 0;
      if (screenX < margin) dx = margin - screenX;
      else if (screenX + w > wrapRect.width - margin) dx = (wrapRect.width - margin) - (screenX + w);
      if (screenY < margin) dy = margin - screenY;
      else if (screenY + h > wrapRect.height - margin) dy = (wrapRect.height - margin) - (screenY + h);
      if (dx || dy) { mmView.tx += dx; mmView.ty += dy; applyTransform(true); }
    }

    function selectAllText(el) {
      const range = document.createRange();
      range.selectNodeContents(el);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }

    function focusNode(id, selectAll) {
      selectedId = id;
      renderNodes();
      drawEdges();
      const node = currentMindmap().nodes.find(n => n.id === id);
      if (node) ensureVisible(node);
      const el = document.querySelector(`.mm-node[data-id="${id}"] .mm-text`);
      if (el) {
        el.focus();
        if (selectAll) selectAllText(el);
      }
    }

    function addChildTo(parentId) {
      const parent = currentMindmap().nodes.find(n => n.id === parentId);
      if (!parent) return;
      parent.collapsed = false;
      const pos = computeChildPosition(parent);
      const node = { id: uid(), parentId: parent.id, x: pos.x, y: pos.y, text: "Neuer Punkt" };
      currentMindmap().nodes.push(node);
      saveState();
      focusNode(node.id, true);
    }

    function addSiblingTo(nodeId) {
      const node = currentMindmap().nodes.find(n => n.id === nodeId);
      if (!node || !node.parentId) { addChildTo(mmRoot().id); return; }
      addChildTo(node.parentId);
    }

    function deleteSubtree(id) {
      const rootNode = mmRoot();
      if (id === rootNode.id) { showToast("Die Zentrale Idee kann nicht gelöscht werden."); return; }
      const toDelete = new Set([id]);
      let changed = true;
      while (changed) {
        changed = false;
        currentMindmap().nodes.forEach(n => {
          if (n.parentId && toDelete.has(n.parentId) && !toDelete.has(n.id)) { toDelete.add(n.id); changed = true; }
        });
      }
      currentMindmap().nodes = currentMindmap().nodes.filter(n => !toDelete.has(n.id));
      selectedId = rootNode.id;
      saveState(); renderNodes(); drawEdges();
    }

    function drawEdges() {
      const svg = document.getElementById("mmSvg");
      if (!svg) return;
      svg.innerHTML = "";
      const visibleIds = new Set(visibleNodes().map(n => n.id));
      currentMindmap().nodes.forEach(node => {
        if (!node.parentId || !visibleIds.has(node.id)) return;
        const a = currentMindmap().nodes.find(n => n.id === node.parentId);
        if (!a) return;
        const aEl = wrap.querySelector(`.mm-node[data-id="${a.id}"]`);
        const bEl = wrap.querySelector(`.mm-node[data-id="${node.id}"]`);
        const aw = aEl ? aEl.offsetWidth : 160, ah = aEl ? aEl.offsetHeight : 46;
        const bw = bEl ? bEl.offsetWidth : 160, bh = bEl ? bEl.offsetHeight : 46;
        const ax = a.x + aw / 2, ay = a.y + ah / 2, bx = node.x + bw / 2, by = node.y + bh / 2;
        const mx = (ax + bx) / 2;
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("class", "mm-edge");
        path.setAttribute("d", `M ${ax} ${ay} C ${mx} ${ay}, ${mx} ${by}, ${bx} ${by}`);
        const color = node.color || mmBranchColorFor(node) || "var(--accent2)";
        path.setAttribute("stroke", color);
        path.setAttribute("stroke-width", node.parentId === mmRoot().id ? "3.5" : "2.25");
        svg.appendChild(path);
      });
    }

    function renderNodes() {
      const world = document.getElementById("mmWorld");
      world.querySelectorAll(".mm-node").forEach(n => n.remove());
      const visible = visibleNodes();
      visible.forEach(node => {
        const el = document.createElement("div");
        const branchColor = node.color || mmBranchColorFor(node);
        el.className = "mm-node" + (node.root ? " root" : "") + (selectedId === node.id ? " selected" : "");
        el.style.left = node.x + "px";
        el.style.top = node.y + "px";
        if (branchColor && !node.root) {
          el.style.borderColor = branchColor;
          el.style.background = `color-mix(in srgb, ${branchColor} ${node.color ? 22 : 10}%, var(--surface))`;
        }
        el.dataset.id = node.id;

        const textEl = document.createElement("span");
        textEl.className = "mm-text";
        textEl.contentEditable = "true";
        textEl.spellcheck = false;
        textEl.innerHTML = mdToHtml(node.text);
        el.appendChild(textEl);

        const childCount = mmChildren(node.id).length;
        if (childCount > 0) {
          const toggleBtn = document.createElement("button");
          toggleBtn.className = "mm-toggle";
          toggleBtn.title = node.collapsed ? "Ausklappen" : "Einklappen";
          toggleBtn.textContent = node.collapsed ? `▸ ${childCount}` : "▾";
          toggleBtn.onclick = (e) => { e.stopPropagation(); node.collapsed = !node.collapsed; saveState(); renderNodes(); drawEdges(); };
          el.appendChild(toggleBtn);
        }

        const delBtn = document.createElement("button");
        delBtn.className = "mm-del";
        delBtn.title = "Ast löschen";
        delBtn.textContent = "✕";
        delBtn.style.display = node.root ? "none" : "";
        el.appendChild(delBtn);

        const addChildBtn = document.createElement("button");
        addChildBtn.className = "mm-add-child";
        addChildBtn.title = "Unterpunkt hinzufügen";
        addChildBtn.textContent = "+";
        el.appendChild(addChildBtn);

        if (!node.root) {
          const colorBtn = document.createElement("button");
          colorBtn.className = "mm-color";
          colorBtn.title = "Farbe wählen";
          colorBtn.textContent = "🎨";
          colorBtn.onclick = (e) => {
            e.stopPropagation();
            document.querySelectorAll(".mm-color-picker").forEach(p => p.remove());
            const picker = document.createElement("div");
            picker.className = "mm-color-picker";
            const swatches = ["", ...MM_BRANCH_COLORS, "#C0453B", "#2B7A21", "#7A4A20"];
            picker.innerHTML = swatches.map(c => c
              ? `<button type="button" class="mm-swatch" style="background:${c};" data-c="${c}"></button>`
              : `<button type="button" class="mm-swatch mm-swatch-reset" data-c="" title="Automatisch">✕</button>`
            ).join("");
            document.body.appendChild(picker);
            const rect = colorBtn.getBoundingClientRect();
            picker.style.left = rect.left + "px";
            picker.style.top = (rect.bottom + 4) + "px";
            picker.querySelectorAll(".mm-swatch").forEach(sw => {
              sw.onclick = (ev) => {
                ev.stopPropagation();
                node.color = sw.dataset.c || null;
                saveState(); renderNodes(); drawEdges();
                picker.remove();
              };
            });
            const closePicker = (ev) => { if (!picker.contains(ev.target)) { picker.remove(); document.removeEventListener("pointerdown", closePicker); } };
            setTimeout(() => document.addEventListener("pointerdown", closePicker), 0);
          };
          el.appendChild(colorBtn);
        }

        delBtn.onclick = (e) => { e.stopPropagation(); deleteSubtree(node.id); };
        addChildBtn.onclick = (e) => { e.stopPropagation(); addChildTo(node.id); };

        el.addEventListener("click", (e) => {
          if (e.target === delBtn || e.target === addChildBtn || e.target.classList.contains("mm-toggle")) return;
          if (selectedId !== node.id) { selectedId = node.id; renderNodes(); }
          ensureVisible(node);
          if (e.target !== textEl) { textEl.focus(); selectAllText(textEl); }
        });

        textEl.addEventListener("focus", () => { textEl.textContent = node.text; });
        textEl.addEventListener("blur", () => {
          node.text = textEl.textContent.trim() || "Ohne Titel";
          saveState();
          textEl.innerHTML = mdToHtml(node.text);
        });
        textEl.addEventListener("keydown", (e) => {
          if (e.key === "Enter") { e.preventDefault(); node.text = textEl.textContent.trim() || "Ohne Titel"; saveState(); addSiblingTo(node.id); }
          else if (e.key === "Tab") { e.preventDefault(); node.text = textEl.textContent.trim() || "Ohne Titel"; saveState(); addChildTo(node.id); }
          else if (e.key === "Escape") { e.preventDefault(); textEl.blur(); el.focus(); }
        });
        textEl.addEventListener("pointerdown", (e) => e.stopPropagation());

        // dragging (from anywhere on the node except the editable text / buttons) — drop onto another node to re-parent
        let dragging = false, moved = false, sx = 0, sy = 0, ox = 0, oy = 0, dropTarget = null;
        el.tabIndex = -1;
        el.addEventListener("pointerdown", (e) => {
          if (e.target === delBtn || e.target === textEl || e.target === addChildBtn || e.target.classList.contains("mm-toggle")) return;
          e.stopPropagation();
          dragging = true; moved = false; sx = e.clientX; sy = e.clientY; ox = node.x; oy = node.y;
          el.setPointerCapture(e.pointerId);
          el.style.cursor = "grabbing";
          el.style.zIndex = 10;
        });
        el.addEventListener("pointermove", (e) => {
          if (!dragging) return;
          e.stopPropagation();
          if (Math.abs(e.clientX - sx) > 3 || Math.abs(e.clientY - sy) > 3) moved = true;
          node.x = ox + (e.clientX - sx) / mmView.scale;
          node.y = oy + (e.clientY - sy) / mmView.scale;
          el.style.left = node.x + "px"; el.style.top = node.y + "px";
          drawEdges();
          if (moved && !node.root) {
            const under = document.elementFromPoint(e.clientX, e.clientY);
            const overEl = under ? under.closest(".mm-node") : null;
            const overId = overEl && overEl !== el ? overEl.dataset.id : null;
            const valid = overId && overId !== node.parentId && !isDescendantOf(overId, node.id);
            if (dropTarget && dropTarget !== overEl) dropTarget.classList.remove("drop-target");
            dropTarget = valid ? overEl : null;
            if (dropTarget) dropTarget.classList.add("drop-target");
          }
        });
        el.addEventListener("pointerup", (e) => {
          if (!dragging) return;
          e.stopPropagation(); dragging = false; el.style.cursor = "grab"; el.style.zIndex = "";
          if (dropTarget) {
            const newParentId = dropTarget.dataset.id;
            dropTarget.classList.remove("drop-target");
            dropTarget = null;
            node.parentId = newParentId;
            showToast("Neu eingeordnet.");
            saveState(); renderNodes(); drawEdges();
            return;
          }
          if (moved) saveState();
        });

        world.appendChild(el);
      });
    }

    // Pan (drag empty canvas) + wheel zoom + pinch zoom
    let panning = false, panSX = 0, panSY = 0, panOX = 0, panOY = 0;
    const activePointers = new Map();
    let pinchStartDist = 0, pinchStartScale = 1, pinchAnchorX = 0, pinchAnchorY = 0;

    wrap.addEventListener("pointerdown", (e) => {
      if (e.target.closest(".mm-node") || e.target.closest(".mm-controls")) return;
      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (activePointers.size === 1) {
        panning = true; panSX = e.clientX; panSY = e.clientY; panOX = mmView.tx; panOY = mmView.ty;
        wrap.classList.add("panning");
        wrap.setPointerCapture(e.pointerId);
      } else if (activePointers.size === 2) {
        panning = false;
        const pts = [...activePointers.values()];
        const rect = wrap.getBoundingClientRect();
        pinchStartDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1;
        pinchStartScale = mmView.scale;
        const midX = (pts[0].x + pts[1].x) / 2 - rect.left, midY = (pts[0].y + pts[1].y) / 2 - rect.top;
        pinchAnchorX = (midX - mmView.tx) / mmView.scale;
        pinchAnchorY = (midY - mmView.ty) / mmView.scale;
      }
    });
    wrap.addEventListener("pointermove", (e) => {
      if (!activePointers.has(e.pointerId)) return;
      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (activePointers.size === 2) {
        const pts = [...activePointers.values()];
        const rect = wrap.getBoundingClientRect();
        const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1;
        const midX = (pts[0].x + pts[1].x) / 2 - rect.left, midY = (pts[0].y + pts[1].y) / 2 - rect.top;
        mmView.scale = Math.min(2.5, Math.max(0.15, pinchStartScale * (dist / pinchStartDist)));
        mmView.tx = midX - pinchAnchorX * mmView.scale;
        mmView.ty = midY - pinchAnchorY * mmView.scale;
        applyTransform(false);
      } else if (panning) {
        mmView.tx = panOX + (e.clientX - panSX);
        mmView.ty = panOY + (e.clientY - panSY);
        applyTransform(false);
      }
    });
    function endPan(e) {
      activePointers.delete(e.pointerId);
      if (activePointers.size < 2) pinchStartDist = 0;
      if (activePointers.size === 0) { panning = false; wrap.classList.remove("panning"); }
    }
    wrap.addEventListener("pointerup", endPan);
    wrap.addEventListener("pointercancel", endPan);
    wrap.addEventListener("pointerleave", (e) => { if (activePointers.size <= 1) endPan(e); });

    wrap.addEventListener("wheel", (e) => {
      e.preventDefault();
      const rect = wrap.getBoundingClientRect();
      if (e.ctrlKey || e.metaKey) {
        const factor = e.deltaY < 0 ? 1.08 : 0.93;
        zoomBy(factor, e.clientX - rect.left, e.clientY - rect.top);
      } else {
        mmView.tx -= e.deltaX;
        mmView.ty -= e.deltaY;
        applyTransform(false);
      }
    }, { passive: false });

    wrap.addEventListener("dblclick", (e) => {
      if (e.target.closest(".mm-node") || e.target.closest(".mm-controls")) return;
      addChildTo(selectedId || root.id);
    });

    document.getElementById("mmZoomIn").onclick = () => zoomBy(1.2);
    document.getElementById("mmZoomOut").onclick = () => zoomBy(0.8);
    document.getElementById("mmZoomFit").onclick = () => fitToContent(true);

    let resizeTimer;
    const onResize = () => {
      if (!document.body.contains(wrap)) { window.removeEventListener("resize", onResize); return; }
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => fitToContent(false), 150);
    };
    window.addEventListener("resize", onResize);

    const onKeydown = (e) => {
      if (!document.body.contains(wrap)) { document.removeEventListener("keydown", onKeydown); return; }
      if (currentView !== "mindmap") return;
      if ((e.key === "Delete" || e.key === "Backspace") && selectedId && document.activeElement.className !== "mm-text") {
        e.preventDefault(); deleteSubtree(selectedId);
      }
    };
    document.addEventListener("keydown", onKeydown);

    toolbar.querySelector("#mmAddBranch").onclick = () => addChildTo(root.id);
    toolbar.querySelector("#mmAddChild").onclick = () => addChildTo(selectedId || root.id);
    toolbar.querySelector("#mmDeleteNode").onclick = () => {
      if (!selectedId) { showToast("Kein Knoten ausgewählt."); return; }
      deleteSubtree(selectedId);
    };

    renderNodes();
    drawEdges();
    fitToContent(false);
  }

  /* ============ AUFGABEN & BELOHNUNGEN ============ */
  function ledgerAdd(profileId, delta, reason) {
    const entry = { id: uid(), profileId, delta, reason, at: Date.now() };
    state.pointsLedger.push(entry);
    return entry.id;
  }
  function ledgerRemove(entryId) {
    state.pointsLedger = state.pointsLedger.filter(l => l.id !== entryId);
  }
