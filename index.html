      grid.appendChild(h);
    });

    const year = calendarCursor.getFullYear(), month = calendarCursor.getMonth();
    const firstDay = new Date(year, month, 1);
    const startOffset = (firstDay.getDay() + 6) % 7; // Monday-first
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const todayStr = new Date().toISOString().slice(0, 10);

    for (let i = 0; i < startOffset; i++) grid.appendChild(document.createElement("div"));

    for (let day = 1; day <= daysInMonth; day++) {
      const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
      const cell = document.createElement("div");
      cell.style.cssText = `min-height:92px;border:1px solid var(--border);border-radius:var(--radius);padding:6px;background:var(--surface);cursor:pointer;position:relative;${dateStr === todayStr ? "outline:2px solid var(--accent);" : ""}`;
      const dayEvents = state.events.filter(ev => ev.date === dateStr);
      const custody = custodyAssignmentsForDate(dateStr);
      cell.innerHTML = `<div style="font-size:12px;color:var(--text-muted);margin-bottom:4px;">${day}</div>
        <div style="display:flex;flex-direction:column;gap:2px;">
          ${dayEvents.slice(0, 3).map(ev => {
            const p = getProfile((ev.profileIds || [])[0]);
            const color = p ? p.color : "var(--accent)";
            return `<div class="cal-event" data-id="${ev.id}" style="font-size:10.5px;background:${color};color:#fff;border-radius:3px;padding:2px 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(ev.title)}</div>`;
          }).join("")}
          ${dayEvents.length > 3 ? `<div style="font-size:10px;color:var(--text-muted);">+${dayEvents.length - 3} mehr</div>` : ""}
        </div>
        ${custody.length ? `<div class="cal-custody-row">${custody.map(({ schedule, result }) => {
          const parents = (result.block.profileIds || []).map(pid => getProfile(pid)).filter(Boolean);
          const label = (parents.map(p => p.name).join(" & ") || "frei") + (result.isSwitchDay ? " · Wechseltag" : "");
          const title = `${escapeHtml(schedule.name)}: ${escapeHtml(label)}`;
          if (!parents.length) return `<span class="custody-dot custody-dot-empty" title="${title}">–</span>`;
          return parents.map(p => `<span class="custody-dot${result.isSwitchDay ? " custody-switch" : ""}" style="background:${p.color};" title="${title}">${result.isSwitchDay ? "⇄" : (p.emoji || p.name.charAt(0))}</span>`).join("");
        }).join("")}</div>` : ""}`;
      cell.onclick = (e) => {
        const evChip = e.target.closest(".cal-event");
        if (evChip) { openEventEditor(state.events.find(ev => ev.id === evChip.dataset.id)); return; }
        openEventEditor(null, dateStr);
      };
      grid.appendChild(cell);
    }
    container.appendChild(grid);

    toolbar.querySelector("#calPrev").onclick = () => { calendarCursor = new Date(year, month - 1, 1); render(); };
    toolbar.querySelector("#calNext").onclick = () => { calendarCursor = new Date(year, month + 1, 1); render(); };
    toolbar.querySelector("#calToday").onclick = () => { calendarCursor = new Date(); render(); };
    toolbar.querySelector("#calAdd").onclick = () => openEventEditor(null, todayStr);
    toolbar.querySelector("#calCustody").onclick = () => openCustodyManager();
  }

  function openEventEditor(existing, defaultDate) {
    const draft = existing ? { ...existing, profileIds: [...(existing.profileIds || [])] } : {
      id: uid(), title: "", date: defaultDate || new Date().toISOString().slice(0, 10), time: "", profileIds: []

    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML = `
      <div class="modal" style="max-width:440px;">
        <div class="modal-header"><h2>${existing ? "Termin bearbeiten" : "Neuer Termin"}</h2><button class="close-btn" id="closeModal">✕</button></div>
        <div class="field"><label>Titel</label><input type="text" id="e-title" value="${escapeHtml(draft.title)}" placeholder="z. B. Zahnarzt Mia"></div>
        <div class="field"><label>Datum</label><input type="text" id="e-date" value="${draft.date}" placeholder="JJJJ-MM-TT"></div>
        <div class="field"><label>Uhrzeit (optional)</label><input type="text" id="e-time" value="${escapeHtml(draft.time || "")}" placeholder="z. B. 15:30"></div>

  /* ============ WECHSELMODELL (Betreuungs-Rotation) ============ */
  function openCustodyManager() {
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    function renderList() {
      const parents = state.profiles.filter(p => p.role === "parent");
      const children = state.profiles.filter(p => p.role === "child");
      overlay.innerHTML = `
        <div class="modal" style="max-width:560px;">
          <div class="modal-header"><h2>Wechselmodell</h2><button class="close-btn" id="closeModal">✕</button></div>
          <p style="font-size:13px;color:var(--text-muted);margin-top:-6px;">
            Legt fest, wer an welchem Tag die Kinder betreut — mit frei wählbarem Rhythmus (z. B. Woche/Woche, 2-2-3, oder eigenes Muster) und einem frei verschiebbaren Startdatum, das den Wechseltag bestimmt.
          </p>
          ${(!parents.length || !children.length) ? `<div class="empty-state" style="padding:20px;"><span class="empty-icon">👪</span>Legt zuerst mindestens ein Eltern- und ein Kind-Profil an (Rolle beim Profil einstellbar).</div>` : ""}
          <div id="scheduleList">
            ${state.custodySchedules.map(s => {
              const cyc = s.blocks.reduce((sum, b) => sum + (b.days || 0), 0);
              const childNames = s.childIds.map(id => getProfile(id)).filter(Boolean).map(p => p.name).join(", ") || "—";
              const pattern = s.blocks.map(b => {
                const names = (b.profileIds || []).map(id => getProfile(id)).filter(Boolean).map(p => p.emoji || p.name.charAt(0)).join("");
                return `${b.days}T ${names || "–"}`;
              }).join(" → ");
              return `<div class="connector-card" data-id="${s.id}">
                <div class="connector-head"><h4>🔁 ${escapeHtml(s.name)}</h4>
                  <div style="display:flex;gap:6px;">
                    <button class="btn btn-sm edit-schedule">Bearbeiten</button>
                    <button class="btn btn-sm btn-danger del-schedule">Löschen</button>
                  </div>
                </div>
                <p style="font-size:12.5px;color:var(--text-muted);margin:0 0 4px;">Kinder: ${escapeHtml(childNames)} · Zyklus: ${cyc} Tage ab ${s.startDate}</p>
                <p style="font-size:12.5px;">${escapeHtml(pattern)}</p>
              </div>`;
            }).join("") || (parents.length && children.length ? `<div class="empty-state" style="padding:20px;"><span class="empty-icon">🔁</span>Noch kein Wechselmodell angelegt.</div>` : "")}
          </div>
          <div class="modal-footer">
            <div></div>
            <div class="modal-footer-right">
              <button class="btn btn-ghost" id="cancelBtn">Schließen</button>
              ${parents.length && children.length ? `<button class="btn btn-accent" id="addScheduleBtn">+ Neues Wechselmodell</button>` : ""}
            </div>
          </div>
        </div>`;
      overlay.querySelector("#closeModal").onclick = () => overlay.remove();
      overlay.querySelector("#cancelBtn").onclick = () => overlay.remove();
      const addBtn = overlay.querySelector("#addScheduleBtn");
      if (addBtn) addBtn.onclick = () => openCustodyScheduleEditor(null, renderList);
      overlay.querySelectorAll(".edit-schedule").forEach(btn => {
        btn.onclick = () => {
          const id = btn.closest("[data-id]").dataset.id;
          openCustodyScheduleEditor(state.custodySchedules.find(s => s.id === id), renderList);
        };
      });
      overlay.querySelectorAll(".del-schedule").forEach(btn => {
        btn.onclick = () => {
          const id = btn.closest("[data-id]").dataset.id;
          if (confirm("Dieses Wechselmodell wirklich löschen?")) {
            state.custodySchedules = state.custodySchedules.filter(s => s.id !== id);
            saveState(); renderList(); render();
          }
        };
      });
    }
    renderList();
    overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
    document.body.appendChild(overlay);
  }

  function openCustodyScheduleEditor(existing, onDone) {
    const draft = existing ? JSON.parse(JSON.stringify(existing)) : {
      id: uid(), name: "Wechselmodell", startDate: new Date().toISOString().slice(0, 10),
      childIds: [], blocks: [{ days: 7, profileIds: [] }, { days: 7, profileIds: [] }]
    };
    const parents = state.profiles.filter(p => p.role === "parent");
    const children = state.profiles.filter(p => p.role === "child");
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.style.zIndex = "70";
    overlay.innerHTML = `
      <div class="modal" style="max-width:520px;">
        <div class="modal-header"><h2>${existing ? "Wechselmodell bearbeiten" : "Neues Wechselmodell"}</h2><button class="close-btn" id="closeModal">✕</button></div>
        <div class="field"><label>Name</label><input type="text" id="cs-name" value="${escapeHtml(draft.name)}" placeholder="z. B. Wechselmodell Mia &amp; Ben"></div>
        <div class="field"><label>Betroffene Kinder</label>
          <div style="display:flex;flex-wrap:wrap;gap:8px;">
            ${children.map(c => `<label class="profile-chip" style="cursor:pointer;">
              <input type="checkbox" class="cs-child" value="${c.id}" ${draft.childIds.includes(c.id) ? "checked" : ""}>
              <span class="mini-avatar" style="background:${c.color};">${c.emoji || c.name.charAt(0)}</span> ${escapeHtml(c.name)}
            </label>`).join("")}
          </div>
        </div>
        <div class="field"><label>Startdatum (bestimmt den Wechseltag)</label>
          <input type="text" id="cs-start" value="${draft.startDate}" placeholder="JJJJ-MM-TT">
        </div>
        <div class="field">
          <label>Rhythmus (Tage je Phase, wiederholt sich fortlaufend)</label>
          <div style="display:flex;gap:6px;margin-bottom:8px;">
            <button type="button" class="btn btn-sm" id="presetWeekly">Vorlage: Woche/Woche</button>
            <button type="button" class="btn btn-sm" id="preset223">Vorlage: 2-2-3</button>
          </div>
          <div id="blockList"></div>
          <button type="button" class="btn btn-sm add-row-btn" id="addBlockBtn">+ Phase hinzufügen</button>
        </div>
        <div class="modal-footer">
          <div>${existing ? `<button class="btn btn-danger" id="deleteBtn">Löschen</button>` : ""}</div>
          <div class="modal-footer-right">
            <button class="btn btn-ghost" id="cancelBtn">Abbrechen</button>
            <button class="btn btn-accent" id="saveBtn">Speichern</button>
          </div>
        </div>
      </div>`;
    document.body.appendChild(overlay);

    function renderBlocks() {
      const wrap = overlay.querySelector("#blockList");
      wrap.innerHTML = "";
      draft.blocks.forEach((b, i) => {
        const row = document.createElement("div");
        row.className = "custody-block-row";
        row.innerHTML = `
          <input type="number" min="1" value="${b.days}" class="block-days">
          <span style="font-size:12px;color:var(--text-muted);">Tage bei</span>
          ${parents.map(p => `<label style="display:flex;align-items:center;gap:4px;cursor:pointer;font-size:12.5px;">
            <input type="checkbox" class="block-parent" value="${p.id}" ${(b.profileIds || []).includes(p.id) ? "checked" : ""} style="accent-color:${p.color};">
            <span class="mini-avatar" style="background:${p.color};">${p.emoji || p.name.charAt(0)}</span>${escapeHtml(p.name)}
          </label>`).join("")}
          <button type="button" class="del" title="Phase entfernen" style="margin-left:auto;background:none;border:none;color:var(--text-muted);font-size:16px;">✕</button>
        `;
        row.querySelector(".block-days").oninput = (e) => { b.days = Math.max(1, parseInt(e.target.value, 10) || 1); };
        row.querySelectorAll(".block-parent").forEach(cb => {
          cb.onchange = () => { b.profileIds = [...row.querySelectorAll(".block-parent:checked")].map(x => x.value); };
        });
        row.querySelector(".del").onclick = () => {
          if (draft.blocks.length <= 1) { showToast("Mindestens eine Phase wird benötigt."); return; }
          draft.blocks.splice(i, 1); renderBlocks();
        };
        wrap.appendChild(row);
      });
    }
    renderBlocks();

    overlay.querySelector("#addBlockBtn").onclick = () => { draft.blocks.push({ days: 7, profileIds: [] }); renderBlocks(); };
    overlay.querySelector("#presetWeekly").onclick = () => { draft.blocks = [{ days: 7, profileIds: [] }, { days: 7, profileIds: [] }]; renderBlocks(); };
    overlay.querySelector("#preset223").onclick = () => {
      draft.blocks = [{ days: 2, profileIds: [] }, { days: 2, profileIds: [] }, { days: 3, profileIds: [] }];
      renderBlocks();
    };

    function close() { overlay.remove(); }
    overlay.querySelector("#closeModal").onclick = close;
    overlay.querySelector("#cancelBtn").onclick = close;
    overlay.onclick = (e) => { if (e.target === overlay) close(); };
    if (existing) {
      overlay.querySelector("#deleteBtn").onclick = () => {
        if (confirm("Dieses Wechselmodell wirklich löschen?")) {
          state.custodySchedules = state.custodySchedules.filter(s => s.id !== existing.id);
          saveState(); close(); if (onDone) onDone(); render();
        }
      };
    }
    overlay.querySelector("#saveBtn").onclick = () => {
      draft.name = overlay.querySelector("#cs-name").value.trim() || "Wechselmodell";
      draft.childIds = [...overlay.querySelectorAll(".cs-child:checked")].map(cb => cb.value);
      draft.startDate = overlay.querySelector("#cs-start").value.trim() || draft.startDate;
      if (!draft.childIds.length) { showToast("Bitte mindestens ein Kind auswählen."); return; }
      if (!draft.blocks.some(b => (b.profileIds || []).length)) { showToast("Bitte mindestens einer Phase ein Elternteil zuweisen."); return; }
      const idx = state.custodySchedules.findIndex(s => s.id === draft.id);
      if (idx >= 0) state.custodySchedules[idx] = draft; else state.custodySchedules.push(draft);
      saveState(); close(); if (onDone) onDone(); render();
      showToast(existing ? "Wechselmodell aktualisiert." : "Wechselmodell angelegt.");
    };
    setTimeout(() => overlay.querySelector("#cs-name").focus(), 30);
  }

  function mmOutlineLines() {
    const root = state.mindmap.nodes.find(n => n.root);
    if (!root) return [];
    const lines = [];
    function walk(node, depth) {
      lines.push({ depth, text: node.text });
      mmChildren(node.id).forEach(child => walk(child, depth + 1));
    }
    walk(root, 0);
    return lines;
  }

  /* ============ EXPORT ============ */
  function scopedItems(scope) {
    if (scope === "all") return state.items;
    return state.items.filter(i => i.type === scope);
  }

    const snap = JSON.parse(JSON.stringify(base || state));
    if (snap.connectors && snap.connectors.network) snap.connectors.network.authHeader = "";
    snap.adminPasswordHash = "";
    return snap;
  }

  function downloadBlob(content, filename, mime) {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    showToast(`${filename} wird heruntergeladen.`);
  }

  function exportJson() {
    const data = exportScope === "all" ? sanitizedStateSnapshot() : { ...sanitizedStateSnapshot(), items: scopedItems(exportScope) };
    downloadBlob(JSON.stringify(data, null, 2), `dapp-${exportScope}-${Date.now()}.json`, "application/json");
  }

  function exportMarkdown() {
    const items = scopedItems(exportScope).sort((a, b) => b.updatedAt - a.updatedAt);
    let md = `# DApp — Export\n\n_Erstellt am ${fmtDate(Date.now())}_\n\n`;
    const groups = { note: "## 📝 Notizen\n", checklist: "## ☑️ Checklisten\n", image: "## 🖼️ Bilder\n" };
    ["note", "checklist", "image"].forEach(type => {
      const group = items.filter(i => i.type === type);
      if (!group.length) return;
      md += "\n" + groups[type] + "\n";
      group.forEach(it => {
        md += `### ${it.title}\n`;
        if (it.tags && it.tags.length) md += it.tags.map(t => `\`#${t}\``).join(" ") + "\n\n";
        if (type === "note") md += `${it.body || "_(leer)_"}\n\n`;
        if (type === "checklist") {
          (it.items || []).forEach(row => { md += `- [${row.done ? "x" : " "}] ${row.text}\n`; });
          md += "\n";
        }
        if (type === "image") md += `${it.caption ? it.caption + "\n\n" : ""}_(Bild eingebettet im JSON- oder PDF-Export)_\n\n`;
      });
    });
    if (exportScope === "all" && state.mindmap.nodes.length) {
      md += "\n## 🕸️ Mind-Map\n\n";
      mmOutlineLines().forEach(l => { md += `${"  ".repeat(l.depth)}- ${l.depth === 0 ? "**" + l.text + "**" : l.text}\n`; });
    }
    downloadBlob(md, `dapp-${exportScope}-${Date.now()}.md`, "text/markdown");
  }

  function exportPdf() {
    if (!window.jspdf) { showToast("PDF-Bibliothek konnte nicht geladen werden (keine Internetverbindung?)."); return; }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "pt", format: "a4" });
    const pageW = doc.internal.pageSize.getWidth();
    const margin = 48;
    let y = margin;

    function ensureSpace(lines) {
      if (y + lines * 14 > doc.internal.pageSize.getHeight() - margin) { doc.addPage(); y = margin; }
    }
    function heading(text, size = 16) {
      ensureSpace(3);
      doc.setFont("helvetica", "bold"); doc.setFontSize(size);
      doc.text(text, margin, y); y += size * 1.1;
      doc.setFont("helvetica", "normal"); doc.setFontSize(11);
    }
    function paragraph(text) {
      const lines = doc.splitTextToSize(text || "", pageW - margin * 2);
      lines.forEach(line => { ensureSpace(1); doc.text(line, margin, y); y += 14; });
      y += 6;
    }

    heading("DApp — Export", 20);
    doc.setFontSize(10); doc.setTextColor(120);
    doc.text(`Erstellt am ${fmtDate(Date.now())}`, margin, y); y += 22;
    doc.setTextColor(20); doc.setFontSize(11);

    const items = scopedItems(exportScope).sort((a, b) => b.updatedAt - a.updatedAt);
    ["note", "checklist", "image"].forEach(type => {
      const group = items.filter(i => i.type === type);
      if (!group.length) return;
      heading({ note: "Notizen", checklist: "Checklisten", image: "Bilder" }[type], 15);
      group.forEach(it => {
        heading(it.title, 12);
        if (it.tags && it.tags.length) { doc.setTextColor(130); paragraph("Tags: " + it.tags.join(", ")); doc.setTextColor(20); }
        if (type === "note") paragraph(it.body || "(leer)");
        if (type === "checklist") (it.items || []).forEach(row => paragraph(`${row.done ? "[x]" : "[ ]"} ${row.text}`));
        if (type === "image") {
          if (it.caption) paragraph(it.caption);
          if (it.dataUrl) {
            try {
              ensureSpace(10);
              const fmtMatch = /^data:image\/(png|jpe?g|webp)/i.exec(it.dataUrl);
              const fmt = fmtMatch ? fmtMatch[1].toUpperCase().replace("JPG", "JPEG") : "PNG";
              doc.addImage(it.dataUrl, fmt === "WEBP" ? "PNG" : fmt, margin, y, 200, 140);
              y += 150;
            } catch (e) { paragraph("(Bild konnte nicht eingebettet werden)"); }
          }
        }
        y += 4;
      });
    });

    if (exportScope === "all" && state.mindmap.nodes.length) {
      heading("Mind-Map", 15);
      mmOutlineLines().forEach(l => paragraph("  ".repeat(l.depth) + (l.depth === 0 ? "★ " : "– ") + l.text));
    }

    doc.save(`dapp-${exportScope}-${Date.now()}.pdf`);
    showToast("PDF wird heruntergeladen.");
  }

  function getReadableTextColor(hex) {
    const c = hex.replace("#", "");
    const r = parseInt(c.substr(0, 2), 16), g = parseInt(c.substr(2, 2), 16), b = parseInt(c.substr(4, 2), 16);
    const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    return luminance > 0.6 ? "#1a1a1a" : "#f5f5f5";
  }

  /* ============ PAPA-BEREICH (kennwortgeschützter Admin-/Erweiterungsbereich) ============ */
  async function sha256Hex(text) {
    if (!window.crypto || !window.crypto.subtle) {
      throw new Error("Web Crypto nicht verfügbar");
    }
    const enc = new TextEncoder().encode(text);
    const buf = await crypto.subtle.digest("SHA-256", enc);
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
  }

      return;
    }
    if (!state.adminPasswordHash) return renderAdminSetup(container);
    if (!adminUnlocked) return renderAdminGate(container);
    return renderAdminPanel(container);
  }

  /* ============ NETZWERK-SYNCHRONISIERUNG ============ */
  let autoSyncTimer = null;

  function buildSyncHeaders() {
    const headers = { "Content-Type": "application/json" };
    const auth = (state.connectors.network.authHeader || "").trim();
    if (auth) headers["Authorization"] = auth;
    return headers;
  }

  function setLastSyncNote(text) {
    const el = document.getElementById("netLastSync");
    if (el) el.textContent = text;
  }

  async function pushToNetwork(silent) {
    const net = state.connectors.network;
    if (!net.url) { if (!silent) showToast("Bitte zuerst eine Server-Adresse eintragen."); return false; }
    try {
      const res = await fetch(net.url, {
        method: net.method || "PUT",
        headers: buildSyncHeaders(),
        body: JSON.stringify(sanitizedStateSnapshot())
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      net.lastSyncAt = Date.now();
      saveState({ skipTouch: true });
      setLastSyncNote("Zuletzt hochgeladen: " + fmtDate(net.lastSyncAt));
      if (!silent) showToast("DApp wurde hochgeladen.");
      return true;
    } catch (err) {
      if (!silent) showToast("Hochladen fehlgeschlagen — Adresse, CORS oder Netzwerk prüfen.");
      console.warn("Netzwerk-Sync (Upload) fehlgeschlagen:", err);
      return false;
    }
  }

  async function pullFromNetwork(silent, opts) {
    const net = state.connectors.network;
    if (!net.url) { if (!silent) showToast("Bitte zuerst eine Server-Adresse eintragen."); return false; }
    try {
      const res = await fetch(net.url, { method: "GET", headers: buildSyncHeaders() });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const remote = await res.json();
      if (!remote || !Array.isArray(remote.items)) throw new Error("Ungültiges Format");

      const remoteModified = (remote.meta && remote.meta.lastModified) || 0;
      const localModified = (state.meta && state.meta.lastModified) || 0;
      if (opts && opts.onlyIfNewer && remoteModified <= localModified) {
        setLastSyncNote("Lokaler Stand ist bereits aktuell (Stand Server: " + fmtDate(remoteModified) + ").");
        return false;
      }
      if (!silent && !(opts && opts.skipConfirm)) {
        if (!confirm("Der Server-Stand ersetzt deine lokalen Daten auf diesem Gerät. Fortfahren?")) return false;
      }
      const keepNetworkConfig = state.connectors.network;
      const keepAdminHash = state.adminPasswordHash;
      state = { ...defaultState(), ...remote,
        connectors: { ...defaultState().connectors, ...(remote.connectors || {}), network: keepNetworkConfig },
        adminPasswordHash: keepAdminHash };
      state.connectors.network.lastSyncAt = Date.now();
      saveState({ skipTouch: true });
      applyTheme(state.theme || "papier");
      renderProfileBar();
      render();
      setLastSyncNote("Zuletzt heruntergeladen: " + fmtDate(state.connectors.network.lastSyncAt));
      if (!silent) showToast("DApp wurde vom Server übernommen.");
      return true;
    } catch (err) {
      if (!silent) showToast("Herunterladen fehlgeschlagen — Adresse, CORS oder Netzwerk prüfen.");
      console.warn("Netzwerk-Sync (Download) fehlgeschlagen:", err);
      return false;
    }
  }

  async function testNetworkConnection() {
    const net = state.connectors.network;
    if (!net.url) { showToast("Bitte zuerst eine Server-Adresse eintragen."); return; }
    showToast("Teste Verbindung…");
    try {
      const res = await fetch(net.url, { method: "GET", headers: buildSyncHeaders() });
      showToast(res.ok ? `Verbindung erfolgreich (HTTP ${res.status}).` : `Server antwortet mit HTTP ${res.status}.`);
    } catch (err) {
      showToast("Verbindung fehlgeschlagen — Adresse, CORS oder Netzwerk prüfen.");
    }
  }

  function stopAutoSync() {
    if (autoSyncTimer) { clearInterval(autoSyncTimer); autoSyncTimer = null; }
  }

  function startAutoSync() {
    stopAutoSync();
    const net = state.connectors.network;
    if (!net.autoSync || !net.url) return;
    const ms = Math.max(1, net.intervalMinutes || 5) * 60 * 1000;
    autoSyncTimer = setInterval(async () => {
      const pulled = await pullFromNetwork(true, { onlyIfNewer: true, skipConfirm: true });
      if (!pulled) await pushToNetwork(true);
    }, ms);
  }

  function wireNetworkSyncControls(scope) {
    const net = state.connectors.network;
    const urlEl = scope.querySelector("#netUrl");
    const authEl = scope.querySelector("#netAuth");
    const methodEl = scope.querySelector("#netMethod");
    const intervalEl = scope.querySelector("#netInterval");
    const autoEl = scope.querySelector("#netAutoSync");
    const badge = scope.querySelector("#netStatusBadge");

    if (net.lastSyncAt) setLastSyncNote("Zuletzt synchronisiert: " + fmtDate(net.lastSyncAt));

    function persistConfig() {
      net.url = urlEl.value.trim();
      net.authHeader = authEl.value.trim();
      net.method = methodEl.value;
      net.intervalMinutes = parseInt(intervalEl.value, 10) || 5;
      saveState({ skipTouch: true });
    }

    [urlEl, authEl].forEach(el => el.addEventListener("change", persistConfig));
    methodEl.addEventListener("change", persistConfig);
    intervalEl.addEventListener("change", () => { persistConfig(); startAutoSync(); });
    autoEl.addEventListener("change", () => {
      net.autoSync = autoEl.checked;
      persistConfig();
      badge.textContent = net.autoSync ? "Auto-Sync aktiv" : "manuell";
      if (net.autoSync) {
        if (!net.url) { showToast("Bitte zuerst eine Server-Adresse eintragen."); autoEl.checked = false; net.autoSync = false; persistConfig(); return; }
        startAutoSync();
        showToast("Automatische Synchronisierung aktiviert.");
      } else {
        stopAutoSync();
      }
    });

    scope.querySelector("#netTestBtn").onclick = () => { persistConfig(); testNetworkConnection(); };
    scope.querySelector("#netPushBtn").onclick = () => { persistConfig(); pushToNetwork(false); };
    scope.querySelector("#netPullBtn").onclick = () => { persistConfig(); pullFromNetwork(false); };
  }

  /* ============ QUICK-ADD MENU ============ */
  function openQuickAddMenu(anchorBtn) {
    document.querySelectorAll(".quick-add-menu").forEach(m => m.remove());
    const menu = document.createElement("div");
    menu.className = "quick-add-menu";
    Object.assign(menu.style, {
      position: "absolute", background: "var(--surface)", border: "1px solid var(--border)",
      borderRadius: "var(--radius)", boxShadow: "var(--shadow)", padding: "6px", zIndex: 70,
      display: "flex", flexDirection: "column", minWidth: "170px"
    });
    const options = [
      { type: "note", label: "📝 Notiz" },
      { type: "checklist", label: "☑️ Checkliste" },
      { type: "image", label: "🖼️ Bild" },
    ];
    options.forEach(o => {
      const b = document.createElement("button");
      b.className = "nav-item";
      b.style.padding = "8px 10px";
      b.textContent = o.label;
      b.onclick = () => { menu.remove(); openEditor(o.type); };
      menu.appendChild(b);
    });
    document.body.appendChild(menu);
    const rect = anchorBtn.getBoundingClientRect();
    menu.style.top = (rect.bottom + window.scrollY + 6) + "px";
    menu.style.right = (window.innerWidth - rect.right) + "px";
    setTimeout(() => {
      document.addEventListener("click", function handler(e) {
        if (!menu.contains(e.target) && e.target !== anchorBtn) { menu.remove(); document.removeEventListener("click", handler); }
      });
    }, 10);
  }

  /* ============ INIT ============ */
  function init() {
    applyTheme(state.theme || "papier");
    if (!state.activeProfileId && state.profiles.length) state.activeProfileId = state.profiles[0].id;
    renderProfileBar();
    const buildTagEl = document.getElementById("buildTag");
    if (buildTagEl) buildTagEl.textContent = `Build ${APP_BUILD_NUMBER} · ${APP_BUILD_DATE}`;

    document.getElementById("hamburger").onclick = () => {
      document.getElementById("sidebar").classList.toggle("open");
    };
    document.querySelectorAll(".nav-item[data-view]").forEach(btn => {
      btn.onclick = () => setView(btn.dataset.view);
    });
    document.getElementById("newItemBtn").onclick = (e) => openQuickAddMenu(e.currentTarget);

    let searchTimer;
    document.getElementById("searchInput").oninput = (e) => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => { searchQuery = e.target.value.trim(); render(); }, 150);
    };

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA") {
        e.preventDefault(); document.getElementById("searchInput").focus();
      }
    });

    render();
    registerServiceWorker();
    setupInstallPrompt();
    if (state.connectors.network.autoSync && state.connectors.network.url) {
      pullFromNetwork(true, { onlyIfNewer: true, skipConfirm: true }).then(() => startAutoSync());
    }
  }

  /* ============ PWA: Service Worker & Installierbarkeit ============ */
  function registerServiceWorker() {
    if (!("serviceWorker" in navigator)) return;
    // Nur registrieren, wenn die Datei tatsächlich über http(s) ausgeliefert wird
    // (bei lokalem Öffnen per file:// unterstützen Browser keine Service Worker).
    if (location.protocol === "file:") return;
    navigator.serviceWorker.register("./sw.js").catch((err) => {
      console.warn("Service Worker konnte nicht registriert werden:", err);
    });
  }

  function setupInstallPrompt() {
    let deferredPrompt = null;
    const btn = document.getElementById("installBtn");
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      btn.style.display = "flex";
    });
    btn.addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const choice = await deferredPrompt.userChoice;
      if (choice.outcome === "accepted") showToast("DApp wird installiert…");
      deferredPrompt = null;
      btn.style.display = "none";
    });
    window.addEventListener("appinstalled", () => {
      btn.style.display = "none";
      showToast("DApp wurde installiert.");
    });
  }

  document.addEventListener("DOMContentLoaded", init);
})();

</script>
</body>
</html>
