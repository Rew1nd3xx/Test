<style>

/* ============ RESET & BASE ============ */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; overflow-x: hidden; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  transition: background .35s ease, color .35s ease;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font-family: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
::selection { background: var(--accent); color: var(--surface); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}

/* ============ THEME TOKENS ============ */
/* 1. Papierblock — warm notebook, typewriter */
.theme-papier {
  --bg: #EAE2CE; --surface: #FBF7EC; --surface2: #F1E9D6;
  --text: #2B2621; --text-muted: #6B6153;
  --accent: #5F7038; --accent2: #2F4858;
  --border: #C9BC9C; --shadow: 0 2px 10px rgba(43,38,33,.12);
  --font-display: 'Special Elite', cursive; --font-body: 'Courier Prime', monospace;
  --radius: 2px; --pattern: none;
}
/* 2. Mitternacht — deep navy, gold */
.theme-mitternacht {
  --bg: #10142A; --surface: #1A2043; --surface2: #212A54;
  --text: #EDEBFA; --text-muted: #9FA3C7;
  --accent: #C9A24B; --accent2: #3F9C99;
  --border: #313A66; --shadow: 0 8px 24px rgba(0,0,0,.4);
  --font-display: 'Fraunces', serif; --font-body: 'Inter', sans-serif;
  --radius: 10px; --pattern: none;
}
/* 3. Skizzenblock — graph paper */
.theme-skizze {
  --bg: #E7ECF2; --surface: #FFFFFF; --surface2: #DCE4EE;
  --text: #29344A; --text-muted: #6C7793;
  --accent: #3A5A9B; --accent2: #C0453B;
  --border: #B9C6DB; --shadow: 0 2px 8px rgba(41,52,74,.1);
  --font-display: 'Kalam', cursive; --font-body: 'Inter', sans-serif;
  --radius: 4px;
  --pattern: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
}
/* 4. Bauhaus — primary geometry */
.theme-bauhaus {
  --bg: #F2EFE6; --surface: #FFFFFF; --surface2: #EAE5D6;
  --text: #1A1A1A; --text-muted: #555049;
  --accent: #D0263B; --accent2: #1D4E9B;
  --border: #1A1A1A; --shadow: 4px 4px 0 #1A1A1A;
  --font-display: 'Archivo Black', sans-serif; --font-body: 'Work Sans', sans-serif;
  --radius: 0px; --pattern: none;
}
/* 5. Wald — deep forest */
.theme-wald {
  --bg: #172A20; --surface: #203627; --surface2: #294432;
  --text: #EDE7D3; --text-muted: #A9B7A4;
  --accent: #86B35A; --accent2: #D9A441;
  --border: #35503E; --shadow: 0 6px 20px rgba(0,0,0,.35);
  --font-display: 'Fraunces', serif; --font-body: 'Source Sans 3', sans-serif;
  --radius: 8px; --pattern: none;
}
/* 6. Ozean — teal calm */
.theme-ozean {
  --bg: #0E3B43; --surface: #124A54; --surface2: #165B67;
  --text: #E7F5F3; --text-muted: #A9CFCB;
  --accent: #FF9270; --accent2: #F2D6A2;
  --border: #1E6773; --shadow: 0 8px 22px rgba(0,0,0,.3);
  --font-display: 'Poppins', sans-serif; --font-body: 'Nunito Sans', sans-serif;
  --radius: 14px; --pattern: none;
}
/* 8. Rosé — soft editorial */
.theme-rose {
  --bg: #F6E9EE; --surface: #FFF8FA; --surface2: #F0DCE3;
  --text: #4A2338; --text-muted: #8A5E71;
  --accent: #C6577B; --accent2: #B8925A;
  --border: #E3C3CF; --shadow: 0 4px 16px rgba(74,35,56,.12);
  --font-display: 'Playfair Display', serif; --font-body: 'Lora', serif;
  --radius: 6px; --pattern: none;
}
/* 9. Industrial — concrete & safety orange */
.theme-industrial {
  --bg: #DEDBD2; --surface: #F1EFE8; --surface2: #D2CEC2;
  --text: #232323; --text-muted: #5B5850;
  --accent: #E8590C; --accent2: #4A6572;
  --border: #232323; --shadow: none;
  --font-display: 'Oswald', sans-serif; --font-body: 'IBM Plex Sans', sans-serif;
  --radius: 0px; --pattern: none;
}
/* 10. Aurora — gradient dream */
.theme-aurora {
  --bg: #150B26; --surface: #1F1338; --surface2: #291A47;
  --text: #F1EBFF; --text-muted: #B4A4D9;
  --accent: #B15CDE; --accent2: #35D0BA;
  --border: #3A2A5C; --shadow: 0 10px 30px rgba(177,92,222,.25);
  --font-display: 'Space Grotesk', sans-serif; --font-body: 'Manrope', sans-serif;
  --radius: 14px; --pattern: none;
}
/* 11. Neon — cyberpunk glow */
.theme-neon {
  --bg: #0A0912; --surface: #120F1F; --surface2: #1B1730;
  --text: #F2EEFF; --text-muted: #8C86B8;
  --accent: #FF2E88; --accent2: #00E5FF;
  --border: #2C2650; --shadow: 0 0 24px rgba(255,46,136,.25);
  --font-display: 'Orbitron', sans-serif; --font-body: 'Rajdhani', sans-serif;
  --radius: 10px; --pattern: none;
}
/* 12. Sternenstaub — magical starlight */
.theme-stardust {
  --bg: #0D0B1F; --surface: #171331; --surface2: #211C42;
  --text: #EDE8FF; --text-muted: #9C93C4;
  --accent: #9C7FFF; --accent2: #FFD86B;
  --border: #2E2757; --shadow: 0 0 22px rgba(156,127,255,.28);
  --font-display: 'Cinzel', serif; --font-body: 'Manrope', sans-serif;
  --radius: 12px; --pattern: none;
}

/* ---- Aurora: drifting glow blobs behind the app ---- */
.theme-aurora #app {
  position: relative; z-index: 0;
}
.theme-aurora #app::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(38vw 38vw at 15% 20%, rgba(177,92,222,.35), transparent 70%),
    radial-gradient(32vw 32vw at 85% 30%, rgba(53,208,186,.28), transparent 70%),
    radial-gradient(40vw 40vw at 50% 90%, rgba(255,157,140,.18), transparent 70%);
  filter: blur(10px);
  animation: auroraDrift 22s ease-in-out infinite alternate;
}
@keyframes auroraDrift {
  0%   { transform: translate(0, 0) scale(1); }
  50%  { transform: translate(2%, -3%) scale(1.06); }
  100% { transform: translate(-2%, 2%) scale(1); }
}

/* ---- Neon: glowing edges on interactive elements ---- */
.theme-neon .brand-mark, .theme-neon .brand-text { text-shadow: 0 0 10px var(--accent), 0 0 22px rgba(255,46,136,.5); }
.theme-neon .btn-accent { box-shadow: 0 0 14px rgba(255,46,136,.55), 0 0 2px rgba(255,46,136,.8); border-color: var(--accent); }
.theme-neon .btn-accent:hover { box-shadow: 0 0 22px rgba(255,46,136,.75), 0 0 4px rgba(255,46,136,.9); }
.theme-neon .nav-item.active { box-shadow: 0 0 16px rgba(255,46,136,.45), inset 0 0 0 1px rgba(255,255,255,.08); }
.theme-neon .avatar.active { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--accent), 0 0 16px rgba(255,46,136,.6); }
.theme-neon .card:hover, .theme-neon .widget-card:hover { box-shadow: 0 0 0 1px var(--accent2), 0 0 24px rgba(0,229,255,.25); }
.theme-neon .mm-node.root { box-shadow: 0 0 28px rgba(255,46,136,.45), 0 4px 10px rgba(0,0,0,.3); }
.theme-neon .view-title { text-shadow: 0 0 18px rgba(255,46,136,.35); }
.theme-neon ::selection { background: var(--accent2); color: #0A0912; }

/* ---- Sternenstaub: soft twinkling starfield + gentle glow ---- */
.theme-stardust #app {
  position: relative; z-index: 0;
}
.theme-stardust #app::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image:
    radial-gradient(1.6px 1.6px at 12% 22%, #fff, transparent),
    radial-gradient(1.4px 1.4px at 28% 68%, #fff, transparent),
    radial-gradient(1.8px 1.8px at 45% 12%, #fff, transparent),
    radial-gradient(1.3px 1.3px at 62% 78%, #fff, transparent),
    radial-gradient(1.6px 1.6px at 78% 35%, #fff, transparent),
    radial-gradient(1.4px 1.4px at 88% 60%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 95% 15%, #fff, transparent),
    radial-gradient(1.3px 1.3px at 8% 85%, #fff, transparent),
    radial-gradient(1.7px 1.7px at 55% 50%, #fff, transparent),
    radial-gradient(1.4px 1.4px at 35% 40%, #fff, transparent);
  background-repeat: no-repeat;
  opacity: .55;
  animation: starTwinkle 5s ease-in-out infinite alternate;
}
@keyframes starTwinkle { from { opacity: .3; } to { opacity: .7; } }
.theme-stardust .brand-text { text-shadow: 0 0 14px rgba(156,127,255,.6); }
.theme-stardust .btn-accent { box-shadow: 0 0 16px rgba(156,127,255,.5); }
.theme-stardust .btn-accent:hover { box-shadow: 0 0 24px rgba(156,127,255,.7); }
.theme-stardust .card:hover, .theme-stardust .widget-card:hover { box-shadow: 0 0 24px rgba(255,216,107,.2), 0 1px 2px rgba(0,0,0,.2); }
.theme-stardust .mm-node.root { box-shadow: 0 0 26px rgba(156,127,255,.5); }
.theme-stardust .avatar.active { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--accent), 0 0 14px rgba(156,127,255,.6); }

/* 13. Blockwelt — blocky pixel-world look */
.theme-blockwelt {
  --bg: #2F7A21; --surface: #E4F0D6; --surface2: #C9E0AC;
  --text: #16330C; --text-muted: #3C5A2C;
  --accent: #4CAF32; --accent2: #7A4A20;
  --border: #16330C; --shadow: 5px 5px 0 rgba(0,0,0,.45);
  --font-display: 'Press Start 2P', monospace; --font-body: 'IBM Plex Mono', monospace;
  --radius: 0px; --pattern: none;
}
/* 14. Bausteine — colorful building-brick look */
.theme-bausteine {
  --bg: #EDE7D3; --surface: #FFFFFF; --surface2: #ECE7D6;
  --text: #1A1A1A; --text-muted: #6B6B6B;
  --accent: #D6001C; --accent2: #0057A6;
  --border: #1A1A1A; --shadow: 0 6px 0 rgba(0,0,0,.22);
  --font-display: 'Baloo 2', sans-serif; --font-body: 'Fredoka', sans-serif;
  --radius: 16px; --pattern: none;
}

/* ---- Blockwelt: grass-block texture, enchant shimmer, torch-flicker glow, break particles ---- */
body.theme-blockwelt {
  background-color: var(--bg);
  background-image:
    linear-gradient(rgba(0,0,0,.09) 0 50%, transparent 50%),
    linear-gradient(90deg, rgba(0,0,0,.09) 0 50%, transparent 50%),
    linear-gradient(rgba(255,255,255,.06) 0 50%, transparent 50%);
  background-size: 32px 32px, 32px 32px, 64px 64px;
  background-position: 0 0, 0 0, 16px 16px;
  image-rendering: pixelated;
}
.theme-blockwelt .sidebar, .theme-blockwelt .topbar { background-color: var(--surface); background-image: none; }
.theme-blockwelt .brand-text, .theme-blockwelt .brand-mark { color: var(--accent); text-shadow: 0 0 8px rgba(76,175,50,.6), 2px 2px 0 rgba(0,0,0,.15); }
.theme-blockwelt .view-title { color: var(--accent); text-shadow: 0 0 10px rgba(76,175,50,.55), 3px 3px 0 rgba(0,0,0,.25); }
.theme-blockwelt .btn { border-radius: 0; border-width: 2px; text-transform: uppercase; letter-spacing: .02em; font-size: 12px; }
.theme-blockwelt .btn-accent {
  position: relative; overflow: hidden;
  box-shadow: inset 2px 2px 0 rgba(255,255,255,.4), inset -2px -2px 0 rgba(0,0,0,.4), 4px 4px 0 rgba(0,0,0,.4), 0 0 18px rgba(76,175,50,.5);
  animation: blockTorchFlicker 2.6s ease-in-out infinite;
}
.theme-blockwelt .btn-accent::after {
  content: ""; position: absolute; top: 0; left: -60%; width: 40%; height: 100%;
  background: linear-gradient(120deg, transparent, rgba(255,255,255,.75), transparent);
  transform: skewX(-20deg); animation: blockEnchantSweep 2.8s ease-in-out infinite;
}
.theme-blockwelt .btn-accent:hover { transform: translate(1px, 1px); box-shadow: inset 2px 2px 0 rgba(255,255,255,.35), inset -2px -2px 0 rgba(0,0,0,.5), 3px 3px 0 rgba(0,0,0,.4), 0 0 26px rgba(76,175,50,.7); }
@keyframes blockEnchantSweep { 0% { left: -60%; } 55% { left: 130%; } 100% { left: 130%; } }
@keyframes blockTorchFlicker {
  0%, 100% { box-shadow: inset 2px 2px 0 rgba(255,255,255,.4), inset -2px -2px 0 rgba(0,0,0,.4), 4px 4px 0 rgba(0,0,0,.4), 0 0 18px rgba(76,175,50,.5); }
  50% { box-shadow: inset 2px 2px 0 rgba(255,255,255,.4), inset -2px -2px 0 rgba(0,0,0,.4), 4px 4px 0 rgba(0,0,0,.4), 0 0 28px rgba(76,175,50,.75); }
}
.theme-blockwelt .card, .theme-blockwelt .widget-card, .theme-blockwelt .mm-node {
  border-radius: 0 !important; border-width: 2px;
  box-shadow: inset 2px 2px 0 rgba(255,255,255,.4), inset -2px -2px 0 rgba(0,0,0,.25), var(--shadow);
}
.theme-blockwelt .card:hover, .theme-blockwelt .widget-card:hover { outline: 3px solid var(--accent); outline-offset: 2px; transform: none; box-shadow: inset 2px 2px 0 rgba(255,255,255,.4), inset -2px -2px 0 rgba(0,0,0,.25), 0 0 20px rgba(76,175,50,.45); }
.theme-blockwelt .mm-node.root { background: linear-gradient(180deg, var(--accent) 0 55%, var(--accent2) 55% 100%); border: 2px solid var(--border); box-shadow: 5px 5px 0 rgba(0,0,0,.4), 0 0 22px rgba(76,175,50,.5); }
.theme-blockwelt .avatar, .theme-blockwelt .mini-avatar { border-radius: 4px; }
.theme-blockwelt .avatar.active { border-radius: 4px; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent), 0 0 16px rgba(76,175,50,.7); }
.theme-blockwelt ::selection { background: var(--accent); color: #fff; }
.theme-blockwelt .nav-item.active { box-shadow: inset 0 0 0 1px rgba(0,0,0,.2), 0 0 14px rgba(76,175,50,.4); }
.theme-blockwelt #app::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  box-shadow: inset 0 0 120px rgba(0,0,0,.35);
  animation: blockVignettePulse 3.4s ease-in-out infinite;
}
.theme-blockwelt #app { position: relative; z-index: 0; }
@keyframes blockVignettePulse {
  0%, 100% { box-shadow: inset 0 0 120px rgba(0,0,0,.3); }
  50% { box-shadow: inset 0 0 160px rgba(0,0,0,.42); }
}

/* break-particle burst (spawned by JS on click) */
.mc-particle {
  position: fixed; width: 6px; height: 6px; pointer-events: none; z-index: 9999;
  image-rendering: pixelated; animation: mcParticleFly .55s ease-out forwards;
}
@keyframes mcParticleFly {
  0% { transform: translate(0,0) scale(1); opacity: 1; }
  100% { transform: translate(var(--mcx), var(--mcy)) scale(.3); opacity: 0; }
}

/* ---- Bausteine: stud bumps + bouncy plastic feel ---- */
.theme-bausteine .btn { border-width: 2px; font-weight: 700; }
.theme-bausteine .btn-accent {
  position: relative; overflow: visible; border-width: 0;
  background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 85%, #fff 15%), var(--accent) 45%, color-mix(in srgb, var(--accent) 80%, #000 20%));
  box-shadow: 0 6px 0 color-mix(in srgb, var(--accent) 55%, #000 45%), 0 6px 10px rgba(0,0,0,.25);
  transition: transform .16s cubic-bezier(.34,1.56,.64,1), box-shadow .16s ease;
}
.theme-bausteine .btn-accent::before {
  content: ""; position: absolute; top: -8px; left: 14px; width: 14px; height: 9px; border-radius: 7px 7px 0 0;
  background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 90%, #fff 10%), var(--accent));
}
.theme-bausteine .btn-accent::after {
  content: ""; position: absolute; top: -8px; right: 14px; width: 14px; height: 9px; border-radius: 7px 7px 0 0;
  background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 90%, #fff 10%), var(--accent));
}
.theme-bausteine .btn-accent:hover { transform: translateY(-2px); box-shadow: 0 8px 0 color-mix(in srgb, var(--accent) 55%, #000 45%), 0 10px 16px rgba(0,0,0,.3); }
.theme-bausteine .btn-accent:active { transform: translateY(4px); box-shadow: 0 2px 0 color-mix(in srgb, var(--accent) 55%, #000 45%); }

body.theme-bausteine {
  background-color: var(--bg);
  background-image:
    radial-gradient(circle at 35% 35%, rgba(255,255,255,.55) 0%, transparent 45%),
    radial-gradient(circle, rgba(0,0,0,.1) 5px, transparent 5.5px),
    radial-gradient(circle, rgba(255,255,255,.35) 1px, transparent 1.5px);
  background-size: 34px 34px, 34px 34px, 34px 34px;
  background-position: 0 0, 0 0, -6px -6px;
}
.theme-bausteine .sidebar, .theme-bausteine .topbar { background-color: var(--surface); background-image: none; }
.theme-bausteine .brand-text { text-shadow: 1px 1px 0 rgba(255,255,255,.5), -1px -1px 0 rgba(0,0,0,.08); }

.theme-bausteine .card, .theme-bausteine .widget-card {
  position: relative; border: 2px solid var(--border); border-radius: 14px; overflow: visible;
  background:
    linear-gradient(115deg, rgba(255,255,255,.5) 0%, rgba(255,255,255,0) 30%),
    linear-gradient(180deg, #fff, var(--surface2) 130%);
  transition: transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s ease;
  margin-top: 10px;
}
.theme-bausteine .card::before, .theme-bausteine .widget-card::before {
  content: ""; position: absolute; top: -9px; left: 20px; width: 16px; height: 10px; border-radius: 8px 8px 0 0;
  background: linear-gradient(180deg, #fff, var(--surface2)); border: 2px solid var(--border); border-bottom: none;
  box-shadow: 34px 0 0 -2px transparent, 0 0 0 0 transparent;
}
.theme-bausteine .card::after, .theme-bausteine .widget-card::after {
  content: ""; position: absolute; top: -9px; left: 52px; width: 16px; height: 10px; border-radius: 8px 8px 0 0;
  background: linear-gradient(180deg, #fff, var(--surface2)); border: 2px solid var(--border); border-bottom: none;
}
.theme-bausteine .widget-card::before { background: linear-gradient(180deg, #fff, color-mix(in srgb, var(--widget-accent, var(--accent)) 18%, #fff)); }
.theme-bausteine .widget-card::after { background: linear-gradient(180deg, #fff, color-mix(in srgb, var(--widget-accent, var(--accent)) 18%, #fff)); }
.theme-bausteine .card:hover, .theme-bausteine .widget-card:hover { transform: translateY(-5px) rotate(-.5deg); box-shadow: 0 10px 0 rgba(0,0,0,.12), 0 14px 22px rgba(0,0,0,.18); }
.theme-bausteine .card:active, .theme-bausteine .widget-card:active { transform: translateY(2px) rotate(0deg); }

.theme-bausteine .mm-node { border-width: 3px; border-radius: 14px; background: linear-gradient(180deg, var(--surface), var(--surface2)); }
.theme-bausteine .mm-node.root { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 85%, #fff 15%), var(--accent)); color: #fff; border: 3px solid var(--border); box-shadow: 0 6px 0 color-mix(in srgb, var(--accent) 55%, #000 45%); }
.theme-bausteine .avatar { border-radius: 30%; }
.theme-bausteine .avatar.active { border-radius: 30%; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent2); }
.theme-bausteine .view-title { -webkit-text-stroke: .5px var(--border); }
.theme-bausteine .nav-item.active { box-shadow: 0 3px 0 color-mix(in srgb, var(--accent) 55%, #000 45%); }

/* 15. Obsidian — absolut exklusives, gedämpftes Dunkel-Theme */
.theme-obsidian {
  --bg: #0B0B0A; --surface: #151412; --surface2: #1E1C19;
  --text: #EDE6D6; --text-muted: #918A78;
  --accent: #C9A24B; --accent2: #7A6E5C;
  --border: #2C2822; --shadow: 0 24px 60px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.4);
  --font-display: 'Cormorant Garamond', serif; --font-body: 'Inter', sans-serif;
  --radius: 2px; --pattern: none;
}
.theme-obsidian body, body.theme-obsidian {
  background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,.025) 1px, transparent 0);
  background-size: 3px 3px;
}
.theme-obsidian .brand-text { font-weight: 600; letter-spacing: .06em; }
.theme-obsidian .brand-mark { color: var(--accent); }
.theme-obsidian .view-title { font-weight: 600; letter-spacing: .01em; }
.theme-obsidian .btn { border-radius: 2px; letter-spacing: .03em; }
.theme-obsidian .btn-accent {
  background: transparent; color: var(--accent); border: 1px solid var(--accent);
  position: relative; overflow: hidden; transition: color .3s ease, background .3s ease;
}
.theme-obsidian .btn-accent::before {
  content: ""; position: absolute; inset: 0; background: var(--accent); transform: scaleX(0); transform-origin: left;
  transition: transform .35s cubic-bezier(.4,0,.2,1); z-index: -1;
}
.theme-obsidian .btn-accent:hover { color: #0B0B0A; }
.theme-obsidian .btn-accent:hover::before { transform: scaleX(1); }
.theme-obsidian .card, .theme-obsidian .widget-card {
  border: 1px solid var(--border); transition: border-color .3s ease, box-shadow .3s ease, transform .3s ease;
}
.theme-obsidian .card:hover, .theme-obsidian .widget-card:hover {
  border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 24px 50px rgba(0,0,0,.5), 0 0 0 1px rgba(201,162,75,.25);
}
.theme-obsidian .widget-card::before { width: 2px; background: var(--accent); opacity: .8; }
.theme-obsidian .nav-item.active { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
.theme-obsidian .avatar.active { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--accent); }
.theme-obsidian .mm-node { border-color: var(--border); }
.theme-obsidian .mm-node.root { background: var(--surface2); color: var(--accent); border: 1px solid var(--accent); box-shadow: 0 0 0 1px rgba(201,162,75,.2), 0 20px 40px rgba(0,0,0,.5); }
.theme-obsidian .mindmap-svg path.mm-edge { opacity: .6; }
.theme-obsidian ::selection { background: var(--accent); color: #0B0B0A; }
.theme-obsidian .tag-chip, .theme-obsidian .profile-chip { border-color: var(--border); }
.theme-obsidian input, .theme-obsidian select, .theme-obsidian textarea { border-color: var(--border) !important; }
.theme-obsidian input:focus, .theme-obsidian select:focus, .theme-obsidian textarea:focus { outline: none; border-color: var(--accent) !important; }

/* 16. Militär — camo, stencil, radar */
.theme-militaer {
  --bg: #2B2E1F; --surface: #4B5320; --surface2: #5C6B2E;
  --text: #E8E4D0; --text-muted: #A8A585;
  --accent: #B8A369; --accent2: #A63A2C;
  --border: #1A1C12; --shadow: 3px 3px 0 rgba(0,0,0,.5);
  --font-display: 'Black Ops One', sans-serif; --font-body: 'Oswald', sans-serif;
  --radius: 2px; --pattern: none;
}
body.theme-militaer {
  background-color: var(--bg);
  background-image:
    radial-gradient(ellipse 140px 90px at 10% 20%, rgba(90,100,50,.55), transparent 70%),
    radial-gradient(ellipse 180px 110px at 70% 10%, rgba(60,50,30,.5), transparent 70%),
    radial-gradient(ellipse 160px 100px at 40% 60%, rgba(110,110,70,.45), transparent 70%),
    radial-gradient(ellipse 150px 95px at 85% 70%, rgba(50,60,30,.5), transparent 70%),
    radial-gradient(ellipse 170px 100px at 15% 85%, rgba(80,70,40,.45), transparent 70%);
  background-size: 480px 420px;
}
.theme-militaer .sidebar, .theme-militaer .topbar { background-color: var(--surface); background-image: none; }
.theme-militaer #app { position: relative; z-index: 0; overflow: hidden; }
.theme-militaer #app::before {
  content: ""; position: fixed; top: 50%; left: 50%; width: 220vmax; height: 220vmax; z-index: -1; pointer-events: none;
  background: conic-gradient(from 0deg, rgba(184,163,105,.16), transparent 18%, transparent 100%);
  transform: translate(-50%, -50%); animation: militaerRadar 6s linear infinite;
}
@keyframes militaerRadar { to { transform: translate(-50%, -50%) rotate(360deg); } }
.theme-militaer .brand-text, .theme-militaer .view-title { text-transform: uppercase; letter-spacing: .04em; text-shadow: 2px 2px 0 rgba(0,0,0,.5), -1px 0 0 rgba(255,255,255,.06); }
.theme-militaer .btn { border-radius: 2px; text-transform: uppercase; letter-spacing: .05em; font-size: 12px; border-width: 2px; }
.theme-militaer .btn-accent { background: var(--accent); color: #1A1C12; border-color: var(--border); box-shadow: 3px 3px 0 rgba(0,0,0,.5); }
.theme-militaer .btn-accent:hover { transform: translate(1px, 1px); box-shadow: 2px 2px 0 rgba(0,0,0,.5); }
.theme-militaer .card, .theme-militaer .widget-card { border-width: 2px; border-radius: 2px; }
.theme-militaer .card:hover, .theme-militaer .widget-card:hover { outline: 2px solid var(--accent2); outline-offset: 2px; transform: none; }
.theme-militaer .nav-item.active { background: var(--accent2); color: #fff; border-color: var(--border); }
.theme-militaer .avatar, .theme-militaer .mini-avatar { border-radius: 2px; }
.theme-militaer .avatar.active { border-radius: 2px; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent2); }
.theme-militaer .mm-node.root { background: var(--accent2); color: #fff; border: 2px solid var(--border); }
.theme-militaer ::selection { background: var(--accent2); color: #fff; }

/* 17. Vault-Terminal — retro CRT-Röhrenbildschirm, Phosphor-Grün */
.theme-vaultterm {
  --bg: #060A06; --surface: #0C170C; --surface2: #142414;
  --text: #6EFF6E; --text-muted: #3F9A3F;
  --accent: #4CFF4C; --accent2: #FFB000;
  --border: #1F3D1F; --shadow: 0 0 0 1px #1F3D1F, 0 0 26px rgba(76,255,76,.15);
  --font-display: 'Share Tech Mono', monospace; --font-body: 'Share Tech Mono', monospace;
  --radius: 12px; --pattern: none;
}
.theme-vaultterm #app { position: relative; z-index: 0; }
.theme-vaultterm #app::before {
  content: ""; position: fixed; inset: 0; z-index: 9999; pointer-events: none;
  background: repeating-linear-gradient(rgba(0,0,0,0) 0 2px, rgba(0,0,0,.18) 3px 4px);
  mix-blend-mode: multiply; animation: vaultFlicker 6s steps(1) infinite;
}
.theme-vaultterm #app::after {
  content: ""; position: fixed; inset: 0; z-index: 9999; pointer-events: none;
  box-shadow: inset 0 0 140px rgba(0,0,0,.75), inset 0 0 40px rgba(0,0,0,.5);
}
@keyframes vaultFlicker {
  0%, 96%, 100% { opacity: 1; }
  97% { opacity: .82; }
  98% { opacity: 1; }
  99% { opacity: .9; }
}
.theme-vaultterm .sidebar, .theme-vaultterm .topbar { background-color: var(--surface); border-color: var(--border); }
.theme-vaultterm .brand-text, .theme-vaultterm .view-title { text-shadow: 0 0 6px var(--accent), 0 0 16px rgba(76,255,76,.5); text-transform: uppercase; letter-spacing: .04em; }
.theme-vaultterm .btn { border-radius: 999px; text-transform: uppercase; letter-spacing: .04em; border-color: var(--border); }
.theme-vaultterm .btn-accent { background: transparent; color: var(--accent); border: 1px solid var(--accent); box-shadow: 0 0 10px rgba(76,255,76,.4), inset 0 0 10px rgba(76,255,76,.08); }
.theme-vaultterm .btn-accent:hover { background: rgba(76,255,76,.12); box-shadow: 0 0 18px rgba(76,255,76,.65), inset 0 0 14px rgba(76,255,76,.15); }
.theme-vaultterm .card, .theme-vaultterm .widget-card {
  border-color: var(--border); border-width: 2px; border-radius: 16px; background: var(--surface);
  box-shadow: 0 0 0 1px rgba(255,176,0,.18), var(--shadow);
}
.theme-vaultterm .card:hover, .theme-vaultterm .widget-card:hover { border-color: var(--accent); box-shadow: 0 0 0 1px rgba(255,176,0,.3), 0 0 20px rgba(76,255,76,.3); transform: none; }
.theme-vaultterm .widget-card::before { background: var(--accent2); box-shadow: 0 0 8px rgba(255,176,0,.6); }
.theme-vaultterm .nav-item.active { background: rgba(76,255,76,.14); color: var(--accent); border: 1px solid var(--accent); box-shadow: 0 0 12px rgba(76,255,76,.35); }
.theme-vaultterm .avatar { border-radius: 50%; box-shadow: 0 0 0 2px var(--border), 0 0 0 4px rgba(255,176,0,.35); }
.theme-vaultterm .avatar.active { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent), 0 0 14px rgba(76,255,76,.6); }
.theme-vaultterm .mm-node { border-color: var(--border); background: var(--surface); border-radius: 14px; }
.theme-vaultterm .mm-node.root { background: var(--surface2); color: var(--accent); border: 2px solid var(--accent); box-shadow: 0 0 22px rgba(76,255,76,.5); border-radius: 50%; }
.theme-vaultterm .mindmap-svg path.mm-edge { filter: drop-shadow(0 0 3px rgba(76,255,76,.5)); }
.theme-vaultterm ::selection { background: var(--accent); color: #060A06; }
.theme-vaultterm input, .theme-vaultterm select, .theme-vaultterm textarea { background: #0A140A !important; border-color: var(--border) !important; color: var(--text) !important; border-radius: 10px !important; }
.theme-vaultterm input:focus, .theme-vaultterm select:focus, .theme-vaultterm textarea:focus { outline: none; border-color: var(--accent) !important; box-shadow: 0 0 8px rgba(76,255,76,.4); }
.theme-vaultterm .view-container { position: relative; }
.theme-vaultterm .widget-head h3 { color: var(--accent2); text-shadow: 0 0 6px rgba(255,176,0,.5); }

/* 19. Atombunker — 1950er Atomzeitalter-Werbeplakat-Stil */
.theme-atombunker {
  --bg: #EFE3C4; --surface: #FBF3DE; --surface2: #F2E2B8;
  --text: #241B12; --text-muted: #6B5A3E;
  --accent: #C4442E; --accent2: #2E8B84;
  --border: #241B12; --shadow: 4px 4px 0 rgba(36,27,18,.85);
  --font-display: 'Archivo Black', sans-serif; --font-body: 'Work Sans', sans-serif;
  --radius: 3px; --pattern: none;
}
body.theme-atombunker {
  background-color: var(--bg);
  background-image: radial-gradient(circle, rgba(36,27,18,.14) 1.4px, transparent 1.6px);
  background-size: 14px 14px;
}
.theme-atombunker .sidebar, .theme-atombunker .topbar { background-color: var(--surface); border-color: var(--border); border-width: 2px; }
.theme-atombunker .brand-text, .theme-atombunker .view-title {
  text-transform: uppercase; letter-spacing: .02em; color: var(--accent);
  text-shadow: 2px 2px 0 var(--accent2), 4px 4px 0 rgba(36,27,18,.3);
}
.theme-atombunker .btn { border-radius: 3px; border-width: 2.5px; text-transform: uppercase; font-weight: 700; letter-spacing: .02em; }
.theme-atombunker .btn-accent { background: var(--accent); color: var(--surface); border-color: var(--border); box-shadow: 3px 3px 0 var(--border); }
.theme-atombunker .btn-accent:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--border); }
.theme-atombunker .btn-accent:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--border); }
.theme-atombunker .card, .theme-atombunker .widget-card {
  border-width: 2.5px; border-radius: 3px; background: var(--surface);
  box-shadow: 4px 4px 0 var(--border);
}
.theme-atombunker .card:hover, .theme-atombunker .widget-card:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--border); }
.theme-atombunker .widget-card::before { background: var(--accent2); width: 5px; }
.theme-atombunker .widget-head h3 { color: var(--accent2); text-transform: uppercase; letter-spacing: .03em; }
.theme-atombunker .nav-item.active { background: var(--accent); color: var(--surface); border: 2px solid var(--border); box-shadow: 2px 2px 0 var(--border); }
.theme-atombunker .avatar { border-radius: 50%; border: 2.5px solid var(--border); box-shadow: 2px 2px 0 var(--border); }
.theme-atombunker .avatar.active { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
.theme-atombunker .mm-node { border-width: 2.5px; border-radius: 3px; box-shadow: 3px 3px 0 var(--border); }
.theme-atombunker .mm-node.root { background: var(--accent); color: var(--surface); border: 2.5px solid var(--border); }
.theme-atombunker ::selection { background: var(--accent2); color: var(--surface); }
.theme-atombunker input, .theme-atombunker select, .theme-atombunker textarea { border-width: 2px !important; border-radius: 3px !important; }


/* ============ LAYOUT ============ */
#app { display: flex; min-height: 100vh; }
.theme-skizze body, .theme-skizze #app { background-image: var(--pattern); background-size: 24px 24px; }
.theme-skizze { }
body.theme-skizze { background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px); background-size: 26px 26px; background-color: var(--bg); }

.sidebar {
  width: 232px; flex-shrink: 0; background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; padding: 20px 14px;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  transition: transform .25s ease;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 6px 10px 22px; }
.brand-mark { font-size: 22px; color: var(--accent); }
.brand-text { font-family: var(--font-display); font-size: 21px; letter-spacing: .3px; }
.brand-version { font-size: 10px; color: var(--text-muted); background: var(--surface2); border: 1px solid var(--border); border-radius: 999px; padding: 2px 7px; margin-left: 2px; font-weight: 600; }
.nav { display: flex; flex-direction: column; gap: 4px; flex: 1; }
.sidebar-bottom { display: flex; flex-direction: column; gap: 4px; border-top: 1px solid var(--border); padding-top: 12px; margin-top: 12px; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  background: transparent; border: 1px solid transparent; border-radius: var(--radius);
  padding: 10px 12px; font-size: 14.5px; font-weight: 500; text-align: left;
  color: var(--text-muted); transition: background .15s, color .15s, border-color .15s;
}
.nav-item:hover { background: var(--surface2); color: var(--text); }
.nav-item.active { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.theme-bauhaus .nav-item.active { color: #fff; }
.nav-icon { font-size: 16px; width: 18px; text-align: center; }
.nav-divider { height: 1px; background: var(--border); margin: 8px 4px; }

/* ============ PROFILE BAR ============ */
.profile-bar { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 6px 16px; }
.avatar {
  width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 16px; border: 2px solid transparent; cursor: pointer; flex-shrink: 0; position: relative;
  transition: transform .12s ease, border-color .15s; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.35);
}
.avatar:hover { transform: translateY(-1px); }
.avatar.active { border-color: var(--text); box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--accent); }
.avatar-add {
  width: 34px; height: 34px; border-radius: 50%; border: 2px dashed var(--border); background: transparent;
  color: var(--text-muted); font-size: 16px; display: flex; align-items: center; justify-content: center;
}
.avatar-add:hover { border-color: var(--accent); color: var(--accent); }
.profile-empty-hint { font-size: 12px; color: var(--text-muted); padding: 0 6px 14px; line-height: 1.5; }
.profile-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 3px 10px 3px 3px; border-radius: 999px; background: var(--surface2); border: 1px solid var(--border); }
.mini-avatar { width: 18px; height: 18px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,.3); flex-shrink: 0; }
.build-tag { font-size: 10.5px; color: var(--text-muted); text-align: center; padding: 10px 6px 2px; opacity: .7; }

/* ============ HOME DASHBOARD ============ */
.global-ticker {
  display: flex; align-items: center; gap: 10px; background: var(--surface2); border-bottom: 1px solid var(--border);
  padding: 7px 26px; font-size: 12.5px; min-height: 34px; box-sizing: border-box;
}
.global-ticker-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex-shrink: 0; animation: tickerPulse 1.8s ease-in-out infinite; }
@keyframes tickerPulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
.global-ticker-text {
  transition: opacity .25s ease; white-space: nowrap;
  display: inline-block;
}
.global-ticker-viewport { flex: 1; min-width: 0; overflow: hidden; }
.global-ticker-viewport.marquee .global-ticker-text { will-change: transform; }
@keyframes tickerMarquee {
  0% { transform: translateX(0); }
  100% { transform: translateX(var(--marquee-distance, -100%)); }
}
.widget-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 18px; margin-bottom: 22px; }
.dashboard-card { grid-column: 1 / -1; }
.dashboard-greeting { margin-bottom: 10px; }
.dashboard-greeting h1 { font-family: var(--font-display); font-size: 26px; margin: 0 0 4px; }
.dashboard-greeting .home-date { color: var(--text-muted); font-size: 13px; text-transform: capitalize; }
.family-share-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 8px 14px; margin-top: 22px;
}
.family-share-text { font-size: 11.5px; color: var(--text-muted); line-height: 1.3; }
.family-share-text strong { color: var(--text); font-family: var(--font-body); font-weight: 700; }
.family-share-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.family-share-divider { width: 1px; height: 18px; background: var(--border); margin: 0 2px; }
.widget-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
  padding: 18px 20px; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 20px rgba(0,0,0,.05);
  display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden;
}
.widget-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--widget-accent, var(--accent)); }
.widget-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.widget-head h3 { font-family: var(--font-display); font-size: 15.5px; margin: 0; display: flex; align-items: center; gap: 8px; }
.widget-head .widget-link { font-size: 11.5px; color: var(--text-muted); }
.widget-card .widget-body { font-size: 13px; color: var(--text); }
.widget-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px dashed var(--border); font-size: 13px; }
.points-pill-row { display: flex; flex-wrap: wrap; gap: 6px; }
.points-pill {
  display: inline-flex; align-items: center; gap: 5px; background: var(--surface2); border-radius: 999px;
  padding: 3px 10px 3px 3px; font-size: 12px; font-weight: 600;
}
.points-pill .mini-avatar { width: 18px; height: 18px; font-size: 10px; }
.reward-list { display: flex; flex-direction: column; gap: 6px; }
.reward-row {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 8px 12px;
}
.reward-title { font-weight: 600; font-size: 13.5px; flex: 1; min-width: 120px; }
.reward-row .redeem-profile { padding: 5px 7px; font-size: 12.5px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); color: var(--text); }
.reward-row .card-pin { font-size: 13px; padding: 2px; }
.widget-row:last-child { border-bottom: none; }
.widget-row .wr-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.widget-row .wr-meta { font-size: 11px; color: var(--text-muted); flex-shrink: 0; }
.widget-empty { font-size: 12.5px; color: var(--text-muted); font-style: italic; padding: 4px 0; }
.widget-big-stat { font-family: var(--font-display); font-size: 26px; }
.today-sub-stat { font-size: 12.5px; color: var(--text-muted); margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--border); }
.custody-today-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
.custody-today-row .arrow { color: var(--text-muted); font-size: 13px; }

/* ============ CALENDAR EXTRAS ============ */
.custody-summary-bar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
.ferien-status-banner {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 10px 14px; margin-bottom: 14px; font-size: 13px;
}
.ferien-status-warn { border-color: #C9A24B; background: color-mix(in srgb, #C9A24B 15%, var(--surface)); }
.custody-summary-chip { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 8px 14px; font-size: 12.5px; }
.custody-summary-chip .arrow { color: var(--text-muted); }
.child-filter-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.child-filter-chip { display: flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-size: 12px; cursor: pointer; opacity: .45; transition: opacity .15s; }
.child-filter-chip.active { opacity: 1; border-color: var(--accent); }
.view-toggle { display: flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.view-toggle button { padding: 7px 14px; background: var(--surface); border: none; font-size: 12.5px; border-right: 1px solid var(--border); }
.view-toggle button:last-child { border-right: none; }
.view-toggle button.active { background: var(--accent); color: var(--surface); }
.theme-bauhaus .view-toggle button.active { color: #fff; }
.week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
.calendar-card {
  background: linear-gradient(180deg, var(--surface), color-mix(in srgb, var(--surface2) 40%, var(--surface)));
  border: 1px solid var(--border); border-radius: calc(var(--radius) + 10px);
  padding: 20px; box-shadow: var(--shadow);
}
.cal-month-grid { display: grid; gap: 8px; }
.cal-weekday-head {
  text-align: center; font-size: 10.5px; color: var(--text-muted); font-weight: 800;
  text-transform: uppercase; letter-spacing: .07em; padding: 2px 4px 12px;
}
.cal-day-cell {
  min-height: 96px; border: 1px solid var(--border); border-radius: calc(var(--radius) + 2px); padding: 7px;
  background: var(--bg); cursor: pointer; position: relative; overflow: hidden;
  transition: transform .14s cubic-bezier(.2,.8,.3,1), border-color .15s ease, box-shadow .15s ease;
}
.cal-day-cell::before {
  content: ""; position: absolute; inset: 0; background: linear-gradient(160deg, rgba(255,255,255,.05), transparent 40%);
  pointer-events: none;
}
.cal-day-cell:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 10px 20px rgba(0,0,0,.14); z-index: 1; }
.cal-day-cell.is-today {
  background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 20%, var(--bg)), color-mix(in srgb, var(--accent) 8%, var(--bg)));
  border: 1.5px solid var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent), 0 0 18px color-mix(in srgb, var(--accent) 30%, transparent);
  animation: calTodayGlow 2.6s ease-in-out infinite;
}
@keyframes calTodayGlow {
  0%, 100% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent), 0 0 14px color-mix(in srgb, var(--accent) 25%, transparent); }
  50% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 28%, transparent), 0 0 22px color-mix(in srgb, var(--accent) 42%, transparent); }
}
.week-day-cell { min-height: 220px; border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; background: var(--bg); cursor: pointer; display: flex; flex-direction: column; gap: 6px; transition: transform .12s ease, border-color .15s ease, box-shadow .15s ease; }
.week-day-cell:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: 0 6px 14px rgba(0,0,0,.12); }
.week-day-cell.is-today { background: color-mix(in srgb, var(--accent) 14%, var(--bg)); border: 1.5px solid var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
.week-day-cell.is-today .wd-num { color: var(--accent); font-weight: 700; }
.week-day-cell .wd-label { font-size: 12px; color: var(--text-muted); }
.week-day-cell .wd-num { font-family: var(--font-display); font-size: 20px; }
.week-meal-tag { font-size: 11px; background: var(--surface2); border-radius: 6px; padding: 4px 7px; color: var(--text-muted); }
.cal-event {
  font-size: 10.5px; background: var(--surface2); color: var(--text); border-left: 3px solid var(--accent);
  border-radius: 4px; padding: 2px 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer;
  transition: transform .1s ease, box-shadow .1s ease;
}
.cal-event:hover { transform: translateX(1px); box-shadow: 0 2px 6px rgba(0,0,0,.15); }
.cal-homework-chip { font-weight: 600; }
.meal-day-block { padding: 10px 0; border-bottom: 1px dashed var(--border); }
.meal-day-block:last-child { border-bottom: none; }
.meal-day-head { font-size: 12.5px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 6px; }
.meal-options { display: flex; flex-direction: column; gap: 4px; margin-bottom: 6px; }
.meal-option { display: flex; align-items: center; gap: 8px; background: var(--surface2); border-radius: var(--radius); padding: 5px 8px; flex-wrap: wrap; }
.meal-option.confirmed { border: 1.5px solid var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface2)); }
.meal-option-text { flex: 1; font-size: 13px; min-width: 90px; }
.meal-vote-btn { font-size: 11.5px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; }
.meal-vote-btn.voted { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.meal-voters { display: flex; gap: 2px; }
.meal-voters .mini-avatar { width: 18px; height: 18px; font-size: 10px; }
.meal-confirm-btn, .meal-del-btn { font-size: 11px; padding: 3px 7px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); cursor: pointer; color: var(--text-muted); }
.meal-add-row { display: flex; gap: 6px; }
.meal-add-row input { flex: 1; padding: 6px 9px; font-size: 12.5px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); color: var(--text); }

/* Papa-Bereich (admin) */
.admin-gate { max-width: 380px; margin: 40px auto; text-align: center; }
.admin-gate .admin-icon { font-size: 40px; display: block; margin-bottom: 14px; }
.admin-gate input[type=password] { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); font-size: 15px; text-align: center; letter-spacing: .1em; margin-bottom: 12px; }
.admin-gate .admin-error { color: #C0453B; font-size: 12.5px; margin-bottom: 10px; min-height: 16px; }
.build-info-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 22px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
.build-info-card .build-num { font-family: var(--font-display); font-size: 20px; }
.hub-back-link { display: block; background: none; border: none; color: var(--text-muted); font-size: 12px; padding: 0; margin-bottom: 6px; cursor: pointer; }
.hub-back-link:hover { color: var(--accent); }
.hub-profile-row { display: flex; flex-wrap: wrap; gap: 14px; }
.hub-profile-card {
  display: flex; flex-direction: column; align-items: center; gap: 6px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px; min-width: 110px;
  box-shadow: var(--shadow); transition: transform .15s ease;
}
.hub-profile-card:hover { transform: translateY(-3px); border-color: var(--accent); }
.hub-profile-name { font-size: 13px; font-weight: 600; }
.hub-profile-status { font-size: 10.5px; color: var(--text-muted); }

/* custody / Betreuung indicator on calendar days */
.cal-custody-row { position: absolute; left: 6px; right: 6px; bottom: 6px; display: flex; gap: 3px; flex-wrap: wrap; }
.custody-dot { width: 16px; height: 16px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 9px; color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,.3); flex-shrink: 0; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.custody-dot.custody-switch { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--text); }
.custody-dot-empty { width: 16px; height: 16px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; color: var(--text-muted); background: var(--surface2); border: 1px dashed var(--border); }
.custody-block-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 6px; background: var(--bg); flex-wrap: wrap; }
.custody-block-row input[type=number] { width: 64px; padding: 6px 8px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  display: flex; align-items: center; gap: 14px; padding: 16px 26px;
  border-bottom: 1px solid var(--border); background: var(--bg);
  position: sticky; top: 0; z-index: 5;
}
.hamburger { display: none; background: none; border: none; font-size: 20px; color: var(--text); }
.search-wrap { flex: 1; max-width: 480px; }
#searchInput {
  width: 100%; padding: 10px 14px; border-radius: var(--radius); border: 1px solid var(--border);
  background: var(--surface); font-size: 14px;
}
.btn {
  padding: 10px 16px; border-radius: var(--radius); border: 1px solid var(--border);
  background: var(--surface); font-size: 14px; font-weight: 600; white-space: nowrap;
  transition: transform .12s ease, background .15s ease;
}
.btn:hover { transform: translateY(-1px); }
.btn-accent { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.theme-bauhaus .btn-accent { color: #fff; box-shadow: var(--shadow); }
.btn-ghost { background: transparent; }
.btn-sm { padding: 6px 10px; font-size: 12.5px; }
.btn-danger { color: #C0453B; border-color: #C0453B; background: transparent; }

.view-container { flex: 1; padding: 26px; max-width: 1100px; width: 100%; margin: 0 auto; overflow-x: hidden; }
.view-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; gap: 10px;}
.view-title { font-family: var(--font-display); font-size: 28px; margin: 0; }
.view-sub { color: var(--text-muted); font-size: 13.5px; margin: 4px 0 0; }

.empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.empty-state .empty-icon { font-size: 34px; display: block; margin-bottom: 10px; }

.toast {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  padding: 10px 18px; border-radius: var(--radius); box-shadow: var(--shadow);
  font-size: 13.5px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
  z-index: 50;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 860px) {
  .sidebar { position: fixed; z-index: 40; left: 0; top: 0; transform: translateX(-100%); box-shadow: 0 0 30px rgba(0,0,0,.3);}
  .sidebar.open { transform: translateX(0); }
  .hamburger { display: block; }
  .view-container { padding: 16px; }
  .topbar { padding: 12px 16px; }
  .global-ticker { padding: 6px 16px; font-size: 11.5px; }
}

/* ============ GRID / CARDS ============ */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px;
  cursor: pointer; transition: transform .12s ease, border-color .15s;
}
.card:hover { transform: translateY(-2px); border-color: var(--accent); }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.card-title { font-family: var(--font-display); font-size: 17px; margin: 0; word-break: break-word; }
.card-pin { background: none; border: none; font-size: 15px; color: var(--text-muted); }
.card-pin.pinned { color: var(--accent); }
.card-body { color: var(--text-muted); font-size: 13.5px; line-height: 1.5; max-height: 4.5em; overflow: hidden; }
.card-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.tag-chip {
  font-size: 11px; padding: 3px 9px; border-radius: 999px; background: var(--surface2);
  color: var(--text-muted); border: 1px solid var(--border);
}
.tag-chip.clickable:hover { border-color: var(--accent); color: var(--accent); cursor: pointer; }
.card-meta { font-size: 11px; color: var(--text-muted); margin-top: auto; padding-top: 6px; }
.card-progress { height: 5px; background: var(--surface2); border-radius: 999px; overflow: hidden; margin-top: 4px;}
.card-progress-bar { height: 100%; background: var(--accent); }
.card-thumb { width: 100%; height: 130px; object-fit: cover; border-radius: var(--radius); border: 1px solid var(--border); }

/* ============ MODAL / EDITOR ============ */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex;
  align-items: center; justify-content: center; z-index: 60; padding: 20px;
}
.modal {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  width: 100%; max-width: 640px; max-height: 88vh; overflow-y: auto; padding: 24px;
  box-shadow: var(--shadow);
}
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.modal-header h2 { font-family: var(--font-display); margin: 0; font-size: 22px; }
.close-btn { background: none; border: none; font-size: 20px; color: var(--text-muted); }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 6px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; }
.field input[type=text], .field textarea, .field select {
  width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg); color: var(--text); font-size: 14px;
}
.field textarea { min-height: 130px; resize: vertical; line-height: 1.5; }
.modal-footer { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; }
.modal-footer-right { display: flex; gap: 8px; }

/* checklist items in editor */
.checklist-items { display: flex; flex-direction: column; gap: 6px; }
.checklist-row { display: flex; align-items: center; gap: 8px; }
.checklist-row-hw { flex-wrap: wrap; background: var(--surface2); padding: 8px; border-radius: var(--radius); }
.checklist-row-hw input[type=text], .checklist-row-hw input[type=date] { padding: 7px 9px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); }
.md-toolbar { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
.md-btn {
  padding: 5px 9px; font-size: 12px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--surface2); color: var(--text); cursor: pointer;
}
.md-btn:hover { border-color: var(--accent); }
.md-preview p { margin: 0 0 4px; }
.md-preview h4 { margin: 4px 0; font-family: var(--font-display); font-size: 14px; }
.md-preview ul, .md-preview ol { margin: 2px 0 4px 18px; padding: 0; }
.md-preview code { background: var(--surface2); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
.md-preview mark, .mm-text mark { background: color-mix(in srgb, var(--accent) 45%, transparent); color: inherit; padding: 0 2px; border-radius: 2px; }
.md-preview del, .mm-text del { opacity: .65; }
.mm-text p { margin: 0; display: inline; }
.mm-text h4 { margin: 0; font-size: inherit; font-family: inherit; display: inline; }
.mm-text ul, .mm-text ol { margin: 2px 0 0 16px; padding: 0; text-align: left; }
.mm-text code { background: rgba(0,0,0,.08); padding: 0 4px; border-radius: 3px; }
.checklist-row input[type=text] { flex: 1; padding: 8px 10px; }
.checklist-row .del { background: none; border: none; color: var(--text-muted); font-size: 16px; }
.checklist-view-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--border); }
.checklist-view-row:last-child { border-bottom: none; }
.checklist-view-row input { width: 17px; height: 17px; accent-color: var(--accent); }
.checklist-view-row.done label { text-decoration: line-through; color: var(--text-muted); }
.shopping-row {
  display: grid; grid-template-columns: 22px 2fr 1fr 1fr 24px; gap: 8px; align-items: center;
  padding: 5px 0; border-bottom: 1px dashed var(--border);
}
.shopping-row:last-child { border-bottom: none; }
.shopping-row-head { font-size: 10.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
.shopping-row input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); }
.shopping-row .s-text { font-size: 13px; }
.shopping-row.done .s-text { text-decoration: line-through; color: var(--text-muted); }
.shopping-row select, .shopping-row input[type=text] {
  padding: 4px 7px; font-size: 12.5px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg);
  font-size: 12.5px; width: 100%;
}
@media (max-width: 640px) {
  .shopping-row {
    grid-template-columns: 20px 1fr 24px; grid-template-areas: "cb text del" "sel loc loc"; row-gap: 4px; padding: 6px 0;
  }
  .shopping-row-head { display: none; }
  .shopping-row .s-done { grid-area: cb; }
  .shopping-row .s-text { grid-area: text; }
  .shopping-row .s-del { grid-area: del; }
  .shopping-row .s-forwhom { grid-area: sel; width: auto; max-width: 88px; padding: 3px 4px; font-size: 11px; }
  .shopping-row .s-where { grid-area: loc; width: auto; padding: 3px 6px; font-size: 11px; }
}
.add-row-btn { align-self: flex-start; margin-top: 4px; }

/* image dropzone */
.dropzone {
  border: 2px dashed var(--border); border-radius: var(--radius); padding: 26px; text-align: center;
  color: var(--text-muted); font-size: 13.5px; cursor: pointer; transition: border-color .15s;
}
.dropzone:hover, .dropzone.drag { border-color: var(--accent); color: var(--accent); }
.dropzone input { display: none; }
.image-preview { width: 100%; max-height: 220px; object-fit: contain; border-radius: var(--radius); margin-top: 10px; border: 1px solid var(--border); }

/* image tabs + drawing pad */
.img-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
.img-tab { padding: 7px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-size: 12.5px; }
.img-tab.active { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.theme-bauhaus .img-tab.active { color: #fff; }
.draw-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.draw-colors { display: flex; gap: 5px; }
.draw-swatch { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--border); padding: 0; }
.draw-swatch.active { border-color: var(--text); box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--accent); }
#drawEraser.active-tool { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.draw-canvas { width: 100%; max-width: 100%; height: auto; aspect-ratio: 600 / 380; border: 1px solid var(--border); border-radius: var(--radius); background: #fff; touch-action: none; cursor: crosshair; }

/* tags view */
.tag-cloud { display: flex; flex-wrap: wrap; gap: 10px; }
.tag-pill {
  padding: 8px 16px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border);
  font-size: 13.5px; display: flex; align-items: center; gap: 8px;
}
.tag-pill .count { background: var(--surface2); border-radius: 999px; padding: 1px 8px; font-size: 11px; color: var(--text-muted); }
.tag-pill.active { border-color: var(--accent); color: var(--accent); }

/* ============ MIND-MAP ============ */
.mindmap-toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
.mindmap-toolbar select { padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); font-size: 13px; }
.mindmap-hint { font-size: 12px; color: var(--text-muted); margin-left: auto; }
.mindmap-wrap {
  position: relative; width: 100%; height: 70vh; min-height: 460px; overflow: hidden;
  border: 1px solid var(--border); border-radius: calc(var(--radius) + 6px); background: var(--surface);
  background-image: radial-gradient(var(--border) 1.1px, transparent 1.1px);
  background-size: 26px 26px; cursor: grab; touch-action: none;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.02);
}
.mindmap-wrap.panning { cursor: grabbing; }
.mindmap-world { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }
.mindmap-svg { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; }
.mindmap-svg path.mm-edge { fill: none; opacity: .85; stroke-linecap: round; filter: drop-shadow(0 1px 1px rgba(0,0,0,.08)); }

.mm-node {
  position: absolute; min-width: 130px; max-width: 240px; padding: 11px 16px;
  background: var(--surface); border: 2px solid var(--accent); border-radius: 14px;
  font-size: 13.5px; line-height: 1.35; cursor: grab;
  box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 6px 16px rgba(0,0,0,.08);
  transition: box-shadow .15s ease, border-color .15s ease, transform .12s ease;
  animation: mmPop .22s cubic-bezier(.34,1.56,.64,1);
}
@keyframes mmPop { from { transform: scale(.75); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.mm-node:hover { box-shadow: 0 2px 4px rgba(0,0,0,.08), 0 10px 22px rgba(0,0,0,.12); }
.mm-node.selected { border-width: 2px; box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent2) 30%, transparent), 0 8px 20px rgba(0,0,0,.12); z-index: 5; }
.mm-node.root {
