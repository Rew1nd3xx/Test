  function exportPdf() {
    if (!window.jspdf) { showToast("PDF-Bibliothek konnte nicht geladen werden (keine Internetverbindung?)."); return; }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "pt", format: "a4" });
    const pageW = doc.internal.pageSize.getWidth();
    const margin = 48;
    let y = margin;

    function ensureSpace(lines) {
      if (y + lines * 14 > doc.internal.pageSize.getHeight() - margin) { doc.addPage(); y = margin; }
    }
    function heading(text, size = 16) {
      ensureSpace(3);
      doc.setFont("helvetica", "bold"); doc.setFontSize(size);
      doc.text(text, margin, y); y += size * 1.1;
      doc.setFont("helvetica", "normal"); doc.setFontSize(11);
    }
    function paragraph(text) {
      const lines = doc.splitTextToSize(text || "", pageW - margin * 2);
      lines.forEach(line => { ensureSpace(1); doc.text(line, margin, y); y += 14; });
      y += 6;
    }

    heading("DApp — Export", 20);
    doc.setFontSize(10); doc.setTextColor(120);
    doc.text(`Erstellt am ${fmtDate(Date.now())}`, margin, y); y += 22;
    doc.setTextColor(20); doc.setFontSize(11);

    const items = scopedItems(exportScope).sort((a, b) => b.updatedAt - a.updatedAt);
    ["note", "checklist", "image"].forEach(type => {
      const group = items.filter(i => i.type === type);
      if (!group.length) return;
      heading({ note: "Notizen", checklist: "Checklisten", image: "Bilder" }[type], 15);
      group.forEach(it => {
        heading(it.title, 12);
        if (it.tags && it.tags.length) { doc.setTextColor(130); paragraph("Tags: " + it.tags.join(", ")); doc.setTextColor(20); }
        if (type === "note") paragraph(it.body || "(leer)");
        if (type === "checklist") (it.items || []).forEach(row => {
          const extra = it.hwMode ? [row.subject, row.dueDate ? "fällig " + row.dueDate : ""].filter(Boolean).join(", ") : "";
          paragraph(`${row.done ? "[x]" : "[ ]"} ${row.text}${extra ? " (" + extra + ")" : ""}`);
        });
        if (type === "image") {
          if (it.caption) paragraph(it.caption);
          if (it.dataUrl) {
            try {
              ensureSpace(10);
              const fmtMatch = /^data:image\/(png|jpe?g|webp)/i.exec(it.dataUrl);
              const fmt = fmtMatch ? fmtMatch[1].toUpperCase().replace("JPG", "JPEG") : "PNG";
              doc.addImage(it.dataUrl, fmt === "WEBP" ? "PNG" : fmt, margin, y, 200, 140);
              y += 150;
            } catch (e) { paragraph("(Bild konnte nicht eingebettet werden)"); }
          }
        }
        y += 4;
      });
    });

    if (exportScope === "all" && state.mindmaps.some(m => m.nodes.length)) {
      state.mindmaps.forEach(mm => {
        const lines = mmOutlineLinesFor(mm);
        if (!lines.length) return;
        heading("Mind-Map: " + mm.name, 15);
        lines.forEach(l => paragraph("  ".repeat(l.depth) + (l.depth === 0 ? "★ " : "– ") + l.text));
      });
    }

    doc.save(`dapp-${exportScope}-${Date.now()}.pdf`);
    showToast("PDF wird heruntergeladen.");
  }

  let collapsedSections = new Set();
  // Generisches Verschieben von Listeneinträgen: langes Drücken (Touch) bzw. Ziehen mit
  // gedrückter Maustaste hebt den Eintrag an, danach lässt er sich an eine neue Stelle ziehen.
  // Ein Oberpunkt gilt als erledigt, sobald alle seine Unterpunkte erledigt sind.
  function syncChecklistParents(items) {
    if (!items) return;
    for (let i = 0; i < items.length; i++) {
      const lvl = items[i].level || 0;
      const children = [];
      for (let j = i + 1; j < items.length; j++) {
        const childLvl = items[j].level || 0;
        if (childLvl <= lvl) break;
        if (childLvl === lvl + 1) children.push(items[j]);
      }
      if (children.length) items[i].done = children.every(ch => ch.done);
    }
  }

  function makeListSortable(containerEl, itemSelector, onReorder) {
    let dragEl = null, pressTimer = null, startY = 0, isDragging = false;
    const LONG_PRESS_MS = 320;

    function itemsOf() { return Array.from(containerEl.querySelectorAll(itemSelector)); }
    // ":scope > x" funktioniert bei closest() nicht — für die Treffersuche brauchen wir
    // den Selektor ohne diesen Zusatz und prüfen die direkte Kindschaft separat.
    const closestSelector = itemSelector.replace(/^:scope\s*>\s*/, "");
    const directChildOnly = itemSelector.startsWith(":scope");
    function itemFromEvent(target) {
      const el = target.closest(closestSelector);
      if (!el || !containerEl.contains(el)) return null;
      if (directChildOnly && el.parentElement !== containerEl) return null;
      return el;
    }

    function beginDrag(el) {
      isDragging = true;
      const sel = window.getSelection && window.getSelection();
      if (sel && sel.removeAllRanges) sel.removeAllRanges();
      dragEl = el;
      el.classList.add("sortable-dragging");
      document.body.classList.add("sortable-active");
      if (navigator.vibrate) { try { navigator.vibrate(15); } catch (e) { /* nicht unterstützt */ } }
    }
    function endDrag() {
      clearTimeout(pressTimer);
      if (dragEl) dragEl.classList.remove("sortable-dragging");
      document.body.classList.remove("sortable-active");
      if (isDragging && dragEl) {
        const order = itemsOf().map(el => el.dataset.sortId).filter(Boolean);
        if (order.length) onReorder(order);
      }
      isDragging = false;
      dragEl = null;
    }
    function onMove(e) {
      if (!isDragging || !dragEl) return;
      e.preventDefault();
      const y = e.clientY;
      const others = itemsOf().filter(el => el !== dragEl);
      for (const el of others) {
        const rect = el.getBoundingClientRect();
        const mid = rect.top + rect.height / 2;
        if (y < mid && el.compareDocumentPosition(dragEl) & Node.DOCUMENT_POSITION_FOLLOWING) {
          el.parentNode.insertBefore(dragEl, el);
          break;
        }
        if (y > mid && el.compareDocumentPosition(dragEl) & Node.DOCUMENT_POSITION_PRECEDING) {
          el.parentNode.insertBefore(dragEl, el.nextSibling);
          break;
        }
      }
    }

    // Griff-Element in jeden Eintrag setzen — Ziehen läuft nur noch darüber,
    // dadurch wird beim Verschieben kein Text mehr markiert.
    function ensureHandles() {
      itemsOf().forEach(el => {
        if (el.querySelector(":scope > .drag-handle")) return;
        const h = document.createElement("span");
        h.className = "drag-handle";
        h.title = "Zum Verschieben ziehen";
        h.textContent = "⠿";
        el.insertBefore(h, el.firstChild);
      });
    }
    ensureHandles();

    containerEl.addEventListener("pointerdown", (e) => {
      // Griff hat Vorrang — auch wenn der Eintrag selbst ein Knopf ist (z. B. Menüpunkte).
      const onHandle = !!e.target.closest(".drag-handle");
      const el = itemFromEvent(e.target);
      if (!el) return;
      if (onHandle) {
        e.preventDefault();
        beginDrag(el);
        return;
      }
      // Sonstige Bedienelemente (Knöpfe, Eingaben) nicht als Ziehen missverstehen.
      if (e.target.closest("button, input, select, textarea, a")) return;
      startY = e.clientY;
      // Textauswahl schon beim Gedrückthalten unterbinden — sonst markiert der Browser
      // beim Ziehen den Text unter dem Finger, was das Verschieben unangenehm macht.
      pressTimer = setTimeout(() => {
        const sel = window.getSelection && window.getSelection();
        if (sel && sel.removeAllRanges) sel.removeAllRanges();
        beginDrag(el);
      }, LONG_PRESS_MS);
    });
    containerEl.addEventListener("pointermove", (e) => {
      if (!isDragging && pressTimer && Math.abs(e.clientY - startY) > 12) { clearTimeout(pressTimer); pressTimer = null; }
      onMove(e);
    });
    document.addEventListener("pointerup", endDrag);
    document.addEventListener("pointercancel", endDrag);
  }

  function makeCollapsible(sectionEl, key, defaultOpen) {
    const h3 = sectionEl.querySelector(":scope > h3");
    if (!h3) return;
    if (!collapsedSections.has(key) && !defaultOpen) collapsedSections.add(key);
    const isOpen = !collapsedSections.has(key);
    const bodyWrap = document.createElement("div");
    Array.from(sectionEl.childNodes).forEach(node => { if (node !== h3) bodyWrap.appendChild(node); });
    const arrow = document.createElement("span");
    arrow.className = "settings-accordion-arrow";
    arrow.textContent = isOpen ? "▾" : "▸";
    h3.classList.add("settings-accordion-head");
    h3.appendChild(arrow);
    bodyWrap.style.display = isOpen ? "" : "none";
    sectionEl.appendChild(bodyWrap);
    h3.onclick = () => {
      const nowOpen = collapsedSections.has(key);
      if (nowOpen) collapsedSections.delete(key); else collapsedSections.add(key);
      bodyWrap.style.display = nowOpen ? "" : "none";
      arrow.textContent = nowOpen ? "▾" : "▸";
    };
  }

  function getReadableTextColor(hex) {
    const c = hex.replace("#", "");
    const r = parseInt(c.substr(0, 2), 16), g = parseInt(c.substr(2, 2), 16), b = parseInt(c.substr(4, 2), 16);
    const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    return luminance > 0.6 ? "#1a1a1a" : "#f5f5f5";
  }

  async function sha256Hex(text) {
    if (!window.crypto || !window.crypto.subtle) {
      throw new Error("Web Crypto nicht verfügbar");
    }
    const enc = new TextEncoder().encode(text);
    const buf = await crypto.subtle.digest("SHA-256", enc);
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
  }

  const WEBAUTHN_KEY = "dapp_webauthn_creds_v1";
  function loadWebAuthnCreds() {
    try { return JSON.parse(localStorage.getItem(WEBAUTHN_KEY) || "{}"); } catch (e) { return {}; }
  }
  function saveWebAuthnCreds(creds) {
    try { localStorage.setItem(WEBAUTHN_KEY, JSON.stringify(creds)); } catch (e) { /* Speicher evtl. voll — nicht kritisch */ }
  }
  async function isBiometricAvailable() {
    return !!(window.PublicKeyCredential && PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable &&
      await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable());
  }
  function biometricEntries(key) {
    const creds = loadWebAuthnCreds()[key];
    return Array.isArray(creds) ? creds : (creds ? [{ id: creds, label: "Eingerichtet" }] : []); // alte Einzel-Einträge weiter unterstützen
  }
  function hasBiometricSetup(key) {
    return biometricEntries(key).length > 0;
  }
  async function registerBiometric(key, label) {
    try {
      const challenge = crypto.getRandomValues(new Uint8Array(32));
      const userId = crypto.getRandomValues(new Uint8Array(16));
      const cred = await navigator.credentials.create({
        publicKey: {
          challenge,
          rp: { name: "DApp" },
          user: { id: userId, name: label, displayName: label },
          pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
          authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
          timeout: 60000,
        }
      });
      if (!cred) return false;
      const creds = loadWebAuthnCreds();
      const entries = biometricEntries(key);
      entries.push({ id: btoa(String.fromCharCode(...new Uint8Array(cred.rawId))), label });
      creds[key] = entries;
      saveWebAuthnCreds(creds);
      return true;
    } catch (err) {
      console.warn("Face ID/Fingerabdruck-Einrichtung fehlgeschlagen:", err);
      return false;
    }
  }
  async function verifyBiometric(key) {
    const entries = biometricEntries(key);
    if (!entries.length) return false;
    try {
      const challenge = crypto.getRandomValues(new Uint8Array(32));
      const assertion = await navigator.credentials.get({
        publicKey: {
          challenge,
          allowCredentials: entries.map(e => ({ type: "public-key", id: Uint8Array.from(atob(e.id), c => c.charCodeAt(0)) })),
          userVerification: "required",
          timeout: 60000,
        }
      });
      return !!assertion;
    } catch (err) {
      return false;
    }
  }
  function removeBiometricEntry(key, entryId) {
    const creds = loadWebAuthnCreds();
    creds[key] = biometricEntries(key).filter(e => e.id !== entryId);
    saveWebAuthnCreds(creds);
  }
  function removeBiometric(key) {
    const creds = loadWebAuthnCreds();
    delete creds[key];
    saveWebAuthnCreds(creds);
  }

          state.wishlist = unionById(state.wishlist, incoming);

          saveState(); render();
          showToast(added > 0 ? `${added} Wunsch/Wünsche hinzugefügt.` : "Nichts Neues (schon vorhanden).");

    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML = `
      <div class="modal" style="max-width:440px;">
        <div class="modal-header"><h2>${existing ? "Wunsch bearbeiten" : "Neuer Wunsch"}</h2><button class="close-btn" id="closeModal">✕</button></div>

          <div class="modal-footer-right">
            <button class="btn btn-ghost" id="cancelBtn">Abbrechen</button>
            <button class="btn btn-accent" id="saveWishBtn">Speichern</button>

  }

  let autoSyncTimer = null;

  function buildSyncHeaders() {
    const headers = { "Content-Type": "application/json" };
    const auth = (state.connectors.network.authHeader || "").trim();
    const headerName = (state.connectors.network.authHeaderName || "Authorization").trim() || "Authorization";
    if (auth) headers[headerName] = auth;
    return headers;
  }

  function setLastSyncNote(text) {
    const el = document.getElementById("netLastSync");
    if (el) el.textContent = text;
  }

  function urlBase64ToUint8Array(base64String) {
    const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
    const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
    const rawData = atob(base64);
    return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
  }

  async function cachePushConfig() {
    try {
      const cache = await caches.open("push-config");
      await cache.put("/config", new Response(JSON.stringify({
        serverUrl: state.push.serverUrl, deviceId: state.push.deviceId
      }), { headers: { "Content-Type": "application/json" } }));
    } catch (e) { /* Cache Storage evtl. nicht verfügbar — Push funktioniert dann nicht offline-robust, kein Absturz */ }
  }

  let kinshipCache = { events: [], news: [], meals: [] };
  function collectKinshipEvents() {
    return state.events.filter(e => e.kinship).map(e => ({
      id: e.id, title: e.title, date: e.date, time: e.time || "", updatedAt: e.updatedAt || Date.now(),
      familyLabel: state.kinship.familyLabel || "Familie"
    }));
  }
  function collectKinshipNews() {
    return state.newsPosts.filter(p => p.kinship).map(p => ({
      id: p.id, text: p.text || "", photo: p.photo || "", createdAt: p.createdAt, updatedAt: p.updatedAt || p.createdAt,
      familyLabel: state.kinship.familyLabel || "Familie"
    }));
  }
  function collectKinshipMeals() {
    const out = [];
    Object.entries(state.mealPlan || {}).forEach(([dateStr, entry]) => {
      if (!entry || !entry.options) return;
      entry.options.filter(o => o.kinship).forEach(o => {
        out.push({ id: o.id, date: dateStr, text: o.text, updatedAt: o.updatedAt || Date.now(), familyLabel: state.kinship.familyLabel || "Familie" });
      });
    });
    return out;
  }
  async function pushKinshipData(silent) {
    const k = state.kinship;
    if (!k.enabled || !k.circleId || !k.serverUrl) return false;
    try {
      const res = await fetch(k.serverUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          circle: k.circleId,
          events: collectKinshipEvents(), news: collectKinshipNews(), meals: collectKinshipMeals(),
          tombstones: state.tombstones
        })
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      kinshipCache = await res.json();
      if (!silent) showToast("Mit Verwandtschaft synchronisiert.");
      return true;
    } catch (err) {
      console.warn("Verwandtschafts-Push fehlgeschlagen:", err);
      if (!silent) showToast("Verwandtschafts-Sync fehlgeschlagen.");
      return false;
    }
  }
  async function pullKinshipData(silent) {
    const k = state.kinship;
    if (!k.enabled || !k.circleId || !k.serverUrl) return false;
    try {
      const url = k.serverUrl + (k.serverUrl.includes("?") ? "&" : "?") + "circle=" + encodeURIComponent(k.circleId);
      const res = await fetch(url);
      if (!res.ok) throw new Error("HTTP " + res.status);
      kinshipCache = await res.json();
      return true;
    } catch (err) {
      console.warn("Verwandtschafts-Pull fehlgeschlagen:", err);
      if (!silent) showToast("Verwandtschafts-Sync fehlgeschlagen.");
      return false;
    }
  }

  async function connectHueBridge(bridgeUrl) {
    bridgeUrl = bridgeUrl.replace(/\/$/, "");
    try {
      const res = await fetch(`${bridgeUrl}/api`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ devicetype: "dapp#familie" })
      });
      const data = await res.json();
      const entry = Array.isArray(data) ? data[0] : data;
      if (entry && entry.success && entry.success.username) {
        state.hue.bridgeUrl = bridgeUrl;
        state.hue.username = entry.success.username;
        saveState();
        await fetchHueLights();
        return true;
      }
      if (entry && entry.error) {
        showToast(entry.error.description || "Bitte zuerst den Knopf auf der Hue Bridge drücken.");
      }
      return false;
    } catch (err) {
      console.warn("Hue-Bridge-Verbindung fehlgeschlagen:", err);
      showToast("Verbindung fehlgeschlagen — Adresse prüfen und im selben WLAN sein.");
      return false;
    }
  }
  async function fetchHueLights() {
    const h = state.hue;
    if (!h.bridgeUrl || !h.username) return false;
    try {
      const res = await fetch(`${h.bridgeUrl}/api/${h.username}/lights`);
      const data = await res.json();
      const existing = h.lights || [];
      h.lights = Object.entries(data).map(([id, l]) => {
        const prev = existing.find(x => x.id === id);
        return { id, name: l.name, assignedTo: prev ? prev.assignedTo : null, updatedAt: prev ? prev.updatedAt : Date.now() };
      });
      saveState();
      return true;

  function hexToHueSat(hex) {
    const r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
    let h = 0;
    if (d !== 0) {
      if (max === r) h = ((g - b) / d) % 6;
      else if (max === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
    }
    h = Math.round(h * 60); if (h < 0) h += 360;
    const s = max === 0 ? 0 : d / max;
    return { hue: Math.round((h / 360) * 65535), sat: Math.round(s * 254) };
  }

  async function subscribeToPush(serverUrl) {
    if (!serverUrl) { showToast("Bitte zuerst eine Server-Adresse eintragen."); return; }
    try {
      const perm = await Notification.requestPermission();
      if (perm !== "granted") { showToast("Benachrichtigungen wurden nicht erlaubt."); return; }
      const reg = await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if (!sub) {
        sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
        });
      }
      if (!state.push.deviceId) state.push.deviceId = uid();
      state.push.serverUrl = serverUrl;
      const res = await fetch(serverUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          subscription: sub.toJSON(),
          deviceId: state.push.deviceId,
          deviceLabel: (getActiveProfile() ? getActiveProfile().name + " – " : "") + navigator.platform,
          categories: state.push.categories,
          syncUrl: state.connectors.network.url || ""
        })
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      state.push.subscribed = true;
      saveState();
      await cachePushConfig();
      render();
      showToast("Benachrichtigungen aktiviert! 🔔");
    } catch (err) {
      console.warn("Push-Anmeldung fehlgeschlagen:", err);
      showToast("Anmeldung fehlgeschlagen — Server-Adresse und CORS prüfen.");
    }
  }

  async function unsubscribeFromPush() {
    try {
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      if (sub) {
        if (state.push.serverUrl) {
          try {
            await fetch(state.push.serverUrl, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ unsubscribe: true, subscription: sub.toJSON() })
            });
          } catch (e) { /* Server evtl. nicht erreichbar — lokal trotzdem abmelden */ }
        }
        await sub.unsubscribe();
      }
      state.push.subscribed = false;
      saveState();
      render();
      showToast("Benachrichtigungen deaktiviert.");
    } catch (err) {
      console.warn("Push-Abmeldung fehlgeschlagen:", err);
    }
  }

  async function pushToNetwork(silent) {
    const net = state.connectors.network;
    if (!net.url) { if (!silent) showToast("Bitte zuerst eine Server-Adresse eintragen."); return false; }
    try {
      // Erst den aktuellen Serverstand holen und lokal einmischen, damit ein Hochladen
      // niemals Daten überschreibt, die nur auf dem Server (z. B. von einem anderen Gerät) stehen.
      try {
        const getRes = await fetch(net.url, { method: "GET", headers: buildSyncHeaders() });
        if (getRes.ok) {
          const remote = await getRes.json();
          if (remote && Array.isArray(remote.items)) {
            mergeStateFrom(remote);
            saveState({ skipTouch: true });
          }
        }
      } catch (mergeErr) { /* kein Serverstand abrufbar — einfach mit dem lokalen Stand weitermachen */ }

      const res = await fetch(net.url, {
        method: net.method || "PUT",
        headers: buildSyncHeaders(),
        body: JSON.stringify(sanitizedStateSnapshot(null, true))
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      net.lastSyncAt = Date.now();
      saveState({ skipTouch: true });
      renderProfileBar();
      render();
      setLastSyncNote("Zuletzt hochgeladen: " + fmtDate(net.lastSyncAt));
      if (!silent) showToast("DApp wurde hochgeladen.");
      return true;
    } catch (err) {
      if (!silent) showToast("Hochladen fehlgeschlagen — Adresse, CORS oder Netzwerk prüfen.");
      console.warn("Netzwerk-Sync (Upload) fehlgeschlagen:", err);
      return false;
    }
  }

  async function pullFromNetwork(silent, opts) {
    const net = state.connectors.network;
    if (!net.url) { if (!silent) showToast("Bitte zuerst eine Server-Adresse eintragen."); return false; }
    try {
      const res = await fetch(net.url, { method: "GET", headers: buildSyncHeaders() });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const remote = await res.json();
      if (!remote || !Array.isArray(remote.items)) throw new Error("Ungültiges Format");

      const remoteModified = (remote.meta && remote.meta.lastModified) || 0;
      const localModified = (state.meta && state.meta.lastModified) || 0;
      if (opts && opts.onlyIfNewer && remoteModified <= localModified) {
        setLastSyncNote("Lokaler Stand ist bereits aktuell (Stand Server: " + fmtDate(remoteModified) + ").");
        return false;
      }
      // Zusammenführen statt überschreiben: bestehende lokale Daten bleiben erhalten,
      // alles Neue vom Server kommt ergänzend dazu (verhindert Datenverlust bei mehreren Geräten).
      mergeStateFrom(remote);
      // Ein Sync im Hintergrund meldet niemanden mehr ab: wer den Bereich bereits mit
      // PIN/Face ID geöffnet hat, bleibt drin. Gesperrt wird nur noch bewusst über den
      // Sperren-Knopf oder beim Neuladen der App.
      state.connectors.network.lastSyncAt = Date.now();
      saveState();
      renderProfileBar();
      render();
      setLastSyncNote("Zuletzt heruntergeladen: " + fmtDate(state.connectors.network.lastSyncAt));
      if (!silent) showToast("Neue Daten vom Server übernommen (zusammengeführt).");
      return true;
    } catch (err) {
      if (!silent) showToast("Herunterladen fehlgeschlagen — Adresse, CORS oder Netzwerk prüfen.");
      console.warn("Netzwerk-Sync (Download) fehlgeschlagen:", err);
      return false;
    }
  }

  async function testNetworkConnection() {
    const net = state.connectors.network;
    if (!net.url) { showToast("Bitte zuerst eine Server-Adresse eintragen."); return; }
    showToast("Teste Verbindung…");
    try {
      const res = await fetch(net.url, { method: "GET", headers: buildSyncHeaders() });
      showToast(res.ok ? `Verbindung erfolgreich (HTTP ${res.status}).` : `Server antwortet mit HTTP ${res.status}.`);
    } catch (err) {
      showToast("Verbindung fehlgeschlagen — Adresse, CORS oder Netzwerk prüfen.");
    }
  }

  function stopAutoSync() {
    if (autoSyncTimer) { clearInterval(autoSyncTimer); autoSyncTimer = null; }
  }

  function startAutoSync() {
    stopAutoSync();
    const net = state.connectors.network;
    if (!net.autoSync || !net.url) return;
    const ms = Math.max(1, net.intervalMinutes || 5) * 60 * 1000;
    autoSyncTimer = setInterval(async () => {
      const pulled = await pullFromNetwork(true, { onlyIfNewer: true, skipConfirm: true });
      if (!pulled) await pushToNetwork(true);
    }, ms);
  }

  function wireNetworkSyncControls(scope) {
    const net = state.connectors.network;
    const urlEl = scope.querySelector("#netUrl");
    const authNameEl = scope.querySelector("#netAuthName");
    const authEl = scope.querySelector("#netAuth");
    const methodEl = scope.querySelector("#netMethod");
    const intervalEl = scope.querySelector("#netInterval");
    const autoEl = scope.querySelector("#netAutoSync");
    const badge = scope.querySelector("#netStatusBadge");

    if (net.lastSyncAt) setLastSyncNote("Zuletzt synchronisiert: " + fmtDate(net.lastSyncAt));

    function persistConfig() {
      net.url = urlEl.value.trim();
      net.authHeaderName = authNameEl.value.trim() || "Authorization";
      net.authHeader = authEl.value.trim();
      net.method = methodEl.value;
      net.intervalMinutes = parseInt(intervalEl.value, 10) || 5;
      saveState({ skipTouch: true });
    }

    [urlEl, authNameEl, authEl].forEach(el => el.addEventListener("change", persistConfig));
    methodEl.addEventListener("change", persistConfig);
    intervalEl.addEventListener("change", () => { persistConfig(); startAutoSync(); });
    autoEl.addEventListener("change", () => {
      net.autoSync = autoEl.checked;
      persistConfig();
      badge.textContent = net.autoSync ? "Auto-Sync aktiv" : "manuell";
      if (net.autoSync) {
        if (!net.url) { showToast("Bitte zuerst eine Server-Adresse eintragen."); autoEl.checked = false; net.autoSync = false; persistConfig(); return; }
        startAutoSync();
        showToast("Automatische Synchronisierung aktiviert.");
      } else {
        stopAutoSync();
      }
    });

    scope.querySelector("#netTestBtn").onclick = () => { persistConfig(); testNetworkConnection(); };
    scope.querySelector("#netPushBtn").onclick = () => { persistConfig(); pushToNetwork(false); };
    scope.querySelector("#netPullBtn").onclick = () => { persistConfig(); pullFromNetwork(false); };

    scope.querySelector("#netExportConfigBtn").onclick = () => {
      persistConfig();
      const cfg = {
        type: "dapp-sync-config",
        url: net.url, authHeaderName: net.authHeaderName, authHeader: net.authHeader,
        method: net.method, autoSync: net.autoSync, intervalMinutes: net.intervalMinutes
      };
      downloadBlob(JSON.stringify(cfg, null, 2), `dapp-sync-einstellungen-${Date.now()}.json`, "application/json");
    };
    const netConfigFileInput = scope.querySelector("#netConfigFileInput");
    scope.querySelector("#netImportConfigBtn").onclick = () => netConfigFileInput.click();
    netConfigFileInput.onchange = () => {
      const file = netConfigFileInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const cfg = JSON.parse(e.target.result);
          if (typeof cfg.url !== "string") throw new Error("Ungültiges Format");
          net.url = cfg.url || "";
          net.authHeaderName = cfg.authHeaderName || "Authorization";
          net.authHeader = cfg.authHeader || "";
          net.method = cfg.method || "PUT";
          net.autoSync = !!cfg.autoSync;
          net.intervalMinutes = cfg.intervalMinutes || 5;
          saveState();
          startAutoSync();
          render();
          showToast("Sync-Einstellungen übernommen.");
        } catch (err) { showToast("Import fehlgeschlagen — ist das eine gültige Sync-Einstellungsdatei?"); }
      };
      reader.readAsText(file);
      netConfigFileInput.value = "";
    };
  }

  function openQuickAddMenu(anchorBtn) {
    document.querySelectorAll(".quick-add-menu").forEach(m => m.remove());
    const menu = document.createElement("div");
    menu.className = "quick-add-menu";
    Object.assign(menu.style, {
      position: "absolute", background: "var(--surface)", border: "1px solid var(--border)",
      borderRadius: "var(--radius)", boxShadow: "var(--shadow)", padding: "6px", zIndex: 70,
      display: "flex", flexDirection: "column", minWidth: "170px"
    });
    // Schnelleintrag in eine bestehende Checkliste — spart den Umweg über die Liste selbst
    const existingChecklists = state.items.filter(it => it.type === "checklist" && canSeeItemDetails(it));
    if (existingChecklists.length) {
      const quick = document.createElement("div");
      quick.className = "quick-add-check";
      quick.innerHTML = `
        <input type="text" id="qaText" placeholder="Schnell auf eine Liste …">
        <select id="qaList">${existingChecklists.map(cl => `<option value="${cl.id}">${escapeHtml(cl.title || "Ohne Titel")}</option>`).join("")}</select>
        <button type="button" class="btn btn-sm btn-accent" id="qaAdd">+</button>`;
      menu.appendChild(quick);
      const qaText = quick.querySelector("#qaText");
      const doQuickAdd = () => {
        const text = qaText.value.trim();
        if (!text) return;
        const target = state.items.find(it => it.id === quick.querySelector("#qaList").value);
        if (!target) return;
        target.items = target.items || [];
        target.items.push({ id: uid(), text, done: false });
        target.updatedAt = Date.now();
        saveState();
        menu.remove();
        showToast(`„${text}" hinzugefügt.`);
        render();
      };
      quick.querySelector("#qaAdd").onclick = doQuickAdd;
      qaText.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); doQuickAdd(); } });
      qaText.addEventListener("click", (e) => e.stopPropagation());
      const sep = document.createElement("div");
      sep.className = "nav-divider";
      menu.appendChild(sep);
      setTimeout(() => qaText.focus(), 40);
    }

    const options = [
      { type: "note", label: "📝 Notiz" },
      { type: "checklist", label: "☑️ Neue Checkliste" },
      { type: "image", label: "🖼️ Bild" },
      { type: "news", label: "📰 Familien-News" },
    ];
    options.forEach(o => {
      const b = document.createElement("button");
      b.className = "nav-item";
      b.style.padding = "8px 10px";
      b.textContent = o.label;
      b.onclick = () => { menu.remove(); if (o.type === "news") setView("news"); else openEditor(o.type); };
      menu.appendChild(b);
    });
    document.body.appendChild(menu);
    const rect = anchorBtn.getBoundingClientRect();
    menu.style.top = (rect.bottom + window.scrollY + 6) + "px";
    menu.style.right = (window.innerWidth - rect.right) + "px";
    setTimeout(() => {
      document.addEventListener("click", function handler(e) {
        if (!menu.contains(e.target) && e.target !== anchorBtn) { menu.remove(); document.removeEventListener("click", handler); }
      });
    }, 10);
  }

  async function checkForLocalNotifications() {
    if (!state.push.localCheckEnabled || Notification.permission !== "granted") return;
    const cats = state.push.categories;
    const todayStrLocal = new Date().toISOString().slice(0, 10);
    const seen = loadLocalSeen();

    if (cats.tasks) {

      });
      state.events.filter(ev => !ev.private && !seen.tasks.includes(ev.id)).forEach(ev => {

        seen.tasks.push(ev.id);
      });

    if (cats.meals) {

          seen.meals.push(d);

        seen.approvals.push(t.id);
      });
      state.rewards.filter(r => r.approved === false && !seen.approvals.includes(r.id)).forEach(r => {
        showLocalNotification("DApp", `✅ Freigabe nötig: Belohnung „${r.title}"`);
        seen.approvals.push(r.id);
      });
    }
    if (cats.weather && state.federalState && warnCache.data) {
      const stateNameLocal = (GERMAN_STATES.find(s => s.code === state.federalState) || {}).name;

  function buildTickerMessages() {
    const todayStr = new Date().toISOString().slice(0, 10);
    const messages = [];
    const upcomingForTicker = state.events.filter(ev => ev.date >= todayStr && canSeeEventDetails(ev))
      .sort((a, b) => (a.date + (a.time || "")).localeCompare(b.date + (b.time || "")))[0];
    if (upcomingForTicker) {
      messages.push({ view: "calendar", date: upcomingForTicker.date, text: `📅 Nächster Termin: ${upcomingForTicker.title} — ${upcomingForTicker.date === todayStr ? "heute" : formatDateStrShort(upcomingForTicker.date)}` });
    }
    const nextHomework = state.tasks.filter(t => t.category === "homework" && !t.done && t.dueDate && t.approved !== false)
      .sort((a, b) => a.dueDate.localeCompare(b.dueDate))[0];
    if (nextHomework) {
      const owner = getProfile(nextHomework.assignedTo);
      messages.push({ view: "tasks", text: `📚 ${nextHomework.title}${owner ? " (" + owner.name + ")" : ""} — fällig ${nextHomework.dueDate === todayStr ? "heute" : formatDateStrShort(nextHomework.dueDate)}` });
    }
    if (state.custodySchedules.length) {
      state.custodySchedules.forEach(s => {
        const res = custodyResultForDate(s, todayStr);
        if (res && res.isSwitchDay) {
          const parents = (res.block.profileIds || []).map(id => getProfile(id)).filter(Boolean);
          messages.push({ view: "calendar", date: todayStr, text: `🔁 Heute Wechseltag${parents.length ? " zu " + parents.map(p => p.name).join(" & ") : ""}` });
        }
      });
    }
    const vacForTicker = getVacationStatus();
    if (vacForTicker) {
      messages.push({ view: "calendar", text: vacForTicker.type === "current"
        ? `${vacForTicker.emoji} Urlaub: ${vacForTicker.name} — ${countdownText(vacForTicker.days, { zero: "heute letzter Tag", one: "noch 1 Tag" })}`
        : `${vacForTicker.emoji} ${countdownText(vacForTicker.days, { zero: "Heute geht es los", one: "Morgen geht es los" })}${vacForTicker.days > 1 ? " bis" : " —"} ${vacForTicker.name}` });
    }
    const ferienForTicker = getFerienStatus();
    if (ferienForTicker) {
      messages.push({ view: "calendar", text: ferienForTicker.type === "current"
        ? (ferienForTicker.days <= 1
            ? `🏖️ ${ferienForTicker.days === 0 ? "Heute ist der letzte Ferientag" : "Morgen geht die Schule wieder los"}`
            : `🏖️ Ferien! Noch ${ferienForTicker.days} Tage bis Schulbeginn (${ferienForTicker.name})`)
        : (() => {
            const sd = countSchoolDays(todayStr, ferienForTicker.lastSchoolDay);
            if (sd === 0) return `🏖️ Heute ist der letzte Schultag`;
            return `🏖️ Noch ${sd} Schultag${sd === 1 ? "" : "e"} bis ${ferienForTicker.name}. Letzter Schultag ${formatDateWithWeekday(ferienForTicker.lastSchoolDay)}`;
          })() });
    }
    if (weatherCache.data) {
      const cw = weatherCache.data.current_weather;
      messages.push({ view: "settings", text: `${weatherInfo(cw.weathercode).icon} ${Math.round(cw.temperature)}° in ${state.weatherLocation.name}` });
    }
    const openShoppingCount = state.shoppingList.filter(i => !i.done).length;
    if (openShoppingCount) messages.push({ view: "shopping", text: `🛒 ${openShoppingCount} Ding${openShoppingCount === 1 ? "" : "e"} auf der Einkaufsliste` });
    const activeIdForTicker = state.activeProfileId;
    const mealDatesForTicker = Array.from({ length: 7 }, (_, i) => addDays(todayStr, i));
    let unvotedMeal = null;
    for (const d of mealDatesForTicker) {
      const entry = getMealEntry(d);
      const pending = entry.options.find(o => !entry.confirmed && (!activeIdForTicker || !(o.votes || []).includes(activeIdForTicker)));
      if (pending) { unvotedMeal = { date: d, text: pending.text }; break; }
    }
    if (unvotedMeal) {
      messages.push({ view: "mealplan", mealDate: unvotedMeal.date, text: `🍽️ Neuer Essensvorschlag: ${unvotedMeal.text} (${unvotedMeal.date === todayStr ? "heute" : formatDateStrShort(unvotedMeal.date)}) — jetzt abstimmen!` });
    }
    const kidsForLeader = state.profiles.filter(p => p.role === "child");
    if (kidsForLeader.length) {
      const leader = kidsForLeader.map(p => ({ p, pts: pointsBalance(p.id) })).sort((a, b) => b.pts - a.pts)[0];
      if (leader && leader.pts > 0) messages.push({ view: "tasks", text: `⭐ ${leader.p.name} führt mit ${leader.pts} Punkten` });
    }
    if (kpCache.data && state.weatherLocation.lat) {
      const kpForTicker = Math.round(kpCache.data.Kp);
      const neededForTicker = kpNeededForLatitude(state.weatherLocation.lat);
      if (kpForTicker >= neededForTicker) {
        messages.push({ view: "home", text: `🌌 Nordlicht-Chance heute Nacht! Kp ${kpForTicker}` });

    }
    if (state.federalState && warnCache.data) {
      const stateNameForTicker = (GERMAN_STATES.find(s => s.code === state.federalState) || {}).name;
      const severeWarn = warnCache.data.filter(w => warningMatchesRegion(w, stateNameForTicker) && w.level >= 3)[0];
      if (severeWarn) {
        messages.push({ view: "home", text: `⚠️ ${(severeWarn.headline || "Unwetterwarnung").replace(/^Amtliche /, "")} — ${severeWarn.regionName || ""}` });
      }
    }
    if (state.federalState && pollenCache.data) {
      const regionIdForTicker = POLLEN_REGION_BY_STATE[state.federalState];
      const entriesForTicker = pollenCache.data.filter(r => r.region_id === regionIdForTicker);
      let bestForTicker = null;
      entriesForTicker.forEach(r => {
        Object.entries(r.Pollen || {}).forEach(([type, vals]) => {
          const score = pollenScore(vals.today);
          if (score > (bestForTicker ? bestForTicker.score : -1)) bestForTicker = { type, score };
        });
      });
      if (bestForTicker && bestForTicker.score >= 2.5) {
        messages.push({ view: "home", text: `🌿 Hohe Pollenbelastung heute: ${POLLEN_NAMES[bestForTicker.type] || bestForTicker.type}` });
      }
    }
    // Abstimmungen und Freigaben gehören in den Ticker, sonst gehen sie unter
    {
      const meT = getActiveProfile();
      let openVotes = 0;
      Array.from({ length: 14 }, (_, i) => addDays(todayStr, i)).forEach(d => {
        const entry = getMealEntry(d);
        if (entry.confirmed) return;
        entry.options.forEach(o => {
          if (!state.activeProfileId || !(o.votes || []).includes(state.activeProfileId)) openVotes++;
        });
      });
      (state.vacations || []).filter(v => v.votable && v.end >= todayStr).forEach(v => {
        if (!state.activeProfileId || !(v.votes || []).includes(state.activeProfileId)) openVotes++;
      });
      if (openVotes) messages.push({ view: "mealplan", text: `🗳️ ${openVotes} offene Abstimmung${openVotes === 1 ? "" : "en"} — deine Stimme fehlt noch` });
      if (!meT || meT.role === "parent") {
        const approvals = state.tasks.filter(t => t.approved === false).length
          + state.rewards.filter(r => r.approved === false).length
          + (state.allowanceRequests || []).filter(r => r.status === "pending").length;
        if (approvals) messages.push({ view: "tasks", text: `✅ ${approvals} Freigabe${approvals === 1 ? "" : "n"} wartet auf dich` });
      }
    }
    const latestNews = state.newsPosts.slice().sort((a, b) => b.createdAt - a.createdAt)[0];
    if (latestNews && Date.now() - latestNews.createdAt < 24 * 60 * 60 * 1000) {
      const author = latestNews.createdBy ? getProfile(latestNews.createdBy) : null;
      const preview = latestNews.text || (latestNews.photo ? "📷 Foto" : latestNews.audio ? "🎤 Sprachnachricht" : "");
      messages.push({ view: "news", text: `📰 ${author ? author.name + ": " : ""}${preview}` });
    }
    if (!messages.length) messages.push({ view: "home", text: "👋 Willkommen bei DApp — leg direkt los!" });
    return messages;
  }

  function setupGlobalTicker() {
    const textEl = document.getElementById("globalTickerText");
    const viewport = document.getElementById("globalTickerViewport");
    const tickerEl = document.getElementById("globalTicker");
    if (!textEl || !viewport) return;
    if (tickerInterval) { clearInterval(tickerInterval); tickerInterval = null; }
    let lastKey = "";

    function buildTape() {
      const messages = buildTickerMessages();
      const key = messages.map(m => m.text).join("|");
      if (key === lastKey) return; // nichts Neues — laufende Animation nicht unterbrechen
      lastKey = key;

      const segHtml = messages.map(m =>
        `<span class="ticker-seg" data-view="${m.view || ""}"${m.date ? ` data-date="${m.date}"` : ""}${m.mealDate ? ` data-meal-date="${m.mealDate}"` : ""}>${escapeHtml(m.text)}</span>`
      ).join(`<span class="ticker-sep">✦</span>`);
      // Zweimal hintereinander für einen nahtlosen Loop (bei -50% Verschiebung wiederholt sich exakt derselbe Inhalt).
      textEl.innerHTML = `<span class="ticker-copy">${segHtml}</span><span class="ticker-sep">✦</span><span class="ticker-copy">${segHtml}</span><span class="ticker-sep">✦</span>`;
      textEl.style.animation = "none";

      requestAnimationFrame(() => {
        const oneCopyWidth = textEl.querySelector(".ticker-copy").getBoundingClientRect().width
          + textEl.querySelector(".ticker-sep").getBoundingClientRect().width;
        const duration = Math.max(12, oneCopyWidth / 55); // gleichmäßiges, ruhiges Lesetempo
        textEl.style.setProperty("--tape-distance", `-${oneCopyWidth}px`);
        textEl.style.animation = `tickerTape ${duration}s linear infinite`;
      });
    }
    tickerEl.onclick = (e) => {
      const seg = e.target.closest(".ticker-seg");
      const view = seg && seg.dataset.view;
      if (!view) return;
      // Wo es sinnvoll ist, direkt zum passenden Tag springen statt nur den Bereich zu öffnen.
      if (seg.dataset.date) {
        // Kalender auf die Woche des Ereignisses stellen und dort auch anzeigen
        calendarCursorStr = seg.dataset.date;
        calendarViewMode = "week";
      }
      if (seg.dataset.mealDate) { mealPlanWeekCursor = startOfWeek(seg.dataset.mealDate); }
      setView(view);
      if (seg.dataset.date) setTimeout(() => openDayOverview(seg.dataset.date), 140);
    };
    buildTape();
    tickerInterval = setInterval(buildTape, 20000);
  }

  function init() {
    // Browser soll die Scrollposition nicht selbst wiederherstellen
    if ("scrollRestoration" in history) { try { history.scrollRestoration = "manual"; } catch (e) {} }
    applyTheme(state.theme || "papier");
    try { if (localStorage.getItem("dapp_echo_show_mode") === "1") document.body.classList.add("echo-show-mode"); } catch (e) {}
    if (!state.activeProfileId && state.profiles.length) state.activeProfileId = state.profiles[0].id;
    renderProfileBar();
    const buildTagEl = document.getElementById("buildTag");
    if (buildTagEl) buildTagEl.textContent = `Build ${APP_BUILD_NUMBER} · ${APP_BUILD_DATE}`;
    setupBlockBreakEffect();

    document.getElementById("hamburger").onclick = () => {
      setSidebarOpen(!document.getElementById("sidebar").classList.contains("open"));
    };
    document.getElementById("sidebarBackdrop").onclick = () => setSidebarOpen(false);
    document.querySelectorAll(".nav-item[data-view]").forEach(btn => {
      btn.onclick = () => setView(btn.dataset.view);
    });
    const toolsSubmenu = document.getElementById("toolsSubmenu");
    const toolsArrow = document.getElementById("toolsArrow");
    const toolsChildViews = ["toothbrush", "notes", "images", "retrogames"];
    if (toolsChildViews.includes(currentView)) {
      toolsSubmenu.classList.add("open");
      toolsArrow.textContent = "▾";
    }
    const orgaSubmenu = document.getElementById("orgaSubmenu");
    const orgaArrow = document.getElementById("orgaArrow");
    if (orgaSubmenu && ["tasks", "mealplan", "shopping", "calendar", "recipes"].includes(currentView)) {
      orgaSubmenu.classList.add("open");
      orgaArrow.textContent = "▾";
    }
    const orgaToggleBtn = document.getElementById("orgaToggle");
    if (orgaToggleBtn) orgaToggleBtn.onclick = () => {
      const open = orgaSubmenu.classList.toggle("open");
      orgaArrow.textContent = open ? "▾" : "▸";
    };
    const schoolSubmenu = document.getElementById("schoolSubmenu");
    const schoolArrow = document.getElementById("schoolArrow");
    if (schoolSubmenu && ["homework", "grades", "learnai"].includes(currentView)) {
      schoolSubmenu.classList.add("open");
      schoolArrow.textContent = "▾";
    }
    const schoolToggleBtn = document.getElementById("schoolToggle");
    if (schoolToggleBtn) schoolToggleBtn.onclick = () => {
      const open = schoolSubmenu.classList.toggle("open");
      schoolArrow.textContent = open ? "▾" : "▸";
    };
    // Menüreihenfolge oberhalb des Sync-Knopfs frei anpassbar (langes Drücken am Griff)
    const navEl = document.querySelector(".sidebar .nav");
    if (navEl) {
      Array.from(navEl.children).forEach(el => {
        if (el.classList.contains("nav-item") && !el.dataset.sortId) {
          el.dataset.sortId = el.dataset.view || el.id || (el.textContent || "").trim();
        }
      });
      let navOrder = [];
      try { navOrder = JSON.parse(localStorage.getItem("dapp_nav_order") || "[]"); } catch (e) {}
      if (navOrder.length) {
        navOrder.forEach(key => {
          const el = navEl.querySelector(`:scope > [data-sort-id="${CSS.escape(key)}"]`);
          if (!el) return;
          navEl.appendChild(el);
          // Untermenü direkt hinter seinem Kopf halten
          const sub = el.id === "toolsToggle" ? document.getElementById("toolsSubmenu")
            : el.id === "schoolToggle" ? document.getElementById("schoolSubmenu")
            : el.id === "orgaToggle" ? document.getElementById("orgaSubmenu") : null;
          if (sub) navEl.appendChild(sub);
        });
      }
      makeListSortable(navEl, ":scope > .nav-item[data-sort-id]", (order) => {
        // Untermenüs direkt hinter ihren Kopf nachziehen, damit sie nicht verwaisen
        [["toolsToggle", "toolsSubmenu"], ["schoolToggle", "schoolSubmenu"], ["orgaToggle", "orgaSubmenu"]]
          .forEach(([headId, subId]) => {
            const head = document.getElementById(headId), sub = document.getElementById(subId);
            if (head && sub && head.nextElementSibling !== sub) head.after(sub);
          });
        try { localStorage.setItem("dapp_nav_order", JSON.stringify(order)); } catch (e) {}
        showToast("Menü-Reihenfolge gespeichert.");
      });
    }

    const quickSyncBtn = document.getElementById("quickSyncBtn");
    if (quickSyncBtn) {
      quickSyncBtn.onclick = async () => {
        const net = state.connectors.network;
        if (!net.url) { showToast("Noch keine Sync-Adresse hinterlegt — siehe Einstellungen."); setView("settings"); return; }
        const icon = document.getElementById("quickSyncIcon");
        quickSyncBtn.disabled = true;
        if (icon) icon.classList.add("sync-spinning");
        try {
          // Erst die eigenen Änderungen hochladen, danach den zusammengeführten Stand
          // wieder herunterladen — so gehen weder eigene noch fremde Änderungen verloren.
          const pushed = await pushToNetwork(true);
          const pulled = await pullFromNetwork(true, { skipConfirm: true });
          showToast(pushed || pulled ? "Synchronisiert ✓" : "Sync fehlgeschlagen — Verbindung prüfen.");
        } catch (e) {
          showToast("Sync fehlgeschlagen — Verbindung prüfen.");
        } finally {
          quickSyncBtn.disabled = false;
          if (icon) icon.classList.remove("sync-spinning");
          render();
        }
      };
    }
    document.getElementById("toolsToggle").onclick = () => {
      const open = toolsSubmenu.classList.toggle("open");
      toolsArrow.textContent = open ? "▾" : "▸";
    };
    document.getElementById("newItemBtn").onclick = (e) => openQuickAddMenu(e.currentTarget);

    let searchTimer;
    document.getElementById("searchInput").oninput = (e) => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => { searchQuery = e.target.value.trim(); render(); }, 150);
    };

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA") {
        e.preventDefault(); document.getElementById("searchInput").focus();
      }
    });

    document.querySelectorAll(".nav-item[data-view]").forEach(b => {
      b.classList.toggle("active", b.dataset.view === currentView);
    });
    resetRecurringTasksIfNeeded();
    applyHolidayMood();
    runDueRecurringAllowances();
    render();
    registerServiceWorker();
    if (state.push.subscribed) cachePushConfig();
    setupLocalNotificationCheck();
    setupInstallPrompt();
    setupGlobalTicker();
    if (state.connectors.network.autoSync && state.connectors.network.url) {
      pullFromNetwork(true, { onlyIfNewer: true, skipConfirm: true }).then(() => startAutoSync());
    }
    if (state.kinship.enabled && state.kinship.circleId && state.kinship.serverUrl) {
      pullKinshipData(true).then(() => render());
      setInterval(() => { pushKinshipData(true).then(() => pullKinshipData(true)).then(() => render()); }, 10 * 60 * 1000);
    }
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState !== "visible") return;
      resetRecurringTasksIfNeeded();
      applyHolidayMood();
      render();
      if (state.kinship.enabled && state.kinship.circleId) { pullKinshipData(true).then(() => render()); }
      const net = state.connectors.network;
      if (!net.autoSync || !net.url) return;
      const dueMs = Math.max(1, net.intervalMinutes || 5) * 60 * 1000;
      if (Date.now() - (net.lastSyncAt || 0) > dueMs) {
        pullFromNetwork(true, { onlyIfNewer: true, skipConfirm: true }).then((pulled) => { if (!pulled) pushToNetwork(true); });
      }
    });
  }

  /* ============ PWA: Service Worker & Installierbarkeit ============ */
  function setupBlockBreakEffect() {
    const PARTICLE_COLORS = ["#4CAF32", "#3E7A22", "#8B5A2B", "#6B4A22"];
    document.addEventListener("click", (e) => {
      if (!document.body.classList.contains("theme-blockwelt")) return;
      const btn = e.target.closest(".btn");
      if (!btn) return;
      const rect = btn.getBoundingClientRect();
      const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
      for (let i = 0; i < 8; i++) {
        const p = document.createElement("div");
        p.className = "mc-particle";
        const angle = Math.random() * Math.PI * 2;
        const dist = 24 + Math.random() * 26;
        p.style.left = cx + "px";
        p.style.top = cy + "px";
        p.style.background = PARTICLE_COLORS[i % PARTICLE_COLORS.length];
        p.style.setProperty("--mcx", Math.cos(angle) * dist + "px");
        p.style.setProperty("--mcy", Math.sin(angle) * dist + "px");
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 600);
      }
    });
  }

  function registerServiceWorker() {
    if (!("serviceWorker" in navigator)) return;
    // Nur registrieren, wenn die Datei tatsächlich über http(s) ausgeliefert wird
    // (bei lokalem Öffnen per file:// unterstützen Browser keine Service Worker).
    if (location.protocol === "file:") return;
    navigator.serviceWorker.register("./sw.js").catch((err) => {
      console.warn("Service Worker konnte nicht registriert werden:", err);
    });
  }

  function setupInstallPrompt() {
    let deferredPrompt = null;
    const btn = document.getElementById("installBtn");
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      btn.style.display = "flex";
    });
    btn.addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const choice = await deferredPrompt.userChoice;
      if (choice.outcome === "accepted") showToast("DApp wird installiert…");
      deferredPrompt = null;
      btn.style.display = "none";
    });
    window.addEventListener("appinstalled", () => {
      btn.style.display = "none";
      showToast("DApp wurde installiert.");
    });
  }

  document.addEventListener("DOMContentLoaded", init);
})();

</script>
