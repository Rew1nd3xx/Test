          <div style="display:flex;flex-wrap:wrap;gap:8px;">
            ${state.profiles.map(p => `
              <label class="profile-chip" style="cursor:pointer;">
                <input type="checkbox" class="f-person" value="${p.id}" ${(draft.taggedProfileIds || []).includes(p.id) ? "checked" : ""} style="accent-color:${p.color};">
                <span class="mini-avatar" style="background:${p.color};">${p.emoji || p.name.charAt(0)}</span> ${escapeHtml(p.name)}
              </label>`).join("")}
          </div>
        </div>` : ""}
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:10px;cursor:pointer;">
          <input type="checkbox" id="f-private" ${draft.private ? "checked" : ""} style="width:16px;height:16px;accent-color:var(--accent);">
          🔒 Privat — wird beim Teilen mit der Familie nicht mit übertragen
        </label>
        <div class="modal-footer">
          <div>${existing ? `<button class="btn btn-danger" id="deleteBtn">Löschen</button>` : ""}</div>
          <div class="modal-footer-right">
            <button class="btn btn-ghost" id="cancelBtn">Abbrechen</button>
            <button class="btn btn-accent" id="saveBtn">Speichern</button>
          </div>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    if (type === "note") {
      const bodyTextarea = overlay.querySelector("#f-body");
      overlay.querySelectorAll(".md-btn[data-md]").forEach(btn => {
        btn.onclick = () => {
          const action = btn.dataset.md;
          if (action === "bold") wrapSelection(bodyTextarea, "**");
          else if (action === "italic") wrapSelection(bodyTextarea, "*");
          else if (action === "code") wrapSelection(bodyTextarea, "`");
          else if (action === "highlight") wrapSelection(bodyTextarea, "==");
          else if (action === "strike") wrapSelection(bodyTextarea, "~~");
          else if (action === "heading") prefixLines(bodyTextarea, "## ");
          else if (action === "bullet") prefixLines(bodyTextarea, "- ");
          else if (action === "numbered") prefixLines(bodyTextarea, "1. ");
        };
      });
    }

    // checklist rows
    const todayStrEditor = new Date().toISOString().slice(0, 10);
    function renderChecklistRows() {
      const wrap = overlay.querySelector("#checklistItems");
      if (!wrap) return;
      wrap.innerHTML = "";
      const hw = draft.hwMode;
      (draft.items || []).forEach((row) => {
        const overdue = hw && row.dueDate && !row.done && row.dueDate < todayStrEditor;
        const r = document.createElement("div");
        r.className = "checklist-row";
        if (row.id) r.dataset.sortId = row.id;
        if (hw) r.classList.add("checklist-row-hw");
        r.innerHTML = hw ? `
          <input type="checkbox" ${row.done ? "checked" : ""}>
          <input type="text" class="hw-text" value="${escapeHtml(row.text)}" placeholder="Aufgabe (z. B. S. 12, Nr. 3)" style="flex:2;">
          <input type="text" class="hw-subject" value="${escapeHtml(row.subject || "")}" placeholder="Fach" style="flex:1;max-width:110px;">
          <input type="date" class="hw-due" value="${escapeHtml(row.dueDate || "")}" style="max-width:150px;${overdue ? "color:#C0453B;border-color:#C0453B;" : ""}">
          <select class="hw-recurring" style="max-width:120px;padding:7px 9px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);">
            <option value="" ${!row.recurring ? "selected" : ""}>Einmalig</option>
            <option value="daily" ${row.recurring === "daily" ? "selected" : ""}>🔁 Täglich</option>
            <option value="weekly" ${row.recurring === "weekly" ? "selected" : ""}>🔁 Wöchentlich</option>
          </select>
          <button type="button" class="del" title="Entfernen">✕</button>` : `
          <input type="checkbox" ${row.done ? "checked" : ""}>
          <input type="text" value="${escapeHtml(row.text)}" placeholder="Aufgabe...">
          <button type="button" class="outdent" title="Ausrücken">⇤</button>
          <button type="button" class="indent" title="Einrücken">⇥</button>
          <button type="button" class="sub" title="Unterpunkt hinzufügen">↳</button>
          <button type="button" class="del" title="Entfernen">✕</button>`;
        // Unterpunkte werden eingerückt dargestellt
        if (!hw && row.level) r.style.marginLeft = Math.min(3, row.level) * 22 + "px";
        if (hw) {
          const [cb, txt, subj, due, rec, del] = r.children;
          cb.onchange = () => {
            if (cb.checked && row.recurring && row.dueDate) {
              const nextDays = row.recurring === "daily" ? 1 : 7;
              row.dueDate = addDays(row.dueDate, nextDays);
              row.done = false;
              showToast(`Erledigt — nächster Termin: ${formatDateStrShort(row.dueDate)}`);
            } else {
              row.done = cb.checked;
            }
            renderChecklistRows();
          };
          txt.oninput = () => { row.text = txt.value; };
          subj.oninput = () => { row.subject = subj.value; };
          due.onchange = () => { row.dueDate = due.value; renderChecklistRows(); };
          rec.onchange = () => { row.recurring = rec.value; };
          del.onclick = () => { draft.items = draft.items.filter(x => x !== row); renderChecklistRows(); };
        } else {
          const [cb, txt, outdentBtn, indentBtn, subBtn, del] = r.children;
          outdentBtn.onclick = () => {
            row.level = Math.max(0, (row.level || 0) - 1);
            syncChecklistParents(draft.items);
            renderChecklistRows();
          };
          indentBtn.onclick = () => {
            const idx = draft.items.indexOf(row);
            // Nur einrücken, wenn es darüber einen passenden Oberpunkt gibt
            const prevLevel = idx > 0 ? (draft.items[idx - 1].level || 0) : -1;
            row.level = Math.min(3, Math.min((row.level || 0) + 1, prevLevel + 1));
            syncChecklistParents(draft.items);
            renderChecklistRows();
          };
          subBtn.onclick = () => {
            const idx = draft.items.indexOf(row);
            draft.items.splice(idx + 1, 0, { id: uid(), text: "", done: false, level: Math.min(3, (row.level || 0) + 1) });
            renderChecklistRows();
          };
          cb.onchange = () => { row.done = cb.checked; };
          txt.oninput = () => { row.text = txt.value; };
          del.onclick = () => { draft.items = draft.items.filter(x => x !== row); renderChecklistRows(); };
        }
        wrap.appendChild(r);
      });
      makeListSortable(wrap, ".checklist-row[data-sort-id]", (order) => {
        const reordered = order.map(id => draft.items.find(x => x.id === id)).filter(Boolean);
        const rest = draft.items.filter(x => !order.includes(x.id));
        draft.items = [...reordered, ...rest];
        // Nach dem Verschieben darf kein Punkt tiefer stehen als eine Ebene unter seinem Vorgänger
        draft.items.forEach((it, i) => {
          const prevLevel = i > 0 ? (draft.items[i - 1].level || 0) : -1;
          it.level = Math.min(it.level || 0, prevLevel + 1);
        });
        syncChecklistParents(draft.items);
        renderChecklistRows();
      });
    }
    if (type === "checklist") {
      renderChecklistRows();
      overlay.querySelector("#addChecklistRow").onclick = () => {
        draft.items.push({ id: uid(), text: "", done: false, subject: "", dueDate: draft.hwMode ? todayStrEditor : "", recurring: "" });
        renderChecklistRows();
        const rows = overlay.querySelectorAll(".checklist-row input[type=text]");
        if (rows.length) rows[rows.length - 1].focus();
      };
      overlay.querySelector("#f-hwmode").addEventListener("change", (e) => {
        draft.hwMode = e.target.checked;
        renderChecklistRows();
      });
      const templateSelect = overlay.querySelector("#f-template");
      if (templateSelect) {
        templateSelect.addEventListener("change", () => {
          const tpl = state.checklistTemplates.find(t => t.id === templateSelect.value);
          if (!tpl) return;
          draft.hwMode = !!tpl.hwMode;
          draft.items = tpl.items.map(it => ({ ...it, id: uid(), done: false }));
          if (!draft.title) draft.title = tpl.name;
          overlay.querySelector("#f-hwmode").checked = draft.hwMode;
          overlay.querySelector("#f-title").value = draft.title;
          renderChecklistRows();
        });
        overlay.querySelector("#deleteTemplateBtn").onclick = () => {
          const tplId = templateSelect.value;
          if (!tplId) { showToast("Bitte zuerst eine Vorlage auswählen."); return; }
          const tpl = state.checklistTemplates.find(t => t.id === tplId);
          if (tpl && confirm(`Vorlage „${tpl.name}" wirklich löschen?`)) {
            markDeleted(tplId);
            state.checklistTemplates = state.checklistTemplates.filter(t => t.id !== tplId);
            saveState({ skipTouch: true });
            templateSelect.querySelector(`option[value="${tplId}"]`).remove();
            showToast("Vorlage gelöscht.");
          }
        };
      }
      overlay.querySelector("#saveTemplateBtn").onclick = () => {
        const name = prompt("Name für diese Vorlage:", draft.title || "Neue Vorlage");
        if (!name || !name.trim()) return;
        state.checklistTemplates.push({
          id: uid(), name: name.trim(), hwMode: draft.hwMode,
          items: draft.items.map(it => ({ text: it.text, subject: it.subject || "", dueDate: "", recurring: it.recurring || "" }))
        });
        saveState({ skipTouch: true });
        showToast("Als Vorlage gespeichert.");
      };
    }

    // image upload
    if (type === "image") {
      const dz = overlay.querySelector("#dropzone");
      const fileInput = overlay.querySelector("#fileInput");
      const preview = overlay.querySelector("#imgPreview");
      const handleFile = (file) => {
        if (!file || !file.type.startsWith("image/")) return;
        if (file.size > 4 * 1024 * 1024) { showToast("Bild ist größer als 4 MB — bitte kleineres Bild wählen."); return; }
        const reader = new FileReader();
        reader.onload = (e) => { draft.dataUrl = e.target.result; preview.src = draft.dataUrl; preview.style.display = "block"; };
        reader.readAsDataURL(file);
      };
      dz.onclick = () => fileInput.click();
      fileInput.onchange = () => handleFile(fileInput.files[0]);
      dz.ondragover = (e) => { e.preventDefault(); dz.classList.add("drag"); };
      dz.ondragleave = () => dz.classList.remove("drag");
      dz.ondrop = (e) => { e.preventDefault(); dz.classList.remove("drag"); handleFile(e.dataTransfer.files[0]); };

      // tabs
      const uploadPane = overlay.querySelector("#uploadPane");
      const drawPane = overlay.querySelector("#drawPane");
      overlay.querySelectorAll(".img-tab").forEach(tab => {
        tab.onclick = () => {
          overlay.querySelectorAll(".img-tab").forEach(t => t.classList.remove("active"));
          tab.classList.add("active");
          const isDraw = tab.dataset.tab === "draw";
          uploadPane.style.display = isDraw ? "none" : "block";
          drawPane.style.display = isDraw ? "block" : "none";
        };
      });

      // drawing pad
      const layerCanvases = [
        overlay.querySelector("#drawCanvas"),
        overlay.querySelector("#drawCanvas1"),
        overlay.querySelector("#drawCanvas2"),
      ];
      const layerCtxs = layerCanvases.map(c => {
        const cx = c.getContext("2d");
        cx.lineCap = "round"; cx.lineJoin = "round";
        return cx;
      });
      // Nur die unterste Ebene bekommt einen weißen Grund — die oberen bleiben durchsichtig,
      // damit man tatsächlich über bereits Gemaltes zeichnen kann.
      layerCtxs[0].fillStyle = "#FFFFFF";
      layerCtxs[0].fillRect(0, 0, layerCanvases[0].width, layerCanvases[0].height);
      // Bereits vorhandenes Bild als Basis laden, statt mit leerem Blatt zu starten.
      if (draft.dataUrl) {
        const baseImg = new Image();
        baseImg.onload = () => {
          layerCtxs[0].drawImage(baseImg, 0, 0, layerCanvases[0].width, layerCanvases[0].height);
        };
        baseImg.src = draft.dataUrl;
      }
      let activeLayer = 0;
      let canvas = layerCanvases[0];
      let ctx = layerCtxs[0];
      function setActiveLayer(i) {
        activeLayer = i;
        canvas = layerCanvases[i];
        ctx = layerCtxs[i];
        layerCanvases.forEach((c, idx) => { c.style.pointerEvents = idx === i ? "auto" : "none"; });
        overlay.querySelector("#drawLayerVisible").checked = layerCanvases[i].style.display !== "none";
      }
      overlay.querySelector("#drawLayerSelect").onchange = (e) => setActiveLayer(Number(e.target.value));
      overlay.querySelector("#drawLayerVisible").onchange = (e) => {
        layerCanvases[activeLayer].style.display = e.target.checked ? "" : "none";
      };
      overlay.querySelector("#drawLayerClear").onclick = () => {
        pushUndo();
        layerCtxs[activeLayer].clearRect(0, 0, canvas.width, canvas.height);
        if (activeLayer === 0) {
          layerCtxs[0].fillStyle = "#FFFFFF";
          layerCtxs[0].fillRect(0, 0, canvas.width, canvas.height);
        }
      };
      setActiveLayer(0);

      const DRAW_COLORS = ["#2B2621", "#C0453B", "#3A5A9B", "#86B35A", "#C9A24B", "#B15CDE", "#FF9270", "#FFFFFF"];
      const colorsWrap = overlay.querySelector("#drawColors");
      let currentColor = DRAW_COLORS[0];
      let erasing = false;
      DRAW_COLORS.forEach((c, i) => {
        const sw = document.createElement("button");
        sw.type = "button";
        sw.className = "draw-swatch" + (i === 0 ? " active" : "");
        sw.style.background = c;
        sw.onclick = () => {
          currentColor = c; erasing = false;
          colorsWrap.querySelectorAll(".draw-swatch").forEach(s => s.classList.remove("active"));
          sw.classList.add("active");
          overlay.querySelector("#drawEraser").classList.remove("active-tool");
        };
        colorsWrap.appendChild(sw);
      });
      overlay.querySelector("#drawCustomColor").addEventListener("input", (e) => {
        currentColor = e.target.value; erasing = false;
        colorsWrap.querySelectorAll(".draw-swatch").forEach(s => s.classList.remove("active"));
        overlay.querySelector("#drawEraser").classList.remove("active-tool");
      });
      overlay.querySelector("#drawEraser").onclick = (e) => {
        erasing = !erasing;
        e.currentTarget.classList.toggle("active-tool", erasing);
      };

      let undoStack = [];
      function pushUndo() {
        undoStack.push({ layer: activeLayer, data: layerCanvases[activeLayer].toDataURL() });
        if (undoStack.length > 20) undoStack.shift();
      }
      overlay.querySelector("#drawUndo").onclick = () => {
        if (!undoStack.length) return;
        const snap = undoStack.pop();
        const targetCtx = layerCtxs[snap.layer];
        const targetCanvas = layerCanvases[snap.layer];
        const img = new Image();
        img.onload = () => { targetCtx.clearRect(0, 0, targetCanvas.width, targetCanvas.height); targetCtx.drawImage(img, 0, 0); };
        img.src = snap.data;
      };
      overlay.querySelector("#drawClear").onclick = () => {
        pushUndo();
        // "Leeren" räumt alle Ebenen ab — für einzelne Ebenen gibt es "Ebene leeren".
        layerCtxs.forEach((cx, i) => {
          cx.clearRect(0, 0, layerCanvases[i].width, layerCanvases[i].height);
          if (i === 0) { cx.fillStyle = "#FFFFFF"; cx.fillRect(0, 0, layerCanvases[i].width, layerCanvases[i].height); }
        });
      };
      overlay.querySelector("#drawTemplate").addEventListener("change", (e) => {
        const tplId = e.target.value;
        if (!tplId) return;
        pushUndo();
        // Vorlage kommt immer auf die unterste Ebene — darüber kann dann frei gemalt werden.
        layerCtxs[0].fillStyle = "#FFFFFF";
        layerCtxs[0].fillRect(0, 0, layerCanvases[0].width, layerCanvases[0].height);
        drawColoringTemplate(layerCtxs[0], tplId);
        e.target.value = "";
      });

      let drawing = false;
      let shapeStart = null;
      let shapeSnapshot = null;
      function pos(e) {
        const rect = canvas.getBoundingClientRect();
        return { x: (e.clientX - rect.left) * (canvas.width / rect.width), y: (e.clientY - rect.top) * (canvas.height / rect.height) };
      }
      function currentTool() { return overlay.querySelector("#drawShapeTool").value; }
      function floodFill(startX, startY, fillColor) {
        startX = Math.round(startX); startY = Math.round(startY);
        const w = canvas.width, h = canvas.height;
        const imgData = ctx.getImageData(0, 0, w, h);
        const data = imgData.data;
        const idx = (x, y) => (y * w + x) * 4;
        const startIdx = idx(startX, startY);
        if (startX < 0 || startY < 0 || startX >= w || startY >= h) return;
        const targetR = data[startIdx], targetG = data[startIdx + 1], targetB = data[startIdx + 2], targetA = data[startIdx + 3];
        const fr = parseInt(fillColor.slice(1, 3), 16), fg = parseInt(fillColor.slice(3, 5), 16), fb = parseInt(fillColor.slice(5, 7), 16);
        if (targetR === fr && targetG === fg && targetB === fb && targetA === 255) return;
        const matches = (i) => Math.abs(data[i] - targetR) < 24 && Math.abs(data[i + 1] - targetG) < 24 && Math.abs(data[i + 2] - targetB) < 24 && Math.abs(data[i + 3] - targetA) < 24;
        const stack = [[startX, startY]];
        let guard = 0;
        while (stack.length && guard < 400000) {
          guard++;
          const [x, y] = stack.pop();
          if (x < 0 || y < 0 || x >= w || y >= h) continue;
          const i = idx(x, y);
          if (!matches(i)) continue;
          data[i] = fr; data[i + 1] = fg; data[i + 2] = fb; data[i + 3] = 255;
          stack.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
        }
        ctx.putImageData(imgData, 0, 0);
      }
      function drawShapePreview(tool, start, end, color, lineWidth) {
        ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lineWidth;
        const x = Math.min(start.x, end.x), y = Math.min(start.y, end.y);
        const w = Math.abs(end.x - start.x), h = Math.abs(end.y - start.y);
        if (tool === "line") { ctx.beginPath(); ctx.moveTo(start.x, start.y); ctx.lineTo(end.x, end.y); ctx.stroke(); }
        else if (tool === "rect") { ctx.strokeRect(x, y, w, h); }
        else if (tool === "rectFill") { ctx.fillRect(x, y, w, h); }
        else if (tool === "circle" || tool === "circleFill") {
          const rx = w / 2, ry = h / 2;
          ctx.beginPath(); ctx.ellipse(x + rx, y + ry, rx, ry, 0, 0, Math.PI * 2);
          if (tool === "circleFill") ctx.fill(); else ctx.stroke();
        }
      }
      layerCanvases.forEach(lc => lc.addEventListener("pointerdown", (e) => {
        const tool = currentTool();
        const p = pos(e);
        if (tool === "fill") {
          pushUndo();
          floodFill(p.x, p.y, erasing ? "#FFFFFF" : currentColor);
          return;
        }
        if (tool === "text") {
          const txt = prompt("Text eingeben:");
          if (!txt) return;
          pushUndo();
          const size = parseInt(overlay.querySelector("#drawSize").value, 10);
          ctx.fillStyle = erasing ? "#FFFFFF" : currentColor;
          ctx.font = `${16 + size * 2}px "Inter", sans-serif`;
          ctx.textBaseline = "top";
          ctx.fillText(txt, p.x, p.y);
          return;
        }
        pushUndo();
        drawing = true;
        canvas.setPointerCapture(e.pointerId);
        ctx.lineWidth = parseInt(overlay.querySelector("#drawSize").value, 10);
        ctx.strokeStyle = erasing ? "#FFFFFF" : currentColor;
        if (tool === "pen") {
          ctx.beginPath(); ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x + 0.1, p.y + 0.1); ctx.stroke();
        } else {
          shapeStart = p;
          shapeSnapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
        }
      }));
      layerCanvases.forEach(lc => lc.addEventListener("pointermove", (e) => {
        if (!drawing) return;
        const tool = currentTool();
        const p = pos(e);
        if (tool === "pen") {
          ctx.lineTo(p.x, p.y); ctx.stroke();
        } else if (shapeSnapshot) {
          ctx.putImageData(shapeSnapshot, 0, 0);
          drawShapePreview(tool, shapeStart, p, erasing ? "#FFFFFF" : currentColor, parseInt(overlay.querySelector("#drawSize").value, 10));
        }
      }));
      layerCanvases.forEach(lc => lc.addEventListener("pointerup", () => { drawing = false; shapeSnapshot = null; }));
      layerCanvases.forEach(lc => lc.addEventListener("pointerleave", () => { drawing = false; shapeSnapshot = null; }));

      overlay.querySelector("#drawUse").onclick = () => {
        // Alle sichtbaren Ebenen von unten nach oben zu einem Bild zusammenrechnen.
        const flat = document.createElement("canvas");
        flat.width = layerCanvases[0].width;
        flat.height = layerCanvases[0].height;
        const fctx = flat.getContext("2d");
        fctx.fillStyle = "#FFFFFF";
        fctx.fillRect(0, 0, flat.width, flat.height);
        layerCanvases.forEach(lc => { if (lc.style.display !== "none") fctx.drawImage(lc, 0, 0); });
        draft.dataUrl = flat.toDataURL("image/png");
        preview.src = draft.dataUrl; preview.style.display = "block";
        overlay.querySelectorAll(".img-tab").forEach(t => t.classList.remove("active"));
        overlay.querySelector('.img-tab[data-tab="upload"]').classList.add("active");
        uploadPane.style.display = "block"; drawPane.style.display = "none";
        showToast("Zeichnung übernommen.");
      };
    }

    function close() { overlay.remove(); }
    overlay.querySelector("#closeModal").onclick = close;
    overlay.querySelector("#cancelBtn").onclick = close;
    overlay.onclick = (e) => { if (e.target === overlay) close(); };

    if (existing) {
      overlay.querySelector("#deleteBtn").onclick = () => {
        if (confirm("Diesen Eintrag wirklich löschen?")) {
          markDeleted(draft.id);
          state.items = state.items.filter(i => i.id !== draft.id);
          saveState(); close(); render();
          showToast("Eintrag gelöscht.");
        }
      };
    }

    overlay.querySelector("#saveBtn").onclick = () => {
      draft.title = overlay.querySelector("#f-title").value.trim() || "Ohne Titel";
      draft.tags = overlay.querySelector("#f-tags").value.split(",").map(t => t.trim()).filter(Boolean);
      draft.private = overlay.querySelector("#f-private").checked;
      draft.taggedProfileIds = [...overlay.querySelectorAll(".f-person:checked")].map(cb => cb.value);
      if (type === "note") draft.body = overlay.querySelector("#f-body").value;
      if (type === "image") draft.caption = overlay.querySelector("#f-caption").value;
      draft.updatedAt = Date.now();
      if (!existing) draft.createdBy = state.activeProfileId || null;

      const idx = state.items.findIndex(i => i.id === draft.id);
      if (idx >= 0) state.items[idx] = draft; else state.items.push(draft);
      saveState(); close(); render();
      showToast(existing ? "Änderungen gespeichert." : "Idee gespeichert.");
    };

    setTimeout(() => overlay.querySelector("#f-title").focus(), 30);
  }

  /* ============ MIND-MAP ============ */
  const MM_BRANCH_COLORS = ["#C0453B", "#3A5A9B", "#86B35A", "#C9A24B", "#B15CDE", "#FF9270", "#4A6572", "#35D0BA", "#E8590C", "#5F7038"];

  function currentMindmap() {
    if (!state.mindmaps.length) {
      state.mindmaps.push({ id: uid(), name: "Ideen", nodes: [], private: false, createdBy: state.activeProfileId || null, createdAt: Date.now(), updatedAt: Date.now() });
      state.activeMindmapId = state.mindmaps[0].id;
    }
    if (!state.activeMindmapId || !state.mindmaps.some(m => m.id === state.activeMindmapId)) {
      state.activeMindmapId = state.mindmaps[0].id;
    }
    return state.mindmaps.find(m => m.id === state.activeMindmapId);
  }

  function canSeeMindmap(m) {
    if (!m.private) return true;
    const activeId = state.activeProfileId;
    if (!activeId) return false;
    if (!m.createdBy) return true;
    return m.createdBy === activeId;
  }

  function mmRoot() { return currentMindmap().nodes.find(n => n.root) || currentMindmap().nodes[0]; }
  function mmChildren(id) { return currentMindmap().nodes.filter(n => n.parentId === id); }
  function mmBranchColorFor(node) {
    // walk up to the top-level branch (direct child of root) to pick a stable color
    const root = mmRoot();
    if (!root || node.id === root.id) return null;
    let cur = node;
    const guard = new Set();
    while (cur.parentId && cur.parentId !== root.id && !guard.has(cur.id)) {
      guard.add(cur.id);
      const parent = currentMindmap().nodes.find(n => n.id === cur.parentId);
      if (!parent) break;
      cur = parent;
    }
    const topLevelSiblings = mmChildren(root.id);
    const idx = topLevelSiblings.findIndex(n => n.id === cur.id);
    return MM_BRANCH_COLORS[idx >= 0 ? idx % MM_BRANCH_COLORS.length : 0];
  }

  function migrateMindmapIfNeeded() {
    const mm = currentMindmap();
    if (!mm.nodes.length) {
      mm.nodes.push({ id: uid(), parentId: null, root: true, x: 1040, y: 680, text: "Zentrale Idee" });
      return;
    }
    const needsMigration = mm.nodes.some(n => n.parentId === undefined);
    if (!needsMigration) return;
    let root = mm.nodes.find(n => n.root);
    if (!root) { root = mm.nodes[0]; root.root = true; }
    root.parentId = null;
    const edges = mm.edges || [];
    const visited = new Set([root.id]);
    const queue = [root.id];
    while (queue.length) {
      const cur = queue.shift();
      edges.forEach(e => {
        let otherId = null;
        if (e.from === cur && !visited.has(e.to)) otherId = e.to;
        else if (e.to === cur && !visited.has(e.from)) otherId = e.from;
        if (otherId) {
          const n = mm.nodes.find(x => x.id === otherId);
          if (n) { n.parentId = cur; visited.add(otherId); queue.push(otherId); }
        }
      });
    }
    mm.nodes.forEach(n => { if (n.parentId === undefined) { n.parentId = n.id === root.id ? null : root.id; visited.add(n.id); } });
  }

  function computeChildPosition(parent) {
    const root = mmRoot();
    const siblings = mmChildren(parent.id);
    const idx = siblings.length;
    if (parent.id === root.id) {
      const totalGuess = Math.max(idx + 1, 6);
      const angle = (idx / totalGuess) * Math.PI * 2 - Math.PI / 2;
      return { x: root.x + Math.cos(angle) * 260, y: root.y + Math.sin(angle) * 200 };
    }
    const dx = parent.x - root.x, dy = parent.y - root.y;
    const baseAngle = Math.atan2(dy, dx) || 0;
    const spread = 0.36;
    const angle = baseAngle + (idx - (idx % 2 === 0 ? idx / 2 : (idx - 1) / 2)) * spread * (idx % 2 === 0 ? 1 : -1);
    const dist = Math.hypot(dx, dy) || 160;
    return { x: parent.x + Math.cos(angle) * (dist * 0 + 190), y: parent.y + Math.sin(angle) * (dist * 0 + 190) };
  }

  function renderMindmapView(container) {
    migrateMindmapIfNeeded();
    const mmList = state.mindmaps;
    const header = document.createElement("div");
    header.className = "view-header";
    header.innerHTML = `<div><h1 class="view-title">Mind-Map</h1><p class="view-sub">Klicken &amp; direkt tippen · <b>Enter</b> = neuer Punkt daneben · <b>Tab</b> = neuer Unterpunkt · <b>Esc</b>, dann <b>Entf</b> = löschen · Knoten auf einen anderen ziehen = neu einordnen · ▾ = ein-/ausklappen</p></div>`;
    container.appendChild(header);

    const switcher = document.createElement("div");
    switcher.className = "mindmap-toolbar";
    switcher.innerHTML = `
      <select id="mmSelect" style="min-width:180px;">
        ${mmList.map(m => `<option value="${m.id}" ${m.id === state.activeMindmapId ? "selected" : ""}>${m.private ? "🔒 " : ""}${escapeHtml(m.name)}</option>`).join("")}
      </select>
      <button class="btn btn-sm btn-accent" id="mmNewBtn">+ Neue Mind-Map</button>
      <button class="btn btn-sm" id="mmRenameBtn">✎ Umbenennen</button>
      <button class="btn btn-sm btn-danger" id="mmDeleteMapBtn">Mind-Map löschen</button>
    `;
    container.appendChild(switcher);
    switcher.querySelector("#mmSelect").addEventListener("change", (e) => {
      state.activeMindmapId = e.target.value;
      saveState({ skipTouch: true }); render();
    });
    switcher.querySelector("#mmNewBtn").onclick = () => {
      const nm = { id: uid(), name: "Neue Mind-Map " + (state.mindmaps.length + 1), nodes: [], private: false, createdBy: state.activeProfileId || null, createdAt: Date.now(), updatedAt: Date.now() };
      state.mindmaps.push(nm);
      state.activeMindmapId = nm.id;
      saveState(); render();
    };
    switcher.querySelector("#mmRenameBtn").onclick = () => {
      const mm = currentMindmap();
      const name = prompt("Name der Mind-Map:", mm.name);
      if (name && name.trim()) { mm.name = name.trim(); saveState(); render(); }
    };
    switcher.querySelector("#mmDeleteMapBtn").onclick = () => {
      if (state.mindmaps.length <= 1) { showToast("Das ist eure einzige Mind-Map — leg zuerst eine neue an, bevor du diese löschst."); return; }
      if (!confirm(`„${currentMindmap().name}" wirklich komplett löschen?`)) return;
      markDeleted(state.activeMindmapId);
      state.mindmaps = state.mindmaps.filter(m => m.id !== state.activeMindmapId);
      state.activeMindmapId = state.mindmaps[0].id;
      saveState(); render();
    };

    const root = mmRoot();
    const toolbar = document.createElement("div");
    toolbar.className = "mindmap-toolbar";
    toolbar.innerHTML = `
      <button class="btn btn-sm btn-accent" id="mmAddBranch">+ Hauptast</button>
      <button class="btn btn-sm" id="mmAddChild">+ Unterpunkt</button>
      <button class="btn btn-sm btn-danger" id="mmDeleteNode">Löschen</button>
      <button class="btn btn-sm" id="mmPrivateToggle">${currentMindmap().private ? "🔒 Privat" : "🔓 Privat machen"}</button>
      <span class="mindmap-hint">Knoten anklicken = auswählen &amp; sofort tippen.</span>
    `;
    container.appendChild(toolbar);
    toolbar.querySelector("#mmPrivateToggle").onclick = () => {
      currentMindmap().private = !currentMindmap().private;
      saveState(); render();
      showToast(currentMindmap().private ? "Mind-Map ist jetzt privat." : "Mind-Map wird wieder mitgeteilt.");
    };

    const wrap = document.createElement("div");
    wrap.className = "mindmap-wrap";
    wrap.innerHTML = `
      <div class="mindmap-world" id="mmWorld">
        <svg class="mindmap-svg" id="mmSvg"></svg>
      </div>
      <div class="mm-controls">
        <div class="mm-zoom-label" id="mmZoomLabel">100%</div>
        <button type="button" id="mmZoomIn" title="Vergrößern">+</button>
        <button type="button" id="mmZoomOut" title="Verkleinern">−</button>
        <button type="button" id="mmZoomFit" title="Einpassen">⛶</button>
      </div>
    `;
    container.appendChild(wrap);

    let selectedId = root ? root.id : null;
    const mmView = { tx: 0, ty: 0, scale: 1 };

    function isDescendantOf(candidateId, ancestorId) {
      let cur = currentMindmap().nodes.find(n => n.id === candidateId);
      const guard = new Set();
      while (cur && cur.parentId && !guard.has(cur.id)) {
        if (cur.parentId === ancestorId) return true;
        guard.add(cur.id);
        cur = currentMindmap().nodes.find(n => n.id === cur.parentId);
      }
      return false;
    }

    function collapsedAncestorIds() {
      return new Set(currentMindmap().nodes.filter(n => n.collapsed).map(n => n.id));
    }
    function visibleNodes() {
      const collapsed = collapsedAncestorIds();
      return currentMindmap().nodes.filter(n => {
        let cur = n;
        const guard = new Set();
        while (cur && cur.parentId && !guard.has(cur.id)) {
          if (collapsed.has(cur.parentId) && cur.parentId !== n.id) return false;
          guard.add(cur.id);
          cur = currentMindmap().nodes.find(x => x.id === cur.parentId);
        }
        return true;
      });
    }

    function applyTransform(animate) {
      const world = document.getElementById("mmWorld");
      if (!world) return;
      world.style.transition = animate ? "transform .3s cubic-bezier(.2,.7,.3,1)" : "none";
      world.style.transform = `translate(${mmView.tx}px, ${mmView.ty}px) scale(${mmView.scale})`;
      const label = document.getElementById("mmZoomLabel");
      if (label) label.textContent = Math.round(mmView.scale * 100) + "%";
    }

    function fitToContent(animate) {
      const visible = visibleNodes();
      if (!visible.length) return;
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      visible.forEach(n => {
        const el = wrap.querySelector(`.mm-node[data-id="${n.id}"]`);
        const w = el ? el.offsetWidth : 160, h = el ? el.offsetHeight : 50;
        minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
        maxX = Math.max(maxX, n.x + w); maxY = Math.max(maxY, n.y + h);
      });
      const padding = 70;
      const bboxW = Math.max(1, maxX - minX), bboxH = Math.max(1, maxY - minY);
      const wrapRect = wrap.getBoundingClientRect();
      const scale = Math.min(
        (wrapRect.width - padding * 2) / bboxW,
        (wrapRect.height - padding * 2) / bboxH,
        1.15
      );
      mmView.scale = Math.max(0.15, scale);
      mmView.tx = (wrapRect.width - bboxW * mmView.scale) / 2 - minX * mmView.scale;
      mmView.ty = (wrapRect.height - bboxH * mmView.scale) / 2 - minY * mmView.scale;
      applyTransform(animate);
    }

    function zoomBy(factor, screenX, screenY) {
      const wrapRect = wrap.getBoundingClientRect();
      const cx = screenX !== undefined ? screenX : wrapRect.width / 2;
      const cy = screenY !== undefined ? screenY : wrapRect.height / 2;
      const worldX = (cx - mmView.tx) / mmView.scale;
      const worldY = (cy - mmView.ty) / mmView.scale;
      mmView.scale = Math.min(2.5, Math.max(0.15, mmView.scale * factor));
      mmView.tx = cx - worldX * mmView.scale;
      mmView.ty = cy - worldY * mmView.scale;
      applyTransform(false);
    }

    function ensureVisible(node) {
      const wrapRect = wrap.getBoundingClientRect();
      const margin = 40;
      const screenX = mmView.tx + node.x * mmView.scale;
      const screenY = mmView.ty + node.y * mmView.scale;
      const w = 180 * mmView.scale, h = 56 * mmView.scale;
      let dx = 0, dy = 0;
      if (screenX < margin) dx = margin - screenX;
      else if (screenX + w > wrapRect.width - margin) dx = (wrapRect.width - margin) - (screenX + w);
      if (screenY < margin) dy = margin - screenY;
      else if (screenY + h > wrapRect.height - margin) dy = (wrapRect.height - margin) - (screenY + h);
      if (dx || dy) { mmView.tx += dx; mmView.ty += dy; applyTransform(true); }
    }

    function selectAllText(el) {
      const range = document.createRange();
      range.selectNodeContents(el);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }

    function focusNode(id, selectAll) {
      selectedId = id;
      renderNodes();
      drawEdges();
      const node = currentMindmap().nodes.find(n => n.id === id);
      if (node) ensureVisible(node);
      const el = document.querySelector(`.mm-node[data-id="${id}"] .mm-text`);
      if (el) {
        el.focus();
        if (selectAll) selectAllText(el);
      }
    }

    function addChildTo(parentId) {
      const parent = currentMindmap().nodes.find(n => n.id === parentId);
      if (!parent) return;
      parent.collapsed = false;
      const pos = computeChildPosition(parent);
      const node = { id: uid(), parentId: parent.id, x: pos.x, y: pos.y, text: "Neuer Punkt" };
      currentMindmap().nodes.push(node);
      saveState();
      focusNode(node.id, true);
    }

    function addSiblingTo(nodeId) {
      const node = currentMindmap().nodes.find(n => n.id === nodeId);
      if (!node || !node.parentId) { addChildTo(mmRoot().id); return; }
      addChildTo(node.parentId);
    }

    function deleteSubtree(id) {
      const rootNode = mmRoot();
      if (id === rootNode.id) { showToast("Die Zentrale Idee kann nicht gelöscht werden."); return; }
      const toDelete = new Set([id]);
      let changed = true;
      while (changed) {
        changed = false;
        currentMindmap().nodes.forEach(n => {
          if (n.parentId && toDelete.has(n.parentId) && !toDelete.has(n.id)) { toDelete.add(n.id); changed = true; }
        });
      }
      currentMindmap().nodes = currentMindmap().nodes.filter(n => !toDelete.has(n.id));
      markDeletedMany([...toDelete]);
      selectedId = rootNode.id;
      saveState(); renderNodes(); drawEdges();
    }

    function drawEdges() {
      const svg = document.getElementById("mmSvg");
      if (!svg) return;
      svg.innerHTML = "";
      const visibleIds = new Set(visibleNodes().map(n => n.id));
      currentMindmap().nodes.forEach(node => {
        if (!node.parentId || !visibleIds.has(node.id)) return;
        const a = currentMindmap().nodes.find(n => n.id === node.parentId);
        if (!a) return;
        const aEl = wrap.querySelector(`.mm-node[data-id="${a.id}"]`);
        const bEl = wrap.querySelector(`.mm-node[data-id="${node.id}"]`);
        const aw = aEl ? aEl.offsetWidth : 160, ah = aEl ? aEl.offsetHeight : 46;
        const bw = bEl ? bEl.offsetWidth : 160, bh = bEl ? bEl.offsetHeight : 46;
        const ax = a.x + aw / 2, ay = a.y + ah / 2, bx = node.x + bw / 2, by = node.y + bh / 2;
        const mx = (ax + bx) / 2;
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("class", "mm-edge");
        path.setAttribute("d", `M ${ax} ${ay} C ${mx} ${ay}, ${mx} ${by}, ${bx} ${by}`);
        const color = node.color || mmBranchColorFor(node) || "var(--accent2)";
        path.setAttribute("stroke", color);
        path.setAttribute("stroke-width", node.parentId === mmRoot().id ? "3.5" : "2.25");
        svg.appendChild(path);
      });
    }

    function renderNodes() {
      const world = document.getElementById("mmWorld");
      world.querySelectorAll(".mm-node").forEach(n => n.remove());
      const visible = visibleNodes();
      visible.forEach(node => {
        const el = document.createElement("div");
        const branchColor = node.color || mmBranchColorFor(node);
        el.className = "mm-node" + (node.root ? " root" : "") + (selectedId === node.id ? " selected" : "");
        el.style.left = node.x + "px";
        el.style.top = node.y + "px";
        if (branchColor && !node.root) {
          el.style.borderColor = branchColor;
          el.style.background = `color-mix(in srgb, ${branchColor} ${node.color ? 22 : 10}%, var(--surface))`;
        }
        el.dataset.id = node.id;

        const textEl = document.createElement("span");
        textEl.className = "mm-text";
        textEl.contentEditable = "true";
        textEl.spellcheck = false;
        textEl.innerHTML = mdToHtml(node.text);
        el.appendChild(textEl);

        const childCount = mmChildren(node.id).length;
        if (childCount > 0) {
          const toggleBtn = document.createElement("button");
          toggleBtn.className = "mm-toggle";
          toggleBtn.title = node.collapsed ? "Ausklappen" : "Einklappen";
          toggleBtn.textContent = node.collapsed ? `▸ ${childCount}` : "▾";
          toggleBtn.onclick = (e) => { e.stopPropagation(); node.collapsed = !node.collapsed; saveState(); renderNodes(); drawEdges(); };
          el.appendChild(toggleBtn);
        }

        const delBtn = document.createElement("button");
        delBtn.className = "mm-del";
        delBtn.title = "Ast löschen";
        delBtn.textContent = "✕";
        delBtn.style.display = node.root ? "none" : "";
        el.appendChild(delBtn);

        const addChildBtn = document.createElement("button");
        addChildBtn.className = "mm-add-child";
        addChildBtn.title = "Unterpunkt hinzufügen";
        addChildBtn.textContent = "+";
        el.appendChild(addChildBtn);

        if (!node.root) {
          const colorBtn = document.createElement("button");
          colorBtn.className = "mm-color";
          colorBtn.title = "Farbe wählen";
          colorBtn.textContent = "🎨";
          colorBtn.onclick = (e) => {
            e.stopPropagation();
            document.querySelectorAll(".mm-color-picker").forEach(p => p.remove());
            const picker = document.createElement("div");
            picker.className = "mm-color-picker";
            const swatches = ["", ...MM_BRANCH_COLORS, "#C0453B", "#2B7A21", "#7A4A20"];
            picker.innerHTML = swatches.map(c => c
              ? `<button type="button" class="mm-swatch" style="background:${c};" data-c="${c}"></button>`
              : `<button type="button" class="mm-swatch mm-swatch-reset" data-c="" title="Automatisch">✕</button>`
            ).join("");
            document.body.appendChild(picker);
            const rect = colorBtn.getBoundingClientRect();
            picker.style.left = rect.left + "px";
            picker.style.top = (rect.bottom + 4) + "px";
            picker.querySelectorAll(".mm-swatch").forEach(sw => {
              sw.onclick = (ev) => {
                ev.stopPropagation();
                node.color = sw.dataset.c || null;
                node.updatedAt = Date.now();
                saveState(); renderNodes(); drawEdges();
                picker.remove();
              };
            });
            const closePicker = (ev) => { if (!picker.contains(ev.target)) { picker.remove(); document.removeEventListener("pointerdown", closePicker); } };
            setTimeout(() => document.addEventListener("pointerdown", closePicker), 0);
          };
          el.appendChild(colorBtn);
        }

        delBtn.onclick = (e) => { e.stopPropagation(); deleteSubtree(node.id); };
        addChildBtn.onclick = (e) => { e.stopPropagation(); addChildTo(node.id); };

        el.addEventListener("click", (e) => {
          if (e.target === delBtn || e.target === addChildBtn || e.target.classList.contains("mm-toggle")) return;
          if (selectedId !== node.id) { selectedId = node.id; renderNodes(); }
          ensureVisible(node);
          if (e.target !== textEl) { textEl.focus(); selectAllText(textEl); }
        });

        textEl.addEventListener("focus", () => { textEl.textContent = node.text; });
        textEl.addEventListener("blur", () => {
          node.text = textEl.textContent.trim() || "Ohne Titel";
          node.updatedAt = Date.now();
          saveState();
          textEl.innerHTML = mdToHtml(node.text);
        });
        textEl.addEventListener("keydown", (e) => {
          if (e.key === "Enter") { e.preventDefault(); node.text = textEl.textContent.trim() || "Ohne Titel"; node.updatedAt = Date.now(); saveState(); addSiblingTo(node.id); }
          else if (e.key === "Tab") { e.preventDefault(); node.text = textEl.textContent.trim() || "Ohne Titel"; node.updatedAt = Date.now(); saveState(); addChildTo(node.id); }
          else if (e.key === "Escape") { e.preventDefault(); textEl.blur(); el.focus(); }
        });
        textEl.addEventListener("pointerdown", (e) => e.stopPropagation());

        // dragging (from anywhere on the node except the editable text / buttons) — drop onto another node to re-parent
        let dragging = false, moved = false, sx = 0, sy = 0, ox = 0, oy = 0, dropTarget = null;
        el.tabIndex = -1;
        el.addEventListener("pointerdown", (e) => {
          if (e.target === delBtn || e.target === textEl || e.target === addChildBtn || e.target.classList.contains("mm-toggle")) return;
          e.stopPropagation();
          dragging = true; moved = false; sx = e.clientX; sy = e.clientY; ox = node.x; oy = node.y;
          el.setPointerCapture(e.pointerId);
          el.style.cursor = "grabbing";
          el.style.zIndex = 10;
        });
        el.addEventListener("pointermove", (e) => {
          if (!dragging) return;
          e.stopPropagation();
          if (Math.abs(e.clientX - sx) > 3 || Math.abs(e.clientY - sy) > 3) moved = true;
          node.x = ox + (e.clientX - sx) / mmView.scale;
          node.y = oy + (e.clientY - sy) / mmView.scale;
          el.style.left = node.x + "px"; el.style.top = node.y + "px";
          drawEdges();
          if (moved && !node.root) {
            const under = document.elementFromPoint(e.clientX, e.clientY);
            const overEl = under ? under.closest(".mm-node") : null;
            const overId = overEl && overEl !== el ? overEl.dataset.id : null;
            const valid = overId && overId !== node.parentId && !isDescendantOf(overId, node.id);
            if (dropTarget && dropTarget !== overEl) dropTarget.classList.remove("drop-target");
            dropTarget = valid ? overEl : null;
            if (dropTarget) dropTarget.classList.add("drop-target");
          }
        });
        el.addEventListener("pointerup", (e) => {
          if (!dragging) return;
          e.stopPropagation(); dragging = false; el.style.cursor = "grab"; el.style.zIndex = "";
          if (dropTarget) {
            const newParentId = dropTarget.dataset.id;
            dropTarget.classList.remove("drop-target");
            dropTarget = null;
            node.parentId = newParentId;
            node.updatedAt = Date.now();
            showToast("Neu eingeordnet.");
            saveState(); renderNodes(); drawEdges();
            return;
          }
          if (moved) { node.updatedAt = Date.now(); saveState(); }
        });

        world.appendChild(el);
      });
    }

    // Pan (drag empty canvas) + wheel zoom + pinch zoom
    let panning = false, panSX = 0, panSY = 0, panOX = 0, panOY = 0;
    const activePointers = new Map();
    let pinchStartDist = 0, pinchStartScale = 1, pinchAnchorX = 0, pinchAnchorY = 0;

    wrap.addEventListener("pointerdown", (e) => {
      if (e.target.closest(".mm-node") || e.target.closest(".mm-controls")) return;
      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (activePointers.size === 1) {
        panning = true; panSX = e.clientX; panSY = e.clientY; panOX = mmView.tx; panOY = mmView.ty;
        wrap.classList.add("panning");
        wrap.setPointerCapture(e.pointerId);
      } else if (activePointers.size === 2) {
        panning = false;
        const pts = [...activePointers.values()];
        const rect = wrap.getBoundingClientRect();
        pinchStartDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1;
        pinchStartScale = mmView.scale;
        const midX = (pts[0].x + pts[1].x) / 2 - rect.left, midY = (pts[0].y + pts[1].y) / 2 - rect.top;
        pinchAnchorX = (midX - mmView.tx) / mmView.scale;
        pinchAnchorY = (midY - mmView.ty) / mmView.scale;
      }
    });
    wrap.addEventListener("pointermove", (e) => {
      if (!activePointers.has(e.pointerId)) return;
      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (activePointers.size === 2) {
        const pts = [...activePointers.values()];
        const rect = wrap.getBoundingClientRect();
        const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1;
        const midX = (pts[0].x + pts[1].x) / 2 - rect.left, midY = (pts[0].y + pts[1].y) / 2 - rect.top;
        mmView.scale = Math.min(2.5, Math.max(0.15, pinchStartScale * (dist / pinchStartDist)));
        mmView.tx = midX - pinchAnchorX * mmView.scale;
        mmView.ty = midY - pinchAnchorY * mmView.scale;
        applyTransform(false);
      } else if (panning) {
        mmView.tx = panOX + (e.clientX - panSX);
        mmView.ty = panOY + (e.clientY - panSY);
        applyTransform(false);
      }
    });
    function endPan(e) {
      activePointers.delete(e.pointerId);
      if (activePointers.size < 2) pinchStartDist = 0;
      if (activePointers.size === 0) { panning = false; wrap.classList.remove("panning"); }
    }
    wrap.addEventListener("pointerup", endPan);
    wrap.addEventListener("pointercancel", endPan);
    wrap.addEventListener("pointerleave", (e) => { if (activePointers.size <= 1) endPan(e); });

    wrap.addEventListener("wheel", (e) => {
      e.preventDefault();
      const rect = wrap.getBoundingClientRect();
      if (e.ctrlKey || e.metaKey) {
        const factor = e.deltaY < 0 ? 1.08 : 0.93;
        zoomBy(factor, e.clientX - rect.left, e.clientY - rect.top);
      } else {
        mmView.tx -= e.deltaX;
        mmView.ty -= e.deltaY;
        applyTransform(false);
      }
    }, { passive: false });

    wrap.addEventListener("dblclick", (e) => {
      if (e.target.closest(".mm-node") || e.target.closest(".mm-controls")) return;
      addChildTo(selectedId || root.id);
    });

    document.getElementById("mmZoomIn").onclick = () => zoomBy(1.2);
    document.getElementById("mmZoomOut").onclick = () => zoomBy(0.8);
    document.getElementById("mmZoomFit").onclick = () => fitToContent(true);

    let resizeTimer;
    const onResize = () => {
      if (!document.body.contains(wrap)) { window.removeEventListener("resize", onResize); return; }
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => fitToContent(false), 150);
    };
    window.addEventListener("resize", onResize);

    const onKeydown = (e) => {
      if (!document.body.contains(wrap)) { document.removeEventListener("keydown", onKeydown); return; }
      if (currentView !== "mindmap") return;
      if ((e.key === "Delete" || e.key === "Backspace") && selectedId && document.activeElement.className !== "mm-text") {
        e.preventDefault(); deleteSubtree(selectedId);
      }
    };
    document.addEventListener("keydown", onKeydown);

    toolbar.querySelector("#mmAddBranch").onclick = () => addChildTo(root.id);
    toolbar.querySelector("#mmAddChild").onclick = () => addChildTo(selectedId || root.id);
    toolbar.querySelector("#mmDeleteNode").onclick = () => {
      if (!selectedId) { showToast("Kein Knoten ausgewählt."); return; }
      deleteSubtree(selectedId);
    };

    renderNodes();
    drawEdges();
    fitToContent(false);
  }

  /* ============ AUFGABEN & BELOHNUNGEN ============ */
  function ledgerAdd(profileId, delta, reason) {
    const entry = { id: uid(), profileId, delta, reason, at: Date.now() };
    state.pointsLedger.push(entry);
    return entry.id;
  }
  function ledgerRemove(entryId) {
    markDeleted(entryId);
    state.pointsLedger = state.pointsLedger.filter(l => l.id !== entryId);
  }

  function renderTasksView(container) {
    const header = document.createElement("div");
    header.className = "view-header";
    header.innerHTML = `<div><h1 class="view-title">Aufgaben &amp; Belohnungen</h1><p class="view-sub">Punkte sammeln, Sticker verdienen, Belohnungen einlösen.</p></div>
      <div style="display:flex;gap:8px;"><button class="btn" id="addRewardBtn">+ Belohnung</button><button class="btn btn-accent" id="addTaskBtn">+ Aufgabe</button></div>`;
    container.appendChild(header);

    if (!state.profiles.length) {
      container.innerHTML += `<div class="empty-state"><span class="empty-icon">⭐</span>Legt zuerst ein Profil an (links, das „+"), dann könnt ihr Aufgaben verteilen.</div>`;
      return;
    }

    // Points overview
    const overview = document.createElement("div");
    overview.className = "grid";
    overview.style.marginBottom = "22px";
    const isParentForReset = !getActiveProfile() || getActiveProfile().role === "parent";
    state.profiles.forEach(p => {
      const card = document.createElement("div");
      card.className = "card";
      card.style.cursor = "default";
      card.innerHTML = `
        <div class="card-top">
          <div style="display:flex;align-items:center;gap:10px;">
            <div class="avatar" style="background:${p.color};cursor:default;">${p.emoji || p.name.charAt(0)}</div>
            <h3 class="card-title" style="margin:0;">${escapeHtml(p.name)}</h3>
          </div>
          ${isParentForReset ? `<button class="card-pin reset-points-btn" title="Punkte zurücksetzen">↺</button>` : ""}
        </div>
        <div style="font-family:var(--font-display);font-size:26px;">${pointsBalance(p.id)} <span style="font-size:13px;color:var(--text-muted);font-family:var(--font-body);">Punkte</span></div>`;
      const resetBtn = card.querySelector(".reset-points-btn");
      if (resetBtn) {
        resetBtn.onclick = () => {
          if (!confirm(`Punktestand von ${p.name} wirklich auf 0 zurücksetzen? Das kann nicht rückgängig gemacht werden.`)) return;
          const toRemove = state.pointsLedger.filter(l => l.profileId === p.id);
          markDeletedMany(toRemove.map(l => l.id));
          state.pointsLedger = state.pointsLedger.filter(l => l.profileId !== p.id);
          saveState(); renderProfileBar(); render();
          showToast(`Punkte von ${p.name} zurückgesetzt.`);
        };
      }
      overview.appendChild(card);
    });
    container.appendChild(overview);

    if (isParentForReset) {
      const recurringTasks = state.tasks.filter(t => t.recurring);
      const tplSection = document.createElement("div");
      tplSection.className = "settings-section";
      tplSection.innerHTML = `
        <h3>🔁 Vorlagen für wiederkehrende Aufgaben</h3>
        <p class="hint">Aktuelle wiederkehrende Aufgaben (${recurringTasks.length}) als Vorlage sichern, z. B. um zwischen „Schulwoche" und „Ferienwoche" zu wechseln.</p>
        <div class="backup-row">
          <button class="btn btn-sm" id="saveTaskTplBtn" ${recurringTasks.length ? "" : "disabled"}>Als Vorlage speichern</button>
        </div>
        ${state.taskTemplates.length ? `<div class="widget-body" style="margin-top:12px;">${state.taskTemplates.map(tpl => `
          <div class="widget-row">
            <span class="wr-title">${escapeHtml(tpl.name)}</span>
            <span class="wr-meta">${tpl.tasks.length} Aufgaben</span>
            <button class="btn btn-sm" data-load-tpl="${tpl.id}" style="margin-left:8px;">Laden</button>
            <button class="card-pin" data-del-tpl="${tpl.id}" title="Vorlage löschen" style="margin-left:4px;">✕</button>
          </div>
        `).join("")}</div>` : ""}
      `;
      container.appendChild(tplSection);
      const saveBtn = tplSection.querySelector("#saveTaskTplBtn");
      if (saveBtn) saveBtn.onclick = () => {
        const name = prompt("Name für die Vorlage (z. B. „Schulwoche“):");
        if (!name || !name.trim()) return;
        state.taskTemplates.push({
          id: uid(), name: name.trim(), createdAt: Date.now(), updatedAt: Date.now(),
          tasks: recurringTasks.map(t => ({ title: t.title, assignedTo: t.assignedTo, points: t.points, recurring: t.recurring, category: t.category, subject: t.subject || "" }))
        });
        saveState(); render();
        showToast("Vorlage gespeichert.");
      };
      tplSection.querySelectorAll("[data-load-tpl]").forEach(btn => {
        btn.onclick = () => {
          const tpl = state.taskTemplates.find(t => t.id === btn.dataset.loadTpl);
          if (!tpl) return;
          if (!confirm(`„${tpl.name}" laden — ${tpl.tasks.length} Aufgaben werden neu angelegt (bestehende bleiben erhalten). Fortfahren?`)) return;
          tpl.tasks.forEach(t => {
            state.tasks.push({
              id: uid(), title: t.title, assignedTo: t.assignedTo, points: t.points, recurring: t.recurring,
              done: false, lastEntryId: null, category: t.category, dueDate: "", subject: t.subject || "",
              approved: true, createdBy: state.activeProfileId || null, updatedAt: Date.now()
            });
          });
          saveState(); render();
          showToast(`${tpl.tasks.length} Aufgaben aus „${tpl.name}" angelegt.`);
        };
      });
      tplSection.querySelectorAll("[data-del-tpl]").forEach(btn => {
        btn.onclick = () => {
          if (!confirm("Vorlage wirklich löschen?")) return;
          markDeleted(btn.dataset.delTpl);
          state.taskTemplates = state.taskTemplates.filter(t => t.id !== btn.dataset.delTpl);
          saveState(); render();
        };
      });
    }

    // Hausaufgaben
    const todayStr = new Date().toISOString().slice(0, 10);
    const homework = state.tasks.filter(t => t.category === "homework" && t.approved !== false);
    const chores = state.tasks.filter(t => t.category !== "homework" && t.approved !== false);

    const sortBar = document.createElement("div");
    sortBar.style.cssText = "display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap;";
    sortBar.innerHTML = `<span class="hint" style="margin:0;">Sortieren:</span>
      <select id="taskSortSelect" class="hue-assign-select">
        <option value="manual" ${taskSortMode === "manual" ? "selected" : ""}>Eigene Reihenfolge (verschiebbar)</option>
        <option value="status" ${taskSortMode === "status" ? "selected" : ""}>Offen zuerst</option>
        <option value="due" ${taskSortMode === "due" ? "selected" : ""}>Fälligkeit</option>
        <option value="person" ${taskSortMode === "person" ? "selected" : ""}>Person</option>
        <option value="points" ${taskSortMode === "points" ? "selected" : ""}>Punkte (hoch → niedrig)</option>
        <option value="title" ${taskSortMode === "title" ? "selected" : ""}>Bezeichnung</option>
      </select>`;
    container.appendChild(sortBar);
    sortBar.querySelector("#taskSortSelect").onchange = (e) => { taskSortMode = e.target.value; render(); };

    function sortTasks(list) {
      if (taskSortMode === "manual") return list.slice();
      const byName = (t) => { const p = getProfile(t.assignedTo); return p ? p.name : "zzz"; };
      return list.slice().sort((a, b) => {
        if (taskSortMode === "due") return (a.done - b.done) || (a.dueDate || "9999").localeCompare(b.dueDate || "9999");

        if (taskSortMode === "title") return (a.done - b.done) || (a.title || "").localeCompare(b.title || "", "de");
        return (a.done - b.done) || (a.dueDate || "").localeCompare(b.dueDate || "");

  /* ============ FAMILIENKALENDER ============ */
  let calendarCursorStr = new Date().toISOString().slice(0, 10);

  function addMonths(dateStr, n) {
    const [y, m] = dateStr.split("-").map(Number);
    const total = (y * 12 + (m - 1)) + n;
    const newY = Math.floor(total / 12), newM = ((total % 12) + 12) % 12;
    return `${newY}-${String(newM + 1).padStart(2, "0")}-01`;
  }
